partie des 0,15 % les plus bas, comme dans une loi normale.", "score": -20.0, "feedback_html": "<p>Le calcul est juste, mais les pourcentages de la loi normale ne s'appliquent pas à une distribution aussi asymétrique.<\/p>"}, {"texte_html": "Il vaut environ −5,1.", "score": -30.0, "feedback_html": "<p>−5,1 est l'écart brut à la moyenne ; il faut le diviser par l'écart-type (1,59).<\/p>"}, {"texte_html": "Il vaut environ +3,2.", "score": -50.0, "feedback_html": "<p>24 est en dessous de la moyenne : le score z est négatif.<\/p>"}]}]}, {"id": "S-017", "type": "serie", "categorie": "interpretation", "cm": [5], "etude": {"titre": "Dormir pour réussir ?"}, "etude_html": "<h4>Dormir pour réussir ?<\/h4><p>Okano et al. (2019) ont équipé de montres connectées 88 étudiants d'un cours de chimie au MIT, pendant tout un semestre. Ils dormaient en moyenne 7 h 08 par nuit. Un sommeil plus long et de meilleure qualité sur le mois ou la semaine précédant un examen allait de pair avec de meilleures notes ; le sommeil de la seule nuit précédant l'examen, non. Ci-dessous, 88 étudiants simulés d'après ces résultats.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Okano, K., Kaczmarzyk, J. R., Dave, N., Gabrieli, J. D. E., &amp; Grossman, J. C. (2019). Sleep quality, duration, and consistency are associated with better academic performance in college students. npj Science of Learning, 4, 16.<\/p><p style=\"margin-bottom:2px\"><strong>Corrélations avec la note globale (n = 88)<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Variable<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">r de Pearson<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Sommeil moyen sur le semestre<\/td><td style=\"padding:2px 12px;text-align:right\">0,45<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Sommeil la veille de l&#x27;examen<\/td><td style=\"padding:2px 12px;text-align:right\">−0,01<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Nuages de points<\/strong><\/p><p><img src=\"images/s017_sommeil.png\" alt=\"Nuages de points\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-017-q1", "difficulte": 1, "question_html": "<p>D'après le nuage A, quel est le sens de la liaison entre sommeil moyen et note ?<\/p>", "question_texte": "D'après le nuage A, quel est le sens de la liaison entre sommeil moyen et note ?", "feedback_general_html": "<p>Le sens se lit sur la pente générale du nuage.<\/p>", "options": [{"texte_html": "Positive : les étudiants qui dorment plus ont en moyenne de meilleures notes.", "score": 100.0, "feedback_html": "<p>Exact. Le nuage monte de gauche à droite (r = 0,45).<\/p>"}, {"texte_html": "Négative.", "score": -20.0, "feedback_html": "<p>Le nuage monte : la liaison est positive.<\/p>"}, {"texte_html": "Nulle.", "score": -30.0, "feedback_html": "<p>On voit une tendance montante, confirmée par r = 0,45.<\/p>"}, {"texte_html": "En forme de U.", "score": -50.0, "feedback_html": "<p>Le nuage ne dessine pas de courbe.<\/p>"}]}, {"id": "S-017-q2", "difficulte": 1, "question_html": "<p>Selon les repères de Cohen, comment qualifier une corrélation de 0,45 ?<\/p>", "question_texte": "Selon les repères de Cohen, comment qualifier une corrélation de 0,45 ?", "feedback_general_html": "<p>Repères : 0,1 faible, 0,3 moyenne, 0,5 forte.<\/p>", "options": [{"texte_html": "Une liaison moyenne, proche d'une liaison forte", "score": 100.0, "feedback_html": "<p>Exact. 0,45 se situe entre les repères 0,3 (moyenne) et 0,5 (forte).<\/p>"}, {"texte_html": "Une liaison parfaite", "score": -20.0, "feedback_html": "<p>Il faudrait r = 1 ; ici, les points sont assez dispersés.<\/p>"}, {"texte_html": "Une liaison faible", "score": -30.0, "feedback_html": "<p>Le repère d'une liaison faible est 0,1.<\/p>"}, {"texte_html": "Aucune liaison", "score": -50.0, "feedback_html": "<p>0,45 est nettement différent de 0.<\/p>"}]}, {"id": "S-017-q3", "difficulte": 2, "question_html": "<p>Que montre le nuage B (r = −0,01) ?<\/p>", "question_texte": "Que montre le nuage B (r = −0,01) ?", "feedback_general_html": "<p>r proche de 0 et nuage sans tendance : pas de liaison linéaire.<\/p>", "options": [{"texte_html": "Aucune liaison linéaire entre le sommeil de la veille et la note.", "score": 100.0, "feedback_html": "<p>Exact. Le nuage ne montre aucune tendance, et r est pratiquement nul.<\/p>"}, {"texte_html": "Une liaison négative faible.", "score": -20.0, "feedback_html": "<p>−0,01 est bien trop proche de 0 pour parler de liaison négative.<\/p>"}, {"texte_html": "Que bien dormir la veille nuit aux résultats.", "score": -30.0, "feedback_html": "<p>On ne voit aucune liaison, et une corrélation ne dirait de toute façon rien de la cause.<\/p>"}, {"texte_html": "Une erreur de mesure.", "score": -50.0, "feedback_html": "<p>Rien ne l'indique : l'absence de liaison est un résultat.<\/p>"}]}, {"id": "S-017-q4", "difficulte": 2, "question_html": "<p>Peut-on conclure de ces données que dormir davantage fait réussir ?<\/p>", "question_texte": "Peut-on conclure de ces données que dormir davantage fait réussir ?", "feedback_general_html": "<p>Corrélation n'est pas causalité : penser aux troisièmes variables.<\/p>", "options": [{"texte_html": "Non : une troisième variable (organisation, motivation, santé…) pourrait causer à la fois un bon sommeil et de bonnes notes.", "score": 100.0, "feedback_html": "<p>Exact. Ce sont des données d'observation : on n'a pas manipulé le sommeil.<\/p>"}, {"texte_html": "Oui, puisque r est positif et l'échantillon de 88 étudiants.", "score": -20.0, "feedback_html": "<p>Ni le signe ni la taille de l'échantillon ne transforment une corrélation en cause.<\/p>"}, {"texte_html": "Oui, puisque le sommeil précède les examens.", "score": -30.0, "feedback_html": "<p>L'ordre dans le temps ne suffit pas : une troisième variable peut agir sur les deux.<\/p>"}, {"texte_html": "Non, parce que r est inférieur à 1.", "score": -50.0, "feedback_html": "<p>Même avec r = 1, on ne pourrait pas conclure à une cause.<\/p>"}]}, {"id": "S-017-q5", "difficulte": 1, "question_html": "<p>Quelle troisième variable pourrait expliquer à la fois un bon sommeil et de bonnes notes ?<\/p>", "question_texte": "Quelle troisième variable pourrait expliquer à la fois un bon sommeil et de bonnes notes ?", "feedback_general_html": "<p>Une troisième variable agit à la fois sur les deux variables corrélées.<\/p>", "options": [{"texte_html": "Une bonne organisation du travail, qui permet de réviser régulièrement et de se coucher à heure fixe.", "score": 100.0, "feedback_html": "<p>Exact. Elle pourrait améliorer les deux sans que le sommeil agisse directement sur les notes.<\/p>"}, {"texte_html": "La note elle-même.", "score": -20.0, "feedback_html": "<p>La note est l'une des deux variables ; une troisième variable est extérieure aux deux.<\/p>"}, {"texte_html": "Le nombre d'étudiants du cours.", "score": -30.0, "feedback_html": "<p>Il est le même pour tous : il ne peut rien expliquer des différences entre étudiants.<\/p>"}, {"texte_html": "La couleur de la montre connectée.", "score": -50.0, "feedback_html": "<p>Rien ne la relie au sommeil ni aux notes.<\/p>"}]}, {"id": "S-017-q6", "difficulte": 2, "question_html": "<p>Si l'on exprimait le sommeil en minutes plutôt qu'en heures, que deviendrait la corrélation de 0,45 ?<\/p>", "question_texte": "Si l'on exprimait le sommeil en minutes plutôt qu'en heures, que deviendrait la corrélation de 0,45 ?", "feedback_general_html": "<p>r ne change pas quand on change d'unité.<\/p>", "options": [{"texte_html": "Elle resterait égale à 0,45.", "score": 100.0, "feedback_html": "<p>Exact. r ne dépend pas des unités.<\/p>"}, {"texte_html": "Elle deviendrait 27 (0,45 × 60).", "score": -20.0, "feedback_html": "<p>r reste toujours entre −1 et 1.<\/p>"}, {"texte_html": "Elle deviendrait 0,0075 (0,45 / 60).", "score": -30.0, "feedback_html": "<p>Changer d'unité ne modifie pas r.<\/p>"}, {"texte_html": "On ne peut pas le prévoir sans refaire le calcul.", "score": -50.0, "feedback_html": "<p>On le peut : r est le même dans toutes les unités.<\/p>"}]}]}, {"id": "S-019", "type": "serie", "categorie": "interpretation", "cm": [5], "etude": {"titre": "Les jumeaux et le QI"}, "etude_html": "<h4>Les jumeaux et le QI<\/h4><p>Bouchard et McGue (1981) ont rassemblé une centaine d'études sur la ressemblance du QI entre membres d'une même famille. Le tableau reprend quelques-unes des corrélations moyennes qu'ils rapportent. Les vrais jumeaux (monozygotes) partagent tous leurs gènes ; les faux jumeaux (dizygotes), comme les frères et sœurs, en partagent en moyenne la moitié. Le nuage est simulé pour 200 paires de vrais jumeaux élevés ensemble.<\/p><p style=\"font-size:0.85em;color:#555\">Données réelles · corrélations : Bouchard, T. J., &amp; McGue, M. (1981). Familial studies of intelligence: A review. Science, 212, 1055–1059 ; nuage simulé.<\/p><p style=\"margin-bottom:2px\"><strong>Corrélations moyennes du QI<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Paire<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">r<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Vrais jumeaux élevés ensemble<\/td><td style=\"padding:2px 12px;text-align:right\">0,86<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Vrais jumeaux élevés séparément<\/td><td style=\"padding:2px 12px;text-align:right\">0,72<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Faux jumeaux élevés ensemble<\/td><td style=\"padding:2px 12px;text-align:right\">0,60<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Frères et sœurs élevés ensemble<\/td><td style=\"padding:2px 12px;text-align:right\">0,47<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Parent et enfant vivant ensemble<\/td><td style=\"padding:2px 12px;text-align:right\">0,42<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>QI de 200 paires de vrais jumeaux (simulé)<\/strong><\/p><p><img src=\"images/s019_jumeaux.png\" alt=\"QI de 200 paires de vrais jumeaux (simulé)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-019-q1", "difficulte": 1, "question_html": "<p>Que montre le nuage des vrais jumeaux élevés ensemble ?<\/p>", "question_texte": "Que montre le nuage des vrais jumeaux élevés ensemble ?", "feedback_general_html": "<p>Sens : pente du nuage ; intensité : dispersion autour de la tendance.<\/p>", "options": [{"texte_html": "Une liaison positive forte : quand un jumeau a un QI élevé, l'autre aussi, le plus souvent.", "score": 100.0, "feedback_html": "<p>Exact. Le nuage monte, et les points sont serrés autour de la tendance (r = 0,86).<\/p>"}, {"texte_html": "Une liaison positive faible.", "score": -20.0, "feedback_html": "<p>Le sens est juste, mais les points sont très serrés : la liaison est forte.<\/p>"}, {"texte_html": "Une liaison négative forte.", "score": -30.0, "feedback_html": "<p>Le nuage monte : la liaison est positive.<\/p>"}, {"texte_html": "Aucune liaison.", "score": -50.0, "feedback_html": "<p>La tendance montante est très nette.<\/p>"}]}, {"id": "S-019-q2", "difficulte": 1, "question_html": "<p>D'après le tableau, quelles paires se ressemblent le plus pour le QI ?<\/p>", "question_texte": "D'après le tableau, quelles paires se ressemblent le plus pour le QI ?", "feedback_general_html": "<p>Plus r est proche de 1, plus les deux membres des paires se ressemblent.<\/p>", "options": [{"texte_html": "Les vrais jumeaux élevés ensemble (0,86)", "score": 100.0, "feedback_html": "<p>Exact. C'est la corrélation la plus élevée du tableau.<\/p>"}, {"texte_html": "Les vrais jumeaux élevés séparément (0,72)", "score": -20.0, "feedback_html": "<p>Ils se ressemblent beaucoup, mais un peu moins que ceux élevés ensemble.<\/p>"}, {"texte_html": "Les faux jumeaux élevés ensemble (0,60)", "score": -30.0, "feedback_html": "<p>Leur corrélation est nettement plus faible.<\/p>"}, {"texte_html": "Un parent et son enfant (0,42)", "score": -50.0, "feedback_html": "<p>C'est la corrélation la plus faible du tableau.<\/p>"}]}, {"id": "S-019-q3", "difficulte": 2, "question_html": "<p>Une corrélation de 0,86 signifie-t-elle que les deux jumeaux d'une paire ont le même QI ?<\/p>", "question_texte": "Une corrélation de 0,86 signifie-t-elle que les deux jumeaux d'une paire ont le même QI ?", "feedback_general_html": "<p>r mesure l'intensité de la liaison linéaire, pas l'égalité des valeurs.<\/p>", "options": [{"texte_html": "Non : leurs QI varient dans le même sens et sont souvent proches, mais avec des écarts parfois importants.", "score": 100.0, "feedback_html": "<p>Exact. Même r = 1 ne voudrait pas forcément dire « mêmes valeurs » : seulement des points alignés sur une droite.<\/p>"}, {"texte_html": "Oui, dans 86 % des paires.", "score": -20.0, "feedback_html": "<p>r n'est pas un pourcentage de paires identiques.<\/p>"}, {"texte_html": "Oui, à 86 % près.", "score": -30.0, "feedback_html": "<p>Cette expression n'a pas de sens pour un coefficient de corrélation.<\/p>"}, {"texte_html": "Non : le QI d'un jumeau cause celui de l'autre.", "score": -50.0, "feedback_html": "<p>Une corrélation ne dit rien d'une cause, et un QI n'en cause pas un autre.<\/p>"}]}, {"id": "S-019-q4", "difficulte": 1, "question_html": "<p>Si l'on transformait les QI en scores z, que deviendrait la corrélation de 0,86 ?<\/p>", "question_texte": "Si l'on transformait les QI en scores z, que deviendrait la corrélation de 0,86 ?", "feedback_general_html": "<p>r est la covariance des scores z : il ne change pas quand on passe en scores z.<\/p>", "options": [{"texte_html": "Elle resterait égale à 0,86.", "score": 100.0, "feedback_html": "<p>Exact. Passer en scores z est un changement d'unité : r ne bouge pas.<\/p>"}, {"texte_html": "Elle deviendrait 0.", "score": -20.0, "feedback_html": "<p>Les scores z ont une moyenne de 0, mais leur corrélation est inchangée.<\/p>"}, {"texte_html": "Elle deviendrait 1.", "score": -30.0, "feedback_html": "<p>Les scores z ont un écart-type de 1, mais leur corrélation est inchangée.<\/p>"}, {"texte_html": "Elle serait divisée par 15.", "score": -50.0, "feedback_html": "<p>r ne dépend pas des unités.<\/p>"}]}, {"id": "S-019-q5", "difficulte": 3, "question_html": "<p>Les faux jumeaux et les frères et sœurs partagent en moyenne autant de gènes, mais leurs corrélations diffèrent (0,60 et 0,47). Que suggère cette différence ?<\/p>", "question_texte": "Les faux jumeaux et les frères et sœurs partagent en moyenne autant de gènes, mais leurs corrélations diffèrent (0,60 et 0,47). Que suggère cette différence ?", "feedback_general_html": "<p>Comparer des corrélations aide à formuler des hypothèses, sans les démontrer.<\/p>", "options": [{"texte_html": "Que les gènes ne sont pas seuls en cause : les faux jumeaux ont le même âge et grandissent au même moment dans la famille, ce qui pourrait accroître leur ressemblance.", "score": 100.0, "feedback_html": "<p>Exact. C'est une piste d'interprétation : ces données d'observation ne permettent pas de trancher.<\/p>"}, {"texte_html": "Que les faux jumeaux partagent plus de gènes que les frères et sœurs.", "score": -20.0, "feedback_html": "<p>En moyenne, ils en partagent autant : c'est justement ce qui rend la différence intéressante.<\/p>"}, {"texte_html": "Que la différence vient forcément du hasard.", "score": -30.0, "feedback_html": "<p>Ces moyennes reposent sur de nombreuses études : le hasard n'est pas la seule explication.<\/p>"}, {"texte_html": "Qu'on ne peut pas comparer deux corrélations.", "score": -50.0, "feedback_html": "<p>On peut tout à fait comparer deux valeurs de r : elles sont sans unité.<\/p>"}]}, {"id": "S-019-q6", "difficulte": 3, "question_html": "<p>Les vrais jumeaux élevés séparément ont une corrélation de 0,72, contre 0,86 pour ceux élevés ensemble. Quelle conclusion est prudente ?<\/p>", "question_texte": "Les vrais jumeaux élevés séparément ont une corrélation de 0,72, contre 0,86 pour ceux élevés ensemble. Quelle conclusion est prudente ?", "feedback_general_html": "<p>Interpréter une corrélation demande toujours de la prudence sur les causes.<\/p>", "options": [{"texte_html": "Les vrais jumeaux élevés séparément restent très semblables, et ceux élevés ensemble le sont un peu plus ; ces données d'observation ne suffisent pas à mesurer exactement la part des gènes et de l'environnement.", "score": 100.0, "feedback_html": "<p>Exact. Par exemple, les jumeaux séparés sont souvent placés dans des familles de milieux proches.<\/p>"}, {"texte_html": "L'environnement ne joue aucun rôle dans le QI.", "score": -20.0, "feedback_html": "<p>La corrélation est plus forte quand les jumeaux sont élevés ensemble : l'environnement semble jouer un rôle.<\/p>"}, {"texte_html": "Le QI est entièrement déterminé par les gènes.", "score": -30.0, "feedback_html": "<p>Si c'était le cas, les deux corrélations seraient égales, et proches de 1.<\/p>"}, {"texte_html": "Être élevés ensemble rend les QI identiques.", "score": -50.0, "feedback_html": "<p>0,86 n'est pas 1 : les QI restent différents.<\/p>"}]}]}, {"id": "S-020", "type": "serie", "categorie": "interpretation", "cm": [5], "etude": {"titre": "Écrans et bien-être des adolescents"}, "etude_html": "<h4>Écrans et bien-être des adolescents<\/h4><p>Przybylski et Weinstein (2017) ont interrogé 120 115 adolescents anglais de 15 ans sur leur temps d'écran et leur bien-être (échelle WEMWBS, de 14 à 70). La relation n'était pas une droite : le bien-être était le plus élevé pour un usage modéré, et baissait pour un usage intensif (hypothèse « Boucle d'or »). Orben et Przybylski (2019), sur plus de 350 000 jeunes, concluent que le temps d'écran est associé à au plus 0,4 % des différences de bien-être, autant que le fait de manger régulièrement des pommes de terre. Le nuage ci-dessous est simulé pour 2 000 adolescents.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Przybylski, A. K., &amp; Weinstein, N. (2017). A large-scale test of the Goldilocks hypothesis. Psychological Science, 28(2), 204–215 ; et Orben, A., &amp; Przybylski, A. K. (2019). The association between adolescent well-being and digital technology use. Nature Human Behaviour, 3, 173–182.<\/p><p style=\"margin-bottom:2px\"><strong>Corrélation (n = 2 000)<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">r de Pearson<\/td><td style=\"padding:2px 12px;text-align:right\">−0,04<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Spearman<\/td><td style=\"padding:2px 12px;text-align:right\">0,03<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Bien-être selon le temps d&#x27;écran<\/strong><\/p><p><img src=\"images/s020_ecrans.png\" alt=\"Bien-être selon le temps d&#x27;écran\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-020-q1", "difficulte": 1, "question_html": "<p>Selon les repères de Cohen, comment qualifier une corrélation de −0,04 ?<\/p>", "question_texte": "Selon les repères de Cohen, comment qualifier une corrélation de −0,04 ?", "feedback_general_html": "<p>Repères : 0,1 faible, 0,3 moyenne, 0,5 forte.<\/p>", "options": [{"texte_html": "Quasi nulle, en dessous même d'une liaison faible", "score": 100.0, "feedback_html": "<p>Exact. Le repère d'une liaison faible est 0,1 en valeur absolue.<\/p>"}, {"texte_html": "Faible", "score": -20.0, "feedback_html": "<p>Elle est encore plus faible que le repère de 0,1.<\/p>"}, {"texte_html": "Moyenne et négative", "score": -30.0, "feedback_html": "<p>Il faudrait environ −0,3.<\/p>"}, {"texte_html": "Forte et négative", "score": -50.0, "feedback_html": "<p>Il faudrait environ −0,5 ou au-delà.<\/p>"}]}, {"id": "S-020-q2", "difficulte": 2, "question_html": "<p>Que montre la courbe des moyennes ?<\/p>", "question_texte": "Que montre la courbe des moyennes ?", "feedback_general_html": "<p>Une courbe des moyennes aide à voir la forme d'une liaison dans un grand nuage.<\/p>", "options": [{"texte_html": "Le bien-être moyen augmente légèrement jusqu'à 2 à 4 heures d'écran, puis baisse au-delà d'environ 6 heures : la liaison n'est pas linéaire.", "score": 100.0, "feedback_html": "<p>Exact. C'est la forme en cloche de l'hypothèse « Boucle d'or ».<\/p>"}, {"texte_html": "Le bien-être baisse régulièrement avec le temps d'écran.", "score": -20.0, "feedback_html": "<p>Il baisse surtout pour les durées élevées ; il augmente d'abord un peu.<\/p>"}, {"texte_html": "Le bien-être ne dépend pas du temps d'écran.", "score": -30.0, "feedback_html": "<p>La courbe n'est pas plate : elle monte puis redescend.<\/p>"}, {"texte_html": "Le bien-être augmente régulièrement avec le temps d'écran.", "score": -50.0, "feedback_html": "<p>Il baisse nettement pour les durées les plus longues.<\/p>"}]}, {"id": "S-020-q3", "difficulte": 3, "question_html": "<p>Pourquoi r est-il presque nul alors que la courbe des moyennes n'est pas plate ?<\/p>", "question_texte": "Pourquoi r est-il presque nul alors que la courbe des moyennes n'est pas plate ?", "feedback_general_html": "<p>r proche de 0 ne veut pas dire « aucune liaison ».<\/p>", "options": [{"texte_html": "r ne mesure que la liaison linéaire : la partie qui monte et celle qui descend se compensent.", "score": 100.0, "feedback_html": "<p>Exact. Comme pour le stress et la performance, une liaison en cloche donne un r proche de 0.<\/p>"}, {"texte_html": "Parce que l'échantillon est trop grand.", "score": -20.0, "feedback_html": "<p>La taille de l'échantillon ne rend pas r nul ; c'est la forme de la liaison qui compte.<\/p>"}, {"texte_html": "Parce que les points sont trop nombreux pour être lus.", "score": -30.0, "feedback_html": "<p>Le calcul de r n'en dépend pas.<\/p>"}, {"texte_html": "Parce que la corrélation a été mal calculée.", "score": -50.0, "feedback_html": "<p>Le calcul est juste : r ne voit pas les liaisons non linéaires.<\/p>"}]}, {"id": "S-020-q4", "difficulte": 2, "question_html": "<p>Peut-on en conclure que le temps d'écran n'a aucun lien avec le bien-être ?<\/p>", "question_texte": "Peut-on en conclure que le temps d'écran n'a aucun lien avec le bien-être ?", "feedback_general_html": "<p>Regarder le nuage avant de conclure, et ne pas confondre liaison faible et absence de liaison.<\/p>", "options": [{"texte_html": "Non : il y a une légère liaison en cloche, que r ne capte pas. Elle reste cependant faible.", "score": 100.0, "feedback_html": "<p>Exact. Une liaison non linéaire existe, mais le temps d'écran ne permet pas de prévoir grand-chose du bien-être.<\/p>"}, {"texte_html": "Oui, puisque r vaut presque 0.", "score": -20.0, "feedback_html": "<p>r ne mesure que la liaison linéaire : il faut regarder le nuage et la courbe.<\/p>"}, {"texte_html": "Non : le temps d'écran détruit le bien-être des adolescents.", "score": -30.0, "feedback_html": "<p>Les données montrent une liaison faible, pas un effet massif, et elles ne disent rien de la cause.<\/p>"}, {"texte_html": "Oui, puisque Spearman est positif et Pearson négatif.", "score": -50.0, "feedback_html": "<p>Deux coefficients proches de 0, de signes opposés, confirment surtout l'absence de liaison monotone.<\/p>"}]}, {"id": "S-020-q5", "difficulte": 3, "question_html": "<p>Orben et Przybylski comparent l'association écrans–bien-être à celle du fait de manger des pommes de terre. Que veulent-ils faire comprendre ?<\/p>", "question_texte": "Orben et Przybylski comparent l'association écrans–bien-être à celle du fait de manger des pommes de terre. Que veulent-ils faire comprendre ?", "feedback_general_html": "<p>Comparer à des liaisons familières aide à juger de l'intensité d'une corrélation.<\/p>", "options": [{"texte_html": "Que la liaison est très faible : connaître le temps d'écran d'un adolescent ne permet presque pas de prévoir son bien-être.", "score": 100.0, "feedback_html": "<p>Exact. La comparaison sert à donner une idée concrète de l'intensité.<\/p>"}, {"texte_html": "Que les pommes de terre sont aussi néfastes que les écrans, et qu'il faudrait les limiter.", "score": -20.0, "feedback_html": "<p>La comparaison montre au contraire que ces deux liaisons sont minuscules.<\/p>"}, {"texte_html": "Que les écrans causent 0,4 % du mal-être des adolescents.", "score": -30.0, "feedback_html": "<p>Une corrélation ne mesure pas une part de cause.<\/p>"}, {"texte_html": "Que les écrans sont la principale cause du mal-être des adolescents.", "score": -50.0, "feedback_html": "<p>C'est l'inverse de leur conclusion.<\/p>"}]}, {"id": "S-020-q6", "difficulte": 1, "question_html": "<p>Avec plus de 100 000 adolescents, une corrélation de −0,04 devient-elle une liaison forte ?<\/p>", "question_texte": "Avec plus de 100 000 adolescents, une corrélation de −0,04 devient-elle une liaison forte ?", "feedback_general_html": "<p>L'intensité d'une liaison se lit sur r, pas sur la taille de l'échantillon.<\/p>", "options": [{"texte_html": "Non : l'intensité se lit sur la valeur de r, quelle que soit la taille de l'échantillon.", "score": 100.0, "feedback_html": "<p>Exact. Un grand échantillon rend l'estimation plus précise ; il ne rend pas la liaison plus forte.<\/p>"}, {"texte_html": "Oui : sur autant de personnes, tout résultat est important.", "score": -20.0, "feedback_html": "<p>La taille de l'échantillon ne change pas l'intensité de la liaison.<\/p>"}, {"texte_html": "On ne peut pas calculer r sur autant de personnes.", "score": -30.0, "feedback_html": "<p>On le peut sans difficulté.<\/p>"}, {"texte_html": "Oui : r est multiplié par la taille de l'échantillon.", "score": -50.0, "feedback_html": "<p>r reste toujours entre −1 et 1.<\/p>"}]}]}]</script>
<script>
(function () {
  "use strict";
  const BASE = JSON.parse(document.getElementById("donnees").textContent);
  const app = document.getElementById("app");
  const LETTRES = "ABCD";
  const NOMS_CAT = { comprehension: "Compréhension", choix: "Choix", interpretation: "Interprétation" };

  // --- mémoire légère dans le navigateur (questions déjà vues) ---
  function lireVues() { try { return JSON.parse(localStorage.getItem("l1s2-vues") || "{}"); } catch (e) { return {}; } }
  function ecrireVues(v) { try { localStorage.setItem("l1s2-vues", JSON.stringify(v)); } catch (e) {} }

  function melanger(t) { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function fmtPoints(p) { const s = (Math.round(p * 100) / 100).toString().replace(".", ","); return (p > 0 ? "+" : "") + s; }

  let session = null;

  // ------------------------------------------------------------ accueil
  function accueil() {
    const cms = [1, 2, 3, 4, 5];
    app.innerHTML = `
      <h2>Composer une série d'exercices</h2>
      <p class="note">Les questions sont tirées au hasard, en priorité parmi celles que vous n'avez pas encore vues sur cet appareil.</p>
      <form id="reglages">
        <fieldset><legend>Cours magistraux</legend><div class="choix">
          ${cms.map(c => `<label><input type="checkbox" name="cm" value="${c}" checked> CM ${c}</label>`).join("")}
        </div></fieldset>
        <fieldset><legend>Type de questions</legend><div class="choix">
          <label><input type="checkbox" name="cat" value="comprehension" checked> Compréhension du cours</label>
          <label><input type="checkbox" name="cat" value="choix" checked> Choisir un indice ou un graphique</label>
          <label><input type="checkbox" name="cat" value="interpretation" checked> Interpréter une étude (séries de questions)</label>
        </div></fieldset>
        <fieldset><legend>Difficulté</legend><div class="choix">
          <label><input type="checkbox" name="diff" value="1" checked> Facile</label>
          <label><input type="checkbox" name="diff" value="2" checked> Moyenne</label>
          <label><input type="checkbox" name="diff" value="3" checked> Difficile</label>
        </div></fieldset>
        <fieldset><legend>Nombre de questions</legend><div class="choix">
          ${[5, 10, 20, 40].map((n, i) => `<label><input type="radio" name="nb" value="${n}" ${i === 1 ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <p class="note">Une étude compte pour toutes ses questions : le total peut dépasser un peu le nombre demandé.</p></fieldset>
        <div class="bloc"><strong>Barème de l'examen.</strong> Bonne réponse : +1 point. Mauvaise réponse : un retrait qui dépend de la gravité de l'erreur (souvent −0,25 ou −0,5). « Je ne sais pas » : 0 point.</div>
        <p id="erreur" class="note" role="alert"></p>
        <div class="boutons"><button type="submit" class="principal">Commencer</button></div>
      </form>`;
    document.getElementById("reglages").addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const r = { cm: f.getAll("cm").map(Number), cat: f.getAll("cat"), diff: f.getAll("diff").map(Number), nb: Number(f.get("nb")) };
      const items = tirer(r);
      if (!items.length) { document.getElementById("erreur").textContent = "Aucune question ne correspond à ces réglages. Élargissez la sélection."; return; }
      session = { items, i: 0, reponses: [] };
      afficherQuestion();
    });
  }

  // ------------------------------------------------------------ tirage
  function tirer(r) {
    const vues = lireVues();
    const unites = [];
    for (const ex of BASE) {
      if (!r.cat.includes(ex.categorie)) continue;
      if (!ex.cm.some(c => r.cm.includes(c))) continue;
      if (ex.type === "serie") {
        const qs = ex.questions.filter(q => r.diff.includes(q.difficulte));
        if (!qs.length) continue;
        unites.push({ cle: ex.id, questions: ex.questions.map(q => Object.assign({ serie: ex, categorie: ex.categorie, cm: ex.cm }, q)) });
      } else if (r.diff.includes(ex.difficulte)) {
        unites.push({ cle: ex.id, questions: [ex] });
      }
    }
    const triees = melanger(unites).sort((a, b) => (vues[a.cle] || 0) - (vues[b.cle] || 0));
    const choisies = [];
    let n = 0;
    for (const u of triees) {
      if (n >= r.nb) break;
      if (n > 0 && n + u.questions.length > r.nb + 4) continue;
      choisies.push(u); n += u.questions.length;
    }
    // séries groupées, questions isolées mélangées autour
    return melanger(choisies).flatMap(u => u.questions.map(q => Object.assign({}, q, { options: melanger(q.options) })));
  }

  // ------------------------------------------------------------ question
  function afficherQuestion() {
    const q = session.items[session.i], total = session.items.length;
    const etude = q.serie ? `
      <div class="bloc etude">
        ${session.i > 0 && session.items[session.i - 1].serie === q.serie
          ? `<details><summary>Revoir l'étude : ${esc(q.serie.etude.titre)}</summary>${q.serie.etude_html}</details>`
          : q.serie.etude_html}
      </div>` : "";
    app.innerHTML = `
      <div class="progression"><span>Question ${session.i + 1} / ${total}</span><span>${scoreCourant()}</span></div>
      <div class="barre"><div style="width:${100 * session.i / total}%"></div></div>
      <div class="etiquettes"><span>${NOMS_CAT[q.categorie]}</span><span>CM ${q.cm.join(", ")}</span><span>${["", "Facile", "Moyenne", "Difficile"][q.difficulte]}</span></div>
      ${etude}
      <div class="enonce">${q.question_html}</div>
      <form id="qcm">
        ${q.options.map((o, k) => `
          <label class="option" data-k="${k}">
            <input type="radio" name="rep" value="${k}">
            <span class="lettre">${LETTRES[k]}</span><span>${o.texte_html}</span>
          </label>`).join("")}
        <div class="boutons">
          <button type="submit" class="principal" id="valider" disabled>Valider</button>
          <button type="button" class="secondaire" id="passer">Je ne sais pas</button>
        </div>
      </form>
      <div id="retour"></div>`;
    const form = document.getElementById("qcm");
    form.addEventListener("change", () => { document.getElementById("valider").disabled = false; });
    form.addEventListener("submit", ev => { ev.preventDefault(); corriger(Number(new FormData(form).get("rep"))); });
    document.getElementById("passer").addEventListener("click", () => corriger(null));
    window.scrollTo(0, 0);
  }

  function corriger(k) {
    const q = session.items[session.i];
    const bonne = q.options.findIndex(o => o.score === 100);
    const points = k === null ? 0 : q.options[k].score / 100;
    session.reponses.push({ q, k, points });
    const vues = lireVues(); const cle = q.serie ? q.serie.id : q.id;
    vues[cle] = (vues[cle] || 0) + (q.serie ? 1 / q.serie.questions.length : 1); ecrireVues(vues);

    document.querySelectorAll(".option").forEach(el => {
      const j = Number(el.dataset.k);
      el.classList.add("verrouillee");
      el.querySelector("input").disabled = true;
      if (j === bonne) el.classList.add("juste");
      else if (j === k) el.classList.add("fausse");
    });
    const classe = k === null ? "neutre" : (k === bonne ? "ok" : "ko");
    const titre = k === null ? "Pas de réponse" : (k === bonne ? "Bonne réponse" : "Mauvaise réponse");
    let corps = "";
    if (k !== null) corps += `<div>${q.options[k].feedback_html}</div>`;
    if (k !== bonne) corps += `<p><strong>La bonne réponse était ${LETTRES[bonne]}.</strong></p><div>${q.options[bonne].feedback_html}</div>`;
    const dernier = session.i === session.items.length - 1;
    document.getElementById("retour").innerHTML = `
      <div class="retour ${classe}">
        <p><strong>${titre}</strong> · <span class="points">${fmtPoints(points)} point${Math.abs(points) > 1 ? "s" : ""}</span></p>
        ${corps}
        ${q.feedback_general_html ? `<div class="general"><strong>À retenir.</strong> ${q.feedback_general_html}</div>` : ""}
      </div>
      <div class="boutons"><button class="principal" id="suite">${dernier ? "Voir le bilan" : "Question suivante"}</button></div>`;
    document.querySelectorAll("#qcm .boutons button").forEach(b => b.remove());
    const suite = document.getElementById("suite");
    suite.addEventListener("click", () => { session.i++; dernier ? bilan() : afficherQuestion(); });
    suite.focus();
  }

  function scoreCourant() {
    const s = session.reponses.reduce((a, r) => a + r.points, 0);
    return session.reponses.length ? `Score : ${fmtPoints(s).replace("+", "")} / ${session.reponses.length}` : "";
  }

  // ------------------------------------------------------------ bilan
  function bilan() {
    const R = session.reponses, n = R.length;
    const total = R.reduce((a, r) => a + r.points, 0);
    const sur20 = Math.max(0, 20 * total / n);
    const groupes = {};
    for (const r of R) {
      const g = NOMS_CAT[r.q.categorie];
      groupes[g] = groupes[g] || { n: 0, justes: 0, pts: 0 };
      groupes[g].n++; groupes[g].pts += r.points;
      if (r.points === 1) groupes[g].justes++;
    }
    const ratees = R.filter(r => r.points < 1);
    app.innerHTML = `
      <h2>Bilan</h2>
      <div class="score">${fmtPoints(total).replace("+", "")} / ${n}</div>
      <p>Soit ${sur20.toFixed(1).replace(".", ",")} / 20 avec le barème de l'examen. ${R.filter(r => r.points === 1).length} bonne(s) réponse(s), ${R.filter(r => r.k === null).length} « je ne sais pas ».</p>
      <table class="bilan"><tr><th>Type</th><th class="n" style="text-align:right">Questions</th><th style="text-align:right">Justes</th><th style="text-align:right">Points</th></tr>
        ${Object.entries(groupes).map(([g, v]) => `<tr><td>${g}</td><td class="n">${v.n}</td><td class="n">${v.justes}</td><td class="n">${fmtPoints(v.pts).replace("+", "")}</td></tr>`).join("")}
      </table>
      ${ratees.length ? `<h2>À revoir</h2><ul class="revoir">${ratees.map(r =>
        `<li>${r.q.question_texte} <span class="note">(CM ${r.q.cm.join(", ")})</span></li>`).join("")}</ul>` : "<p>Aucune erreur : bravo !</p>"}
      <div class="boutons"><button class="principal" id="encore">Nouvelle série</button></div>`;
    document.getElementById("encore").addEventListener("click", accueil);
    window.scrollTo(0, 0);
  }

  accueil();
})();
</script>
</body>
</html>
