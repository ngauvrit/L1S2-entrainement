<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement · Statistiques L1 S2</title>
<style>
  :root {
    --accent: #5862ED; --accent-fonce: #3A43C9; --noir: #1C1C22; --gris: #6B6B73;
    --gris-clair: #E6E6EB; --fond: #F3F3FD; --vert: #1E7F4F; --vert-fond: #E7F5EE;
    --rouge: #B3261E; --rouge-fond: #FBEAE9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--noir); background: #fff; line-height: 1.5; }
  header { background: var(--noir); color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 500; }
  header p { margin: 2px 0 0; font-size: 0.85rem; color: #c9c9d6; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h2 { color: var(--accent-fonce); font-weight: 500; font-size: 1.3rem; margin: 0 0 12px; }
  fieldset { border: 1px solid var(--gris-clair); border-radius: 8px; padding: 12px 16px; margin: 0 0 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  .choix { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .choix label { cursor: pointer; }
  .note { color: var(--gris); font-size: 0.9rem; }
  .bloc { background: var(--fond); border-radius: 8px; padding: 14px 18px; margin: 14px 0; }
  button { font: inherit; border-radius: 6px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--accent-fonce); }
  .principal { background: var(--accent-fonce); color: #fff; }
  .principal:disabled { background: var(--gris-clair); border-color: var(--gris-clair); color: var(--gris); cursor: default; }
  .secondaire { background: #fff; color: var(--accent-fonce); }
  .boutons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .progression { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: var(--gris-clair); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
  .barre > div { height: 100%; background: var(--accent); transition: width .3s; }
  .etiquettes span { display: inline-block; font-size: 0.78rem; color: var(--accent-fonce); background: var(--fond);
                     border-radius: 10px; padding: 1px 9px; margin-right: 6px; }
  .enonce { font-size: 1.05rem; margin: 10px 0 14px; }
  .enonce p { margin: 0 0 8px; }
  .etude { border-left: 4px solid var(--accent); }
  .etude h4 { margin: 0 0 6px; font-size: 1rem; }
  .etude table { background: #fff; }
  .etude details summary { cursor: pointer; color: var(--accent-fonce); }
  .option { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--gris-clair); border-radius: 8px;
            padding: 10px 14px; margin: 8px 0; cursor: pointer; }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 5px; }
  .option .lettre { font-weight: 600; color: var(--accent-fonce); min-width: 1.2em; }
  .option.juste { border-color: var(--vert); background: var(--vert-fond); }
  .option.fausse { border-color: var(--rouge); background: var(--rouge-fond); }
  .option.verrouillee { cursor: default; }
  .retour { border-radius: 8px; padding: 12px 16px; margin-top: 14px; }
  .retour.ok { background: var(--vert-fond); border-left: 4px solid var(--vert); }
  .retour.ko { background: var(--rouge-fond); border-left: 4px solid var(--rouge); }
  .retour.neutre { background: var(--fond); border-left: 4px solid var(--gris); }
  .retour p { margin: 4px 0; }
  .points { font-weight: 600; }
  .general { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.1); }
  .score { font-size: 2.4rem; color: var(--accent-fonce); font-weight: 500; margin: 6px 0; }
  table.bilan { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.95rem; }
  table.bilan th, table.bilan td { padding: 5px 8px; border-bottom: 1px solid var(--gris-clair); text-align: left; }
  table.bilan td.n { text-align: right; }
  .revoir li { margin-bottom: 6px; }
  footer { text-align: center; color: var(--gris); font-size: 0.8rem; padding: 20px; }
  @media (max-width: 520px) { main { padding: 16px 12px 40px; } .score { font-size: 2rem; } }
</style>
</head>
<body>
<header>
  <h1>Statistiques appliquées à la psychologie · L1 S2</h1>
  <p>Entraînement aux QCM · Université de Lille</p>
</header>
<main id="app"></main>
<footer>44 questions disponibles · mise à jour le 15/11/2026</footer>

<script id="donnees" type="application/json">[{"id": "X-CM1-001", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Une étude recueille le nombre de séances de thérapie déjà suivies par chaque patient (de 0 à 40). Quel type de mesure lui donner (dans Jamovi par exemple) ?<\/p>", "question_texte": "Une étude recueille le nombre de séances de thérapie déjà suivies par chaque patient (de 0 à 40). Quel type de mesure lui donner (dans Jamovi par exemple) ?", "feedback_general_html": "<p>Un comptage est une variable numérique discrète. Le type de mesure commande les indices et graphiques disponibles.<\/p>", "options": [{"texte_html": "Numérique", "score": 100.0, "feedback_html": "<p>Exact. C'est un comptage : une variable numérique (discrète).<\/p>"}, {"texte_html": "Ordinal", "score": -20.0, "feedback_html": "<p>On peut ranger les valeurs, mais on peut aussi mesurer leurs écarts : 10 séances, c'est 5 de plus que 5. La variable est numérique.<\/p>"}, {"texte_html": "Nominal", "score": -30.0, "feedback_html": "<p>Ce sont des quantités, pas des catégories sans ordre.<\/p>"}, {"texte_html": "ID (identifiant)", "score": -50.0, "feedback_html": "<p>Un identifiant sert à distinguer les individus ; ici, plusieurs patients peuvent avoir le même nombre de séances.<\/p>"}]}, {"id": "X-CM1-002", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 1, "question_html": "<p>On veut décrire la répartition des 300 étudiants entre les trois filières. Que faut-il produire ?<\/p>", "question_texte": "On veut décrire la répartition des 300 étudiants entre les trois filières. Que faut-il produire ?", "feedback_general_html": "<p>Pour une variable nominale : effectifs et pourcentages par modalité, sans cumul.<\/p>", "options": [{"texte_html": "Un tableau des effectifs et des pourcentages par filière", "score": 100.0, "feedback_html": "<p>Exact. C'est le tableau de distribution d'une variable nominale.<\/p>"}, {"texte_html": "Un tableau des effectifs cumulés", "score": -20.0, "feedback_html": "<p>Le cumul suppose un ordre entre modalités : il n'a pas de sens pour une variable nominale.<\/p>"}, {"texte_html": "Le tableau de données complet", "score": -30.0, "feedback_html": "<p>Il donne la filière de chaque étudiant, mais ne résume rien.<\/p>"}, {"texte_html": "La moyenne de la filière codée 1, 2, 3", "score": -50.0, "feedback_html": "<p>Une « filière moyenne » n'a aucun sens : les chiffres ne sont que des codes.<\/p>"}]}, {"id": "X-CM1-003", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>On a l'âge en années de 500 participants (de 18 à 75 ans). Comment présenter sa distribution dans un tableau ?<\/p>", "question_texte": "On a l'âge en années de 500 participants (de 18 à 75 ans). Comment présenter sa distribution dans un tableau ?", "feedback_general_html": "<p>Quand une variable prend beaucoup de valeurs, on la regroupe en classes : ni trop, ni trop peu, de préférence de même amplitude.<\/p>", "options": [{"texte_html": "Regrouper les âges en classes de même amplitude, par exemple de 10 ans", "score": 100.0, "feedback_html": "<p>Exact. Quelques classes de même largeur rendent la distribution lisible.<\/p>"}, {"texte_html": "Une ligne par âge observé", "score": -20.0, "feedback_html": "<p>Près de 60 lignes : le tableau serait long et difficile à lire.<\/p>"}, {"texte_html": "Deux classes : moins de 40 ans, 40 ans et plus", "score": -30.0, "feedback_html": "<p>Trop peu de classes : on ne voit plus la forme de la distribution.<\/p>"}, {"texte_html": "Une ligne par participant", "score": -50.0, "feedback_html": "<p>C'est le tableau de données, pas une distribution.<\/p>"}]}, {"id": "X-CM1-004", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Dans un tableau de distribution du nombre de séances suivies par les patients, quelle colonne indique la part des patients qui ont suivi au plus 3 séances ?<\/p>", "question_texte": "Dans un tableau de distribution du nombre de séances suivies par les patients, quelle colonne indique la part des patients qui ont suivi au plus 3 séances ?", "feedback_general_html": "<p>« Au plus » une valeur : on lit le pourcentage cumulé sur la ligne de cette valeur.<\/p>", "options": [{"texte_html": "Le pourcentage cumulé, sur la ligne « 3 »", "score": 100.0, "feedback_html": "<p>Exact. Il additionne les parts de 0, 1, 2 et 3 séances.<\/p>"}, {"texte_html": "Le pourcentage, sur la ligne « 3 »", "score": -20.0, "feedback_html": "<p>Il ne compte que les patients à exactement 3 séances, pas ceux qui en ont suivi moins.<\/p>"}, {"texte_html": "L'effectif, sur la ligne « 3 »", "score": -30.0, "feedback_html": "<p>Il n'est ni cumulé, ni exprimé en proportion.<\/p>"}, {"texte_html": "La ligne de l'effectif le plus grand", "score": -50.0, "feedback_html": "<p>Cette ligne donne le mode, sans rapport avec « au plus 3 ».<\/p>"}]}, {"id": "X-CM1-006", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Un chercheur veut pouvoir calculer plus tard une moyenne d'anxiété. Comment doit-il la recueillir ?<\/p>", "question_texte": "Un chercheur veut pouvoir calculer plus tard une moyenne d'anxiété. Comment doit-il la recueillir ?", "feedback_general_html": "<p>Le type de variable se décide au moment du recueil : on peut toujours simplifier une variable numérique ensuite, jamais l'inverse.<\/p>", "options": [{"texte_html": "Par un score numérique à un questionnaire (par exemple de 0 à 42)", "score": 100.0, "feedback_html": "<p>Exact. Seule une variable numérique permet une moyenne pleinement interprétable.<\/p>"}, {"texte_html": "En trois catégories : faible, moyenne, forte", "score": -20.0, "feedback_html": "<p>Ce serait une variable ordinale : sa moyenne serait discutable, et le regroupement perdrait de l'information.<\/p>"}, {"texte_html": "Par une unique question oui / non", "score": -30.0, "feedback_html": "<p>La moyenne d'une variable 0/1 n'est qu'une proportion : elle ne mesure pas un niveau d'anxiété.<\/p>"}, {"texte_html": "Par un code 1, 2, 3 attribué à chaque groupe de passation", "score": -50.0, "feedback_html": "<p>Un code de groupe n'est pas une mesure de l'anxiété.<\/p>"}]}, {"id": "X-CM1-007", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>La variable « nombre de frères et sœurs » va de 0 à 6 chez 200 étudiants. Faut-il la regrouper en classes pour la décrire ?<\/p>", "question_texte": "La variable « nombre de frères et sœurs » va de 0 à 6 chez 200 étudiants. Faut-il la regrouper en classes pour la décrire ?", "feedback_general_html": "<p>Regrouper en classes simplifie mais fait perdre de l'information : on ne le fait que si le tableau valeur par valeur serait illisible.<\/p>", "options": [{"texte_html": "Non : avec 7 valeurs possibles, un tableau valeur par valeur reste lisible.", "score": 100.0, "feedback_html": "<p>Exact. On ne regroupe en classes que lorsque les valeurs sont trop nombreuses.<\/p>"}, {"texte_html": "Oui, une variable numérique se regroupe toujours en classes.", "score": -20.0, "feedback_html": "<p>Les classes servent quand les valeurs sont trop nombreuses ; avec 7 valeurs, ce n'est pas nécessaire.<\/p>"}, {"texte_html": "Non, car on ne peut pas regrouper une variable discrète.", "score": -30.0, "feedback_html": "<p>On peut regrouper une variable discrète quand elle prend beaucoup de valeurs.<\/p>"}, {"texte_html": "Oui, car c'est une variable continue.", "score": -50.0, "feedback_html": "<p>C'est un comptage, donc une variable discrète.<\/p>"}]}, {"id": "X-CM1-008", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 3, "question_html": "<p>Un chercheur hésite à remplacer le score DASS par ses 5 catégories dans toutes ses analyses. Quel argument est correct ?<\/p>", "question_texte": "Un chercheur hésite à remplacer le score DASS par ses 5 catégories dans toutes ses analyses. Quel argument est correct ?", "feedback_general_html": "<p>Simplifier une variable peut aider à la lecture, mais fait toujours perdre de l'information.<\/p>", "options": [{"texte_html": "Les catégories facilitent la lecture clinique, mais font perdre de l'information : mieux vaut garder aussi le score.", "score": 100.0, "feedback_html": "<p>Exact. Les catégories sont parlantes, mais le score contient plus d'information.<\/p>"}, {"texte_html": "Les deux contiennent exactement la même information.", "score": -20.0, "feedback_html": "<p>Plusieurs scores donnent la même catégorie : le regroupement perd de l'information.<\/p>"}, {"texte_html": "Le score n'a pas de sens, car il est ordinal.", "score": -30.0, "feedback_html": "<p>Le score DASS est une variable numérique ; ce sont les catégories qui sont ordinales.<\/p>"}, {"texte_html": "Les catégories sont plus précises que le score.", "score": -50.0, "feedback_html": "<p>C'est l'inverse : les catégories sont moins précises que le score.<\/p>"}]}, {"id": "X-CM2-001", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 1, "question_html": "<p>Une enquête relève le niveau d'études de 250 étudiants (L1, L2, L3, M1, M2). Quel graphique faut-il choisir pour représenter cette variable ?<\/p>", "question_texte": "Une enquête relève le niveau d'études de 250 étudiants (L1, L2, L3, M1, M2). Quel graphique faut-il choisir pour représenter cette variable ?", "feedback_general_html": "<p>Variable qualitative : diagramme en barres. Si elle est ordinale, les barres suivent l'ordre des modalités ; si elle est nominale, l'ordre est libre.<\/p>", "options": [{"texte_html": "Un diagramme en barres, avec les barres dans l'ordre L1, L2, L3, M1, M2", "score": 100.0, "feedback_html": "<p>Exact. La variable est qualitative ordinale : des barres séparées, rangées dans l'ordre des modalités.<\/p>"}, {"texte_html": "Un histogramme", "score": -50.0, "feedback_html": "<p>L'histogramme est réservé aux variables numériques continues regroupées en classes. Le niveau d'études est une variable qualitative.<\/p>"}, {"texte_html": "Un diagramme en barres, avec les barres rangées par effectif décroissant", "score": -20.0, "feedback_html": "<p>Le type de graphique est le bon, mais trier par effectif casse l'ordre naturel des modalités. Cela convient à une variable nominale, pas ordinale.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -30.0, "feedback_html": "<p>Le camembert se lit mal (on compare des angles) et fait perdre l'ordre des modalités. Avec cinq modalités, il devient difficile à lire.<\/p>"}]}, {"id": "X-CM3-001", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une expérience de temps de réaction, la plupart des participants répondent en 300 à 500 ms, mais quelques-uns, inattentifs, mettent plus de 2 000 ms. Quel couple d'indices choisir pour décrire ces temps ?<\/p>", "question_texte": "Dans une expérience de temps de réaction, la plupart des participants répondent en 300 à 500 ms, mais quelques-uns, inattentifs, mettent plus de 2 000 ms. Quel couple d'indices choisir pour décrire ces temps ?", "feedback_general_html": "<p>Couples cohérents : moyenne + écart-type (distribution symétrique, sans valeurs extrêmes) ; médiane + écart interquartile (asymétrie ou valeurs extrêmes).<\/p>", "options": [{"texte_html": "La médiane et l'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Avec des valeurs extrêmes, on choisit des indices robustes, et un couple cohérent position + dispersion.<\/p>"}, {"texte_html": "La moyenne et l'écart-type", "score": -50.0, "feedback_html": "<p>C'est le couple adapté à une distribution à peu près symétrique, sans valeurs extrêmes. Ici, les quelques temps très longs tireraient la moyenne et l'écart-type vers le haut.<\/p>"}, {"texte_html": "La médiane et l'étendue", "score": -30.0, "feedback_html": "<p>La médiane convient, mais l'étendue est l'indice le moins robuste. Elle ne dépend que du minimum et du maximum, donc précisément des temps aberrants.<\/p>"}, {"texte_html": "La moyenne et l'écart interquartile", "score": -20.0, "feedback_html": "<p>L'écart interquartile convient, mais la moyenne n'est pas robuste. Et l'on associe d'habitude médiane avec EIQ, moyenne avec écart-type.<\/p>"}]}, {"id": "X-CM4-001", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 3, "question_html": "<p>Léa a obtenu 15 à un test de mémoire (moyenne du groupe 12, écart-type 2) et 18 à un test d'attention (moyenne 14, écart-type 4). Pour savoir dans quel test sa performance est la plus remarquable, que faut-il faire ?<\/p>", "question_texte": "Léa a obtenu 15 à un test de mémoire (moyenne du groupe 12, écart-type 2) et 18 à un test d'attention (moyenne 14, écart-type 4). Pour savoir dans quel test sa performance est la plus remarquable, que faut-il faire ?", "feedback_general_html": "<p>Le score z, z = (x − moyenne) / écart-type, exprime l'écart à la moyenne en nombre d'écarts-types. Il permet de comparer des valeurs mesurées sur des échelles différentes.<\/p>", "options": [{"texte_html": "Calculer ses scores z dans chaque test et les comparer", "score": 100.0, "feedback_html": "<p>Exact. Mémoire : z = (15 − 12) / 2 = 1,5. Attention : z = (18 − 14) / 4 = 1. Sa performance est plus remarquable en mémoire, alors que son écart brut y est plus petit.<\/p>"}, {"texte_html": "Comparer directement ses deux notes, 15 et 18", "score": -30.0, "feedback_html": "<p>Les deux tests n'ont ni la même moyenne ni la même dispersion. Une note brute seule ne dit pas si la performance est haute ou basse dans son groupe.<\/p>"}, {"texte_html": "Comparer ses écarts bruts à la moyenne, 3 et 4 points", "score": -20.0, "feedback_html": "<p>C'est la moitié du chemin. Il faut aussi tenir compte de la dispersion de chaque test. Un écart de 4 points compte moins quand l'écart-type vaut 4 que quand il vaut 2.<\/p>"}, {"texte_html": "Comparer les coefficients d'asymétrie des deux tests", "score": -50.0, "feedback_html": "<p>L'asymétrie décrit la forme de chaque distribution. Elle ne dit pas où se situe Léa dans chacune.<\/p>"}]}, {"id": "X-CM5-001", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 2, "question_html": "<p>On veut mesurer la liaison entre l'âge de 80 patients et leur satisfaction à l'égard d'une thérapie, notée sur une échelle de 1 (pas du tout satisfait) à 5 (tout à fait satisfait). Quel indice choisir ?<\/p>", "question_texte": "On veut mesurer la liaison entre l'âge de 80 patients et leur satisfaction à l'égard d'une thérapie, notée sur une échelle de 1 (pas du tout satisfait) à 5 (tout à fait satisfait). Quel indice choisir ?", "feedback_general_html": "<p>Spearman = corrélation de Pearson calculée sur les rangs. À préférer quand une variable est ordinale, quand il y a des valeurs extrêmes, ou quand la liaison est monotone sans être linéaire.<\/p>", "options": [{"texte_html": "Le coefficient de corrélation de Spearman", "score": 100.0, "feedback_html": "<p>Exact. La satisfaction est une variable ordinale. Spearman ne travaille que sur les rangs et ne suppose pas que les écarts entre modalités sont égaux.<\/p>"}, {"texte_html": "Le coefficient de corrélation de Pearson", "score": -20.0, "feedback_html": "<p>Pearson traite l'échelle de 1 à 5 comme numérique, en supposant des écarts égaux entre modalités. Pour une variable ordinale, Spearman est plus adapté.<\/p>"}, {"texte_html": "La covariance entre l'âge et la satisfaction", "score": -30.0, "feedback_html": "<p>La covariance dépend des unités. Sa valeur ne dit rien de l'intensité de la liaison, et elle suppose aussi deux variables numériques.<\/p>"}, {"texte_html": "Aucun indice, car on ne peut pas mesurer de liaison avec une variable ordinale", "score": -50.0, "feedback_html": "<p>C'est justement le rôle du coefficient de Spearman. Il mesure une liaison monotone et fonctionne avec des variables ordinales.<\/p>"}]}, {"id": "C-CM1-001", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans un fichier de données, le numéro du groupe de TD de chaque étudiant (de 1 à 12) est une variable…<\/p>", "question_texte": "Dans un fichier de données, le numéro du groupe de TD de chaque étudiant (de 1 à 12) est une variable…", "feedback_general_html": "<p>Une variable codée par des chiffres n'est numérique que si ces chiffres représentent des quantités. Un numéro de groupe, d'étudiant ou un code postal sont des variables nominales.<\/p>", "options": [{"texte_html": "nominale", "score": 100.0, "feedback_html": "<p>Exact. Le numéro sert seulement à nommer le groupe. Le groupe 6 n'est pas « deux fois » le groupe 3, et il n'est pas « plus » que le groupe 2.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>C'est le piège classique : des chiffres ne font pas une variable numérique. Test simple : une moyenne des numéros de groupe aurait-elle un sens ? Non.<\/p>"}, {"texte_html": "ordinale", "score": -20.0, "feedback_html": "<p>Les groupes ne sont pas rangés selon un ordre qui a un sens. Le groupe 12 n'est pas « au-dessus » du groupe 1.<\/p>"}, {"texte_html": "numérique continue", "score": -50.0, "feedback_html": "<p>Une variable continue suppose des valeurs qui sont des quantités, avec toujours une valeur possible entre deux autres. Ce n'est pas le cas d'un numéro de groupe.<\/p>"}]}, {"id": "C-CM1-002", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une expérience de temps de réaction, chacun des 10 participants réalise 40 essais. On analyse la durée de chaque essai. Quels sont les individus statistiques ?<\/p>", "question_texte": "Dans une expérience de temps de réaction, chacun des 10 participants réalise 40 essais. On analyse la durée de chaque essai. Quels sont les individus statistiques ?", "feedback_general_html": "<p>L'individu (ou unité statistique) est l'entité sur laquelle on mesure les variables : une ligne du tableau de données. Ce n'est pas forcément une personne : un essai, une séance, une classe…<\/p>", "options": [{"texte_html": "Chacun des 400 essais", "score": 100.0, "feedback_html": "<p>Exact. On mesure une durée par essai : chaque essai est une ligne du tableau de données, donc un individu statistique. Il y en a 10 × 40 = 400.<\/p>"}, {"texte_html": "Chacun des 10 participants", "score": -20.0, "feedback_html": "<p>C'est l'erreur la plus fréquente : un individu statistique n'est pas toujours une personne. Ici, la durée est mesurée à chaque essai, pas une seule fois par participant.<\/p>"}, {"texte_html": "Les temps de réaction", "score": -30.0, "feedback_html": "<p>Le temps de réaction est la variable mesurée, pas l'individu. L'individu est ce sur quoi on mesure la variable : l'essai.<\/p>"}, {"texte_html": "L'expérience dans son ensemble", "score": -50.0, "feedback_html": "<p>L'expérience est l'étude elle-même. Les individus sont les unités sur lesquelles on recueille une valeur, ici les essais.<\/p>"}]}, {"id": "C-CM1-005", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pour la variable <code>filiere<\/code>, « Sciences », « Psychologie » et « Arts » sont…<\/p>", "question_texte": "Pour la variable `filiere`, « Sciences », « Psychologie » et « Arts » sont…", "feedback_general_html": "<p>Une variable est une caractéristique qui varie d'un individu à l'autre ; ses modalités sont les valeurs qu'elle peut prendre.<\/p>", "options": [{"texte_html": "les modalités de la variable", "score": 100.0, "feedback_html": "<p>Exact. Les modalités sont les valeurs que peut prendre une variable.<\/p>"}, {"texte_html": "trois variables différentes", "score": -20.0, "feedback_html": "<p>Il n'y a qu'une variable, la filière. Sciences, Psychologie et Arts sont ses valeurs possibles.<\/p>"}, {"texte_html": "des effectifs", "score": -30.0, "feedback_html": "<p>Un effectif est un nombre d'individus. « Sciences » est une modalité ; l'effectif est le nombre d'étudiants qui la présentent (100).<\/p>"}, {"texte_html": "des individus", "score": -50.0, "feedback_html": "<p>Les individus sont les étudiants. Sciences, Psychologie et Arts sont les valeurs que prend leur filière.<\/p>"}]}, {"id": "C-CM1-010", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>La variable <code>filiere<\/code> (Sciences, Psychologie, Arts) est…<\/p>", "question_texte": "La variable `filiere` (Sciences, Psychologie, Arts) est…", "feedback_general_html": "<p>Variable nominale : qualitative, sans ordre entre les modalités. Ordinale : qualitative, avec un ordre naturel.<\/p>", "options": [{"texte_html": "nominale", "score": 100.0, "feedback_html": "<p>Exact. Ses modalités sont des catégories sans ordre naturel.<\/p>"}, {"texte_html": "ordinale", "score": -33.33333, "feedback_html": "<p>Il n'y a pas d'ordre naturel entre sciences, psychologie et arts : on peut les ranger dans n'importe quel ordre.<\/p>"}, {"texte_html": "numérique discrète", "score": -33.33333, "feedback_html": "<p>Ses modalités ne sont pas des quantités : même codées 1, 2, 3, une « filière moyenne » n'aurait aucun sens.<\/p>"}, {"texte_html": "dichotomique", "score": -33.33333, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; la filière en a trois.<\/p>"}]}, {"id": "C-CM1-011", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>La variable <code>niveau<\/code> (L1, L2, L3) est…<\/p>", "question_texte": "La variable `niveau` (L1, L2, L3) est…", "feedback_general_html": "<p>Ordinale : on peut ranger les modalités, mais l'écart entre deux modalités n'est pas mesurable.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses modalités sont des catégories ordonnées : L1 &lt; L2 &lt; L3.<\/p>"}, {"texte_html": "numérique discrète", "score": -20.0, "feedback_html": "<p>Le chiffre dans « L1 » ou « L2 » n'est pas une quantité mesurée : on sait ranger les niveaux, mais pas mesurer l'écart entre eux.<\/p>"}, {"texte_html": "nominale", "score": -30.0, "feedback_html": "<p>Les modalités ont un ordre naturel (L1 &lt; L2 &lt; L3) : la variable est ordinale.<\/p>"}, {"texte_html": "numérique continue", "score": -50.0, "feedback_html": "<p>Il n'existe pas de valeur entre L1 et L2 : la variable n'est pas continue, ni même numérique.<\/p>"}]}, {"id": "C-CM1-015", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans le logiciel Jamovi (par exemple), comment appelle-t-on une variable qualitative (catégorielle) qui sert à former des groupes à comparer ?<\/p>", "question_texte": "Dans le logiciel Jamovi (par exemple), comment appelle-t-on une variable qualitative (catégorielle) qui sert à former des groupes à comparer ?", "feedback_general_html": "<p>Un facteur est une variable qualitative à peu de modalités, utilisée pour former des groupes à comparer.<\/p>", "options": [{"texte_html": "Un facteur", "score": 100.0, "feedback_html": "<p>Exact. La filière, par exemple, est un facteur à trois modalités qui définit trois groupes.<\/p>"}, {"texte_html": "Une modalité", "score": -20.0, "feedback_html": "<p>Les modalités sont les valeurs du facteur (Sciences, Psychologie, Arts), pas la variable elle-même.<\/p>"}, {"texte_html": "Un identifiant", "score": -30.0, "feedback_html": "<p>Un identifiant distingue chaque individu : il ne forme pas de groupes.<\/p>"}, {"texte_html": "Une variable continue", "score": -50.0, "feedback_html": "<p>Une variable continue est numérique ; un facteur est qualitatif.<\/p>"}]}, {"id": "C-CM1-016", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Une variable est codée par des chiffres. Quelle question permet de savoir si elle est vraiment numérique ?<\/p>", "question_texte": "Une variable est codée par des chiffres. Quelle question permet de savoir si elle est vraiment numérique ?", "feedback_general_html": "<p>Des chiffres ne font pas une variable numérique. Test : la moyenne de ces valeurs a-t-elle un sens ?<\/p>", "options": [{"texte_html": "Une moyenne de ces valeurs aurait-elle un sens ?", "score": 100.0, "feedback_html": "<p>Exact. Si la moyenne n'a pas de sens (une « filière moyenne » de 2,0), les chiffres ne sont que des codes.<\/p>"}, {"texte_html": "Les valeurs sont-elles des nombres entiers ?", "score": -20.0, "feedback_html": "<p>Des entiers peuvent être de vraies quantités (un comptage) ou de simples codes (un numéro de groupe). Ce critère distingue plutôt discret et continu.<\/p>"}, {"texte_html": "Le logiciel accepte-t-il de calculer une moyenne ?", "score": -30.0, "feedback_html": "<p>Le logiciel calcule la moyenne de n'importe quels chiffres, même d'un code de filière. C'est à nous de juger si elle a un sens.<\/p>"}, {"texte_html": "Les valeurs sont-elles toutes différentes ?", "score": -50.0, "feedback_html": "<p>Des valeurs toutes différentes évoquent un identifiant, ce qui ne dit rien du caractère numérique.<\/p>"}]}, {"id": "C-CM1-020", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 3, "question_html": "<p>La variable <code>prop_repetitions<\/code> vaut 0, 1/49, 2/49… Que dire de son statut ?<\/p>", "question_texte": "La variable `prop_repetitions` vaut 0, 1/49, 2/49… Que dire de son statut ?", "feedback_general_html": "<p>Le statut discret ou continu dépend aussi de l'usage : une variable discrète aux valeurs nombreuses et serrées peut être traitée comme continue.<\/p>", "options": [{"texte_html": "Elle est discrète en théorie, mais on la traite comme continue car ses valeurs sont nombreuses et serrées.", "score": 100.0, "feedback_html": "<p>Exact. Elle ne prend que des multiples de 1/49, mais ces valeurs sont si proches qu'on la traite comme continue.<\/p>"}, {"texte_html": "Elle est discrète, et on ne peut pas la traiter comme continue.", "score": -20.0, "feedback_html": "<p>Elle est bien discrète en théorie, mais on peut la traiter comme continue : c'est un choix de modélisation justifié par le nombre et la proximité de ses valeurs.<\/p>"}, {"texte_html": "Elle est continue, car c'est une proportion.", "score": -30.0, "feedback_html": "<p>Une proportion calculée à partir d'un comptage reste discrète : elle ne peut valoir que 0, 1/49, 2/49…<\/p>"}, {"texte_html": "Elle est qualitative, car elle est comprise entre 0 et 1.", "score": -50.0, "feedback_html": "<p>Être comprise entre 0 et 1 ne rend pas une variable qualitative : c'est une quantité.<\/p>"}]}, {"id": "C-CM1-022", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pour une variable nominale, quel est le seul indice de position utilisable ?<\/p>", "question_texte": "Pour une variable nominale, quel est le seul indice de position utilisable ?", "feedback_general_html": "<p>Le type de variable commande les indices : mode pour une variable nominale, médiane pour une ordinale, moyenne pour une numérique.<\/p>", "options": [{"texte_html": "Le mode", "score": 100.0, "feedback_html": "<p>Exact. Le mode (la modalité la plus fréquente) ne suppose ni ordre ni quantité.<\/p>"}, {"texte_html": "La médiane", "score": -20.0, "feedback_html": "<p>La médiane suppose de ranger les valeurs : elle n'a pas de sens sans ordre entre les modalités.<\/p>"}, {"texte_html": "L'effectif cumulé", "score": -30.0, "feedback_html": "<p>Ce n'est pas un indice de position, et cumuler suppose aussi un ordre.<\/p>"}, {"texte_html": "La moyenne", "score": -50.0, "feedback_html": "<p>Une moyenne de catégories, comme une « filière moyenne », n'a aucun sens.<\/p>"}]}, {"id": "C-CM1-025", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>182 des 300 étudiants ont répondu oui. Quelle est la fréquence des « oui » (répondez sans faire de calcul exact) ?<\/p>", "question_texte": "182 des 300 étudiants ont répondu oui. Quelle est la fréquence des « oui » (répondez sans faire de calcul exact) ?", "feedback_general_html": "<p>Fréquence = effectif de la modalité / effectif total. Elle est toujours comprise entre 0 et 1 (0 et 100 %).<\/p>", "options": [{"texte_html": "0,607, soit 60,7 %", "score": 100.0, "feedback_html": "<p>Exact. 182 / 300 : un peu plus de la moitié, environ 0,6.<\/p>"}, {"texte_html": "0,393", "score": -20.0, "feedback_html": "<p>0,393 est la fréquence des « non » (118 / 300). Les « oui » sont plus de la moitié : leur fréquence dépasse 0,5.<\/p>"}, {"texte_html": "182", "score": -30.0, "feedback_html": "<p>182 est l'effectif des « oui ». La fréquence est la part qu'ils représentent : 182 / 300.<\/p>"}, {"texte_html": "1,54", "score": -50.0, "feedback_html": "<p>Une fréquence ne dépasse jamais 1 (100 %). 1,54 correspond à 182 / 118, une division par le nombre de « non ».<\/p>"}]}, {"id": "C-CM1-026", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans un tableau de distribution, la somme des <strong>fréquences<\/strong> de toutes les modalités vaut…<\/p>", "question_texte": "Dans un tableau de distribution, la somme des **fréquences** de toutes les modalités vaut…", "feedback_general_html": "<p>La somme des effectifs vaut l'effectif total ; la somme des fréquences vaut 1 (100 %).<\/p>", "options": [{"texte_html": "1, soit 100 %", "score": 100.0, "feedback_html": "<p>Exact. Chaque individu est compté une fois, dans une seule modalité : les parts additionnées font le tout.<\/p>"}, {"texte_html": "l'effectif total", "score": -20.0, "feedback_html": "<p>C'est la somme des effectifs qui vaut l'effectif total. La somme des fréquences vaut 1.<\/p>"}, {"texte_html": "une valeur qui dépend de la variable", "score": -30.0, "feedback_html": "<p>Quelle que soit la variable, les fréquences de toutes les modalités totalisent 1.<\/p>"}, {"texte_html": "le nombre de modalités", "score": -50.0, "feedback_html": "<p>Le nombre de modalités n'a aucun lien avec la somme des fréquences.<\/p>"}]}, {"id": "C-CM1-027", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans la distribution de <code>niveau<\/code>, le pourcentage cumulé de L2 vaut 75,3 %. Cela signifie que…<\/p>", "question_texte": "Dans la distribution de `niveau`, le pourcentage cumulé de L2 vaut 75,3 %. Cela signifie que…", "feedback_general_html": "<p>Pourcentage cumulé d'une modalité = part des individus qui ont cette modalité ou une modalité inférieure.<\/p>", "options": [{"texte_html": "75,3 % des étudiants sont en L1 ou en L2", "score": 100.0, "feedback_html": "<p>Exact. Le cumul additionne les modalités jusqu'à L2 incluse : 75,3 % des étudiants sont au plus en L2.<\/p>"}, {"texte_html": "75,3 % des étudiants sont en L2", "score": -20.0, "feedback_html": "<p>Le pourcentage cumulé n'est pas celui de la seule modalité L2 (36,3 %) : il inclut aussi les L1.<\/p>"}, {"texte_html": "75,3 % des étudiants sont en L2 ou en L3", "score": -30.0, "feedback_html": "<p>Le cumul croissant part de la première modalité : il additionne L1 et L2, pas L2 et L3.<\/p>"}, {"texte_html": "24,7 % des étudiants sont en L1", "score": -50.0, "feedback_html": "<p>24,7 % (100 − 75,3) est la part des étudiants au-delà de L2, donc des L3.<\/p>"}]}, {"id": "C-CM1-028", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pourquoi ne calcule-t-on pas de fréquences cumulées pour la variable <code>filiere<\/code> ?<\/p>", "question_texte": "Pourquoi ne calcule-t-on pas de fréquences cumulées pour la variable `filiere` ?", "feedback_general_html": "<p>Cumuler suppose un ordre entre les modalités : pas de cumul pour une variable nominale.<\/p>", "options": [{"texte_html": "Ses modalités n'ont pas d'ordre : un cumul dépendrait d'un ordre arbitraire.", "score": 100.0, "feedback_html": "<p>Exact. « 200 étudiants sont au plus en psychologie » n'a pas de sens.<\/p>"}, {"texte_html": "Ses trois modalités ont le même effectif.", "score": -20.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'absence d'ordre entre modalités qui empêche de cumuler.<\/p>"}, {"texte_html": "Jamovi ne le permet pas.", "score": -30.0, "feedback_html": "<p>C'est une question de sens, pas de logiciel.<\/p>"}, {"texte_html": "On ne peut pas calculer de fréquences pour une variable qualitative.", "score": -50.0, "feedback_html": "<p>On peut calculer des fréquences pour toute variable. C'est le cumul qui suppose un ordre.<\/p>"}]}, {"id": "C-CM1-034", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pour un temps de réaction mesuré à la milliseconde, pourquoi un tableau des effectifs valeur par valeur est-il peu utile ?<\/p>", "question_texte": "Pour un temps de réaction mesuré à la milliseconde, pourquoi un tableau des effectifs valeur par valeur est-il peu utile ?", "feedback_general_html": "<p>Pour une variable continue, on s'intéresse à la part des individus dans un intervalle plutôt qu'à chaque valeur exacte.<\/p>", "options": [{"texte_html": "Une valeur précise n'est presque jamais observée deux fois.", "score": 100.0, "feedback_html": "<p>Exact. Presque chaque valeur aurait un effectif de 1 : on regroupe donc en classes.<\/p>"}, {"texte_html": "Les effectifs seraient trop grands.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : ils seraient presque tous de 1.<\/p>"}, {"texte_html": "On ne peut pas compter des individus pour une variable continue.", "score": -30.0, "feedback_html": "<p>On peut toujours compter ; le problème est que chaque valeur exacte est presque unique.<\/p>"}, {"texte_html": "Les fréquences dépasseraient 100 %.", "score": -50.0, "feedback_html": "<p>Le total des fréquences vaut toujours 100 %.<\/p>"}]}, {"id": "C-CM1-035", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec un vrai dé, combien de répétitions attend-on environ dans une suite de 50 lancers (49 paires de lancers voisins) ?<\/p>", "question_texte": "Avec un vrai dé, combien de répétitions attend-on environ dans une suite de 50 lancers (49 paires de lancers voisins) ?", "feedback_general_html": "<p>Avec un dé, une paire de lancers voisins est une répétition une fois sur six. Les humains en produisent moins que le hasard.<\/p>", "options": [{"texte_html": "Environ 8", "score": 100.0, "feedback_html": "<p>Exact. Chaque paire a une chance sur six d'être une répétition : 49 / 6 ≈ 8.<\/p>"}, {"texte_html": "Environ 5", "score": -20.0, "feedback_html": "<p>C'est ce que font les étudiants, qui évitent les répétitions. Le hasard en produit davantage.<\/p>"}, {"texte_html": "Environ 25", "score": -30.0, "feedback_html": "<p>Ce serait le cas avec une chance sur deux (une pièce). Avec un dé, c'est une chance sur six.<\/p>"}, {"texte_html": "Aucune, car le hasard évite les répétitions", "score": -50.0, "feedback_html": "<p>C'est précisément l'intuition fausse étudiée dans le cours : le hasard produit des répétitions.<\/p>"}]}, {"id": "C-CM2-001", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans un histogramme, qu'est-ce qui représente la fréquence d'une classe ?<\/p>", "question_texte": "Dans un histogramme, qu'est-ce qui représente la fréquence d'une classe ?", "feedback_general_html": "<p>Histogramme : fréquence d'une classe = aire de la barre. D'où la règle : quand les classes ont des largeurs différentes, on met une densité en ordonnée, pas un effectif.<\/p>", "options": [{"texte_html": "L'aire de la barre", "score": 100.0, "feedback_html": "<p>Exact. Dans un histogramme, c'est l'aire de la barre qui représente la part des individus dans la classe. La hauteur est une densité.<\/p>"}, {"texte_html": "La hauteur de la barre", "score": -20.0, "feedback_html": "<p>C'est vrai pour un diagramme en barres ou en bâtons, pas pour un histogramme. Hauteur et aire ne racontent la même chose que si toutes les classes ont la même largeur.<\/p>"}, {"texte_html": "La largeur de la barre", "score": -30.0, "feedback_html": "<p>La largeur est l'amplitude de la classe, fixée par le choix des classes. Elle ne dit rien du nombre d'individus.<\/p>"}, {"texte_html": "La position du milieu de la barre sur l'axe horizontal", "score": -50.0, "feedback_html": "<p>Le milieu de la barre est le centre de la classe, une valeur de la variable. Ce n'est pas une fréquence.<\/p>"}]}, {"id": "C-CM3-001", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?<\/p>", "question_texte": "Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?", "feedback_general_html": "<p>Indices robustes (peu sensibles aux valeurs extrêmes) : médiane, écart interquartile. Indices non robustes : moyenne, écart-type et surtout étendue.<\/p>", "options": [{"texte_html": "La moyenne et l'écart-type", "score": 100.0, "feedback_html": "<p>Exact. Ces deux indices ne sont pas robustes. Chaque valeur pèse selon sa distance au centre, et 40 est très loin.<\/p>"}, {"texte_html": "La médiane et l'écart interquartile", "score": -50.0, "feedback_html": "<p>C'est l'inverse. La médiane et l'EIQ ne dépendent que du rang des valeurs. Un individu de plus, même très extrême, les déplace à peine.<\/p>"}, {"texte_html": "La médiane et l'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type bouge, oui. Mais la médiane est robuste : elle ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La moyenne et l'écart interquartile", "score": -30.0, "feedback_html": "<p>La moyenne bouge, oui. Mais l'EIQ est robuste : il ignore les 25 % les plus bas et les 25 % les plus hauts.<\/p>"}]}, {"id": "C-CM4-001", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?<\/p>", "question_texte": "Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?", "feedback_general_html": "<p>Moyen mnémotechnique : la moyenne est tirée du côté de la queue. Asymétrie à gauche : moyenne &lt; médiane &lt; mode. Asymétrie à droite : mode &lt; médiane &lt; moyenne.<\/p>", "options": [{"texte_html": "Asymétrique à gauche", "score": 100.0, "feedback_html": "<p>Exact. Moyenne &lt; médiane &lt; mode. La moyenne est tirée vers les petites valeurs : la queue de la distribution est à gauche.<\/p>"}, {"texte_html": "Asymétrique à droite", "score": -20.0, "feedback_html": "<p>Le sommet (le mode) est à droite, mais l'asymétrie se nomme du côté de la queue, pas du côté du sommet. Ici, la queue est à gauche.<\/p>"}, {"texte_html": "Symétrique", "score": -30.0, "feedback_html": "<p>Dans une distribution symétrique, mode, médiane et moyenne sont confondus ou très proches. Ici, ils s'étalent de 8 à 12.<\/p>"}, {"texte_html": "Bimodale", "score": -50.0, "feedback_html": "<p>L'énoncé précise que la distribution est unimodale. L'ordre des trois indices renseigne sur l'asymétrie, pas sur le nombre de sommets.<\/p>"}]}, {"id": "C-CM5-001", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?<\/p>", "question_texte": "Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?", "feedback_general_html": "<p>Avant d'interpréter r, toujours regarder le nuage de points. r proche de 0 ne veut pas dire « aucune liaison ».<\/p>", "options": [{"texte_html": "Il n'y a presque pas de liaison linéaire, mais il peut exister une liaison d'une autre forme.", "score": 100.0, "feedback_html": "<p>Exact. r ne mesure que la liaison linéaire. Une liaison en U (performance maximale pour un stress moyen) peut donner un r proche de 0. Il faut regarder le nuage de points.<\/p>"}, {"texte_html": "Le stress n'a aucun lien avec la performance.", "score": -20.0, "feedback_html": "<p>Conclusion trop forte. Un r proche de 0 exclut seulement une liaison linéaire. Une liaison nette en forme de U peut donner r ≈ 0.<\/p>"}, {"texte_html": "Le stress a un faible effet causal sur la performance.", "score": -50.0, "feedback_html": "<p>Une corrélation ne permet pas de conclure à un effet causal, quelle que soit sa valeur.<\/p>"}, {"texte_html": "Il faudrait plutôt calculer la covariance, qui détecte les liaisons non linéaires.", "score": -30.0, "feedback_html": "<p>La covariance mesure la même chose que r (une liaison linéaire), mais dans les unités des variables. Elle ne détecte pas mieux une liaison en U.<\/p>"}]}, {"id": "S-001", "type": "serie", "categorie": "interpretation", "cm": [3, 4], "etude": {"titre": "Score de dépression selon la filière"}, "etude_html": "<h4>Score de dépression selon la filière<\/h4><p>300 étudiants de L1 à L3 (sciences, psychologie, arts, 100 par filière) ont rempli l'échelle de dépression de la DASS-21 (score de 0 à 42). On compare la distribution du score dans les trois filières.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Arts<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Psychologie<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Sciences<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Manquant<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">10,46<\/td><td style=\"padding:2px 12px;text-align:right\">10,14<\/td><td style=\"padding:2px 12px;text-align:right\">7,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">10,28<\/td><td style=\"padding:2px 12px;text-align:right\">9,69<\/td><td style=\"padding:2px 12px;text-align:right\">9,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">42<\/td><td style=\"padding:2px 12px;text-align:right\">34<\/td><td style=\"padding:2px 12px;text-align:right\">38<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">25e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,00<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">75e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">16,0<\/td><td style=\"padding:2px 12px;text-align:right\">16,5<\/td><td style=\"padding:2px 12px;text-align:right\">12,0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Asymétrie<\/td><td style=\"padding:2px 12px;text-align:right\">1,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,75<\/td><td style=\"padding:2px 12px;text-align:right\">1,41<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Aplatissement<\/td><td style=\"padding:2px 12px;text-align:right\">0,18<\/td><td style=\"padding:2px 12px;text-align:right\">-0,55<\/td><td style=\"padding:2px 12px;text-align:right\">1,03<\/td><\/tr><\/table><p style=\"font-size:0.85em;color:#555;margin-top:2px\">Variable dass_depression, séparée par filiere<\/p>", "questions": [{"id": "S-001-q1", "difficulte": 1, "question_html": "<p>Dans quelle filière la médiane du score de dépression est-elle la plus basse ?<\/p>", "question_texte": "Dans quelle filière la médiane du score de dépression est-elle la plus basse ?", "feedback_general_html": "<p>On lit la ligne « Médiane » du tableau. Elle vaut 8 en arts et en psychologie, 4 en sciences.<\/p>", "options": [{"texte_html": "Sciences", "score": 100.0, "feedback_html": "<p>Exact. La médiane vaut 4 en sciences, contre 8 dans les deux autres filières. La moitié des étudiants de sciences a un score de 4 ou moins.<\/p>"}, {"texte_html": "Arts", "score": -20.0, "feedback_html": "<p>La médiane d'arts vaut 8. Vous avez peut-être lu une autre ligne du tableau, comme la moyenne ou le maximum.<\/p>"}, {"texte_html": "Psychologie", "score": -30.0, "feedback_html": "<p>La médiane de psychologie vaut 8, comme en arts. C'est en sciences qu'elle est la plus basse (4).<\/p>"}, {"texte_html": "Elle est la même dans les trois filières, puisque le minimum vaut 0 partout.", "score": -50.0, "feedback_html": "<p>Le minimum et la médiane sont deux indices différents. Le minimum est la plus petite valeur ; la médiane coupe le groupe en deux moitiés.<\/p>"}]}, {"id": "S-001-q2", "difficulte": 2, "question_html": "<p>Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?<\/p>", "question_texte": "Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?", "feedback_general_html": "<p>Quand la moyenne dépasse nettement la médiane, la distribution est asymétrique à droite. Les coefficients d'asymétrie, tous positifs, le confirment.<\/p>", "options": [{"texte_html": "La distribution est étirée vers la droite ; quelques scores élevés tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est sensible aux valeurs extrêmes ; la médiane ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La distribution est étirée vers la gauche.", "score": -30.0, "feedback_html": "<p>C'est l'inverse. La moyenne est tirée du côté de la queue de la distribution. Ici elle est au-dessus de la médiane, donc la queue est à droite, vers les scores élevés.<\/p>"}, {"texte_html": "Il y a des données manquantes dans le tableau.", "score": -50.0, "feedback_html": "<p>La ligne « Manquant » vaut 0 dans les trois filières. L'écart entre moyenne et médiane vient de la forme de la distribution.<\/p>"}, {"texte_html": "La plupart des étudiants ont un score supérieur à la moyenne.", "score": -20.0, "feedback_html": "<p>C'est le contraire. La médiane étant sous la moyenne, plus de la moitié des étudiants ont un score inférieur à la moyenne.<\/p>"}]}, {"id": "S-001-q3", "difficulte": 2, "question_html": "<p>On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?<\/p>", "question_texte": "On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?", "feedback_general_html": "<p>Pour une distribution asymétrique ou avec des valeurs extrêmes, on décrit la position par la médiane et la dispersion par l'écart interquartile (Q3 − Q1).<\/p>", "options": [{"texte_html": "L'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Les distributions sont asymétriques, avec des valeurs élevées isolées. L'écart interquartile est robuste. Il vaut 14 en arts, 14,5 en psychologie et 12 en sciences.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type n'est pas faux, mais il est sensible aux valeurs extrêmes. Avec des distributions aussi asymétriques, on lui préfère un indice robuste.<\/p>"}, {"texte_html": "L'étendue", "score": -50.0, "feedback_html": "<p>L'étendue est l'indice le moins robuste. Elle ne dépend que des deux valeurs les plus extrêmes : en arts, un seul étudiant à 42 suffit à la gonfler.<\/p>"}, {"texte_html": "La variance", "score": -30.0, "feedback_html": "<p>La variance a les mêmes défauts que l'écart-type, et elle s'exprime en plus dans une unité au carré, difficile à interpréter.<\/p>"}]}, {"id": "S-001-q4", "difficulte": 3, "question_html": "<p>D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?<\/p>", "question_texte": "D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?", "feedback_general_html": "<p>Règle de Tukey : une valeur est atypique si elle dépasse Q3 + 1,5 × EIQ ou si elle est sous Q1 − 1,5 × EIQ.<\/p>", "options": [{"texte_html": "Au-dessus de 30", "score": 100.0, "feedback_html": "<p>Exact. En sciences, Q1 = 0 et Q3 = 12, donc EIQ = 12. Borne haute : 12 + 1,5 × 12 = 30. Les scores de 32, 36 et 38 sont atypiques.<\/p>"}, {"texte_html": "Au-dessus de 24", "score": -20.0, "feedback_html": "<p>24 = Q3 + EIQ. Il manque le facteur 1,5 : la borne est Q3 + 1,5 × EIQ = 12 + 18 = 30.<\/p>"}, {"texte_html": "Au-dessus de 38", "score": -50.0, "feedback_html": "<p>38 est le maximum observé, pas une borne. La règle de Tukey se calcule à partir des quartiles, pas des valeurs extrêmes.<\/p>"}, {"texte_html": "Au-dessus de 37", "score": -30.0, "feedback_html": "<p>37 est la borne calculée en cours sur les 300 étudiants (Q1 = 2, Q3 = 16). Pour les seuls étudiants de sciences, il faut utiliser leurs propres quartiles.<\/p>"}]}, {"id": "S-001-q5", "difficulte": 2, "question_html": "<p>Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?<\/p>", "question_texte": "Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?", "feedback_general_html": "<p>Coefficient d'asymétrie positif = asymétrie à droite ; au-delà de 1, elle est nette. Penser à vérifier sur un graphique que quelques valeurs extrêmes ne suffisent pas à l'expliquer.<\/p>", "options": [{"texte_html": "Elle est nettement asymétrique à droite, plus que dans les deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient d'asymétrie (1,41) dépasse 1, et c'est le plus élevé des trois. La médiane (4) est aussi loin sous la moyenne (7,80).<\/p>"}, {"texte_html": "Elle est asymétrique à gauche.", "score": -20.0, "feedback_html": "<p>Un coefficient d'asymétrie positif signale une asymétrie à droite, c'est-à-dire une queue vers les valeurs élevées.<\/p>"}, {"texte_html": "Elle est proche d'une loi normale, car l'aplatissement est proche de 1.", "score": -30.0, "feedback_html": "<p>Pour une loi normale, le coefficient d'aplatissement de Jamovi vaut 0, pas 1. Et surtout, l'asymétrie de 1,41 exclut une forme normale.<\/p>"}, {"texte_html": "Elle est symétrique, car le minimum est 0 comme dans les autres filières.", "score": -50.0, "feedback_html": "<p>Le minimum ne dit rien de la symétrie. Il faut regarder le coefficient d'asymétrie, ou comparer la moyenne et la médiane.<\/p>"}]}, {"id": "S-001-q6", "difficulte": 3, "question_html": "<p>Laquelle de ces conclusions est correcte ?<\/p>", "question_texte": "Laquelle de ces conclusions est correcte ?", "feedback_general_html": "<p>Comparer des groupes, c'est comparer leur position (médiane, moyenne) et leur dispersion. Une différence observée décrit ces individus ; elle ne prouve pas une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 300 étudiants, ceux de sciences ont en général des scores de dépression plus faibles que ceux des deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. La médiane, la moyenne et les quartiles sont plus bas en sciences. La conclusion reste descriptive et ne vaut que pour ces étudiants.<\/p>"}, {"texte_html": "Faire des études de sciences protège de la dépression.", "score": -30.0, "feedback_html": "<p>C'est une conclusion causale. Ces données d'observation ne permettent pas de la tirer. D'autres variables pourraient expliquer la différence, par exemple la répartition par sexe, qui n'est pas la même selon les filières.<\/p>"}, {"texte_html": "Tous les étudiants de sciences ont un score plus bas que les étudiants d'arts.", "score": -20.0, "feedback_html": "<p>Les distributions se chevauchent largement. Le maximum en sciences (38) dépasse de beaucoup la médiane d'arts (8). Une différence de position ne dit rien de chaque individu.<\/p>"}, {"texte_html": "Les trois filières ne diffèrent pas, puisque leurs écarts-types sont presque identiques.", "score": -50.0, "feedback_html": "<p>L'écart-type mesure la dispersion, pas la position. Des groupes de même dispersion peuvent avoir des positions différentes.<\/p>"}]}]}, {"id": "S-002", "type": "serie", "categorie": "interpretation", "cm": [1], "etude": {"titre": "Qualité du sommeil des étudiants de L1"}, "etude_html": "<h4>Qualité du sommeil des étudiants de L1<\/h4><p>240 étudiants de L1 ont évalué la qualité de leur sommeil du dernier mois, de « très mauvaise » à « très bonne ».<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de qualite_sommeil<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">47<\/td><td style=\"padding:2px 12px;text-align:right\">19,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">27,1 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Correcte<\/td><td style=\"padding:2px 12px;text-align:right\">89<\/td><td style=\"padding:2px 12px;text-align:right\">37,1 %<\/td><td style=\"padding:2px 12px;text-align:right\">64,2 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Bonne<\/td><td style=\"padding:2px 12px;text-align:right\">63<\/td><td style=\"padding:2px 12px;text-align:right\">26,3 %<\/td><td style=\"padding:2px 12px;text-align:right\">90,4 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très bonne<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">9,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table>", "questions": [{"id": "S-002-q1", "difficulte": 1, "question_html": "<p>La variable <code>qualite_sommeil<\/code> est…<\/p>", "question_texte": "La variable `qualite_sommeil` est…", "feedback_general_html": "<p>Catégories ordonnées : variable ordinale.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses cinq modalités sont des catégories ordonnées, de « très mauvaise » à « très bonne ».<\/p>"}, {"texte_html": "nominale", "score": -20.0, "feedback_html": "<p>Les modalités ont un ordre naturel : la variable est ordinale.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>Des modalités ordonnées ne sont pas des quantités : on ne mesure pas l'écart entre « correcte » et « bonne ».<\/p>"}, {"texte_html": "dichotomique", "score": -50.0, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; celle-ci en a cinq.<\/p>"}]}, {"id": "S-002-q2", "difficulte": 1, "question_html": "<p>Combien d'étudiants déclarent un sommeil de « bonne » qualité ?<\/p>", "question_texte": "Combien d'étudiants déclarent un sommeil de « bonne » qualité ?", "feedback_general_html": "<p>Effectif : nombre d'individus d'une modalité. Pourcentage : leur part dans le total.<\/p>", "options": [{"texte_html": "63", "score": 100.0, "feedback_html": "<p>Exact. On lit la colonne « Effectifs » sur la ligne « Bonne ».<\/p>"}, {"texte_html": "23", "score": -20.0, "feedback_html": "<p>23 est l'effectif de la ligne « Très bonne », pas « Bonne ».<\/p>"}, {"texte_html": "217", "score": -30.0, "feedback_html": "<p>217 additionne les effectifs jusqu'à « Bonne » (18 + 47 + 89 + 63) : c'est un effectif cumulé.<\/p>"}, {"texte_html": "26", "score": -50.0, "feedback_html": "<p>26 vient du pourcentage (26,3 %), pas de la colonne des effectifs.<\/p>"}]}, {"id": "S-002-q3", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil au plus « correct » ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil au plus « correct » ?", "feedback_general_html": "<p>« Au plus » une modalité : pourcentage cumulé sur la ligne de cette modalité.<\/p>", "options": [{"texte_html": "64,2 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « Correcte » : 7,5 + 19,6 + 37,1.<\/p>"}, {"texte_html": "27,1 %", "score": -20.0, "feedback_html": "<p>27,1 % s'arrête à « Mauvaise ». « Au plus correct » inclut aussi « Correcte ».<\/p>"}, {"texte_html": "37,1 %", "score": -30.0, "feedback_html": "<p>37,1 % est la part de la seule modalité « Correcte ».<\/p>"}, {"texte_html": "35,8 %", "score": -50.0, "feedback_html": "<p>35,8 % est la part au-dessus de « Correcte » (bonne ou très bonne) : c'est le complément de la réponse.<\/p>"}]}, {"id": "S-002-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil bon ou très bon ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil bon ou très bon ?", "feedback_general_html": "<p>Pour une part « au moins » une modalité : 100 % moins le cumul de la modalité précédente.<\/p>", "options": [{"texte_html": "35,8 % (26,3 + 9,6, ou 100 − 64,2)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les deux modalités, ou on retire de 100 % le cumul jusqu'à « Correcte ».<\/p>"}, {"texte_html": "26,3 %", "score": -20.0, "feedback_html": "<p>26,3 % ne compte que « Bonne » ; il faut ajouter « Très bonne ».<\/p>"}, {"texte_html": "9,6 %", "score": -30.0, "feedback_html": "<p>9,6 % ne compte que « Très bonne ».<\/p>"}, {"texte_html": "90,4 %", "score": -50.0, "feedback_html": "<p>90,4 % est le cumul jusqu'à « Bonne » : il compte tout ce qui est en dessous, y compris les sommeils mauvais.<\/p>"}]}, {"id": "S-002-q5", "difficulte": 1, "question_html": "<p>Quel est le mode de cette distribution ?<\/p>", "question_texte": "Quel est le mode de cette distribution ?", "feedback_general_html": "<p>Le mode est la modalité la plus fréquente ; on le donne sous forme de modalité, pas d'effectif.<\/p>", "options": [{"texte_html": "Correcte", "score": 100.0, "feedback_html": "<p>Exact. C'est la modalité la plus fréquente (89 étudiants).<\/p>"}, {"texte_html": "89", "score": -20.0, "feedback_html": "<p>89 est l'effectif du mode. Le mode est la modalité elle-même : « Correcte ».<\/p>"}, {"texte_html": "Très bonne", "score": -30.0, "feedback_html": "<p>« Très bonne » est la dernière ligne, pas la plus fréquente (23 étudiants).<\/p>"}, {"texte_html": "Il n'y en a pas, car la variable est ordinale", "score": -50.0, "feedback_html": "<p>Toute variable a un mode, même nominale : c'est la modalité la plus fréquente.<\/p>"}]}, {"id": "S-002-q6", "difficulte": 2, "question_html": "<p>La colonne « % cumulé » a-t-elle un sens pour cette variable ?<\/p>", "question_texte": "La colonne « % cumulé » a-t-elle un sens pour cette variable ?", "feedback_general_html": "<p>Le cumul a un sens dès que les modalités sont ordonnées : variables ordinales et numériques.<\/p>", "options": [{"texte_html": "Oui, car les modalités sont ordonnées.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, « au plus correct » a un sens.<\/p>"}, {"texte_html": "Oui, car on peut toujours cumuler.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : pour une variable nominale, le cumul n'a pas de sens.<\/p>"}, {"texte_html": "Non, car la variable est qualitative.", "score": -30.0, "feedback_html": "<p>Une variable qualitative ordinale peut se cumuler : seules les variables nominales ne le peuvent pas.<\/p>"}, {"texte_html": "Non, car les effectifs sont inégaux.", "score": -50.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'ordre des modalités qui compte.<\/p>"}]}, {"id": "S-002-q7", "difficulte": 3, "question_html": "<p>Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?<\/p>", "question_texte": "Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?", "feedback_general_html": "<p>Moyenne d'une variable ordinale codée en chiffres : possible en pratique, mais discutable. La médiane est l'indice adapté.<\/p>", "options": [{"texte_html": "Il est à interpréter avec prudence : il suppose des écarts égaux entre modalités, ce qui n'est pas garanti.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, la moyenne est discutable ; la médiane est l'indice adapté.<\/p>"}, {"texte_html": "Il n'a aucun sens, comme une moyenne de filières.", "score": -20.0, "feedback_html": "<p>C'est trop sévère : contrairement à une variable nominale, les modalités sont ordonnées, et la moyenne peut donner une indication, avec prudence.<\/p>"}, {"texte_html": "Il signifie que la qualité moyenne est exactement « correcte ».", "score": -30.0, "feedback_html": "<p>Ce serait traiter le code comme une mesure exacte : rien ne garantit que les modalités soient équidistantes.<\/p>"}, {"texte_html": "C'est la modalité la plus fréquente.", "score": -50.0, "feedback_html": "<p>La modalité la plus fréquente est le mode, pas la moyenne.<\/p>"}]}, {"id": "S-002-q8", "difficulte": 2, "question_html": "<p>Laquelle de ces conclusions est permise ?<\/p>", "question_texte": "Laquelle de ces conclusions est permise ?", "feedback_general_html": "<p>Un tableau de fréquences décrit les individus observés : il ne permet ni de généraliser, ni de conclure à une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 240 étudiants, un peu plus d'un sur quatre déclare un sommeil mauvais ou très mauvais.", "score": 100.0, "feedback_html": "<p>Exact. 27,1 % des étudiants observés : la conclusion reste descriptive.<\/p>"}, {"texte_html": "Un étudiant français sur quatre dort mal.", "score": -20.0, "feedback_html": "<p>Le chiffre est juste pour ces 240 étudiants, mais la phrase généralise à tous les étudiants français.<\/p>"}, {"texte_html": "Ces étudiants dorment mal parce qu'ils révisent.", "score": -30.0, "feedback_html": "<p>Aucune cause n'est mesurée dans ces données.<\/p>"}, {"texte_html": "La plupart des étudiants dorment bien.", "score": -50.0, "feedback_html": "<p>Les sommeils bons et très bons ne représentent que 35,8 % des étudiants.<\/p>"}]}]}]</script>
<script>
(function () {
  "use strict";
  const BASE = JSON.parse(document.getElementById("donnees").textContent);
  const app = document.getElementById("app");
  const LETTRES = "ABCD";
  const NOMS_CAT = { comprehension: "Compréhension", choix: "Choix", interpretation: "Interprétation" };

  // --- mémoire légère dans le navigateur (questions déjà vues) ---
  function lireVues() { try { return JSON.parse(localStorage.getItem("l1s2-vues") || "{}"); } catch (e) { return {}; } }
  function ecrireVues(v) { try { localStorage.setItem("l1s2-vues", JSON.stringify(v)); } catch (e) {} }

  function melanger(t) { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function fmtPoints(p) { const s = (Math.round(p * 100) / 100).toString().replace(".", ","); return (p > 0 ? "+" : "") + s; }

  let session = null;

  // ------------------------------------------------------------ accueil
  function accueil() {
    const cms = [1, 2, 3, 4, 5];
    app.innerHTML = `
      <h2>Composer une série d'exercices</h2>
      <p class="note">Les questions sont tirées au hasard, en priorité parmi celles que vous n'avez pas encore vues sur cet appareil.</p>
      <form id="reglages">
        <fieldset><legend>Cours magistraux</legend><div class="choix">
          ${cms.map(c => `<label><input type="checkbox" name="cm" value="${c}" checked> CM ${c}</label>`).join("")}
        </div></fieldset>
        <fieldset><legend>Type de questions</legend><div class="choix">
          <label><input type="checkbox" name="cat" value="comprehension" checked> Compréhension du cours</label>
          <label><input type="checkbox" name="cat" value="choix" checked> Choisir un indice ou un graphique</label>
          <label><input type="checkbox" name="cat" value="interpretation" checked> Interpréter une étude (séries de questions)</label>
        </div></fieldset>
        <fieldset><legend>Difficulté</legend><div class="choix">
          <label><input type="checkbox" name="diff" value="1" checked> Facile</label>
          <label><input type="checkbox" name="diff" value="2" checked> Moyenne</label>
          <label><input type="checkbox" name="diff" value="3" checked> Difficile</label>
        </div></fieldset>
        <fieldset><legend>Nombre de questions</legend><div class="choix">
          ${[5, 10, 20, 40].map((n, i) => `<label><input type="radio" name="nb" value="${n}" ${i === 1 ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <p class="note">Une étude compte pour toutes ses questions : le total peut dépasser un peu le nombre demandé.</p></fieldset>
        <div class="bloc"><strong>Barème de l'examen.</strong> Bonne réponse : +1 point. Mauvaise réponse : un retrait qui dépend de la gravité de l'erreur (souvent −0,25 ou −0,5). « Je ne sais pas » : 0 point.</div>
        <p id="erreur" class="note" role="alert"></p>
        <div class="boutons"><button type="submit" class="principal">Commencer</button></div>
      </form>`;
    document.getElementById("reglages").addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const r = { cm: f.getAll("cm").map(Number), cat: f.getAll("cat"), diff: f.getAll("diff").map(Number), nb: Number(f.get("nb")) };
      const items = tirer(r);
      if (!items.length) { document.getElementById("erreur").textContent = "Aucune question ne correspond à ces réglages. Élargissez la sélection."; return; }
      session = { items, i: 0, reponses: [] };
      afficherQuestion();
    });
  }

  // ------------------------------------------------------------ tirage
  function tirer(r) {
    const vues = lireVues();
    const unites = [];
    for (const ex of BASE) {
      if (!r.cat.includes(ex.categorie)) continue;
      if (!ex.cm.some(c => r.cm.includes(c))) continue;
      if (ex.type === "serie") {
        const qs = ex.questions.filter(q => r.diff.includes(q.difficulte));
        if (!qs.length) continue;
        unites.push({ cle: ex.id, questions: ex.questions.map(q => Object.assign({ serie: ex, categorie: ex.categorie, cm: ex.cm }, q)) });
      } else if (r.diff.includes(ex.difficulte)) {
        unites.push({ cle: ex.id, questions: [ex] });
      }
    }
    const triees = melanger(unites).sort((a, b) => (vues[a.cle] || 0) - (vues[b.cle] || 0));
    const choisies = [];
    let n = 0;
    for (const u of triees) {
      if (n >= r.nb) break;
      if (n > 0 && n + u.questions.length > r.nb + 4) continue;
      choisies.push(u); n += u.questions.length;
    }
    // séries groupées, questions isolées mélangées autour
    return melanger(choisies).flatMap(u => u.questions.map(q => Object.assign({}, q, { options: melanger(q.options) })));
  }

  // ------------------------------------------------------------ question
  function afficherQuestion() {
    const q = session.items[session.i], total = session.items.length;
    const etude = q.serie ? `
      <div class="bloc etude">
        ${session.i > 0 && session.items[session.i - 1].serie === q.serie
          ? `<details><summary>Revoir l'étude : ${esc(q.serie.etude.titre)}</summary>${q.serie.etude_html}</details>`
          : q.serie.etude_html}
      </div>` : "";
    app.innerHTML = `
      <div class="progression"><span>Question ${session.i + 1} / ${total}</span><span>${scoreCourant()}</span></div>
      <div class="barre"><div style="width:${100 * session.i / total}%"></div></div>
      <div class="etiquettes"><span>${NOMS_CAT[q.categorie]}</span><span>CM ${q.cm.join(", ")}</span><span>${["", "Facile", "Moyenne", "Difficile"][q.difficulte]}</span></div>
      ${etude}
      <div class="enonce">${q.question_html}</div>
      <form id="qcm">
        ${q.options.map((o, k) => `
          <label class="option" data-k="${k}">
            <input type="radio" name="rep" value="${k}">
            <span class="lettre">${LETTRES[k]}</span><span>${o.texte_html}</span>
          </label>`).join("")}
        <div class="boutons">
          <button type="submit" class="principal" id="valider" disabled>Valider</button>
          <button type="button" class="secondaire" id="passer">Je ne sais pas</button>
        </div>
      </form>
      <div id="retour"></div>`;
    const form = document.getElementById("qcm");
    form.addEventListener("change", () => { document.getElementById("valider").disabled = false; });
    form.addEventListener("submit", ev => { ev.preventDefault(); corriger(Number(new FormData(form).get("rep"))); });
    document.getElementById("passer").addEventListener("click", () => corriger(null));
    window.scrollTo(0, 0);
  }

  function corriger(k) {
    const q = session.items[session.i];
    const bonne = q.options.findIndex(o => o.score === 100);
    const points = k === null ? 0 : q.options[k].score / 100;
    session.reponses.push({ q, k, points });
    const vues = lireVues(); const cle = q.serie ? q.serie.id : q.id;
    vues[cle] = (vues[cle] || 0) + (q.serie ? 1 / q.serie.questions.length : 1); ecrireVues(vues);

    document.querySelectorAll(".option").forEach(el => {
      const j = Number(el.dataset.k);
      el.classList.add("verrouillee");
      el.querySelector("input").disabled = true;
      if (j === bonne) el.classList.add("juste");
      else if (j === k) el.classList.add("fausse");
    });
    const classe = k === null ? "neutre" : (k === bonne ? "ok" : "ko");
    const titre = k === null ? "Pas de réponse" : (k === bonne ? "Bonne réponse" : "Mauvaise réponse");
    let corps = "";
    if (k !== null) corps += `<div>${q.options[k].feedback_html}</div>`;
    if (k !== bonne) corps += `<p><strong>La bonne réponse était ${LETTRES[bonne]}.</strong></p><div>${q.options[bonne].feedback_html}</div>`;
    const dernier = session.i === session.items.length - 1;
    document.getElementById("retour").innerHTML = `
      <div class="retour ${classe}">
        <p><strong>${titre}</strong> · <span class="points">${fmtPoints(points)} point${Math.abs(points) > 1 ? "s" : ""}</span></p>
        ${corps}
        ${q.feedback_general_html ? `<div class="general"><strong>À retenir.</strong> ${q.feedback_general_html}</div>` : ""}
      </div>
      <div class="boutons"><button class="principal" id="suite">${dernier ? "Voir le bilan" : "Question suivante"}</button></div>`;
    document.querySelectorAll("#qcm .boutons button").forEach(b => b.remove());
    const suite = document.getElementById("suite");
    suite.addEventListener("click", () => { session.i++; dernier ? bilan() : afficherQuestion(); });
    suite.focus();
  }

  function scoreCourant() {
    const s = session.reponses.reduce((a, r) => a + r.points, 0);
    return session.reponses.length ? `Score : ${fmtPoints(s).replace("+", "")} / ${session.reponses.length}` : "";
  }

  // ------------------------------------------------------------ bilan
  function bilan() {
    const R = session.reponses, n = R.length;
    const total = R.reduce((a, r) => a + r.points, 0);
    const sur20 = Math.max(0, 20 * total / n);
    const groupes = {};
    for (const r of R) {
      const g = NOMS_CAT[r.q.categorie];
      groupes[g] = groupes[g] || { n: 0, justes: 0, pts: 0 };
      groupes[g].n++; groupes[g].pts += r.points;
      if (r.points === 1) groupes[g].justes++;
    }
    const ratees = R.filter(r => r.points < 1);
    app.innerHTML = `
      <h2>Bilan</h2>
      <div class="score">${fmtPoints(total).replace("+", "")} / ${n}</div>
      <p>Soit ${sur20.toFixed(1).replace(".", ",")} / 20 avec le barème de l'examen. ${R.filter(r => r.points === 1).length} bonne(s) réponse(s), ${R.filter(r => r.k === null).length} « je ne sais pas ».</p>
      <table class="bilan"><tr><th>Type</th><th class="n" style="text-align:right">Questions</th><th style="text-align:right">Justes</th><th style="text-align:right">Points</th></tr>
        ${Object.entries(groupes).map(([g, v]) => `<tr><td>${g}</td><td class="n">${v.n}</td><td class="n">${v.justes}</td><td class="n">${fmtPoints(v.pts).replace("+", "")}</td></tr>`).join("")}
      </table>
      ${ratees.length ? `<h2>À revoir</h2><ul class="revoir">${ratees.map(r =>
        `<li>${r.q.question_texte} <span class="note">(CM ${r.q.cm.join(", ")})</span></li>`).join("")}</ul>` : "<p>Aucune erreur : bravo !</p>"}
      <div class="boutons"><button class="principal" id="encore">Nouvelle série</button></div>`;
    document.getElementById("encore").addEventListener("click", accueil);
    window.scrollTo(0, 0);
  }

  accueil();
})();
</script>
</body>
</html>
