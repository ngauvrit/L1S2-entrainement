", "question_texte": "Le temps d'écran quotidien, mesuré en heures, est une variable…", "feedback_general_html": "<p>Une durée est une variable numérique continue.<\/p>", "options": [{"texte_html": "numérique continue", "score": 100.0, "feedback_html": "<p>Exact. Une durée peut prendre toutes les valeurs d'un intervalle.<\/p>"}, {"texte_html": "numérique discrète", "score": -20.0, "feedback_html": "<p>Elle est bien numérique, mais une durée n'est pas un comptage : elle est continue.<\/p>"}, {"texte_html": "ordinale", "score": -30.0, "feedback_html": "<p>Les écarts entre durées ont un sens : la variable est numérique.<\/p>"}, {"texte_html": "nominale", "score": -50.0, "feedback_html": "<p>Ce sont des quantités.<\/p>"}]}, {"id": "S-004-q2", "difficulte": 1, "question_html": "<p>Quelle est la largeur de la classe [5 ; 10[ ?<\/p>", "question_texte": "Quelle est la largeur de la classe [5 ; 10[ ?", "feedback_general_html": "<p>Largeur d'une classe = borne supérieure − borne inférieure.<\/p>", "options": [{"texte_html": "5 heures", "score": 100.0, "feedback_html": "<p>Exact. Largeur = borne supérieure − borne inférieure = 10 − 5.<\/p>"}, {"texte_html": "10 heures", "score": -20.0, "feedback_html": "<p>10 est la borne supérieure, pas la largeur.<\/p>"}, {"texte_html": "1 heure", "score": -30.0, "feedback_html": "<p>C'est la largeur des premières classes, pas de celle-ci.<\/p>"}, {"texte_html": "20", "score": -50.0, "feedback_html": "<p>20 est l'effectif de la classe.<\/p>"}]}, {"id": "S-004-q3", "difficulte": 1, "question_html": "<p>Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>Distinguer effectif, pourcentage et pourcentage cumulé.<\/p>", "options": [{"texte_html": "25 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le pourcentage de la classe [1 ; 2[.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % cumule les classes [0 ; 1[ et [1 ; 2[ : c'est la part de ceux qui passent moins de 2 heures.<\/p>"}, {"texte_html": "50 %", "score": -30.0, "feedback_html": "<p>50 est l'effectif de la classe, pas un pourcentage.<\/p>"}, {"texte_html": "1 %", "score": -50.0, "feedback_html": "<p>1 heure est la largeur de la classe, pas une part.<\/p>"}]}, {"id": "S-004-q4", "difficulte": 2, "question_html": "<p>Quelle est la densité de la classe [3 ; 5[ ?<\/p>", "question_texte": "Quelle est la densité de la classe [3 ; 5[ ?", "feedback_general_html": "<p>Densité = part de la classe / largeur de la classe.<\/p>", "options": [{"texte_html": "12,5 % par heure (25 % / 2 heures)", "score": 100.0, "feedback_html": "<p>Exact. Densité = part / largeur.<\/p>"}, {"texte_html": "25 %", "score": -20.0, "feedback_html": "<p>C'est la part de la classe : il faut encore diviser par sa largeur (2 heures).<\/p>"}, {"texte_html": "8,3 % par heure", "score": -30.0, "feedback_html": "<p>On a divisé par 3, la borne inférieure, au lieu de la largeur (2).<\/p>"}, {"texte_html": "50 % par heure", "score": -50.0, "feedback_html": "<p>On a multiplié par la largeur au lieu de diviser.<\/p>"}]}, {"id": "S-004-q5", "difficulte": 2, "question_html": "<p>Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?<\/p>", "question_texte": "Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?", "feedback_general_html": "<p>Classes inégales : densité en ordonnée.<\/p>", "options": [{"texte_html": "La classe large [5 ; 10[ paraîtrait plus peuplée qu'elle ne l'est.", "score": 100.0, "feedback_html": "<p>Exact. Large de 5 heures, elle formerait une grande surface pour seulement 20 étudiants.<\/p>"}, {"texte_html": "Les classes étroites paraîtraient trop peuplées.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : ce sont les classes larges qui sont gonflées.<\/p>"}, {"texte_html": "Les effectifs ne totaliseraient plus 200.", "score": -30.0, "feedback_html": "<p>Le total ne dépend pas du graphique.<\/p>"}, {"texte_html": "L'histogramme deviendrait un diagramme en barres.", "score": -50.0, "feedback_html": "<p>Aucun lien : c'est la lecture des surfaces qui serait faussée.<\/p>"}]}, {"id": "S-004-q6", "difficulte": 3, "question_html": "<p>Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?<\/p>", "question_texte": "Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?", "feedback_general_html": "<p>Histogramme en densité : la part d'une classe se lit sur l'aire (hauteur × largeur).<\/p>", "options": [{"texte_html": "La classe [3 ; 5[ contient pourtant plus d'étudiants (50 contre 40) : c'est l'aire, et non la hauteur, qui représente la part.", "score": 100.0, "feedback_html": "<p>Exact. Densités : 12,5 contre 20 % par heure ; mais la barre [3 ; 5[ est deux fois plus large : 25 % contre 20 %.<\/p>"}, {"texte_html": "La classe [3 ; 5[ contient moins d'étudiants, puisque sa barre est plus basse.", "score": -20.0, "feedback_html": "<p>Sur un histogramme en densité, la hauteur seule ne donne pas l'effectif : il faut tenir compte de la largeur.<\/p>"}, {"texte_html": "Le graphique est faux : la barre [3 ; 5[ devrait être plus haute.", "score": -30.0, "feedback_html": "<p>Le graphique est correct : la densité divise la part par la largeur.<\/p>"}, {"texte_html": "Les deux classes contiennent autant d'étudiants.", "score": -50.0, "feedback_html": "<p>Aucune lecture ne donne ce résultat : 50 contre 40.<\/p>"}]}, {"id": "S-004-q7", "difficulte": 2, "question_html": "<p>D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>« Moins de 3 heures » : on cumule toutes les classes en dessous de 3.<\/p>", "options": [{"texte_html": "65 % (20 + 25 + 20)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les trois premières classes.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % s'arrête à 2 heures ; il faut ajouter la classe [2 ; 3[.<\/p>"}, {"texte_html": "20 %", "score": -30.0, "feedback_html": "<p>20 % est la part de la seule classe [2 ; 3[.<\/p>"}, {"texte_html": "3 %", "score": -50.0, "feedback_html": "<p>3 heures est la borne ; la question demande une part.<\/p>"}]}]}, {"id": "S-005", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Nombre de cafés bus la veille"}, "etude_html": "<h4>Nombre de cafés bus la veille<\/h4><p>Riera-Sampol et al. (2022) ont interrogé 886 étudiants de l'université des Îles Baléares : 91 % consomment de la caféine, et le café en est la première source ; environ la moitié boivent du café (56 % des femmes, 42 % des hommes). Ici, 200 étudiants ont indiqué combien de cafés ils ont bus la veille.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Riera-Sampol, A., et al. (2022). Caffeine Intake among Undergraduate Students: Sex Differences, Sources, Motivations, and Associations with Smoking Status and Self-Reported Sleep Quality. Nutrients.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de nb_cafes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">0<\/td><td style=\"padding:2px 12px;text-align:right\">96<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1<\/td><td style=\"padding:2px 12px;text-align:right\">52<\/td><td style=\"padding:2px 12px;text-align:right\">26,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">74,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">2<\/td><td style=\"padding:2px 12px;text-align:right\">30<\/td><td style=\"padding:2px 12px;text-align:right\">15,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">89,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3<\/td><td style=\"padding:2px 12px;text-align:right\">12<\/td><td style=\"padding:2px 12px;text-align:right\">6,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">95,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">4<\/td><td style=\"padding:2px 12px;text-align:right\">6<\/td><td style=\"padding:2px 12px;text-align:right\">3,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">98,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">5<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><td style=\"padding:2px 12px;text-align:right\">2,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en bâtons et fréquences cumulées croissantes<\/strong><\/p><p><img src=\"images/s005_cafes.png\" alt=\"Diagramme en bâtons et fréquences cumulées croissantes\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-005-q1", "difficulte": 1, "question_html": "<p>Quel graphique choisir pour représenter cette distribution ?<\/p>", "question_texte": "Quel graphique choisir pour représenter cette distribution ?", "feedback_general_html": "<p>Numérique discrète : diagramme en bâtons.<\/p>", "options": [{"texte_html": "Un diagramme en bâtons", "score": 100.0, "feedback_html": "<p>Exact. Variable numérique discrète avec peu de valeurs.<\/p>"}, {"texte_html": "Un histogramme", "score": -20.0, "feedback_html": "<p>Inutile de regrouper en classes une variable discrète à six valeurs.<\/p>"}, {"texte_html": "Un diagramme en barres", "score": -30.0, "feedback_html": "<p>Il perdrait l'axe numérique.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il perdrait l'ordre des valeurs.<\/p>"}]}, {"id": "S-005-q2", "difficulte": 1, "question_html": "<p>Quelle part des étudiants a bu au plus 2 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au plus 2 cafés ?", "feedback_general_html": "<p>« Au plus » une valeur : % cumulé sur la ligne de cette valeur.<\/p>", "options": [{"texte_html": "89,0 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « 2 ».<\/p>"}, {"texte_html": "74,0 %", "score": -20.0, "feedback_html": "<p>74,0 % s'arrête à 1 café.<\/p>"}, {"texte_html": "15,0 %", "score": -30.0, "feedback_html": "<p>15,0 % est la part de ceux qui ont bu exactement 2 cafés.<\/p>"}, {"texte_html": "30", "score": -50.0, "feedback_html": "<p>30 est un effectif, pas une part.<\/p>"}]}, {"id": "S-005-q3", "difficulte": 1, "question_html": "<p>Quel est le mode ?<\/p>", "question_texte": "Quel est le mode ?", "feedback_general_html": "<p>Le mode est une valeur de la variable, pas un effectif.<\/p>", "options": [{"texte_html": "0 café", "score": 100.0, "feedback_html": "<p>Exact. C'est la valeur la plus fréquente (96 étudiants).<\/p>"}, {"texte_html": "96", "score": -20.0, "feedback_html": "<p>96 est l'effectif du mode ; le mode est la valeur : 0 café.<\/p>"}, {"texte_html": "1 café", "score": -30.0, "feedback_html": "<p>1 café concerne 52 étudiants, moins que 0 café.<\/p>"}, {"texte_html": "Il n'y en a pas", "score": -50.0, "feedback_html": "<p>Toute distribution a un mode.<\/p>"}]}, {"id": "S-005-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants a bu au moins 3 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au moins 3 cafés ?", "feedback_general_html": "<p>« Au moins x » = 100 % − cumul jusqu'à la valeur précédente.<\/p>", "options": [{"texte_html": "11,0 % (100 − 89,0)", "score": 100.0, "feedback_html": "<p>Exact. On retire de 100 % le cumul jusqu'à 2 cafés.<\/p>"}, {"texte_html": "6,0 %", "score": -20.0, "feedback_html": "<p>6,0 % ne compte que ceux qui ont bu exactement 3 cafés.<\/p>"}, {"texte_html": "95,0 %", "score": -30.0, "feedback_html": "<p>95,0 % est le cumul jusqu'à 3 : il compte « au plus 3 », pas « au moins 3 ».<\/p>"}, {"texte_html": "12 %", "score": -50.0, "feedback_html": "<p>12 est l'effectif de la ligne « 3 », pas un pourcentage.<\/p>"}]}, {"id": "S-005-q5", "difficulte": 2, "question_html": "<p>À partir du % cumulé, quelle est la médiane du nombre de cafés ?<\/p>", "question_texte": "À partir du % cumulé, quelle est la médiane du nombre de cafés ?", "feedback_general_html": "<p>La médiane se lit sur les fréquences cumulées : première valeur dont le cumul atteint 50 %.<\/p>", "options": [{"texte_html": "1 café : c'est la première valeur où le cumul atteint ou dépasse 50 %", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 48 % à 0 et 74 % à 1 : la moitié des étudiants a bu au plus 1 café.<\/p>"}, {"texte_html": "0 café", "score": -20.0, "feedback_html": "<p>Le cumul de 0 (48 %) n'atteint pas 50 % : 0 est le mode, pas la médiane.<\/p>"}, {"texte_html": "2,5 cafés", "score": -30.0, "feedback_html": "<p>C'est le milieu de l'échelle (0 à 5), pas la valeur qui coupe les étudiants en deux.<\/p>"}, {"texte_html": "74,0 %", "score": -50.0, "feedback_html": "<p>C'est une fréquence cumulée, pas une valeur de la variable.<\/p>"}]}, {"id": "S-005-q6", "difficulte": 3, "question_html": "<p>On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?<\/p>", "question_texte": "On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?", "feedback_general_html": "<p>Le diagramme en bâtons montre les valeurs isolées et les vides de la distribution.<\/p>", "options": [{"texte_html": "Un bâton isolé apparaît en 12, séparé des autres par un vide", "score": 100.0, "feedback_html": "<p>Exact. Chaque valeur a son bâton à sa position réelle sur l'axe.<\/p>"}, {"texte_html": "Le bâton de la valeur 5 s'allonge", "score": -20.0, "feedback_html": "<p>La valeur 12 a son propre bâton : elle ne s'ajoute pas à la valeur 5.<\/p>"}, {"texte_html": "L'étudiant n'apparaît pas, car l'axe s'arrête à 5", "score": -30.0, "feedback_html": "<p>L'axe s'étend pour placer la nouvelle valeur.<\/p>"}, {"texte_html": "Tous les bâtons changent de hauteur", "score": -50.0, "feedback_html": "<p>En effectifs, les autres bâtons ne bougent pas : seul un nouveau bâton s'ajoute.<\/p>"}]}, {"id": "S-005-q7", "difficulte": 1, "question_html": "<p>Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?<\/p>", "question_texte": "Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?", "feedback_general_html": "<p>Fonction de répartition d'une variable discrète : un escalier, qui monte à chaque valeur observée.<\/p>", "options": [{"texte_html": "Parce que la variable est discrète : la fréquence cumulée ne change qu'aux valeurs 0, 1, 2…", "score": 100.0, "feedback_html": "<p>Exact. Entre deux valeurs entières, aucun étudiant n'est ajouté : la courbe reste plate, puis monte d'un coup.<\/p>"}, {"texte_html": "Parce que l'effectif est petit", "score": -20.0, "feedback_html": "<p>Même avec beaucoup plus d'étudiants, la courbe resterait en escalier : c'est la nature discrète de la variable qui compte.<\/p>"}, {"texte_html": "C'est une erreur de tracé : la courbe devrait être lisse", "score": -30.0, "feedback_html": "<p>Pour une variable discrète, l'escalier est la représentation correcte.<\/p>"}, {"texte_html": "Parce que la variable est qualitative", "score": -50.0, "feedback_html": "<p>Le nombre de cafés est une variable numérique.<\/p>"}]}]}, {"id": "S-006", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Combien de fois regarde-t-on son téléphone ?"}, "etude_html": "<h4>Combien de fois regarde-t-on son téléphone ?<\/h4><p>Andrews et al. (2015) ont installé une application sur le smartphone de 23 jeunes adultes (18 à 33 ans), qui a enregistré chaque utilisation pendant deux semaines. En moyenne, les participants utilisaient leur téléphone 84,7 fois par jour (écart-type 55,2), pour un total de 5 heures par jour. Interrogés avant l'enregistrement, ils estimaient l'utiliser 37 fois par jour en moyenne. Plus de la moitié des utilisations duraient moins de 30 secondes. Les 23 valeurs ci-dessous sont simulées, calées sur la moyenne et l'écart-type publiés.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Andrews, S., Ellis, D. A., Shaw, H., &amp; Piwek, L. (2015). Beyond self-report: Tools to compare estimated and real-world smartphone use. PLOS ONE, 10(10), e0139004.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives : utilisations par jour<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">86,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">72<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">52,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">246<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1er quartile<\/td><td style=\"padding:2px 12px;text-align:right\">56<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3e quartile<\/td><td style=\"padding:2px 12px;text-align:right\">117,5<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Utilisations par jour : un point par participant et boîte à moustaches<\/strong><\/p><p><img src=\"images/s006_smartphone.png\" alt=\"Utilisations par jour : un point par participant et boîte à moustaches\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-006-q1", "difficulte": 1, "question_html": "<p>Combien de fois par jour, en moyenne, ces participants utilisent-ils leur téléphone ?<\/p>", "question_texte": "Combien de fois par jour, en moyenne, ces participants utilisent-ils leur téléphone ?", "feedback_general_html": "<p>Moyenne, médiane, écart-type : chaque ligne du tableau répond à une question différente.<\/p>", "options": [{"texte_html": "Environ 86 fois", "score": 100.0, "feedback_html": "<p>Exact. On lit la ligne « Moyenne » : 86,5.<\/p>"}, {"texte_html": "72 fois", "score": -20.0, "feedback_html": "<p>72 est la médiane, pas la moyenne.<\/p>"}, {"texte_html": "52,6 fois", "score": -30.0, "feedback_html": "<p>52,6 est l'écart-type : il mesure la dispersion, pas la position.<\/p>"}, {"texte_html": "246 fois", "score": -50.0, "feedback_html": "<p>246 est le maximum, la valeur d'un seul participant.<\/p>"}]}, {"id": "S-006-q2", "difficulte": 1, "question_html": "<p>Complétez : la moitié des participants utilise son téléphone…<\/p>", "question_texte": "Complétez : la moitié des participants utilise son téléphone…", "feedback_general_html": "<p>La médiane coupe les individus en deux moitiés.<\/p>", "options": [{"texte_html": "72 fois par jour ou moins.", "score": 100.0, "feedback_html": "<p>Exact. C'est la définition de la médiane : la moitié des participants est en dessous ou égale.<\/p>"}, {"texte_html": "86,5 fois par jour ou moins.", "score": -20.0, "feedback_html": "<p>86,5 est la moyenne. Ici, plus de la moitié des participants est en dessous, car la moyenne est tirée vers le haut.<\/p>"}, {"texte_html": "117,5 fois par jour ou plus.", "score": -30.0, "feedback_html": "<p>117,5 est le 3e quartile : un quart des participants est au-dessus, pas la moitié.<\/p>"}, {"texte_html": "exactement 72 fois par jour.", "score": -50.0, "feedback_html": "<p>La médiane est une borne : la moitié est en dessous ou égale, pas exactement à 72.<\/p>"}]}, {"id": "S-006-q3", "difficulte": 2, "question_html": "<p>Pourquoi la moyenne (86,5) est-elle plus grande que la médiane (72) ?<\/p>", "question_texte": "Pourquoi la moyenne (86,5) est-elle plus grande que la médiane (72) ?", "feedback_general_html": "<p>Distribution étirée vers les valeurs élevées : moyenne &gt; médiane.<\/p>", "options": [{"texte_html": "Quelques gros utilisateurs, dont un à 246 utilisations par jour, tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La distribution est étirée vers les valeurs élevées ; la moyenne s'éloigne de la médiane de ce côté.<\/p>"}, {"texte_html": "Parce que la plupart des participants utilisent leur téléphone plus de 86 fois par jour.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : la médiane est à 72, donc la plupart des participants sont en dessous de 86.<\/p>"}, {"texte_html": "Parce que l'échantillon est petit (23 personnes).", "score": -30.0, "feedback_html": "<p>La taille de l'échantillon n'explique pas le sens de l'écart. C'est la forme de la distribution qui compte.<\/p>"}, {"texte_html": "C'est une erreur : la moyenne et la médiane devraient être égales.", "score": -50.0, "feedback_html": "<p>Elles ne sont égales que pour une distribution symétrique. Ici, la distribution est étirée vers le haut.<\/p>"}]}, {"id": "S-006-q4", "difficulte": 2, "question_html": "<p>On retire le participant à 246 utilisations par jour. Lequel de ces paramètres change le plus ?<\/p>", "question_texte": "On retire le participant à 246 utilisations par jour. Lequel de ces paramètres change le plus ?", "feedback_general_html": "<p>L'étendue est l'indice le moins robuste ; la médiane le plus robuste.<\/p>", "options": [{"texte_html": "L'étendue (de 228 à 133)", "score": 100.0, "feedback_html": "<p>Exact. L'étendue dépend directement du maximum : elle perd presque la moitié de sa valeur. L'écart-type passe de 52,6 à 40,4, la moyenne de 86,5 à 79,2, la médiane de 72 à 68,5.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>Il baisse nettement (de 52,6 à 40,4), mais moins que l'étendue, qui ne dépend que des deux valeurs extrêmes.<\/p>"}, {"texte_html": "La moyenne", "score": -30.0, "feedback_html": "<p>Elle baisse (de 86,5 à 79,2), mais bien moins que l'étendue.<\/p>"}, {"texte_html": "La médiane", "score": -50.0, "feedback_html": "<p>C'est l'indice qui change le moins (de 72 à 68,5) : elle est robuste.<\/p>"}]}, {"id": "S-006-q5", "difficulte": 3, "question_html": "<p>Les participants estimaient utiliser leur téléphone 37 fois par jour en moyenne. Quelle conclusion descriptive peut-on tirer ?<\/p>", "question_texte": "Les participants estimaient utiliser leur téléphone 37 fois par jour en moyenne. Quelle conclusion descriptive peut-on tirer ?", "feedback_general_html": "<p>Une comparaison de moyennes décrit le groupe, pas chaque individu.<\/p>", "options": [{"texte_html": "En moyenne, ils utilisent leur téléphone plus de deux fois plus souvent qu'ils ne le pensent.", "score": 100.0, "feedback_html": "<p>Exact. 84,7 / 37 ≈ 2,3. La conclusion porte sur les moyennes du groupe.<\/p>"}, {"texte_html": "Chaque participant sous-estime son usage de plus de moitié.", "score": -20.0, "feedback_html": "<p>Les moyennes ne disent rien de chaque participant : certains peuvent s'estimer correctement, d'autres très mal.<\/p>"}, {"texte_html": "Les participants surestiment leur usage.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : l'usage réel (84,7) dépasse l'estimation (37).<\/p>"}, {"texte_html": "Les estimations des participants sont plus dispersées que leur usage réel.", "score": -50.0, "feedback_html": "<p>On ne connaît ici que la moyenne des estimations, pas leur dispersion.<\/p>"}]}, {"id": "S-006-q6", "difficulte": 2, "question_html": "<p>Pour exprimer l'usage par semaine, on multiplie chaque valeur par 7. Que deviennent la moyenne et l'écart-type ?<\/p>", "question_texte": "Pour exprimer l'usage par semaine, on multiplie chaque valeur par 7. Que deviennent la moyenne et l'écart-type ?", "feedback_general_html": "<p>Multiplier par k : moyenne et écart-type multipliés par k.<\/p>", "options": [{"texte_html": "Environ 605 et 368", "score": 100.0, "feedback_html": "<p>Exact. 86,5 × 7 ≈ 605 et 52,6 × 7 ≈ 368 : multiplier par une constante multiplie la position et la dispersion.<\/p>"}, {"texte_html": "Environ 605 et 52,6", "score": -20.0, "feedback_html": "<p>La moyenne est juste, mais l'écart-type est aussi multiplié par 7.<\/p>"}, {"texte_html": "Environ 93,5 et 52,6", "score": -30.0, "feedback_html": "<p>C'est ce qu'on obtiendrait en ajoutant 7 à chaque valeur, pas en multipliant par 7.<\/p>"}, {"texte_html": "Ils ne changent pas.", "score": -50.0, "feedback_html": "<p>Toutes les valeurs sont multipliées par 7 : leur moyenne et leur dispersion aussi.<\/p>"}]}]}, {"id": "S-008", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Combien d'amis ?"}, "etude_html": "<h4>Combien d&#x27;amis ?<\/h4><p>Pennington, Hall et Holmstrom (2024) ont interrogé un échantillon d'adultes américains dans le cadre de l'American Friendship Project. En 2023, 2 243 participants ont indiqué leur nombre d'amis en choisissant une classe : 0, 1–5, 6–10, etc. 1,5 % n'ont déclaré aucun ami, 44,4 % de 1 à 5 amis, 24,2 % de 6 à 10 amis. Dans le tableau, les trois premières classes sont celles de l'article ; la répartition des classes suivantes est simulée.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Pennington, N., Hall, J. A., &amp; Holmstrom, A. J. (2024). The American Friendship Project: A report on the status and health of friendship in America. PLOS ONE, 19(7), e0305834.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences du nombre d&#x27;amis<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Nombre d&#x27;amis<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">%<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">0<\/td><td style=\"padding:2px 12px;text-align:right\">1,5<\/td><td style=\"padding:2px 12px;text-align:right\">1,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1–5<\/td><td style=\"padding:2px 12px;text-align:right\">44,4<\/td><td style=\"padding:2px 12px;text-align:right\">45,9<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">6–10<\/td><td style=\"padding:2px 12px;text-align:right\">24,2<\/td><td style=\"padding:2px 12px;text-align:right\">70,1<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">11–15<\/td><td style=\"padding:2px 12px;text-align:right\">10,5<\/td><td style=\"padding:2px 12px;text-align:right\">80,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">16–20<\/td><td style=\"padding:2px 12px;text-align:right\">7,2<\/td><td style=\"padding:2px 12px;text-align:right\">87,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">21–30<\/td><td style=\"padding:2px 12px;text-align:right\">5,6<\/td><td style=\"padding:2px 12px;text-align:right\">93,4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">31–50<\/td><td style=\"padding:2px 12px;text-align:right\">3,4<\/td><td style=\"padding:2px 12px;text-align:right\">96,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">51 et plus<\/td><td style=\"padding:2px 12px;text-align:right\">3,2<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><\/table>", "questions": [{"id": "S-008-q1", "difficulte": 1, "question_html": "<p>Quelle est la classe modale ?<\/p>", "question_texte": "Quelle est la classe modale ?", "feedback_general_html": "<p>Le mode est une modalité (ici une classe), pas une fréquence.<\/p>", "options": [{"texte_html": "1–5 amis", "score": 100.0, "feedback_html": "<p>Exact. C'est la classe la plus fréquente (44,4 %).<\/p>"}, {"texte_html": "6–10 amis", "score": -20.0, "feedback_html": "<p>6–10 est la classe de la médiane ; la classe modale est la plus fréquente, 1–5.<\/p>"}, {"texte_html": "44,4 %", "score": -30.0, "feedback_html": "<p>44,4 % est la fréquence de la classe modale ; le mode est la classe elle-même.<\/p>"}, {"texte_html": "51 amis et plus", "score": -50.0, "feedback_html": "<p>C'est l'une des classes les moins fréquentes (3,2 %).<\/p>"}]}, {"id": "S-008-q2", "difficulte": 2, "question_html": "<p>Dans quelle classe se trouve la médiane ?<\/p>", "question_texte": "Dans quelle classe se trouve la médiane ?", "feedback_general_html": "<p>Médiane d'une variable en classes ordonnées : la classe où le pourcentage cumulé franchit 50 %.<\/p>", "options": [{"texte_html": "6–10 amis", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 45,9 % à la fin de la classe 1–5 et 70,1 % à la fin de 6–10 : les 50 % sont franchis dans la classe 6–10.<\/p>"}, {"texte_html": "1–5 amis", "score": -20.0, "feedback_html": "<p>C'est la classe modale. Le cumul n'y atteint que 45,9 % : moins de la moitié.<\/p>"}, {"texte_html": "11–15 amis", "score": -30.0, "feedback_html": "<p>Le cumul dépasse déjà 50 % à la fin de la classe 6–10.<\/p>"}, {"texte_html": "Il n'y en a pas : le nombre d'amis est donné en classes.", "score": -50.0, "feedback_html": "<p>Les classes sont ordonnées : on peut repérer celle où le cumul franchit 50 %.<\/p>"}]}, {"id": "S-008-q3", "difficulte": 2, "question_html": "<p>Pourquoi ne peut-on pas calculer exactement la moyenne du nombre d'amis à partir de ce tableau ?<\/p>", "question_texte": "Pourquoi ne peut-on pas calculer exactement la moyenne du nombre d'amis à partir de ce tableau ?", "feedback_general_html": "<p>Avec des classes, surtout une classe ouverte, la moyenne exacte est inconnue ; médiane et quartiles restent repérables.<\/p>", "options": [{"texte_html": "Les réponses sont données en classes, dont la dernière est ouverte (51 et plus) : on ne connaît pas les valeurs exactes.", "score": 100.0, "feedback_html": "<p>Exact. Dans la classe « 51 et plus », une personne peut avoir 52 ou 300 amis : la moyenne en dépend fortement.<\/p>"}, {"texte_html": "Parce que la distribution est asymétrique.", "score": -20.0, "feedback_html": "<p>Une distribution asymétrique a bien une moyenne ; elle est seulement éloignée de la médiane. Le problème ici, ce sont les classes.<\/p>"}, {"texte_html": "Parce que l'échantillon est trop grand.", "score": -30.0, "feedback_html": "<p>La taille de l'échantillon n'empêche pas de calculer une moyenne.<\/p>"}, {"texte_html": "Parce que le nombre d'amis est une variable nominale.", "score": -50.0, "feedback_html": "<p>Le nombre d'amis est une variable numérique, ici regroupée en classes ordonnées.<\/p>"}]}, {"id": "S-008-q4", "difficulte": 2, "question_html": "<p>Dans quelle classe se trouve le troisième quartile ?<\/p>", "question_texte": "Dans quelle classe se trouve le troisième quartile ?", "feedback_general_html": "<p>Troisième quartile : la classe où le pourcentage cumulé franchit 75 %.<\/p>", "options": [{"texte_html": "11–15 amis", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 70,1 % à la fin de 6–10 et 80,6 % à la fin de 11–15 : les 75 % sont franchis dans la classe 11–15.<\/p>"}, {"texte_html": "6–10 amis", "score": -20.0, "feedback_html": "<p>Le cumul n'y atteint que 70,1 %, moins de 75 %.<\/p>"}, {"texte_html": "16–20 amis", "score": -30.0, "feedback_html": "<p>Les 75 % sont déjà franchis à la fin de la classe 11–15 (80,6 %).<\/p>"}, {"texte_html": "51 amis et plus", "score": -50.0, "feedback_html": "<p>Cette classe contient les 3,2 % les plus hauts, bien au-delà de 75 %.<\/p>"}]}, {"id": "S-008-q5", "difficulte": 3, "question_html": "<p>Un journaliste résume : « La moitié des Américains a entre 1 et 5 amis. » Est-ce exact ?<\/p>", "question_texte": "Un journaliste résume : « La moitié des Américains a entre 1 et 5 amis. » Est-ce exact ?", "feedback_general_html": "<p>Classe modale et moitié des individus sont deux choses différentes.<\/p>", "options": [{"texte_html": "Non : 45,9 % ont 5 amis ou moins, zéro compris ; la moitié n'est atteinte que dans la classe 6–10.", "score": 100.0, "feedback_html": "<p>Exact. La classe 1–5 regroupe 44,4 % des répondants : beaucoup, mais pas la moitié.<\/p>"}, {"texte_html": "Oui : 1–5 est la classe la plus fréquente.", "score": -20.0, "feedback_html": "<p>C'est bien la classe modale, mais être la plus fréquente ne veut pas dire regrouper la moitié des répondants.<\/p>"}, {"texte_html": "Non : la moitié des Américains a plus de 10 amis.", "score": -30.0, "feedback_html": "<p>Seuls 29,9 % des répondants ont plus de 10 amis.<\/p>"}, {"texte_html": "On ne peut pas le vérifier sans la moyenne.", "score": -50.0, "feedback_html": "<p>La moyenne n'est pas utile ici : les pourcentages du tableau suffisent.<\/p>"}]}]}, {"id": "S-009", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Le jeu du dictateur"}, "etude_html": "<h4>Le jeu du dictateur<\/h4><p>Dans le jeu du dictateur, un participant reçoit une somme d'argent et décide seul de la part qu'il donne à un inconnu, qui ne peut rien faire. Engel (2011) a rassemblé plus de 600 versions de cette expérience. En moyenne, les participants donnent 28 % de la somme ; environ un tiers ne donne rien, et environ un sixième partage à égalité. Ci-dessous, 400 participants simulés d'après ces résultats. Variable <code>don<\/code> : part de la somme donnée, en %.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Engel, C. (2011). Dictator games: A meta study. Experimental Economics, 14(4), 583–610.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives de don (%)<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">400<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">28,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">20<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mode<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">29,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1er quartile<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3e quartile<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en bâtons de don<\/strong><\/p><p><img src=\"images/s009_dictateur.png\" alt=\"Diagramme en bâtons de don\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-009-q1", "difficulte": 1, "question_html": "<p>Quel est le mode de la variable <code>don<\/code> ?<\/p>", "question_texte": "Quel est le mode de la variable `don` ?", "feedback_general_html": "<p>Le mode est la valeur la plus fréquente.<\/p>", "options": [{"texte_html": "0 %", "score": 100.0, "feedback_html": "<p>Exact. C'est la valeur la plus fréquente : 36 % des participants ne donnent rien.<\/p>"}, {"texte_html": "50 %", "score": -20.0, "feedback_html": "<p>C'est le second sommet (17 % des participants), mais pas le plus haut.<\/p>"}, {"texte_html": "36 %", "score": -30.0, "feedback_html": "<p>36 % est la part des participants qui donnent 0 ; le mode est la valeur 0 elle-même.<\/p>"}, {"texte_html": "28,8 %", "score": -50.0, "feedback_html": "<p>C'est la moyenne, que presque personne ne donne.<\/p>"}]}, {"id": "S-009-q2", "difficulte": 1, "question_html": "<p>Comment qualifier la forme de cette distribution ?<\/p>", "question_texte": "Comment qualifier la forme de cette distribution ?", "feedback_general_html": "<p>Deux sommets : distribution bimodale. Elle suggère deux façons de se comporter.<\/p>", "options": [{"texte_html": "Bimodale : un sommet à 0 % et un second à 50 %.", "score": 100.0, "feedback_html": "<p>Exact. Deux comportements fréquents se dégagent : ne rien donner, et partager à égalité.<\/p>"}, {"texte_html": "Unimodale, étirée vers les valeurs élevées.", "score": -20.0, "feedback_html": "<p>Elle est bien étirée vers les valeurs élevées, mais le pic à 50 % forme un second sommet.<\/p>"}, {"texte_html": "Symétrique autour de 50 %.", "score": -30.0, "feedback_html": "<p>Le gros des participants est à gauche de 50 %, avec un pic à 0 : la distribution n'est pas symétrique.<\/p>"}, {"texte_html": "Uniforme : chaque valeur est aussi fréquente que les autres.", "score": -50.0, "feedback_html": "<p>Les bâtons ont des hauteurs très différentes, de 1 % à 36 %.<\/p>"}]}, {"id": "S-009-q3", "difficulte": 1, "question_html": "<p>Que signifie la médiane de 20 % ?<\/p>", "question_texte": "Que signifie la médiane de 20 % ?", "feedback_general_html": "<p>La médiane coupe les participants en deux moitiés.<\/p>", "options": [{"texte_html": "La moitié des participants donne 20 % de la somme ou moins.", "score": 100.0, "feedback_html": "<p>Exact. C'est la définition de la médiane.<\/p>"}, {"texte_html": "En moyenne, les participants donnent 20 % de la somme.", "score": -20.0, "feedback_html": "<p>La moyenne vaut 28,8 % ; 20 % est la médiane.<\/p>"}, {"texte_html": "20 % des participants donnent la moitié de la somme.", "score": -30.0, "feedback_html": "<p>La médiane est une valeur de la variable, pas une part des participants.<\/p>"}, {"texte_html": "La plupart des participants donnent exactement 20 %.", "score": -50.0, "feedback_html": "<p>Seuls 9 % des participants donnent 20 %. La valeur la plus fréquente est 0.<\/p>"}]}, {"id": "S-009-q4", "difficulte": 2, "question_html": "<p>On crée la variable <code>a_donne<\/code> : 1 si le participant a donné quelque chose, 0 sinon. Quelle est sa moyenne ?<\/p>", "question_texte": "On crée la variable `a_donne` : 1 si le participant a donné quelque chose, 0 sinon. Quelle est sa moyenne ?", "feedback_general_html": "<p>Variable codée 0/1 : moyenne = proportion de 1.<\/p>", "options": [{"texte_html": "0,64", "score": 100.0, "feedback_html": "<p>Exact. 36 % ne donnent rien, donc 64 % donnent quelque chose ; la moyenne d'une variable 0/1 est la proportion de 1.<\/p>"}, {"texte_html": "0,36", "score": -20.0, "feedback_html": "<p>0,36 est la proportion de 0 (ceux qui ne donnent rien). La moyenne est la proportion de 1.<\/p>"}, {"texte_html": "0,288", "score": -30.0, "feedback_html": "<p>C'est la moyenne de <code>don<\/code> divisée par 100, pas la proportion de participants qui donnent.<\/p>"}, {"texte_html": "0,5, puisque la variable n'a que deux valeurs", "score": -50.0, "feedback_html": "<p>La moyenne dépend de la proportion de 1, pas du nombre de valeurs possibles.<\/p>"}]}, {"id": "S-009-q5", "difficulte": 3, "question_html": "<p>Le premier quartile vaut 0. Que signifie-t-il ?<\/p>", "question_texte": "Le premier quartile vaut 0. Que signifie-t-il ?", "feedback_general_html": "<p>Un quartile peut être égal au minimum si plus d'un quart des individus ont cette valeur.<\/p>", "options": [{"texte_html": "Au moins un quart des participants ne donne rien.", "score": 100.0, "feedback_html": "<p>Exact. 25 % des participants ont une valeur inférieure ou égale à 0, c'est-à-dire 0. En réalité, ils sont 36 %.<\/p>"}, {"texte_html": "Exactement un quart des participants ne donne rien.", "score": -20.0, "feedback_html": "<p>Le quartile dit qu'au moins 25 % sont à 0, pas exactement 25 %. Ici, ils sont 36 %.<\/p>"}, {"texte_html": "Le quart le plus généreux des participants donne 0 %.", "score": -30.0, "feedback_html": "<p>C'est le quart le moins généreux qui est en dessous de Q1.<\/p>"}, {"texte_html": "C'est une erreur : un quartile ne peut pas être égal au minimum.", "score": -50.0, "feedback_html": "<p>C'est tout à fait possible quand beaucoup d'individus ont la valeur minimale.<\/p>"}]}, {"id": "S-009-q6", "difficulte": 3, "question_html": "<p>Quel résumé décrit le plus fidèlement ces données ?<\/p>", "question_texte": "Quel résumé décrit le plus fidèlement ces données ?", "feedback_general_html": "<p>Pour une distribution bimodale, aucun indice de position ne décrit un individu typique : on décrit la forme.<\/p>", "options": [{"texte_html": "Plus d'un tiers des participants ne donne rien et environ un sixième partage à égalité ; en moyenne, on donne 29 %, mais cette moyenne ne décrit pas un comportement typique.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux sommets, un seul nombre résume mal : il faut décrire la forme de la distribution.<\/p>"}, {"texte_html": "Les participants donnent en général un peu moins de 30 % de la somme.", "score": -20.0, "feedback_html": "<p>La moyenne est juste, mais « en général » suggère un comportement typique : or la plupart donnent soit 0, soit 50 %.<\/p>"}, {"texte_html": "La plupart des participants partagent à égalité.", "score": -30.0, "feedback_html": "<p>Seuls 17 % partagent à égalité.<\/p>"}, {"texte_html": "Les participants ne donnent rien.", "score": -50.0, "feedback_html": "<p>C'est le mode, mais 64 % des participants donnent quelque chose.<\/p>"}]}]}, {"id": "S-011", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Découvrir le diagramme en violon"}, "etude_html": "<h4>Découvrir le diagramme en violon<\/h4><p>Un diagramme en violon montre la forme d'une distribution numérique. Pour chaque valeur, la largeur du violon indique la densité : plus le violon est large à une hauteur donnée, plus les individus sont nombreux autour de cette valeur. La forme est dessinée en miroir, à gauche et à droite, ce qui donne l'allure d'un violon. On y ajoute souvent une petite boîte à moustaches. Ici, chaque violon a la même largeur maximale, quel que soit l'effectif du groupe.<\/p><p>Qin et al. (2020) ont validé un questionnaire de dépistage du trouble du jeu vidéo. Ils ont interrogé 3 724 étudiants chinois et 131 patients venus consulter pour leur pratique du jeu. Temps de jeu hebdomadaire : 8,1 heures en moyenne chez les étudiants (écart-type 10,8) ; 26,0 heures chez les patients (écart-type 14,1). Ci-dessous, 400 étudiants et 131 patients simulés, calés sur ces chiffres.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Qin, L., Cheng, L., Hu, M., Liu, Q., Tong, J., Hao, W., Luo, T., &amp; Liao, Y. (2020). Clarification of the cut-off score for nine-item Internet Gaming Disorder Scale-Short Form (IGDS9-SF) in a Chinese context. Frontiers in Psychiatry, 11, 470.<\/p><p style=\"margin-bottom:2px\"><strong>Heures de jeu vidéo par semaine<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Groupe<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">N<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Moyenne<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Médiane<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Écart-type<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Q1<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Q3<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Étudiants<\/td><td style=\"padding:2px 12px;text-align:right\">400<\/td><td style=\"padding:2px 12px;text-align:right\">8,2<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><td style=\"padding:2px 12px;text-align:right\">10,5<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">13<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Patients<\/td><td style=\"padding:2px 12px;text-align:right\">131<\/td><td style=\"padding:2px 12px;text-align:right\">26,3<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">13,7<\/td><td style=\"padding:2px 12px;text-align:right\">16<\/td><td style=\"padding:2px 12px;text-align:right\">36<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en violon (avec boîte à moustaches)<\/strong><\/p><p><img src=\"images/s011_violon_jeu.png\" alt=\"Diagramme en violon (avec boîte à moustaches)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-011-q1", "difficulte": 1, "question_html": "<p>Dans un diagramme en violon, que représente la largeur du violon à une hauteur donnée ?<\/p>", "question_texte": "Dans un diagramme en violon, que représente la largeur du violon à une hauteur donnée ?", "feedback_general_html": "<p>Violon : largeur = densité des individus autour de chaque valeur.<\/p>", "options": [{"texte_html": "La densité : plus le violon est large, plus les individus sont nombreux autour de cette valeur.", "score": 100.0, "feedback_html": "<p>Exact. Le violon est une sorte d'histogramme lissé, dessiné en miroir.<\/p>"}, {"texte_html": "Le nombre exact d'individus qui ont exactement cette valeur.", "score": -20.0, "feedback_html": "<p>L'idée est proche, mais le violon est lissé : il montre la concentration des individus autour d'une valeur, pas un effectif exact.<\/p>"}, {"texte_html": "L'écart-type du groupe.", "score": -30.0, "feedback_html": "<p>L'écart-type est un seul nombre ; la largeur du violon varie d'une valeur à l'autre.<\/p>"}, {"texte_html": "Rien : la largeur est décorative.", "score": -50.0, "feedback_html": "<p>La largeur est justement l'information principale du violon.<\/p>"}]}, {"id": "S-011-q2", "difficulte": 1, "question_html": "<p>Chez les étudiants, autour de quelle valeur les individus sont-ils les plus nombreux ?<\/p>", "question_texte": "Chez les étudiants, autour de quelle valeur les individus sont-ils les plus nombreux ?", "feedback_general_html": "<p>La zone la plus dense est la plus large du violon.<\/p>", "options": [{"texte_html": "Près de 0 heure par semaine", "score": 100.0, "feedback_html": "<p>Exact. Le violon est le plus large tout en bas : beaucoup d'étudiants ne jouent pas ou presque pas.<\/p>"}, {"texte_html": "Autour de 4 heures, la médiane", "score": -20.0, "feedback_html": "<p>4 heures est la médiane : la moitié des étudiants joue moins. Mais le violon est encore plus large près de 0.<\/p>"}, {"texte_html": "Autour de 8 heures, la moyenne", "score": -30.0, "feedback_html": "<p>La moyenne n'est pas là où les individus sont les plus nombreux ; elle est tirée vers le haut par les gros joueurs.<\/p>"}, {"texte_html": "Autour de 67 heures, là où le violon est le plus haut", "score": -50.0, "feedback_html": "<p>La hauteur montre l'étendue des valeurs ; à 67 heures, le violon est un simple fil : il n'y a presque personne.<\/p>"}]}, {"id": "S-011-q3", "difficulte": 2, "question_html": "<p>Que montre la forme du violon des étudiants ?<\/p>", "question_texte": "Que montre la forme du violon des étudiants ?", "feedback_general_html": "<p>Un violon large d'un côté et effilé de l'autre montre une distribution asymétrique.<\/p>", "options": [{"texte_html": "Une distribution étirée vers les valeurs élevées : beaucoup jouent peu ou pas, quelques-uns jouent beaucoup.", "score": 100.0, "feedback_html": "<p>Exact. Le violon est large en bas et s'effile en une longue pointe vers le haut.<\/p>"}, {"texte_html": "Une distribution étirée vers les valeurs faibles.", "score": -20.0, "feedback_html": "<p>La forme est bien asymétrique, mais dans l'autre sens : la longue pointe va vers les valeurs élevées.<\/p>"}, {"texte_html": "Une distribution symétrique autour de 8 heures.", "score": -30.0, "feedback_html": "<p>Le violon n'a pas la même forme au-dessus et en dessous de 8 heures.<\/p>"}, {"texte_html": "Une distribution bimodale, avec un sommet à 0 et un autre à 67 heures.", "score": -50.0, "feedback_html": "<p>À 67 heures, le violon est presque nul : il n'y a qu'un seul sommet, près de 0.<\/p>"}]}, {"id": "S-011-q4", "difficulte": 2, "question_html": "<p>Qu'apporte le violon par rapport à la boîte à moustaches dessinée à l'intérieur ?<\/p>", "question_texte": "Qu'apporte le violon par rapport à la boîte à moustaches dessinée à l'intérieur ?", "feedback_general_html": "<p>Boîte : médiane, quartiles, valeurs isolées. Violon : la forme complète de la distribution.<\/p>", "options": [{"texte_html": "Il montre la forme complète de la distribution, par exemple la forte concentration près de 0 chez les étudiants, que la boîte résume seulement par Q1 = 0.", "score": 100.0, "feedback_html": "<p>Exact. La boîte donne cinq repères ; le violon montre où les individus se concentrent entre ces repères.<\/p>"}, {"texte_html": "Il montre la médiane, que la boîte ne montre pas.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : la médiane est le trait épais de la boîte. Le violon, lui, montre la forme.<\/p>"}, {"texte_html": "Il donne la moyenne et l'écart-type de chaque groupe.", "score": -30.0, "feedback_html": "<p>Ni le violon ni la boîte ne montrent la moyenne ou l'écart-type.<\/p>"}, {"texte_html": "Rien : il montre exactement la même information.", "score": -50.0, "feedback_html": "<p>La boîte ne montre pas où les individus se concentrent ; le violon, si.<\/p>"}]}, {"id": "S-011-q5", "difficulte": 3, "question_html": "<p>Chez les étudiants, l'écart-type (10,5 h) est plus grand que la moyenne (8,2 h). Comment l'expliquer, d'après le violon ?<\/p>", "question_texte": "Chez les étudiants, l'écart-type (10,5 h) est plus grand que la moyenne (8,2 h). Comment l'expliquer, d'après le violon ?", "feedback_general_html": "<p>Une distribution très asymétrique, avec beaucoup de valeurs nulles, peut avoir un écart-type supérieur à la moyenne.<\/p>", "options": [{"texte_html": "Beaucoup d'étudiants sont à 0 et quelques-uns jouent beaucoup : les écarts à la moyenne sont grands, surtout du côté des fortes valeurs.", "score": 100.0, "feedback_html": "<p>Exact. Les gros joueurs, à 30 ou 60 heures, s'écartent de plusieurs dizaines d'heures de la moyenne ; élevés au carré, ces écarts pèsent lourd.<\/p>"}, {"texte_html": "La plupart des étudiants jouent plus de 18,7 heures (8,2 + 10,5).", "score": -20.0, "feedback_html": "<p>C'est faux : la médiane est à 4 heures. L'écart-type ne se lit pas en ajoutant une valeur à la moyenne pour la majorité.<\/p>"}, {"texte_html": "Le groupe des étudiants contient aussi les patients.", "score": -30.0, "feedback_html": "<p>Les deux groupes sont distincts ; l'écart-type des étudiants vient de leur propre distribution.<\/p>"}, {"texte_html": "C'est impossible : un écart-type est toujours plus petit que la moyenne.", "score": -50.0, "feedback_html": "<p>Rien ne l'interdit : avec une distribution très étirée vers le haut et beaucoup de valeurs à 0, l'écart-type peut dépasser la moyenne.<\/p>"}]}]}, {"id": "S-012", "type": "serie", "categorie": "interpretation", "cm": [4], "etude": {"titre": "Droitiers et gauchers"}, "etude_html": "<h4>Droitiers et gauchers<\/h4><p>L'inventaire de latéralité d'Édimbourg demande avec quelle main on écrit, on dessine, on lance, on se brosse les dents, etc. Il en tire un quotient de latéralité, de −100 (gaucher exclusif) à +100 (droitier exclusif). Espírito-Santo et al. (2017) l'ont validé auprès de 342 adultes portugais : quotient moyen de 63,5 (écart-type 38,0). Les 342 valeurs ci-dessous sont simulées, calées sur ces chiffres ; 17 participants ont un quotient négatif.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Espírito-Santo, H., et al. (2017). Preliminary validation of the Portuguese Edinburgh Handedness Inventory in an adult sample. Applied Neuropsychology: Adult, 24(3), 275–287.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives du quotient de latéralité<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">342<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">64,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mode<\/td><td style=\"padding:2px 12px;text-align:right\">90<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">38,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1er quartile<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3e quartile<\/td><td style=\"padding:2px 12px;text-align:right\">90<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Asymétrie<\/td><td style=\"padding:2px 12px;text-align:right\">−2,05<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Aplatissement<\/td><td style=\"padding:2px 12px;text-align:right\">4,77<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Histogramme du quotient de latéralité<\/strong><\/p><p><img src=\"images/s012_lateralite.png\" alt=\"Histogramme du quotient de latéralité\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-012-q1", "difficulte": 1, "question_html": "<p>Comment décrire la forme de cette distribution ?<\/p>", "question_texte": "Comment décrire la forme de cette distribution ?", "feedback_general_html": "<p>Le côté de l'asymétrie est celui de la queue.<\/p>", "options": [{"texte_html": "Asymétrique à gauche : la plupart des participants sont droitiers, et la queue s'étire vers les gauchers.", "score": 100.0, "feedback_html": "<p>Exact. Le sommet est vers +90, la queue part vers −100. Le coefficient (−2,05) le confirme.<\/p>"}, {"texte_html": "Asymétrique à droite, puisque le sommet est à droite.", "score": -20.0, "feedback_html": "<p>L'asymétrie se nomme du côté de la queue, ici à gauche.<\/p>"}, {"texte_html": "Symétrique.", "score": -30.0, "feedback_html": "<p>Le sommet est tout à droite et la queue s'étire loin vers la gauche.<\/p>"}, {"texte_html": "Uniforme.", "score": -50.0, "feedback_html": "<p>Les effectifs varient énormément d'une classe à l'autre.<\/p>"}]}, {"id": "S-012-q2", "difficulte": 2, "question_html": "<p>Moyenne (64,8) &lt; médiane (80) &lt; mode (90) : cet ordre est-il cohérent avec la forme observée ?<\/p>", "question_texte": "Moyenne (64,8) < médiane (80) < mode (90) : cet ordre est-il cohérent avec la forme observée ?", "feedback_general_html": "<p>Asymétrie à gauche : moyenne &lt; médiane &lt; mode.<\/p>", "options": [{"texte_html": "Oui : c'est la signature d'une asymétrie à gauche ; la moyenne est tirée vers la queue des gauchers.", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est l'indice le plus sensible aux valeurs éloignées.<\/p>"}, {"texte_html": "Oui, et il signale une asymétrie à droite.", "score": -20.0, "feedback_html": "<p>L'ordre est cohérent, mais il signale une asymétrie à gauche.<\/p>"}, {"texte_html": "Non : il faudrait mode &lt; médiane &lt; moyenne.", "score": -30.0, "feedback_html": "<p>C'est l'ordre d'une asymétrie à droite.<\/p>"}, {"texte_html": "Non : les trois indices devraient être égaux.", "score": -50.0, "feedback_html": "<p>Ils ne sont égaux que pour une distribution symétrique.<\/p>"}]}, {"id": "S-012-q3", "difficulte": 2, "question_html": "<p>Quelle est la borne basse de la règle de Tukey ?<\/p>", "question_texte": "Quelle est la borne basse de la règle de Tukey ?", "feedback_general_html": "<p>Borne basse de Tukey = Q1 − 1,5 × EIQ.<\/p>", "options": [{"texte_html": "−10", "score": 100.0, "feedback_html": "<p>Exact. EIQ = 90 − 50 = 40 ; 50 − 1,5 × 40 = −10.<\/p>"}, {"texte_html": "10", "score": -20.0, "feedback_html": "<p>On a retiré un seul EIQ ; la règle en retire 1,5.<\/p>"}, {"texte_html": "−60", "score": -30.0, "feedback_html": "<p>−60 = −1,5 × 40 ; il faut partir du premier quartile : 50 − 60 = −10.<\/p>"}, {"texte_html": "50", "score": -50.0, "feedback_html": "<p>50 est le premier quartile.<\/p>"}]}, {"id": "S-012-q4", "difficulte": 3, "question_html": "<p>Avec cette borne, les 17 participants au quotient négatif sont tous des valeurs atypiques. Que faire ?<\/p>", "question_texte": "Avec cette borne, les 17 participants au quotient négatif sont tous des valeurs atypiques. Que faire ?", "feedback_general_html": "<p>Une valeur atypique n'est pas une erreur : on la vérifie, on la garde si elle est plausible, on la signale.<\/p>", "options": [{"texte_html": "Les garder : ce sont des gauchers, une minorité bien réelle. On signale qu'ils forment la queue de la distribution.", "score": 100.0, "feedback_html": "<p>Exact. « Atypique » veut dire éloigné de la masse, pas faux. Ici, ces valeurs sont parfaitement plausibles.<\/p>"}, {"texte_html": "Les garder, sans le signaler.", "score": -20.0, "feedback_html": "<p>Les garder est juste, mais il faut signaler qu'ils forment la queue de la distribution.<\/p>"}, {"texte_html": "Les supprimer, puisque la règle de Tukey les déclare atypiques.", "score": -30.0, "feedback_html": "<p>La règle repère des valeurs à examiner ; elle ne dit pas qu'il faut les supprimer.<\/p>"}, {"texte_html": "Les recoder en droitiers pour rendre la distribution plus symétrique.", "score": -50.0, "feedback_html": "<p>Ce serait falsifier les données.<\/p>"}]}, {"id": "S-012-q5", "difficulte": 2, "question_html": "<p>La moyenne (64,8) décrit-elle bien un participant typique ?<\/p>", "question_texte": "La moyenne (64,8) décrit-elle bien un participant typique ?", "feedback_general_html": "<p>Distribution très asymétrique : la médiane décrit mieux l'individu typique que la moyenne.<\/p>", "options": [{"texte_html": "Non : elle est tirée vers le bas par les gauchers ; la médiane (80) décrit mieux le participant typique, droitier.", "score": 100.0, "feedback_html": "<p>Exact. Avec une forte asymétrie, la médiane décrit mieux l'individu typique.<\/p>"}, {"texte_html": "Oui, puisqu'elle utilise toutes les valeurs.", "score": -20.0, "feedback_html": "<p>Utiliser toutes les valeurs la rend justement sensible aux gauchers, très éloignés du gros des données.<\/p>"}, {"texte_html": "Non : il faudrait donner l'écart-type à sa place.", "score": -30.0, "feedback_html": "<p>L'écart-type mesure la dispersion, pas la position.<\/p>"}, {"texte_html": "Oui : une moyenne décrit toujours l'individu typique.", "score": -50.0, "feedback_html": "<p>Pas quand la distribution est très asymétrique.<\/p>"}]}, {"id": "S-012-q6", "difficulte": 3, "question_html": "<p>Le coefficient d'aplatissement vaut 4,77. Que signifie-t-il ici ?<\/p>", "question_texte": "Le coefficient d'aplatissement vaut 4,77. Que signifie-t-il ici ?", "feedback_general_html": "<p>Aplatissement positif : queues plus lourdes qu'une loi normale.<\/p>", "options": [{"texte_html": "Les queues sont lourdes : il y a plus de valeurs très éloignées du centre (les gauchers) que dans une loi normale.", "score": 100.0, "feedback_html": "<p>Exact. Un coefficient positif signale des queues plus lourdes que celles d'une loi normale.<\/p>"}, {"texte_html": "La distribution est très pointue, donc sans valeur éloignée du centre.", "score": -20.0, "feedback_html": "<p>Le coefficient porte surtout sur le poids des queues : positif, il signale au contraire des valeurs éloignées.<\/p>"}, {"texte_html": "Les queues sont légères.", "score": -30.0, "feedback_html": "<p>Des queues légères donneraient un coefficient négatif.<\/p>"}, {"texte_html": "La distribution est symétrique.", "score": -50.0, "feedback_html": "<p>La symétrie se lit sur le coefficient d'asymétrie, ici −2,05.<\/p>"}]}]}, {"id": "S-013", "type": "serie", "categorie": "interpretation", "cm": [4], "etude": {"titre": "Êtes-vous satisfait de votre vie ?"}, "etude_html": "<h4>Êtes-vous satisfait de votre vie ?<\/h4><p>Zullig, Huebner et Pun (2009) ont interrogé un échantillon aléatoire d'étudiants d'une université américaine. Une question demandait de décrire sa satisfaction à l'égard de sa vie, de 1 (« terrible ») à 7 (« ravi »). Moyenne publiée : 5,75 (écart-type 1,04). Le tableau donne la répartition publiée.<\/p><p style=\"font-size:0.85em;color:#555\">Données réelles · Zullig, K. J., Huebner, E. S., &amp; Pun, S. M. (2009). Demographic correlates of domain-based life satisfaction reports of college students. Journal of Happiness Studies, 10, 229–238.<\/p><p style=\"margin-bottom:2px\"><strong>Répartition des réponses<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Réponse<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">%<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1 · terrible<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">2 · malheureux<\/td><td style=\"padding:2px 12px;text-align:right\">0,4<\/td><td style=\"padding:2px 12px;text-align:right\">0,4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3 · plutôt insatisfait<\/td><td style=\"padding:2px 12px;text-align:right\">2,4<\/td><td style=\"padding:2px 12px;text-align:right\">2,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">4 · mitigé<\/td><td style=\"padding:2px 12px;text-align:right\">10,5<\/td><td style=\"padding:2px 12px;text-align:right\">13,3<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">5 · plutôt satisfait<\/td><td style=\"padding:2px 12px;text-align:right\">20,3<\/td><td style=\"padding:2px 12px;text-align:right\">33,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">6 · content<\/td><td style=\"padding:2px 12px;text-align:right\">41,4<\/td><td style=\"padding:2px 12px;text-align:right\">75,0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">7 · ravi<\/td><td style=\"padding:2px 12px;text-align:right\">25,1<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en barres des réponses<\/strong><\/p><p><img src=\"images/s013_satisfaction.png\" alt=\"Diagramme en barres des réponses\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-013-q1", "difficulte": 1, "question_html": "<p>Quel est le mode ?<\/p>", "question_texte": "Quel est le mode ?", "feedback_general_html": "<p>Le mode est une modalité, pas une fréquence.<\/p>", "options": [{"texte_html": "6 (« content »)", "score": 100.0, "feedback_html": "<p>Exact. C'est la réponse la plus fréquente (41,4 %).<\/p>"}, {"texte_html": "7 (« ravi »)", "score": -20.0, "feedback_html": "<p>7 est fréquent (25,1 %), mais moins que 6.<\/p>"}, {"texte_html": "41,4 %", "score": -30.0, "feedback_html": "<p>41,4 % est la fréquence du mode ; le mode est la réponse elle-même.<\/p>"}, {"texte_html": "4 (« mitigé »), le milieu de l'échelle", "score": -50.0, "feedback_html": "<p>Le milieu de l'échelle n'a rien à voir avec la réponse la plus fréquente.<\/p>"}]}, {"id": "S-013-q2", "difficulte": 1, "question_html": "<p>Quelle est la médiane ?<\/p>", "question_texte": "Quelle est la médiane ?", "feedback_general_html": "<p>Médiane : première modalité dont le pourcentage cumulé atteint 50 %.<\/p>", "options": [{"texte_html": "6 (« content »)", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 33,6 % à 5 et 75,0 % à 6 : les 50 % sont franchis à 6.<\/p>"}, {"texte_html": "5 (« plutôt satisfait »)", "score": -20.0, "feedback_html": "<p>Le cumul n'y atteint que 33,6 %.<\/p>"}, {"texte_html": "4 (« mitigé »), le milieu de l'échelle", "score": -30.0, "feedback_html": "<p>La médiane coupe les répondants en deux, pas l'échelle.<\/p>"}, {"texte_html": "5,75", "score": -50.0, "feedback_html": "<p>5,75 est la moyenne.<\/p>"}]}, {"id": "S-013-q3", "difficulte": 2, "question_html": "<p>Comment décrire la forme de cette distribution ?<\/p>", "question_texte": "Comment décrire la forme de cette distribution ?", "feedback_general_html": "<p>Le côté de l'asymétrie est celui de la queue.<\/p>", "options": [{"texte_html": "Asymétrique à gauche : la plupart des étudiants sont satisfaits, et la queue s'étire vers l'insatisfaction.", "score": 100.0, "feedback_html": "<p>Exact. Sommet à 6, queue vers les petites valeurs.<\/p>"}, {"texte_html": "Asymétrique à droite, puisque le sommet est du côté des fortes valeurs.", "score": -20.0, "feedback_html": "<p>On nomme l'asymétrie du côté de la queue, ici les faibles valeurs.<\/p>"}, {"texte_html": "Symétrique autour de 4.", "score": -30.0, "feedback_html": "<p>Les réponses s'accumulent nettement en haut de l'échelle.<\/p>"}, {"texte_html": "Bimodale.", "score": -50.0, "feedback_html": "<p>Il n'y a qu'un sommet, à 6.<\/p>"}]}, {"id": "S-013-q4", "difficulte": 2, "question_html": "<p>La moyenne (5,75) est inférieure à la médiane et au mode (6). Est-ce cohérent ?<\/p>", "question_texte": "La moyenne (5,75) est inférieure à la médiane et au mode (6). Est-ce cohérent ?", "feedback_general_html": "<p>Asymétrie à gauche : moyenne &lt; médiane ≤ mode.<\/p>", "options": [{"texte_html": "Oui : la moyenne est tirée vers la queue, du côté des étudiants insatisfaits.", "score": 100.0, "feedback_html": "<p>Exact. C'est la signature d'une asymétrie à gauche.<\/p>"}, {"texte_html": "Oui, et cela montre une asymétrie à droite.", "score": -20.0, "feedback_html": "<p>L'ordre est cohérent, mais avec une asymétrie à gauche.<\/p>"}, {"texte_html": "Non : la moyenne devrait être la plus grande des trois.", "score": -30.0, "feedback_html": "<p>Ce serait le cas d'une asymétrie à droite.<\/p>"}, {"texte_html": "Non : moyenne, médiane et mode doivent toujours être égaux.", "score": -50.0, "feedback_html": "<p>Seulement pour une distribution symétrique.<\/p>"}]}, {"id": "S-013-q5", "difficulte": 2, "question_html": "<p>Quel paramètre de position convient le mieux à cette variable ?<\/p>", "question_texte": "Quel paramètre de position convient le mieux à cette variable ?", "feedback_general_html": "<p>Variable ordinale : la médiane est le paramètre de position adapté.<\/p>", "options": [{"texte_html": "La médiane (6) : la variable est ordinale, et la moyenne suppose des écarts égaux entre les modalités.", "score": 100.0, "feedback_html": "<p>Exact. Rien ne garantit que l'écart entre « mitigé » et « plutôt satisfait » vaut celui entre « content » et « ravi ».<\/p>"}, {"texte_html": "La moyenne (5,75), parce qu'elle utilise toutes les réponses.", "score": -20.0, "feedback_html": "<p>On la voit souvent, mais pour une variable ordinale c'est un choix discuté.<\/p>"}, {"texte_html": "Le coefficient d'asymétrie.", "score": -30.0, "feedback_html": "<p>C'est un indice de forme, pas de position.<\/p>"}, {"texte_html": "Aucun : on ne peut rien calculer sur une échelle de réponse.", "score": -50.0, "feedback_html": "<p>On peut ranger les réponses : médiane et mode ont un sens.<\/p>"}]}, {"id": "S-013-q6", "difficulte": 3, "question_html": "<p>Pourquoi ce type de question produit-il souvent une distribution asymétrique à gauche ?<\/p>", "question_texte": "Pourquoi ce type de question produit-il souvent une distribution asymétrique à gauche ?", "feedback_general_html": "<p>Quand la plupart des valeurs sont proches d'une limite, la queue s'étire de l'autre côté.<\/p>", "options": [{"texte_html": "La plupart des réponses s'accumulent près du haut de l'échelle, qui s'arrête à 7 : la queue ne peut s'étendre que vers le bas.", "score": 100.0, "feedback_html": "<p>Exact. C'est un effet plafond, comme pour le MMSE chez des adultes en bonne santé.<\/p>"}, {"texte_html": "Parce que l'échantillon est trop petit.", "score": -20.0, "feedback_html": "<p>La taille de l'échantillon n'explique pas le sens de l'asymétrie.<\/p>"}, {"texte_html": "Parce que les étudiants insatisfaits sont des valeurs atypiques à supprimer.", "score": -30.0, "feedback_html": "<p>Ce sont des réponses réelles : les supprimer fausserait la description.<\/p>"}, {"texte_html": "Parce que la moyenne est inférieure à 7.", "score": -50.0, "feedback_html": "<p>La moyenne est toujours inférieure au maximum de l'échelle : cela n'explique rien.<\/p>"}]}]}, {"id": "S-015", "type": "serie", "categorie": "interpretation", "cm": [4], "etude": {"titre": "Le bilan neuropsychologique de sujets sains"}, "etude_html": "<h4>Le bilan neuropsychologique de sujets sains<\/h4><p>Vaccaro et al. (2022) ont fait passer une batterie de tests neuropsychologiques à 121 adultes italiens en bonne santé (âge moyen 46 ans). Le MMSE est un test de dépistage cognitif noté sur 30. Le tableau reprend une partie des statistiques descriptives publiées.<\/p><p style=\"font-size:0.85em;color:#555\">Données réelles · Vaccaro, M. G., et al. (2022). The validity and reliability of the Test of Memory Strategies among Italian healthy adults. PeerJ, 10, e14059.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives (n = 121)<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Test<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Moyenne<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Médiane<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Écart-type<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Asymétrie<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">MMSE (sur 30)<\/td><td style=\"padding:2px 12px;text-align:right\">29,10<\/td><td style=\"padding:2px 12px;text-align:right\">30<\/td><td style=\"padding:2px 12px;text-align:right\">1,59<\/td><td style=\"padding:2px 12px;text-align:right\">−2,00<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Rappel différé (échelle de mémoire de Wechsler)<\/td><td style=\"padding:2px 12px;text-align:right\">22,40<\/td><td style=\"padding:2px 12px;text-align:right\">19<\/td><td style=\"padding:2px 12px;text-align:right\">16,10<\/td><td style=\"padding:2px 12px;text-align:right\">0,70<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Stroop<\/td><td style=\"padding:2px 12px;text-align:right\">36,20<\/td><td style=\"padding:2px 12px;text-align:right\">37<\/td><td style=\"padding:2px 12px;text-align:right\">14,10<\/td><td style=\"padding:2px 12px;text-align:right\">−0,20<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Fluence sémantique<\/td><td style=\"padding:2px 12px;text-align:right\">49,50<\/td><td style=\"padding:2px 12px;text-align:right\">48<\/td><td style=\"padding:2px 12px;text-align:right\">14,90<\/td><td style=\"padding:2px 12px;text-align:right\">1,98<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Empan de chiffres endroit<\/td><td style=\"padding:2px 12px;text-align:right\">4,66<\/td><td style=\"padding:2px 12px;text-align:right\">5<\/td><td style=\"padding:2px 12px;text-align:right\">1,59<\/td><td style=\"padding:2px 12px;text-align:right\">−0,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Empan de chiffres envers<\/td><td style=\"padding:2px 12px;text-align:right\">3,49<\/td><td style=\"padding:2px 12px;text-align:right\">3<\/td><td style=\"padding:2px 12px;text-align:right\">1,18<\/td><td style=\"padding:2px 12px;text-align:right\">0,06<\/td><\/tr><\/table>", "questions": [{"id": "S-015-q1", "difficulte": 1, "question_html": "<p>Quel test a la distribution la plus asymétrique à gauche ?<\/p>", "question_texte": "Quel test a la distribution la plus asymétrique à gauche ?", "feedback_general_html": "<p>Asymétrie à gauche : coefficient négatif ; plus il est loin de 0, plus elle est marquée.<\/p>", "options": [{"texte_html": "Le MMSE (−2,00)", "score": 100.0, "feedback_html": "<p>Exact. C'est le coefficient le plus négatif.<\/p>"}, {"texte_html": "L'empan de chiffres endroit (−0,80)", "score": -20.0, "feedback_html": "<p>Il est bien asymétrique à gauche, mais moins que le MMSE.<\/p>"}, {"texte_html": "La fluence sémantique (1,98)", "score": -30.0, "feedback_html": "<p>Son coefficient est très élevé, mais positif : asymétrie à droite.<\/p>"}, {"texte_html": "L'empan de chiffres envers (0,06)", "score": -50.0, "feedback_html": "<p>Il est presque symétrique.<\/p>"}]}, {"id": "S-015-q2", "difficulte": 2, "question_html": "<p>Pourquoi le MMSE est-il asymétrique à gauche chez des adultes en bonne santé ?<\/p>", "question_texte": "Pourquoi le MMSE est-il asymétrique à gauche chez des adultes en bonne santé ?", "feedback_general_html": "<p>Effet plafond : quand la plupart des valeurs sont près du maximum, la queue s'étire vers le bas.<\/p>", "options": [{"texte_html": "Effet plafond : le score maximal est 30, la plupart des participants l'atteignent ou presque, et seuls quelques-uns perdent des points.", "score": 100.0, "feedback_html": "<p>Exact. Médiane à 30 : au moins la moitié des participants a le score maximal.<\/p>"}, {"texte_html": "Parce que la plupart des participants ont un score faible.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : la plupart ont un score très élevé (médiane 30).<\/p>"}, {"texte_html": "Parce que l'échantillon est petit.", "score": -30.0, "feedback_html": "<p>La taille de l'échantillon n'explique pas le sens de l'asymétrie.<\/p>"}, {"texte_html": "C'est une erreur : un test cognitif est toujours symétrique.", "score": -50.0, "feedback_html": "<p>Beaucoup de tests ne le sont pas, surtout chez des sujets sains qui réussissent presque tout.<\/p>"}]}, {"id": "S-015-q3", "difficulte": 1, "question_html": "<p>Pour quel test la distribution est-elle presque symétrique ?<\/p>", "question_texte": "Pour quel test la distribution est-elle presque symétrique ?", "feedback_general_html": "<p>Coefficient proche de 0 : distribution à peu près symétrique.<\/p>", "options": [{"texte_html": "L'empan de chiffres envers (0,06)", "score": 100.0, "feedback_html": "<p>Exact. Un coefficient aussi proche de 0 signale une distribution presque symétrique.<\/p>"}, {"texte_html": "L'empan de chiffres endroit (−0,80)", "score": -20.0, "feedback_html": "<p>−0,80 indique une asymétrie à gauche déjà visible.<\/p>"}, {"texte_html": "Le rappel différé (0,70)", "score": -30.0, "feedback_html": "<p>0,70 indique une asymétrie à droite.<\/p>"}, {"texte_html": "Le MMSE (−2,00)", "score": -50.0, "feedback_html": "<p>C'est le plus asymétrique du tableau.<\/p>"}]}, {"id": "S-015-q4", "difficulte": 2, "question_html": "<p>Pour le rappel différé, la moyenne (22,4) dépasse la médiane (19). Est-ce cohérent avec le coefficient d'asymétrie (0,70) ?<\/p>", "question_texte": "Pour le rappel différé, la moyenne (22,4) dépasse la médiane (19). Est-ce cohérent avec le coefficient d'asymétrie (0,70) ?", "feedback_general_html": "<p>Asymétrie à droite : coefficient positif et moyenne &gt; médiane.<\/p>", "options": [{"texte_html": "Oui : un coefficient positif indique une asymétrie à droite, qui tire la moyenne au-dessus de la médiane.", "score": 100.0, "feedback_html": "<p>Exact. Les deux informations vont dans le même sens.<\/p>"}, {"texte_html": "Oui, et cela indique une asymétrie à gauche.", "score": -20.0, "feedback_html": "<p>Coefficient positif et moyenne &gt; médiane signalent une asymétrie à droite.<\/p>"}, {"texte_html": "Non : un coefficient positif devrait donner une moyenne inférieure à la médiane.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : positif, la moyenne est tirée vers les grandes valeurs.<\/p>"}, {"texte_html": "Non : moyenne et médiane devraient être égales.", "score": -50.0, "feedback_html": "<p>Elles ne sont égales que pour une distribution symétrique.<\/p>"}]}, {"id": "S-015-q5", "difficulte": 3, "question_html": "<p>La fluence sémantique a un coefficient d'asymétrie de 1,98, alors que sa moyenne (49,5) et sa médiane (48) sont proches. Comment l'expliquer ?<\/p>", "question_texte": "La fluence sémantique a un coefficient d'asymétrie de 1,98, alors que sa moyenne (49,5) et sa médiane (48) sont proches. Comment l'expliquer ?", "feedback_general_html": "<p>Un coefficient d'asymétrie élevé peut venir de quelques valeurs : toujours regarder le graphique.<\/p>", "options": [{"texte_html": "Quelques valeurs très élevées suffisent à gonfler le coefficient, qui n'est pas robuste : il faut regarder le graphique.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient dépend fortement des valeurs les plus éloignées, alors que la moyenne n'en est que peu affectée sur 121 personnes.<\/p>"}, {"texte_html": "La distribution est très asymétrique : la moyenne devrait donc être bien plus grande que la médiane.", "score": -20.0, "feedback_html": "<p>Si toute la distribution était étirée, la moyenne s'éloignerait davantage de la médiane. L'écart faible suggère que quelques valeurs seulement sont en cause.<\/p>"}, {"texte_html": "C'est forcément une erreur de calcul.", "score": -30.0, "feedback_html": "<p>Rien ne l'indique : ces chiffres sont compatibles avec quelques valeurs très élevées.<\/p>"}, {"texte_html": "La distribution est asymétrique à gauche.", "score": -50.0, "feedback_html": "<p>Un coefficient positif indique une asymétrie à droite.<\/p>"}]}, {"id": "S-015-q6", "difficulte": 3, "question_html": "<p>Une participante obtient 24 au MMSE. Que dire de son score z ?<\/p>", "question_texte": "Une participante obtient 24 au MMSE. Que dire de son score z ?", "feedback_general_html": "<p>Un score z se calcule toujours ; sa lecture par la loi normale suppose une distribution à peu près normale.<\/p>", "options": [{"texte_html": "Il vaut environ −3,2 ; mais la distribution est très asymétrique, donc la règle |z| &gt; 3, qui suppose une loi normale, doit être appliquée avec prudence.", "score": 100.0, "feedback_html": "<p>Exact. z = (24 − 29,10) / 1,59 ≈ −3,2. Le calcul est juste, mais son interprétation « normale » ne l'est pas.<\/p>"}, {"texte_html": "Il vaut environ −3,2 : elle fait donc
