pe 14,1). Ci-dessous, 400 étudiants et 131 patients simulés, calés sur ces chiffres.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Qin, L., Cheng, L., Hu, M., Liu, Q., Tong, J., Hao, W., Luo, T., &amp; Liao, Y. (2020). Clarification of the cut-off score for nine-item Internet Gaming Disorder Scale-Short Form (IGDS9-SF) in a Chinese context. Frontiers in Psychiatry, 11, 470.<\/p><p style=\"margin-bottom:2px\"><strong>Heures de jeu vidéo par semaine<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Groupe<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">N<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Moyenne<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Médiane<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Écart-type<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Q1<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Q3<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Étudiants<\/td><td style=\"padding:2px 12px;text-align:right\">400<\/td><td style=\"padding:2px 12px;text-align:right\">8,2<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><td style=\"padding:2px 12px;text-align:right\">10,5<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">13<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Patients<\/td><td style=\"padding:2px 12px;text-align:right\">131<\/td><td style=\"padding:2px 12px;text-align:right\">26,3<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">13,7<\/td><td style=\"padding:2px 12px;text-align:right\">16<\/td><td style=\"padding:2px 12px;text-align:right\">36<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en violon (avec boîte à moustaches)<\/strong><\/p><p><img src=\"images/s011_violon_jeu.png\" alt=\"Diagramme en violon (avec boîte à moustaches)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-011-q1", "difficulte": 1, "question_html": "<p>Dans un diagramme en violon, que représente la largeur du violon à une hauteur donnée ?<\/p>", "question_texte": "Dans un diagramme en violon, que représente la largeur du violon à une hauteur donnée ?", "feedback_general_html": "<p>Violon : largeur = densité des individus autour de chaque valeur.<\/p>", "options": [{"texte_html": "La densité : plus le violon est large, plus les individus sont nombreux autour de cette valeur.", "score": 100.0, "feedback_html": "<p>Exact. Le violon est une sorte d'histogramme lissé, dessiné en miroir.<\/p>"}, {"texte_html": "Le nombre exact d'individus qui ont exactement cette valeur.", "score": -20.0, "feedback_html": "<p>L'idée est proche, mais le violon est lissé : il montre la concentration des individus autour d'une valeur, pas un effectif exact.<\/p>"}, {"texte_html": "L'écart-type du groupe.", "score": -30.0, "feedback_html": "<p>L'écart-type est un seul nombre ; la largeur du violon varie d'une valeur à l'autre.<\/p>"}, {"texte_html": "Rien : la largeur est décorative.", "score": -50.0, "feedback_html": "<p>La largeur est justement l'information principale du violon.<\/p>"}]}, {"id": "S-011-q2", "difficulte": 1, "question_html": "<p>Chez les étudiants, autour de quelle valeur les individus sont-ils les plus nombreux ?<\/p>", "question_texte": "Chez les étudiants, autour de quelle valeur les individus sont-ils les plus nombreux ?", "feedback_general_html": "<p>La zone la plus dense est la plus large du violon.<\/p>", "options": [{"texte_html": "Près de 0 heure par semaine", "score": 100.0, "feedback_html": "<p>Exact. Le violon est le plus large tout en bas : beaucoup d'étudiants ne jouent pas ou presque pas.<\/p>"}, {"texte_html": "Autour de 4 heures, la médiane", "score": -20.0, "feedback_html": "<p>4 heures est la médiane : la moitié des étudiants joue moins. Mais le violon est encore plus large près de 0.<\/p>"}, {"texte_html": "Autour de 8 heures, la moyenne", "score": -30.0, "feedback_html": "<p>La moyenne n'est pas là où les individus sont les plus nombreux ; elle est tirée vers le haut par les gros joueurs.<\/p>"}, {"texte_html": "Autour de 67 heures, là où le violon est le plus haut", "score": -50.0, "feedback_html": "<p>La hauteur montre l'étendue des valeurs ; à 67 heures, le violon est un simple fil : il n'y a presque personne.<\/p>"}]}, {"id": "S-011-q3", "difficulte": 2, "question_html": "<p>Que montre la forme du violon des étudiants ?<\/p>", "question_texte": "Que montre la forme du violon des étudiants ?", "feedback_general_html": "<p>Un violon large d'un côté et effilé de l'autre montre une distribution asymétrique.<\/p>", "options": [{"texte_html": "Une distribution étirée vers les valeurs élevées : beaucoup jouent peu ou pas, quelques-uns jouent beaucoup.", "score": 100.0, "feedback_html": "<p>Exact. Le violon est large en bas et s'effile en une longue pointe vers le haut.<\/p>"}, {"texte_html": "Une distribution étirée vers les valeurs faibles.", "score": -20.0, "feedback_html": "<p>La forme est bien asymétrique, mais dans l'autre sens : la longue pointe va vers les valeurs élevées.<\/p>"}, {"texte_html": "Une distribution symétrique autour de 8 heures.", "score": -30.0, "feedback_html": "<p>Le violon n'a pas la même forme au-dessus et en dessous de 8 heures.<\/p>"}, {"texte_html": "Une distribution bimodale, avec un sommet à 0 et un autre à 67 heures.", "score": -50.0, "feedback_html": "<p>À 67 heures, le violon est presque nul : il n'y a qu'un seul sommet, près de 0.<\/p>"}]}, {"id": "S-011-q4", "difficulte": 2, "question_html": "<p>Qu'apporte le violon par rapport à la boîte à moustaches dessinée à l'intérieur ?<\/p>", "question_texte": "Qu'apporte le violon par rapport à la boîte à moustaches dessinée à l'intérieur ?", "feedback_general_html": "<p>Boîte : médiane, quartiles, valeurs isolées. Violon : la forme complète de la distribution.<\/p>", "options": [{"texte_html": "Il montre la forme complète de la distribution, par exemple la forte concentration près de 0 chez les étudiants, que la boîte résume seulement par Q1 = 0.", "score": 100.0, "feedback_html": "<p>Exact. La boîte donne cinq repères ; le violon montre où les individus se concentrent entre ces repères.<\/p>"}, {"texte_html": "Il montre la médiane, que la boîte ne montre pas.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : la médiane est le trait épais de la boîte. Le violon, lui, montre la forme.<\/p>"}, {"texte_html": "Il donne la moyenne et l'écart-type de chaque groupe.", "score": -30.0, "feedback_html": "<p>Ni le violon ni la boîte ne montrent la moyenne ou l'écart-type.<\/p>"}, {"texte_html": "Rien : il montre exactement la même information.", "score": -50.0, "feedback_html": "<p>La boîte ne montre pas où les individus se concentrent ; le violon, si.<\/p>"}]}, {"id": "S-011-q5", "difficulte": 3, "question_html": "<p>Chez les étudiants, l'écart-type (10,5 h) est plus grand que la moyenne (8,2 h). Comment l'expliquer, d'après le violon ?<\/p>", "question_texte": "Chez les étudiants, l'écart-type (10,5 h) est plus grand que la moyenne (8,2 h). Comment l'expliquer, d'après le violon ?", "feedback_general_html": "<p>Une distribution très asymétrique, avec beaucoup de valeurs nulles, peut avoir un écart-type supérieur à la moyenne.<\/p>", "options": [{"texte_html": "Beaucoup d'étudiants sont à 0 et quelques-uns jouent beaucoup : les écarts à la moyenne sont grands, surtout du côté des fortes valeurs.", "score": 100.0, "feedback_html": "<p>Exact. Les gros joueurs, à 30 ou 60 heures, s'écartent de plusieurs dizaines d'heures de la moyenne ; élevés au carré, ces écarts pèsent lourd.<\/p>"}, {"texte_html": "La plupart des étudiants jouent plus de 18,7 heures (8,2 + 10,5).", "score": -20.0, "feedback_html": "<p>C'est faux : la médiane est à 4 heures. L'écart-type ne se lit pas en ajoutant une valeur à la moyenne pour la majorité.<\/p>"}, {"texte_html": "Le groupe des étudiants contient aussi les patients.", "score": -30.0, "feedback_html": "<p>Les deux groupes sont distincts ; l'écart-type des étudiants vient de leur propre distribution.<\/p>"}, {"texte_html": "C'est impossible : un écart-type est toujours plus petit que la moyenne.", "score": -50.0, "feedback_html": "<p>Rien ne l'interdit : avec une distribution très étirée vers le haut et beaucoup de valeurs à 0, l'écart-type peut dépasser la moyenne.<\/p>"}]}]}]</script>
<script>
(function () {
  "use strict";
  const BASE = JSON.parse(document.getElementById("donnees").textContent);
  const app = document.getElementById("app");
  const LETTRES = "ABCD";
  const NOMS_CAT = { comprehension: "Compréhension", choix: "Choix", interpretation: "Interprétation" };

  // --- mémoire légère dans le navigateur (questions déjà vues) ---
  function lireVues() { try { return JSON.parse(localStorage.getItem("l1s2-vues") || "{}"); } catch (e) { return {}; } }
  function ecrireVues(v) { try { localStorage.setItem("l1s2-vues", JSON.stringify(v)); } catch (e) {} }

  function melanger(t) { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function fmtPoints(p) { const s = (Math.round(p * 100) / 100).toString().replace(".", ","); return (p > 0 ? "+" : "") + s; }

  let session = null;

  // ------------------------------------------------------------ accueil
  function accueil() {
    const cms = [1, 2, 3, 4, 5];
    app.innerHTML = `
      <h2>Composer une série d'exercices</h2>
      <p class="note">Les questions sont tirées au hasard, en priorité parmi celles que vous n'avez pas encore vues sur cet appareil.</p>
      <form id="reglages">
        <fieldset><legend>Cours magistraux</legend><div class="choix">
          ${cms.map(c => `<label><input type="checkbox" name="cm" value="${c}" checked> CM ${c}</label>`).join("")}
        </div></fieldset>
        <fieldset><legend>Type de questions</legend><div class="choix">
          <label><input type="checkbox" name="cat" value="comprehension" checked> Compréhension du cours</label>
          <label><input type="checkbox" name="cat" value="choix" checked> Choisir un indice ou un graphique</label>
          <label><input type="checkbox" name="cat" value="interpretation" checked> Interpréter une étude (séries de questions)</label>
        </div></fieldset>
        <fieldset><legend>Difficulté</legend><div class="choix">
          <label><input type="checkbox" name="diff" value="1" checked> Facile</label>
          <label><input type="checkbox" name="diff" value="2" checked> Moyenne</label>
          <label><input type="checkbox" name="diff" value="3" checked> Difficile</label>
        </div></fieldset>
        <fieldset><legend>Nombre de questions</legend><div class="choix">
          ${[5, 10, 20, 40].map((n, i) => `<label><input type="radio" name="nb" value="${n}" ${i === 1 ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <p class="note">Une étude compte pour toutes ses questions : le total peut dépasser un peu le nombre demandé.</p></fieldset>
        <div class="bloc"><strong>Barème de l'examen.</strong> Bonne réponse : +1 point. Mauvaise réponse : un retrait qui dépend de la gravité de l'erreur (souvent −0,25 ou −0,5). « Je ne sais pas » : 0 point.</div>
        <p id="erreur" class="note" role="alert"></p>
        <div class="boutons"><button type="submit" class="principal">Commencer</button></div>
      </form>`;
    document.getElementById("reglages").addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const r = { cm: f.getAll("cm").map(Number), cat: f.getAll("cat"), diff: f.getAll("diff").map(Number), nb: Number(f.get("nb")) };
      const items = tirer(r);
      if (!items.length) { document.getElementById("erreur").textContent = "Aucune question ne correspond à ces réglages. Élargissez la sélection."; return; }
      session = { items, i: 0, reponses: [] };
      afficherQuestion();
    });
  }

  // ------------------------------------------------------------ tirage
  function tirer(r) {
    const vues = lireVues();
    const unites = [];
    for (const ex of BASE) {
      if (!r.cat.includes(ex.categorie)) continue;
      if (!ex.cm.some(c => r.cm.includes(c))) continue;
      if (ex.type === "serie") {
        const qs = ex.questions.filter(q => r.diff.includes(q.difficulte));
        if (!qs.length) continue;
        unites.push({ cle: ex.id, questions: ex.questions.map(q => Object.assign({ serie: ex, categorie: ex.categorie, cm: ex.cm }, q)) });
      } else if (r.diff.includes(ex.difficulte)) {
        unites.push({ cle: ex.id, questions: [ex] });
      }
    }
    const triees = melanger(unites).sort((a, b) => (vues[a.cle] || 0) - (vues[b.cle] || 0));
    const choisies = [];
    let n = 0;
    for (const u of triees) {
      if (n >= r.nb) break;
      if (n > 0 && n + u.questions.length > r.nb + 4) continue;
      choisies.push(u); n += u.questions.length;
    }
    // séries groupées, questions isolées mélangées autour
    return melanger(choisies).flatMap(u => u.questions.map(q => Object.assign({}, q, { options: melanger(q.options) })));
  }

  // ------------------------------------------------------------ question
  function afficherQuestion() {
    const q = session.items[session.i], total = session.items.length;
    const etude = q.serie ? `
      <div class="bloc etude">
        ${session.i > 0 && session.items[session.i - 1].serie === q.serie
          ? `<details><summary>Revoir l'étude : ${esc(q.serie.etude.titre)}</summary>${q.serie.etude_html}</details>`
          : q.serie.etude_html}
      </div>` : "";
    app.innerHTML = `
      <div class="progression"><span>Question ${session.i + 1} / ${total}</span><span>${scoreCourant()}</span></div>
      <div class="barre"><div style="width:${100 * session.i / total}%"></div></div>
      <div class="etiquettes"><span>${NOMS_CAT[q.categorie]}</span><span>CM ${q.cm.join(", ")}</span><span>${["", "Facile", "Moyenne", "Difficile"][q.difficulte]}</span></div>
      ${etude}
      <div class="enonce">${q.question_html}</div>
      <form id="qcm">
        ${q.options.map((o, k) => `
          <label class="option" data-k="${k}">
            <input type="radio" name="rep" value="${k}">
            <span class="lettre">${LETTRES[k]}</span><span>${o.texte_html}</span>
          </label>`).join("")}
        <div class="boutons">
          <button type="submit" class="principal" id="valider" disabled>Valider</button>
          <button type="button" class="secondaire" id="passer">Je ne sais pas</button>
        </div>
      </form>
      <div id="retour"></div>`;
    const form = document.getElementById("qcm");
    form.addEventListener("change", () => { document.getElementById("valider").disabled = false; });
    form.addEventListener("submit", ev => { ev.preventDefault(); corriger(Number(new FormData(form).get("rep"))); });
    document.getElementById("passer").addEventListener("click", () => corriger(null));
    window.scrollTo(0, 0);
  }

  function corriger(k) {
    const q = session.items[session.i];
    const bonne = q.options.findIndex(o => o.score === 100);
    const points = k === null ? 0 : q.options[k].score / 100;
    session.reponses.push({ q, k, points });
    const vues = lireVues(); const cle = q.serie ? q.serie.id : q.id;
    vues[cle] = (vues[cle] || 0) + (q.serie ? 1 / q.serie.questions.length : 1); ecrireVues(vues);

    document.querySelectorAll(".option").forEach(el => {
      const j = Number(el.dataset.k);
      el.classList.add("verrouillee");
      el.querySelector("input").disabled = true;
      if (j === bonne) el.classList.add("juste");
      else if (j === k) el.classList.add("fausse");
    });
    const classe = k === null ? "neutre" : (k === bonne ? "ok" : "ko");
    const titre = k === null ? "Pas de réponse" : (k === bonne ? "Bonne réponse" : "Mauvaise réponse");
    let corps = "";
    if (k !== null) corps += `<div>${q.options[k].feedback_html}</div>`;
    if (k !== bonne) corps += `<p><strong>La bonne réponse était ${LETTRES[bonne]}.</strong></p><div>${q.options[bonne].feedback_html}</div>`;
    const dernier = session.i === session.items.length - 1;
    document.getElementById("retour").innerHTML = `
      <div class="retour ${classe}">
        <p><strong>${titre}</strong> · <span class="points">${fmtPoints(points)} point${Math.abs(points) > 1 ? "s" : ""}</span></p>
        ${corps}
        ${q.feedback_general_html ? `<div class="general"><strong>À retenir.</strong> ${q.feedback_general_html}</div>` : ""}
      </div>
      <div class="boutons"><button class="principal" id="suite">${dernier ? "Voir le bilan" : "Question suivante"}</button></div>`;
    document.querySelectorAll("#qcm .boutons button").forEach(b => b.remove());
    const suite = document.getElementById("suite");
    suite.addEventListener("click", () => { session.i++; dernier ? bilan() : afficherQuestion(); });
    suite.focus();
  }

  function scoreCourant() {
    const s = session.reponses.reduce((a, r) => a + r.points, 0);
    return session.reponses.length ? `Score : ${fmtPoints(s).replace("+", "")} / ${session.reponses.length}` : "";
  }

  // ------------------------------------------------------------ bilan
  function bilan() {
    const R = session.reponses, n = R.length;
    const total = R.reduce((a, r) => a + r.points, 0);
    const sur20 = Math.max(0, 20 * total / n);
    const groupes = {};
    for (const r of R) {
      const g = NOMS_CAT[r.q.categorie];
      groupes[g] = groupes[g] || { n: 0, justes: 0, pts: 0 };
      groupes[g].n++; groupes[g].pts += r.points;
      if (r.points === 1) groupes[g].justes++;
    }
    const ratees = R.filter(r => r.points < 1);
    app.innerHTML = `
      <h2>Bilan</h2>
      <div class="score">${fmtPoints(total).replace("+", "")} / ${n}</div>
      <p>Soit ${sur20.toFixed(1).replace(".", ",")} / 20 avec le barème de l'examen. ${R.filter(r => r.points === 1).length} bonne(s) réponse(s), ${R.filter(r => r.k === null).length} « je ne sais pas ».</p>
      <table class="bilan"><tr><th>Type</th><th class="n" style="text-align:right">Questions</th><th style="text-align:right">Justes</th><th style="text-align:right">Points</th></tr>
        ${Object.entries(groupes).map(([g, v]) => `<tr><td>${g}</td><td class="n">${v.n}</td><td class="n">${v.justes}</td><td class="n">${fmtPoints(v.pts).replace("+", "")}</td></tr>`).join("")}
      </table>
      ${ratees.length ? `<h2>À revoir</h2><ul class="revoir">${ratees.map(r =>
        `<li>${r.q.question_texte} <span class="note">(CM ${r.q.cm.join(", ")})</span></li>`).join("")}</ul>` : "<p>Aucune erreur : bravo !</p>"}
      <div class="boutons"><button class="principal" id="encore">Nouvelle série</button></div>`;
    document.getElementById("encore").addEventListener("click", accueil);
    window.scrollTo(0, 0);
  }

  accueil();
})();
</script>
</body>
</html>
