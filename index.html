p>C'est la fréquence cumulée de la médiane (environ 430 ms), pas de 500 ms.<\/p>"}, {"texte_html": "Environ 25 %", "score": -30.0, "feedback_html": "<p>C'est la part des participants qui répondent en plus de 500 ms.<\/p>"}, {"texte_html": "500 ms", "score": -50.0, "feedback_html": "<p>500 ms est la valeur de départ ; la question demande une part.<\/p>"}]}, {"id": "C-CM3-001", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?<\/p>", "question_texte": "Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?", "feedback_general_html": "<p>Indices robustes (peu sensibles aux valeurs extrêmes) : médiane, écart interquartile. Indices non robustes : moyenne, écart-type et surtout étendue.<\/p>", "options": [{"texte_html": "La moyenne et l'écart-type", "score": 100.0, "feedback_html": "<p>Exact. Ces deux indices ne sont pas robustes. Chaque valeur pèse selon sa distance au centre, et 40 est très loin.<\/p>"}, {"texte_html": "La médiane et l'écart interquartile", "score": -50.0, "feedback_html": "<p>C'est l'inverse. La médiane et l'EIQ ne dépendent que du rang des valeurs. Un individu de plus, même très extrême, les déplace à peine.<\/p>"}, {"texte_html": "La médiane et l'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type bouge, oui. Mais la médiane est robuste : elle ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La moyenne et l'écart interquartile", "score": -30.0, "feedback_html": "<p>La moyenne bouge, oui. Mais l'EIQ est robuste : il ignore les 25 % les plus bas et les 25 % les plus hauts.<\/p>"}]}, {"id": "C-CM3-002", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Une distribution présente deux sommets nettement séparés. Comment la qualifie-t-on, et que suggère-t-elle souvent ?<\/p>", "question_texte": "Une distribution présente deux sommets nettement séparés. Comment la qualifie-t-on, et que suggère-t-elle souvent ?", "feedback_general_html": "<p>Une distribution à deux sommets est dite bimodale. Elle suggère souvent deux groupes mélangés ; un seul indice de position la décrit mal.<\/p>", "options": [{"texte_html": "Elle est bimodale ; elle suggère souvent deux groupes mélangés.", "score": 100.0, "feedback_html": "<p>Exact. Deux sommets indiquent souvent deux sous-groupes aux valeurs typiques différentes (par exemple deux filières, deux tranches d'âge).<\/p>"}, {"texte_html": "Elle est bimodale ; elle suggère une erreur de mesure.", "score": -20.0, "feedback_html": "<p>Le mot « bimodale » est juste, mais deux sommets ne signalent pas une erreur : ils traduisent le plus souvent deux groupes mélangés.<\/p>"}, {"texte_html": "Elle est symétrique ; la moyenne se trouve entre les deux sommets.", "score": -30.0, "feedback_html": "<p>Une distribution bimodale peut être symétrique ou non ; l'essentiel est qu'elle a deux sommets, que la moyenne ne décrit pas.<\/p>"}, {"texte_html": "Elle n'a pas de mode, puisqu'aucune valeur ne domine.", "score": -50.0, "feedback_html": "<p>Au contraire : chaque sommet est un mode. La distribution en a deux.<\/p>"}]}, {"id": "C-CM3-004", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Cinq participants ont rappelé 2, 9, 4, 6 et 14 mots. Quelle est la médiane ?<\/p>", "question_texte": "Cinq participants ont rappelé 2, 9, 4, 6 et 14 mots. Quelle est la médiane ?", "feedback_general_html": "<p>Pour trouver la médiane, on range d'abord les valeurs, puis on prend celle du milieu.<\/p>", "options": [{"texte_html": "6", "score": 100.0, "feedback_html": "<p>Exact. On range les valeurs : 2, 4, 6, 9, 14. La valeur du milieu (la 3e sur 5) est 6.<\/p>"}, {"texte_html": "4 (la valeur du milieu de la liste, sans la ranger)", "score": -20.0, "feedback_html": "<p>Il faut d'abord ranger les valeurs dans l'ordre croissant : 2, 4, 6, 9, 14.<\/p>"}, {"texte_html": "7 (la moyenne)", "score": -30.0, "feedback_html": "<p>7 = 35 / 5 est la moyenne, pas la médiane.<\/p>"}, {"texte_html": "8 (le milieu entre 2 et 14)", "score": -50.0, "feedback_html": "<p>C'est le milieu de l'étendue ; il ne dépend que du minimum et du maximum.<\/p>"}]}, {"id": "C-CM3-007", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Une échelle d'accord va de « pas du tout d'accord » (1) à « tout à fait d'accord » (5). D'après le cours, quel paramètre de position est le plus adapté ?<\/p>", "question_texte": "Une échelle d'accord va de « pas du tout d'accord » (1) à « tout à fait d'accord » (5). D'après le cours, quel paramètre de position est le plus adapté ?", "feedback_general_html": "<p>Variable ordinale : la médiane est le paramètre de position adapté ; la moyenne est un choix discuté.<\/p>", "options": [{"texte_html": "La médiane", "score": 100.0, "feedback_html": "<p>Exact. La variable est ordinale : on peut ranger les réponses, mais rien ne garantit que les écarts entre modalités sont égaux.<\/p>"}, {"texte_html": "La moyenne", "score": -20.0, "feedback_html": "<p>On la voit souvent, mais elle suppose des écarts égaux entre « pas du tout », « plutôt pas », etc. C'est un choix discuté.<\/p>"}, {"texte_html": "L'étendue", "score": -30.0, "feedback_html": "<p>L'étendue est un paramètre de dispersion, pas de position.<\/p>"}, {"texte_html": "L'écart-type", "score": -50.0, "feedback_html": "<p>L'écart-type est un paramètre de dispersion, et il suppose une variable numérique.<\/p>"}]}, {"id": "C-CM3-008", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Un indice est dit robuste quand…<\/p>", "question_texte": "Un indice est dit robuste quand…", "feedback_general_html": "<p>Robuste = peu sensible aux valeurs extrêmes. Médiane et écart interquartile sont robustes.<\/p>", "options": [{"texte_html": "il est peu sensible aux valeurs extrêmes.", "score": 100.0, "feedback_html": "<p>Exact. La médiane et l'écart interquartile sont robustes ; la moyenne, l'écart-type et surtout l'étendue ne le sont pas.<\/p>"}, {"texte_html": "il ne change jamais, même si l'on ajoute des individus.", "score": -20.0, "feedback_html": "<p>Un indice robuste peut changer un peu ; il ne se laisse simplement pas entraîner par quelques valeurs extrêmes.<\/p>"}, {"texte_html": "il est facile à calculer.", "score": -30.0, "feedback_html": "<p>La robustesse ne dit rien de la facilité de calcul.<\/p>"}, {"texte_html": "il utilise toutes les valeurs avec le même poids.", "score": -50.0, "feedback_html": "<p>C'est presque l'inverse : la moyenne utilise toutes les valeurs, et chaque valeur pèse selon sa distance au centre. C'est pour cela qu'elle n'est pas robuste.<\/p>"}]}, {"id": "C-CM3-010", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Les scores d'un questionnaire vont de 3 à 41. Quelle est l'étendue ?<\/p>", "question_texte": "Les scores d'un questionnaire vont de 3 à 41. Quelle est l'étendue ?", "feedback_general_html": "<p>Étendue = valeur maximale − valeur minimale.<\/p>", "options": [{"texte_html": "38", "score": 100.0, "feedback_html": "<p>Exact. Étendue = maximum − minimum = 41 − 3 = 38.<\/p>"}, {"texte_html": "41", "score": -20.0, "feedback_html": "<p>41 est le maximum. Il faut lui retirer le minimum.<\/p>"}, {"texte_html": "22", "score": -30.0, "feedback_html": "<p>22 est le milieu entre 3 et 41, pas l'étendue.<\/p>"}, {"texte_html": "44", "score": -50.0, "feedback_html": "<p>On a additionné le minimum et le maximum ; il faut les soustraire.<\/p>"}]}, {"id": "C-CM3-013", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>D'après la même boîte à moustaches, quelle part des étudiants a un score compris entre 12 et 22 ?<\/p><p><img src=\"images/cm3_boite_anxiete.png\" alt=\"Boîte à moustaches du score d&#x27;anxiété de 250 étudiants\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "D'après la même boîte à moustaches, quelle part des étudiants a un score compris entre 12 et 22 ?", "feedback_general_html": "<p>La boîte va de Q1 à Q3 : elle contient la moitié centrale des individus.<\/p>", "options": [{"texte_html": "Environ 50 %", "score": 100.0, "feedback_html": "<p>Exact. 12 et 22 sont Q1 et Q3 : la boîte contient la moitié centrale des étudiants.<\/p>"}, {"texte_html": "Environ 75 %", "score": -20.0, "feedback_html": "<p>75 % des étudiants ont un score de 22 ou moins (Q3). Entre Q1 et Q3, il y en a la moitié.<\/p>"}, {"texte_html": "Environ 25 %", "score": -30.0, "feedback_html": "<p>Chaque quart va d'un quartile au suivant. Entre Q1 et Q3, il y a deux quarts, soit la moitié.<\/p>"}, {"texte_html": "Environ 10 %", "score": -50.0, "feedback_html": "<p>10 est l'écart interquartile, en points de score, pas une part des étudiants.<\/p>"}]}, {"id": "C-CM3-014", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Des temps de réaction, mesurés en millisecondes, ont une variance de 2 500. Quel est leur écart-type ?<\/p>", "question_texte": "Des temps de réaction, mesurés en millisecondes, ont une variance de 2 500. Quel est leur écart-type ?", "feedback_general_html": "<p>Écart-type = √variance. La variance est en unité², l'écart-type dans l'unité de la variable.<\/p>", "options": [{"texte_html": "50 ms", "score": 100.0, "feedback_html": "<p>Exact. L'écart-type est la racine carrée de la variance : √2 500 = 50, dans l'unité de la variable.<\/p>"}, {"texte_html": "50 ms²", "score": -20.0, "feedback_html": "<p>La valeur est juste, mais l'unité ne l'est pas : c'est la variance qui s'exprime en ms² ; l'écart-type revient en ms.<\/p>"}, {"texte_html": "1 250 ms", "score": -30.0, "feedback_html": "<p>On a divisé par 2 ; il faut prendre la racine carrée.<\/p>"}, {"texte_html": "6 250 000 ms", "score": -50.0, "feedback_html": "<p>On a élevé au carré au lieu de prendre la racine carrée.<\/p>"}]}, {"id": "C-CM3-016", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Un enseignant ajoute 5 points à toutes les notes d'un examen. Que deviennent la moyenne et l'écart-type ?<\/p>", "question_texte": "Un enseignant ajoute 5 points à toutes les notes d'un examen. Que deviennent la moyenne et l'écart-type ?", "feedback_general_html": "<p>Ajouter une constante déplace la position et ne change pas la dispersion.<\/p>", "options": [{"texte_html": "La moyenne augmente de 5 ; l'écart-type ne change pas.", "score": 100.0, "feedback_html": "<p>Exact. La distribution se déplace d'un bloc : la position change, les écarts entre les notes restent les mêmes.<\/p>"}, {"texte_html": "La moyenne et l'écart-type augmentent tous deux de 5.", "score": -20.0, "feedback_html": "<p>La moyenne augmente bien de 5. Mais les écarts à la moyenne sont inchangés : l'écart-type ne bouge pas.<\/p>"}, {"texte_html": "La moyenne ne change pas ; l'écart-type augmente de 5.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : ajouter une constante déplace la position, pas la dispersion.<\/p>"}, {"texte_html": "Ni la moyenne ni l'écart-type ne changent.", "score": -50.0, "feedback_html": "<p>Toutes les notes augmentent de 5 : leur moyenne aussi.<\/p>"}]}, {"id": "C-CM3-019", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>Classez ces trois indices de dispersion du moins robuste au plus robuste.<\/p>", "question_texte": "Classez ces trois indices de dispersion du moins robuste au plus robuste.", "feedback_general_html": "<p>Sur les répétitions du cours, retirer deux suites extrêmes fait passer l'étendue de 23 à 13, l'écart-type de 2,66 à 2,34, et laisse l'EIQ à 3.<\/p>", "options": [{"texte_html": "Étendue, écart-type, écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. L'étendue ne dépend que des deux valeurs extrêmes ; l'écart-type utilise toutes les valeurs, les grands écarts pesant beaucoup ; l'écart interquartile ignore les 25 % les plus bas et les 25 % les plus hauts.<\/p>"}, {"texte_html": "Écart-type, étendue, écart interquartile", "score": -20.0, "feedback_html": "<p>L'écart interquartile est bien le plus robuste, mais l'étendue est encore moins robuste que l'écart-type : elle ne dépend que du minimum et du maximum.<\/p>"}, {"texte_html": "Étendue, écart interquartile, écart-type", "score": -30.0, "feedback_html": "<p>L'étendue est bien la moins robuste, mais l'écart interquartile est plus robuste que l'écart-type, qui est sensible aux valeurs extrêmes.<\/p>"}, {"texte_html": "Écart interquartile, écart-type, étendue", "score": -50.0, "feedback_html": "<p>C'est l'ordre inverse : l'écart interquartile est le plus robuste, l'étendue la moins robuste.<\/p>"}]}, {"id": "C-CM3-021", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Les deux groupes ci-dessous ont la même moyenne (20). Quelle affirmation est correcte ?<\/p><p><img src=\"images/cm3_deux_dispersions.png\" alt=\"Deux courbes centrées sur 20 : A resserrée, B étalée\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Les deux groupes ci-dessous ont la même moyenne (20). Quelle affirmation est correcte ?", "feedback_general_html": "<p>Même position ne veut pas dire même dispersion. Une distribution plus étalée a un écart-type plus grand.<\/p>", "options": [{"texte_html": "Le groupe B a l'écart-type le plus grand : ses scores s'écartent davantage de 20.", "score": 100.0, "feedback_html": "<p>Exact. La courbe de B est plus étalée : ses valeurs sont plus loin de la moyenne.<\/p>"}, {"texte_html": "Les deux groupes ont la même dispersion, puisqu'ils ont la même moyenne.", "score": -20.0, "feedback_html": "<p>Position et dispersion sont deux choses différentes : on peut avoir la même moyenne et des dispersions très différentes.<\/p>"}, {"texte_html": "On ne peut rien dire sans connaître la médiane.", "score": -30.0, "feedback_html": "<p>La médiane est un paramètre de position ; l'étalement des courbes suffit pour comparer les dispersions.<\/p>"}, {"texte_html": "Le groupe A a l'écart-type le plus grand, puisque sa courbe est plus haute.", "score": -50.0, "feedback_html": "<p>Une courbe plus haute est plus resserrée : les valeurs sont concentrées autour de 20. L'écart-type de A est le plus petit.<\/p>"}]}, {"id": "C-CM3-022", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans une boîte à moustaches, la boîte elle-même contient…<\/p>", "question_texte": "Dans une boîte à moustaches, la boîte elle-même contient…", "feedback_general_html": "<p>Boîte : de Q1 à Q3 (moitié centrale), trait à la médiane. Moustaches : jusqu'aux valeurs pas trop éloignées. Au-delà : points isolés.<\/p>", "options": [{"texte_html": "la moitié centrale des individus, du premier au troisième quartile.", "score": 100.0, "feedback_html": "<p>Exact. La boîte va de Q1 à Q3, avec un trait à la médiane.<\/p>"}, {"texte_html": "environ les trois quarts des individus, du minimum au troisième quartile.", "score": -20.0, "feedback_html": "<p>La boîte commence au premier quartile, pas au minimum. Entre Q1 et Q3, il y a la moitié des individus.<\/p>"}, {"texte_html": "tous les individus, sauf les points isolés.", "score": -30.0, "feedback_html": "<p>Ceux-là sont couverts par la boîte et les moustaches réunies ; la boîte seule n'en contient que la moitié.<\/p>"}, {"texte_html": "les individus situés autour de la moyenne.", "score": -50.0, "feedback_html": "<p>La boîte est construite avec les quartiles ; la moyenne n'y apparaît pas.<\/p>"}]}, {"id": "C-CM3-024", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Le poids de nouveau-nés est mesuré en grammes. Dans quelle unité s'expriment la variance et l'écart-type de ce poids ?<\/p>", "question_texte": "Le poids de nouveau-nés est mesuré en grammes. Dans quelle unité s'expriment la variance et l'écart-type de ce poids ?", "feedback_general_html": "<p>La variance s'exprime dans l'unité de la variable au carré ; l'écart-type dans l'unité de la variable. C'est pour cela qu'on interprète l'écart-type.<\/p>", "options": [{"texte_html": "La variance en grammes au carré (g²), l'écart-type en grammes (g).", "score": 100.0, "feedback_html": "<p>Exact. La variance est une moyenne d'écarts élevés au carré ; l'écart-type, sa racine, revient à l'unité de la variable.<\/p>"}, {"texte_html": "Toutes deux en grammes (g).", "score": -20.0, "feedback_html": "<p>C'est vrai de l'écart-type, pas de la variance : élever les écarts au carré élève aussi l'unité au carré.<\/p>"}, {"texte_html": "La variance en grammes (g), l'écart-type en grammes au carré (g²).", "score": -30.0, "feedback_html": "<p>C'est l'inverse : la variance est en g², et l'écart-type, sa racine carrée, en g.<\/p>"}, {"texte_html": "Ni l'une ni l'autre n'a d'unité.", "score": -50.0, "feedback_html": "<p>Les deux ont une unité, liée à celle de la variable : g² pour la variance, g pour l'écart-type.<\/p>"}]}, {"id": "C-CM4-001", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?<\/p>", "question_texte": "Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?", "feedback_general_html": "<p>Moyen mnémotechnique : la moyenne est tirée du côté de la queue. Asymétrie à gauche : moyenne &lt; médiane &lt; mode. Asymétrie à droite : mode &lt; médiane &lt; moyenne.<\/p>", "options": [{"texte_html": "Asymétrique à gauche", "score": 100.0, "feedback_html": "<p>Exact. Moyenne &lt; médiane &lt; mode. La moyenne est tirée vers les petites valeurs : la queue de la distribution est à gauche.<\/p>"}, {"texte_html": "Asymétrique à droite", "score": -20.0, "feedback_html": "<p>Le sommet (le mode) est à droite, mais l'asymétrie se nomme du côté de la queue, pas du côté du sommet. Ici, la queue est à gauche.<\/p>"}, {"texte_html": "Symétrique", "score": -30.0, "feedback_html": "<p>Dans une distribution symétrique, mode, médiane et moyenne sont confondus ou très proches. Ici, ils s'étalent de 8 à 12.<\/p>"}, {"texte_html": "Bimodale", "score": -50.0, "feedback_html": "<p>L'énoncé précise que la distribution est unimodale. L'ordre des trois indices renseigne sur l'asymétrie, pas sur le nombre de sommets.<\/p>"}]}, {"id": "C-CM4-002", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Une distribution qui présente trois sommets nettement séparés est dite…<\/p>", "question_texte": "Une distribution qui présente trois sommets nettement séparés est dite…", "feedback_general_html": "<p>Unimodale : un sommet. Bimodale : deux. Multimodale : plus de deux.<\/p>", "options": [{"texte_html": "multimodale", "score": 100.0, "feedback_html": "<p>Exact. Au-delà de deux sommets, on parle de distribution multimodale.<\/p>"}, {"texte_html": "bimodale", "score": -20.0, "feedback_html": "<p>Bimodale signifie deux sommets ; ici, il y en a trois.<\/p>"}, {"texte_html": "asymétrique", "score": -30.0, "feedback_html": "<p>L'asymétrie décrit l'étirement d'un côté, pas le nombre de sommets.<\/p>"}, {"texte_html": "uniforme", "score": -50.0, "feedback_html": "<p>Une distribution uniforme n'a pas de sommet : toutes les valeurs y sont aussi fréquentes.<\/p>"}]}, {"id": "C-CM4-005", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Laquelle de ces trois distributions est asymétrique à gauche (asymétrie négative) ?<\/p><p><img src=\"images/cm4_trois_formes.png\" alt=\"Trois histogrammes A, B et C de formes différentes\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Laquelle de ces trois distributions est asymétrique à gauche (asymétrie négative) ?", "feedback_general_html": "<p>On nomme l'asymétrie du côté de la queue.<\/p>", "options": [{"texte_html": "A", "score": 100.0, "feedback_html": "<p>Exact. Le sommet de A est à droite et sa queue s'étire vers la gauche.<\/p>"}, {"texte_html": "B", "score": -20.0, "feedback_html": "<p>B a son sommet à gauche, mais sa queue s'étire vers la droite : elle est asymétrique à droite.<\/p>"}, {"texte_html": "C", "score": -30.0, "feedback_html": "<p>C est à peu près symétrique.<\/p>"}, {"texte_html": "Aucune", "score": -50.0, "feedback_html": "<p>A est nettement asymétrique à gauche.<\/p>"}]}, {"id": "C-CM4-006", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Pour une distribution unimodale asymétrique à droite (positive), dans quel ordre trouve-t-on en général le mode, la médiane et la moyenne ?<\/p>", "question_texte": "Pour une distribution unimodale asymétrique à droite (positive), dans quel ordre trouve-t-on en général le mode, la médiane et la moyenne ?", "feedback_general_html": "<p>Asymétrie à droite : mode &lt; médiane &lt; moyenne. Asymétrie à gauche : moyenne &lt; médiane &lt; mode.<\/p>", "options": [{"texte_html": "Mode &lt; médiane &lt; moyenne", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est tirée du côté de la queue, donc vers les grandes valeurs ; le mode reste au sommet.<\/p>"}, {"texte_html": "Mode &lt; moyenne &lt; médiane", "score": -20.0, "feedback_html": "<p>Le mode est bien le plus petit, mais la moyenne, tirée par la queue, dépasse la médiane.<\/p>"}, {"texte_html": "Moyenne &lt; médiane &lt; mode", "score": -30.0, "feedback_html": "<p>C'est l'ordre d'une asymétrie à gauche.<\/p>"}, {"texte_html": "Ils sont égaux.", "score": -50.0, "feedback_html": "<p>Ils sont égaux (ou presque) seulement pour une distribution symétrique.<\/p>"}]}, {"id": "C-CM4-007", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Le coefficient d'asymétrie d'un score vaut −1,6. Que peut-on en dire ?<\/p>", "question_texte": "Le coefficient d'asymétrie d'un score vaut −1,6. Que peut-on en dire ?", "feedback_general_html": "<p>Coefficient d'asymétrie : proche de 0, symétrique ; positif, à droite ; négatif, à gauche ; au-delà de 1 en valeur absolue, asymétrie nette.<\/p>", "options": [{"texte_html": "La distribution est nettement asymétrique à gauche.", "score": 100.0, "feedback_html": "<p>Exact. Négatif : asymétrie à gauche ; au-delà de 1 en valeur absolue : asymétrie nette.<\/p>"}, {"texte_html": "La distribution est légèrement asymétrique à gauche.", "score": -20.0, "feedback_html": "<p>Le sens est juste, mais −1,6 dépasse −1 : l'asymétrie est nette.<\/p>"}, {"texte_html": "La distribution est nettement asymétrique à droite.", "score": -30.0, "feedback_html": "<p>Un coefficient positif indiquerait une asymétrie à droite ; ici, il est négatif.<\/p>"}, {"texte_html": "La distribution est symétrique.", "score": -50.0, "feedback_html": "<p>Une distribution symétrique a un coefficient proche de 0.<\/p>"}]}, {"id": "C-CM4-009", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>La distribution A ci-dessous est normale. Que peut-on dire de la distribution B ?<\/p>", "question_texte": "La distribution A ci-dessous est normale. Que peut-on dire de la distribution B ?", "feedback_general_html": "<p>Aplatissement : 0 pour une loi normale ; positif pour des queues plus lourdes ; négatif pour des queues plus légères.<\/p>", "options": [{"texte_html": "Ses queues sont plus lourdes : son coefficient d'aplatissement est positif.", "score": 100.0, "feedback_html": "<p>Exact. B a plus de valeurs très éloignées du centre (et un pic plus marqué) qu'une loi normale de même écart-type.<\/p>"}, {"texte_html": "Ses queues sont plus lourdes : son coefficient d'aplatissement est négatif.", "score": -20.0, "feedback_html": "<p>Le constat est juste, mais le signe est faux : des queues plus lourdes donnent un coefficient positif.<\/p>"}, {"texte_html": "Ses queues sont plus légères : son coefficient d'aplatissement est négatif.", "score": -30.0, "feedback_html": "<p>Loin du centre, la courbe de B reste au-dessus de celle de A : ses queues sont plus lourdes.<\/p>"}, {"texte_html": "Elle est plus asymétrique que A.", "score": -50.0, "feedback_html": "<p>Les deux courbes sont symétriques ; elles diffèrent par le poids des queues.<\/p>"}]}, {"id": "C-CM4-010", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans Jamovi, un coefficient d'aplatissement proche de 0 signifie que…<\/p>", "question_texte": "Dans Jamovi, un coefficient d'aplatissement proche de 0 signifie que…", "feedback_general_html": "<p>Le coefficient d'aplatissement mesure le poids des queues par rapport à une loi normale.<\/p>", "options": [{"texte_html": "les queues de la distribution ont un poids comparable à celles d'une loi normale.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient compare le poids des queues à celui d'une loi normale, pour laquelle il vaut 0.<\/p>"}, {"texte_html": "la distribution est symétrique.", "score": -20.0, "feedback_html": "<p>La symétrie se lit sur le coefficient d'asymétrie, pas sur celui d'aplatissement.<\/p>"}, {"texte_html": "aucune valeur n'est éloignée du centre.", "score": -30.0, "feedback_html": "<p>Même une loi normale a des valeurs éloignées du centre, en proportion connue.<\/p>"}, {"texte_html": "la distribution est plate, sans sommet.", "score": -50.0, "feedback_html": "<p>Malgré son nom, le coefficient mesure surtout le poids des queues, pas l'absence de sommet.<\/p>"}]}, {"id": "C-CM4-013", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Dans une boîte à moustaches, les points isolés représentent…<\/p>", "question_texte": "Dans une boîte à moustaches, les points isolés représentent…", "feedback_general_html": "<p>Points isolés de la boîte = valeurs atypiques selon la règle de Tukey.<\/p>", "options": [{"texte_html": "les valeurs situées au-delà des bornes de Tukey.", "score": 100.0, "feedback_html": "<p>Exact. Les moustaches s'arrêtent à la dernière valeur qui respecte ces bornes ; au-delà, chaque valeur est un point.<\/p>"}, {"texte_html": "les 5 % de valeurs les plus extrêmes.", "score": -20.0, "feedback_html": "<p>Le nombre de points isolés dépend de la distribution : il peut n'y en avoir aucun, ou beaucoup.<\/p>"}, {"texte_html": "les valeurs situées à plus de deux écarts-types de la moyenne.", "score": -30.0, "feedback_html": "<p>La boîte à moustaches est construite avec les quartiles, pas avec la moyenne et l'écart-type.<\/p>"}, {"texte_html": "des erreurs de saisie, à supprimer.", "score": -50.0, "feedback_html": "<p>Une valeur atypique peut être tout à fait réelle : on la vérifie avant toute décision.<\/p>"}]}, {"id": "C-CM4-015", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Pour le nombre de répétitions, Q1 = 4 et Q3 = 7. Un étudiant a produit 12 répétitions. Est-ce une valeur atypique selon Tukey ?<\/p>", "question_texte": "Pour le nombre de répétitions, Q1 = 4 et Q3 = 7. Un étudiant a produit 12 répétitions. Est-ce une valeur atypique selon Tukey ?", "feedback_general_html": "<p>Borne haute de Tukey = Q3 + 1,5 × EIQ.<\/p>", "options": [{"texte_html": "Oui : 12 dépasse 7 + 1,5 × 3 = 11,5.", "score": 100.0, "feedback_html": "<p>Exact. C'est l'un des quatre points isolés de la boîte des répétitions.<\/p>"}, {"texte_html": "Non : 12 est inférieur à 7 + 2 × 3 = 13.", "score": -20.0, "feedback_html": "<p>Le principe est bon, mais la règle utilise 1,5 × EIQ, pas 2 × EIQ.<\/p>"}, {"texte_html": "Non : seules les valeurs supérieures à 20 sont atypiques.", "score": -30.0, "feedback_html": "<p>La borne se calcule à partir des quartiles : ici, 11,5.<\/p>"}, {"texte_html": "On ne peut pas le savoir sans la moyenne.", "score": -50.0, "feedback_html": "<p>La règle de Tukey n'utilise que les quartiles.<\/p>"}]}, {"id": "C-CM4-016", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Dans une loi normale…<\/p>", "question_texte": "Dans une loi normale…", "feedback_general_html": "<p>Loi normale : un sommet, symétrique, mode = médiane = moyenne, queues qui s'amincissent vite.<\/p>", "options": [{"texte_html": "le mode, la médiane et la moyenne sont confondus.", "score": 100.0, "feedback_html": "<p>Exact. La loi normale est parfaitement symétrique et n'a qu'un sommet.<\/p>"}, {"texte_html": "la moyenne est légèrement supérieure à la médiane.", "score": -20.0, "feedback_html": "<p>Ce serait le cas d'une distribution asymétrique à droite.<\/p>"}, {"texte_html": "il y a deux sommets, de part et d'autre de la moyenne.", "score": -30.0, "feedback_html": "<p>La loi normale n'a qu'un sommet, à la moyenne.<\/p>"}, {"texte_html": "les queues sont plus lourdes que dans les autres distributions.", "score": -50.0, "feedback_html": "<p>Au contraire, ses queues s'amincissent très vite ; elle sert de référence pour l'aplatissement.<\/p>"}]}, {"id": "C-CM4-017", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Quels nombres suffisent à décrire entièrement une loi normale ?<\/p>", "question_texte": "Quels nombres suffisent à décrire entièrement une loi normale ?", "feedback_general_html": "<p>Connaître la moyenne et l'écart-type d'une loi normale, c'est connaître toute la distribution.<\/p>", "options": [{"texte_html": "Sa moyenne et son écart-type", "score": 100.0, "feedback_html": "<p>Exact. La moyenne fixe la position du sommet, l'écart-type la largeur de la cloche.<\/p>"}, {"texte_html": "Sa médiane et son écart interquartile", "score": -20.0, "feedback_html": "<p>La médiane donne bien la position (elle est égale à la moyenne), mais la loi normale est définie par sa moyenne et son écart-type.<\/p>"}, {"texte_html": "Sa moyenne et son coefficient d'asymétrie", "score": -30.0, "feedback_html": "<p>L'asymétrie d'une loi normale vaut toujours 0 : elle n'apporte rien.<\/p>"}, {"texte_html": "Son minimum et son maximum", "score": -50.0, "feedback_html": "<p>Une loi normale n'a ni minimum ni maximum : ses queues s'étendent indéfiniment.<\/p>"}]}, {"id": "C-CM4-019", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec la même loi (moyenne 100, écart-type 15), quelle part de la population a un QI supérieur à 130 ?<\/p>", "question_texte": "Avec la même loi (moyenne 100, écart-type 15), quelle part de la population a un QI supérieur à 130 ?", "feedback_general_html": "<p>Par symétrie, ce qui est hors de l'intervalle se répartit à moitié de chaque côté.<\/p>", "options": [{"texte_html": "Environ 2,5 %", "score": 100.0, "feedback_html": "<p>Exact. 95 % sont entre 70 et 130, donc 5 % en dehors, partagés également : 2,5 % au-dessus de 130.<\/p>"}, {"texte_html": "Environ 5 %", "score": -20.0, "feedback_html": "<p>5 % est la part en dehors de 70-130, des deux côtés réunis.<\/p>"}, {"texte_html": "Environ 16 %", "score": -30.0, "feedback_html": "<p>16 % est la part au-dessus de 115 (un écart-type).<\/p>"}, {"texte_html": "Environ 30 %", "score": -50.0, "feedback_html": "<p>Ce chiffre ne correspond à aucune lecture de la règle.<\/p>"}]}, {"id": "C-CM4-021", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Une variable a pour moyenne 20 et pour écart-type 4. Quel est le score z d'un individu qui a obtenu 26 ?<\/p>", "question_texte": "Une variable a pour moyenne 20 et pour écart-type 4. Quel est le score z d'un individu qui a obtenu 26 ?", "feedback_general_html": "<p>z = (x − moyenne) / écart-type.<\/p>", "options": [{"texte_html": "1,5", "score": 100.0, "feedback_html": "<p>Exact. z = (26 − 20) / 4 = 1,5.<\/p>"}, {"texte_html": "6", "score": -20.0, "feedback_html": "<p>6 est l'écart brut à la moyenne ; il faut encore le diviser par l'écart-type.<\/p>"}, {"texte_html": "−1,5", "score": -30.0, "feedback_html": "<p>26 est au-dessus de la moyenne : le score z est positif.<\/p>"}, {"texte_html": "6,5", "score": -50.0, "feedback_html": "<p>On a divisé 26 par 4 sans retirer la moyenne.<\/p>"}]}, {"id": "C-CM4-022", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Un score z de −2 signifie que la valeur est…<\/p>", "question_texte": "Un score z de −2 signifie que la valeur est…", "feedback_general_html": "<p>Signe : de quel côté de la moyenne. Valeur : à combien d'écarts-types.<\/p>", "options": [{"texte_html": "à deux écarts-types en dessous de la moyenne.", "score": 100.0, "feedback_html": "<p>Exact. Le signe indique le côté, la valeur la distance en écarts-types.<\/p>"}, {"texte_html": "à deux points en dessous de la moyenne.", "score": -20.0, "feedback_html": "<p>Le score z se compte en écarts-types, pas dans l'unité de la variable.<\/p>"}, {"texte_html": "à deux écarts-types au-dessus de la moyenne.", "score": -30.0, "feedback_html": "<p>Un score z négatif est en dessous de la moyenne.<\/p>"}, {"texte_html": "deux fois plus petite que la moyenne.", "score": -50.0, "feedback_html": "<p>Le score z mesure une distance à la moyenne, pas un rapport.<\/p>"}]}, {"id": "C-CM4-025", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Dans quelle unité s'exprime un score z ?<\/p>", "question_texte": "Dans quelle unité s'exprime un score z ?", "feedback_general_html": "<p>Le score z est sans unité : il permet de comparer des variables différentes.<\/p>", "options": [{"texte_html": "Il n'a pas d'unité : c'est un nombre d'écarts-types.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce qui permet de comparer des variables mesurées dans des unités différentes.<\/p>"}, {"texte_html": "Dans l'unité de la variable.", "score": -20.0, "feedback_html": "<p>On divise par l'écart-type, qui est dans la même unité : l'unité disparaît.<\/p>"}, {"texte_html": "En pourcentage.", "score": -30.0, "feedback_html": "<p>Un score z n'est pas un pourcentage : il peut valoir −2 ou 3,4.<\/p>"}, {"texte_html": "Dans l'unité de la variable au carré.", "score": -50.0, "feedback_html": "<p>C'est l'unité de la variance, pas du score z.<\/p>"}]}, {"id": "C-CM5-001", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?<\/p>", "question_texte": "Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?", "feedback_general_html": "<p>Avant d'interpréter r, toujours regarder le nuage de points. r proche de 0 ne veut pas dire « aucune liaison ».<\/p>", "options": [{"texte_html": "Il n'y a presque pas de liaison linéaire, mais il peut exister une liaison d'une autre forme.", "score": 100.0, "feedback_html": "<p>Exact. r ne mesure que la liaison linéaire. Une liaison en U (performance maximale pour un stress moyen) peut donner un r proche de 0. Il faut regarder le nuage de points.<\/p>"}, {"texte_html": "Le stress n'a aucun lien avec la performance.", "score": -20.0, "feedback_html": "<p>Conclusion trop forte. Un r proche de 0 exclut seulement une liaison linéaire. Une liaison nette en forme de U peut donner r ≈ 0.<\/p>"}, {"texte_html": "Le stress a un faible effet causal sur la performance.", "score": -50.0, "feedback_html": "<p>Une corrélation ne permet pas de conclure à un effet causal, quelle que soit sa valeur.<\/p>"}, {"texte_html": "Il faudrait plutôt calculer la covariance, qui détecte les liaisons non linéaires.", "score": -30.0, "feedback_html": "<p>La covariance mesure la même chose que r (une liaison linéaire), mais dans les unités des variables. Elle ne détecte pas mieux une liaison en U.<\/p>"}]}, {"id": "C-CM5-002", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Dans un nuage de points, chaque point représente…<\/p>", "question_texte": "Dans un nuage de points, chaque point représente…", "feedback_general_html": "<p>Nuage de points : un point par individu ; un axe par variable.<\/p>", "options": [{"texte_html": "un individu, placé selon ses valeurs sur les deux variables.", "score": 100.0, "feedback_html": "<p>Exact. Abscisse : sa valeur sur la première variable ; ordonnée : sa valeur sur la seconde.<\/p>"}, {"texte_html": "une modalité de l'une des deux variables.", "score": -20.0, "feedback_html": "<p>Les deux variables sont numériques : chaque point est un individu, pas une modalité.<\/p>"}, {"texte_html": "la moyenne d'un groupe d'individus.", "score": -30.0, "feedback_html": "<p>Un nuage de points montre chaque individu séparément, sans résumer.<\/p>"}, {"texte_html": "une variable.", "score": -50.0, "feedback_html": "<p>Chaque variable correspond à un axe ; les points sont les individus.<\/p>"}]}, {"id": "C-CM5-005", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Rangez les nuages A, C et D du moins intense au plus intense (liaison linéaire).<\/p><p><img src=\"images/cm5_galerie.png\" alt=\"Quatre nuages de points A, B, C et D\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Rangez les nuages A, C et D du moins intense au plus intense (liaison linéaire).", "feedback_general_html": "<p>Plus les points sont serrés autour de la tendance, plus la liaison est intense.<\/p>", "options": [{"texte_html": "C, D, A", "score": 100.0, "feedback_html": "<p>Exact. C : aucune tendance ; D : une tendance faible, très dispersée ; A : des points serrés autour d'une droite.<\/p>"}, {"texte_html": "D, C, A", "score": -20.0, "feedback_html": "<p>A est bien le plus intense, mais C ne montre aucune tendance : c'est le moins intense.<\/p>"}, {"texte_html": "A, D, C", "score": -30.0, "feedback_html": "<p>C'est l'ordre inverse : A est le nuage le plus serré.<\/p>"}, {"texte_html": "Ils ont la même intensité, puisqu'ils ont le même nombre de points.", "score": -50.0, "feedback_html": "<p>Le nombre de points ne dit rien de l'intensité de la liaison.<\/p>"}]}, {"id": "C-CM5-006", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Pour lire un nuage de points, on regarde le sens, la forme et l'intensité. L'intensité renvoie à…<\/p>", "question_texte": "Pour lire un nuage de points, on regarde le sens, la forme et l'intensité. L'intensité renvoie à…", "feedback_general_html": "<p>Intensité : dispersion des points autour de la tendance, pas la pente.<\/p>", "options": [{"texte_html": "la façon dont les points sont serrés autour de la tendance.", "score": 100.0, "feedback_html": "<p>Exact. Points serrés : liaison intense ; points très dispersés : liaison faible.<\/p>"}, {"texte_html": "la pente de la tendance : plus elle est raide, plus la liaison est intense.", "score": -20.0, "feedback_html": "<p>C'est un piège classique : une droite peu pentue peut être très bien suivie par les points. L'intensité dépend de la dispersion autour de la tendance.<\/p>"}, {"texte_html": "le nombre de points du nuage.", "score": -30.0, "feedback_html": "<p>Le nombre de points ne dit rien de l'intensité.<\/p>"}, {"texte_html": "le sens de la liaison, positive ou négative.", "score": -50.0, "feedback_html": "<p>Le sens est une autre caractéristique du nuage.<\/p>"}]}, {"id": "C-CM5-007", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>On trace les deux moyennes sur un nuage de points. La plupart des points se trouvent dans les quadrants où les deux variables sont du même côté de leur moyenne. Que peut-on en dire ?<\/p>", "question_texte": "On trace les deux moyennes sur un nuage de points. La plupart des points se trouvent dans les quadrants où les deux variables sont du même côté de leur moyenne. Que peut-on en dire ?", "feedback_general_html": "<p>Quadrants « même côté » majoritaires : liaison positive ; quadrants « côtés opposés » : liaison négative.<\/p>", "options": [{"texte_html": "La liaison est positive.", "score": 100.0, "feedback_html": "<p>Exact. Un individu au-dessus de la moyenne sur une variable a tendance à l'être aussi sur l'autre.<\/p>"}, {"texte_html": "La liaison est forte.", "score": -20.0, "feedback_html": "<p>Le déséquilibre entre quadrants donne le sens. Pour l'intensité, il faut voir à quel point les points sont serrés.<\/p>"}, {"texte_html": "La liaison est négative.", "score": -30.0, "feedback_html": "<p>Une liaison négative mettrait la plupart des points dans les quadrants où les variables sont de part et d'autre de leur moyenne.<\/p>"}, {"texte_html": "Il n'y a pas de liaison.", "score": -50.0, "feedback_html": "<p>Sans liaison, les points se répartiraient à peu près également entre les quadrants.<\/p>"}]}, {"id": "C-CM5-008", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>La covariance entre le score DASS et le nombre de répétitions vaut 10,6 ; entre le score DASS et la proportion de répétitions, elle vaut 0,22. Que faut-il en conclure ?<\/p>", "question_texte": "La covariance entre le score DASS et le nombre de répétitions vaut 10,6 ; entre le score DASS et la proportion de répétitions, elle vaut 0,22. Que faut-il en conclure ?", "feedback_general_html": "<p>La covariance dépend des unités : on la ramène à une échelle commune avec le coefficient r.<\/p>", "options": [{"texte_html": "Rien sur l'intensité : c'est la même liaison, exprimée dans deux unités, et la covariance dépend des unités.", "score": 100.0, "feedback_html": "<p>Exact. La proportion est le nombre divisé par 49 : la covariance est divisée d'autant, alors que la liaison est identique.<\/p>"}, {"texte_html": "La liaison avec le nombre de répétitions est environ 50 fois plus forte.", "score": -20.0, "feedback_html": "<p>La covariance ne mesure pas l'intensité : sa valeur change dès qu'on change d'unité.<\/p>"}, {"texte_html": "L'un des deux calculs est faux.", "score": -30.0, "feedback_html": "<p>Les deux sont justes : 10,6 / 49 ≈ 0,22.<\/p>"}, {"texte_html": "La liaison avec la proportion de répétitions est presque nulle.", "score": -50.0, "feedback_html": "<p>0,22 paraît petit uniquement parce que la proportion s'exprime avec de petits nombres.<\/p>"}]}, {"id": "C-CM5-009", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Le coefficient de corrélation de Pearson r est toujours compris entre…<\/p>", "question_texte": "Le coefficient de corrélation de Pearson r est toujours compris entre…", "feedback_general_html": "<p>r est compris entre −1 et 1, et n'a pas d'unité.<\/p>", "options": [{"texte_html": "−1 et 1", "score": 100.0, "feedback_html": "<p>Exact. Son signe donne le sens ; sa valeur absolue l'intensité.<\/p>"}, {"texte_html": "0 et 1", "score": -20.0, "feedback_html": "<p>r peut être négatif : il l'est quand la liaison est négative.<\/p>"}, {"texte_html": "−100 et 100", "score": -30.0, "feedback_html": "<p>r n'est pas un pourcentage.<\/p>"}, {"texte_html": "Il n'a pas de bornes.", "score": -50.0, "feedback_html": "<p>C'est la covariance qui n'a pas de bornes ; r est toujours entre −1 et 1.<\/p>"}]}, {"id": "C-CM5-010", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Une corrélation r = −0,7 indique…<\/p>", "question_texte": "Une corrélation r = −0,7 indique…", "feedback_general_html": "<p>Signe : sens. Valeur absolue : intensité (0,1 faible, 0,3 moyenne, 0,5 et plus forte).<\/p>", "options": [{"texte_html": "une liaison linéaire négative forte.", "score": 100.0, "feedback_html": "<p>Exact. Négative par son signe, forte puisque 0,7 dépasse le repère de 0,5.<\/p>"}, {"texte_html": "une liaison linéaire négative d'intensité moyenne.", "score": -20.0, "feedback_html": "<p>Le sens est juste, mais 0,7 dépasse 0,5 : selon les repères de Cohen, la liaison est forte.<\/p>"}, {"texte_html": "une liaison linéaire positive forte.", "score": -30.0, "feedback_html": "<p>Le signe moins indique une liaison négative.<\/p>"}, {"texte_html": "que 70 % des individus suivent la tendance.", "score": -50.0, "feedback_html": "<p>r n'est pas un pourcentage d'individus.<\/p>"}]}, {"id": "C-CM5-012", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>On calcule r entre l'âge et un temps de réaction mesuré en millisecondes, puis on convertit les temps en secondes. Que devient r ?<\/p>", "question_texte": "On calcule r entre l'âge et un temps de réaction mesuré en millisecondes, puis on convertit les temps en secondes. Que devient r ?", "feedback_general_html": "<p>r ne dépend pas des unités ; la covariance, si.<\/p>", "options": [{"texte_html": "Il ne change pas.", "score": 100.0, "feedback_html": "<p>Exact. r n'a pas d'unité : un changement d'unité ne le modifie pas.<\/p>"}, {"texte_html": "Il est divisé par 1 000.", "score": -20.0, "feedback_html": "<p>C'est ce qui arrive à la covariance, pas à r.<\/p>"}, {"texte_html": "Il est multiplié par 1 000.", "score": -30.0, "feedback_html": "<p>r reste toujours entre −1 et 1 : il ne peut pas être multiplié par 1 000.<\/p>"}, {"texte_html": "Il devient nul.", "score": -50.0, "feedback_html": "<p>La liaison est exactement la même : seule l'unité a changé.<\/p>"}]}, {"id": "C-CM5-014", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Pour un individu, le produit de ses deux scores z est négatif. Où se trouve-t-il dans le nuage de points ?<\/p>", "question_texte": "Pour un individu, le produit de ses deux scores z est négatif. Où se trouve-t-il dans le nuage de points ?", "feedback_general_html": "<p>r est la moyenne des produits z_x × z_y : positifs dans les quadrants « même côté », négatifs dans les autres.<\/p>", "options": [{"texte_html": "Dans un quadrant où l'une des variables est au-dessus de sa moyenne et l'autre en dessous.", "score": 100.0, "feedback_html": "<p>Exact. Un score z positif et un score z négatif donnent un produit négatif : cet individu tire r vers le négatif.<\/p>"}, {"texte_html": "En dessous des deux moyennes.", "score": -20.0, "feedback_html": "<p>Deux scores z négatifs donnent un produit positif.<\/p>"}, {"texte_html": "Au-dessus des deux moyennes.", "score": -30.0, "feedback_html": "<p>Deux scores z positifs donnent un produit positif.<\/p>"}, {"texte_html": "Exactement sur l'une des deux moyennes.", "score": -50.0, "feedback_html": "<p>Sur une moyenne, le score z vaut 0, et le produit aussi.<\/p>"}]}, {"id": "C-CM5-015", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Que conclure de ce nuage de points, pour lequel r = −0,03 ?<\/p><p><img src=\"images/cm5_nuage_u.png\" alt=\"Nuage de points en forme de U inversé entre stress et performance\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Que conclure de ce nuage de points, pour lequel r = −0,03 ?", "feedback_general_html": "<p>Toujours regarder le nuage avant d'interpréter r : r ne voit que les liaisons linéaires.<\/p>", "options": [{"texte_html": "Il n'y a presque pas de liaison linéaire, mais il y a une liaison très nette, en forme de U inversé.", "score": 100.0, "feedback_html": "<p>Exact. La performance est maximale pour un stress moyen ; r, qui ne mesure que la liaison linéaire, ne la voit pas.<\/p>"}, {"texte_html": "Le stress et la performance ne sont pas liés.", "score": -20.0, "feedback_html": "<p>r proche de 0 veut dire « pas de liaison linéaire », pas « aucune liaison ».<\/p>"}, {"texte_html": "Il y a une liaison négative faible.", "score": -30.0, "feedback_html": "<p>La performance monte puis redescend : ce n'est pas une liaison négative.<\/p>"}, {"texte_html": "Le calcul de r est faux.", "score": -50.0, "feedback_html": "<p>Le calcul est juste ; c'est l'outil qui n'est pas adapté à une liaison en U.<\/p>"}]}, {"id": "C-CM5-018", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Sur 300 participants, r = 0,40 entre le score DASS et le nombre de répétitions. En retirant les deux participants aux suites les plus extrêmes, r passe à 0,48. Pourquoi ?<\/p>", "question_texte": "Sur 300 participants, r = 0,40 entre le score DASS et le nombre de répétitions. En retirant les deux participants aux suites les plus extrêmes, r passe à 0,48. Pourquoi ?", "feedback_general_html": "<p>r n'est pas robuste : quelques valeurs extrêmes peuvent le modifier nettement.<\/p>", "options": [{"texte_html": "Ces deux participants sont très éloignés des autres. Comme r se calcule à partir des valeurs elles-mêmes, ils pèsent beaucoup dans le calcul.", "score": 100.0, "feedback_html": "<p>Exact. Comme la moyenne, r n'est pas robuste.<\/p>"}, {"texte_html": "Parce que retirer des participants fait toujours augmenter r.", "score": -20.0, "feedback_html": "<p>Non : retirer deux participants quelconques ne changerait presque rien. Ce sont des points très éloignés qui pèsent.<\/p>"}, {"texte_html": "Parce que r dépend des unités.", "score": -30.0, "feedback_html": "<p>r ne dépend pas des unités, et aucune unité n'a changé ici.<\/p>"}, {"texte_html": "Parce que l'un des deux calculs est faux.", "score": -50.0, "feedback_html": "<p>Les deux sont justes : ils montrent la sensibilité de r aux valeurs extrêmes.<\/p>"}]}, {"id": "C-CM5-019", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Deux variables A et B sont fortement corrélées. Quelles explications faut-il envisager ?<\/p>", "question_texte": "Deux variables A et B sont fortement corrélées. Quelles explications faut-il envisager ?", "feedback_general_html": "<p>Corrélation n'est pas causalité : A → B, B → A, ou C → A et B.<\/p>", "options": [{"texte_html": "A cause B, B cause A, ou une troisième variable cause les deux.", "score": 100.0, "feedback_html": "<p>Exact. Les données d'observation seules ne permettent pas de trancher.<\/p>"}, {"texte_html": "A cause B, ou B cause A.", "score": -20.0, "feedback_html": "<p>Il manque la troisième explication, souvent la bonne : une variable qui cause à la fois A et B.<\/p>"}, {"texte_html": "A cause B, puisque la corrélation est forte.", "score": -30.0, "feedback_html": "<p>Une corrélation forte ne dit pas dans quel sens va la cause, ni s'il y en a une.<\/p>"}, {"texte_html": "Aucune : une corrélation forte se suffit à elle-même.", "score": -50.0, "feedback_html": "<p>Une corrélation appelle toujours une explication ; il faut envisager les trois.<\/p>"}]}, {"id": "C-CM5-021", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Que faut-il pour établir qu'une variable en cause une autre ?<\/p>", "question_texte": "Que faut-il pour établir qu'une variable en cause une autre ?", "feedback_general_html": "<p>Seule une expérience, où l'on manipule une variable, permet d'établir une cause.<\/p>", "options": [{"texte_html": "Une expérience : manipuler une variable, par exemple en répartissant les participants au hasard entre deux conditions, et observer l'autre.", "score": 100.0, "feedback_html": "<p>Exact. Le tirage au sort rend les groupes comparables sur toutes les autres variables.<\/p>"}, {"texte_html": "Une corrélation très proche de 1.", "score": -20.0, "feedback_html": "<p>Même parfaite, une corrélation d'observation laisse ouvertes les trois explications.<\/p>"}, {"texte_html": "Un très grand échantillon.", "score": -30.0, "feedback_html": "<p>Un grand échantillon rend r plus précis, pas plus causal.<\/p>"}, {"texte_html": "Un nuage de points bien linéaire.", "score": -50.0, "feedback_html": "<p>La forme du nuage ne dit rien du sens de la cause.<\/p>"}]}, {"id": "C-CM5-023", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Le coefficient de corrélation de Spearman, c'est…<\/p>", "question_texte": "Le coefficient de corrélation de Spearman, c'est…", "feedback_general_html": "<p>Spearman = Pearson sur les rangs.<\/p>", "options": [{"texte_html": "la corrélation de Pearson calculée sur les rangs des valeurs.", "score": 100.0, "feedback_html": "<p>Exact. On remplace chaque valeur par son rang (1, 2, 3…) sur chaque variable.<\/p>"}, {"texte_html": "la corrélation de Pearson calculée sur les scores z.", "score": -20.0, "feedback_html": "<p>C'est la définition de Pearson lui-même ; Spearman utilise les rangs.<\/p>"}, {"texte_html": "la covariance calculée sur les rangs.", "score": -30.0, "feedback_html": "<p>Il s'agit bien des rangs, mais on calcule une corrélation, pas une covariance.<\/p>"}, {"texte_html": "la moyenne des rangs des deux variables.", "score": -50.0, "feedback_html": "<p>Ce ne serait pas une mesure de liaison.<\/p>"}]}, {"id": "C-CM5-024", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Pour une liaison où y augmente toujours quand x augmente, mais en courbe, Pearson vaut 0,83 et Spearman vaut 1. Pourquoi ?<\/p>", "question_texte": "Pour une liaison où y augmente toujours quand x augmente, mais en courbe, Pearson vaut 0,83 et Spearman vaut 1. Pourquoi ?", "feedback_general_html": "<p>Pearson : liaison linéaire. Spearman : liaison monotone.<\/p>", "options": [{"texte_html": "Spearman mesure une liaison monotone : toujours dans le même sens, pas forcément linéaire.", "score": 100.0, "feedback_html": "<p>Exact. Les rangs de x et de y sont exactement dans le même ordre : Spearman vaut 1.<\/p>"}, {"texte_html": "Spearman est toujours plus grand que Pearson.", "score": -20.0, "feedback_html": "<p>Ce n'est pas toujours le cas ; ici, c'est parce que la liaison est monotone mais courbe.<\/p>"}, {"texte_html": "Pearson est faux pour une liaison courbe.", "score": -30.0, "feedback_html": "<p>Pearson est juste : il mesure la liaison linéaire, qui n'est pas parfaite ici.<\/p>"}, {"texte_html": "Spearman ne tient compte que des valeurs extrêmes.", "score": -50.0, "feedback_html": "<p>C'est l'inverse : il atténue le poids des valeurs extrêmes.<\/p>"}]}, {"id": "S-001", "type": "serie", "categorie": "interpretation", "cm": [3, 4], "etude": {"titre": "Score de dépression selon la filière"}, "etude_html": "<h4>Score de dépression selon la filière<\/h4><p>300 étudiants de L1 à L3 (sciences, psychologie, arts, 100 par filière) ont rempli l'échelle de dépression de la DASS-21 (score de 0 à 42). On compare la distribution du score dans les trois filières.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Jeu de données fil rouge du cours (production_aleatoire.csv).<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Arts<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Psychologie<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Sciences<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Manquant<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">10,46<\/td><td style=\"padding:2px 12px;text-align:right\">10,14<\/td><td style=\"padding:2px 12px;text-align:right\">7,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">10,28<\/td><td style=\"padding:2px 12px;text-align:right\">9,69<\/td><td style=\"padding:2px 12px;text-align:right\">9,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">42<\/td><td style=\"padding:2px 12px;text-align:right\">34<\/td><td style=\"padding:2px 12px;text-align:right\">38<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">25e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,00<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">75e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">16,0<\/td><td style=\"padding:2px 12px;text-align:right\">16,5<\/td><td style=\"padding:2px 12px;text-align:right\">12,0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Asymétrie<\/td><td style=\"padding:2px 12px;text-align:right\">1,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,75<\/td><td style=\"padding:2px 12px;text-align:right\">1,41<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Aplatissement<\/td><td style=\"padding:2px 12px;text-align:right\">0,18<\/td><td style=\"padding:2px 12px;text-align:right\">-0,55<\/td><td style=\"padding:2px 12px;text-align:right\">1,03<\/td><\/tr><\/table><p style=\"font-size:0.85em;color:#555;margin-top:2px\">Variable dass_depression, séparée par filiere<\/p>", "questions": [{"id": "S-001-q1", "difficulte": 1, "question_html": "<p>Dans quelle filière la médiane du score de dépression est-elle la plus basse ?<\/p>", "question_texte": "Dans quelle filière la médiane du score de dépression est-elle la plus basse ?", "feedback_general_html": "<p>On lit la ligne « Médiane » du tableau. Elle vaut 8 en arts et en psychologie, 4 en sciences.<\/p>", "options": [{"texte_html": "Sciences", "score": 100.0, "feedback_html": "<p>Exact. La médiane vaut 4 en sciences, contre 8 dans les deux autres filières. La moitié des étudiants de sciences a un score de 4 ou moins.<\/p>"}, {"texte_html": "Arts", "score": -20.0, "feedback_html": "<p>La médiane d'arts vaut 8. Vous avez peut-être lu une autre ligne du tableau, comme la moyenne ou le maximum.<\/p>"}, {"texte_html": "Psychologie", "score": -30.0, "feedback_html": "<p>La médiane de psychologie vaut 8, comme en arts. C'est en sciences qu'elle est la plus basse (4).<\/p>"}, {"texte_html": "Elle est la même dans les trois filières, puisque le minimum vaut 0 partout.", "score": -50.0, "feedback_html": "<p>Le minimum et la médiane sont deux indices différents. Le minimum est la plus petite valeur ; la médiane coupe le groupe en deux moitiés.<\/p>"}]}, {"id": "S-001-q2", "difficulte": 2, "question_html": "<p>Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?<\/p>", "question_texte": "Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?", "feedback_general_html": "<p>Quand la moyenne dépasse nettement la médiane, la distribution est asymétrique à droite. Les coefficients d'asymétrie, tous positifs, le confirment.<\/p>", "options": [{"texte_html": "La distribution est étirée vers la droite ; quelques scores élevés tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est sensible aux valeurs extrêmes ; la médiane ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La distribution est étirée vers la gauche.", "score": -30.0, "feedback_html": "<p>C'est l'inverse. La moyenne est tirée du côté de la queue de la distribution. Ici elle est au-dessus de la médiane, donc la queue est à droite, vers les scores élevés.<\/p>"}, {"texte_html": "Il y a des données manquantes dans le tableau.", "score": -50.0, "feedback_html": "<p>La ligne « Manquant » vaut 0 dans les trois filières. L'écart entre moyenne et médiane vient de la forme de la distribution.<\/p>"}, {"texte_html": "La plupart des étudiants ont un score supérieur à la moyenne.", "score": -20.0, "feedback_html": "<p>C'est le contraire. La médiane étant sous la moyenne, plus de la moitié des étudiants ont un score inférieur à la moyenne.<\/p>"}]}, {"id": "S-001-q3", "difficulte": 2, "question_html": "<p>On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?<\/p>", "question_texte": "On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?", "feedback_general_html": "<p>Pour une distribution asymétrique ou avec des valeurs extrêmes, on décrit la position par la médiane et la dispersion par l'écart interquartile (Q3 − Q1).<\/p>", "options": [{"texte_html": "L'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Les distributions sont asymétriques, avec des valeurs élevées isolées. L'écart interquartile est robuste. Il vaut 14 en arts, 14,5 en psychologie et 12 en sciences.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type n'est pas faux, mais il est sensible aux valeurs extrêmes. Avec des distributions aussi asymétriques, on lui préfère un indice robuste.<\/p>"}, {"texte_html": "L'étendue", "score": -50.0, "feedback_html": "<p>L'étendue est l'indice le moins robuste. Elle ne dépend que des deux valeurs les plus extrêmes : en arts, un seul étudiant à 42 suffit à la gonfler.<\/p>"}, {"texte_html": "La variance", "score": -30.0, "feedback_html": "<p>La variance a les mêmes défauts que l'écart-type, et elle s'exprime en plus dans une unité au carré, difficile à interpréter.<\/p>"}]}, {"id": "S-001-q4", "difficulte": 3, "question_html": "<p>D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?<\/p>", "question_texte": "D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?", "feedback_general_html": "<p>Règle de Tukey : une valeur est atypique si elle dépasse Q3 + 1,5 × EIQ ou si elle est sous Q1 − 1,5 × EIQ.<\/p>", "options": [{"texte_html": "Au-dessus de 30", "score": 100.0, "feedback_html": "<p>Exact. En sciences, Q1 = 0 et Q3 = 12, donc EIQ = 12. Borne haute : 12 + 1,5 × 12 = 30. Les scores de 32, 36 et 38 sont atypiques.<\/p>"}, {"texte_html": "Au-dessus de 24", "score": -20.0, "feedback_html": "<p>24 = Q3 + EIQ. Il manque le facteur 1,5 : la borne est Q3 + 1,5 × EIQ = 12 + 18 = 30.<\/p>"}, {"texte_html": "Au-dessus de 38", "score": -50.0, "feedback_html": "<p>38 est le maximum observé, pas une borne. La règle de Tukey se calcule à partir des quartiles, pas des valeurs extrêmes.<\/p>"}, {"texte_html": "Au-dessus de 37", "score": -30.0, "feedback_html": "<p>37 est la borne calculée en cours sur les 300 étudiants (Q1 = 2, Q3 = 16). Pour les seuls étudiants de sciences, il faut utiliser leurs propres quartiles.<\/p>"}]}, {"id": "S-001-q5", "difficulte": 2, "question_html": "<p>Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?<\/p>", "question_texte": "Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?", "feedback_general_html": "<p>Coefficient d'asymétrie positif = asymétrie à droite ; au-delà de 1, elle est nette. Penser à vérifier sur un graphique que quelques valeurs extrêmes ne suffisent pas à l'expliquer.<\/p>", "options": [{"texte_html": "Elle est nettement asymétrique à droite, plus que dans les deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient d'asymétrie (1,41) dépasse 1, et c'est le plus élevé des trois. La médiane (4) est aussi loin sous la moyenne (7,80).<\/p>"}, {"texte_html": "Elle est asymétrique à gauche.", "score": -20.0, "feedback_html": "<p>Un coefficient d'asymétrie positif signale une asymétrie à droite, c'est-à-dire une queue vers les valeurs élevées.<\/p>"}, {"texte_html": "Elle est proche d'une loi normale, car l'aplatissement est proche de 1.", "score": -30.0, "feedback_html": "<p>Pour une loi normale, le coefficient d'aplatissement de Jamovi vaut 0, pas 1. Et surtout, l'asymétrie de 1,41 exclut une forme normale.<\/p>"}, {"texte_html": "Elle est symétrique, car le minimum est 0 comme dans les autres filières.", "score": -50.0, "feedback_html": "<p>Le minimum ne dit rien de la symétrie. Il faut regarder le coefficient d'asymétrie, ou comparer la moyenne et la médiane.<\/p>"}]}, {"id": "S-001-q6", "difficulte": 3, "question_html": "<p>Laquelle de ces conclusions est correcte ?<\/p>", "question_texte": "Laquelle de ces conclusions est correcte ?", "feedback_general_html": "<p>Comparer des groupes, c'est comparer leur position (médiane, moyenne) et leur dispersion. Une différence observée décrit ces individus ; elle ne prouve pas une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 300 étudiants, ceux de sciences ont en général des scores de dépression plus faibles que ceux des deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. La médiane, la moyenne et les quartiles sont plus bas en sciences. La conclusion reste descriptive et ne vaut que pour ces étudiants.<\/p>"}, {"texte_html": "Faire des études de sciences protège de la dépression.", "score": -30.0, "feedback_html": "<p>C'est une conclusion causale. Ces données d'observation ne permettent pas de la tirer. D'autres variables pourraient expliquer la différence, par exemple la répartition par sexe, qui n'est pas la même selon les filières.<\/p>"}, {"texte_html": "Tous les étudiants de sciences ont un score plus bas que les étudiants d'arts.", "score": -20.0, "feedback_html": "<p>Les distributions se chevauchent largement. Le maximum en sciences (38) dépasse de beaucoup la médiane d'arts (8). Une différence de position ne dit rien de chaque individu.<\/p>"}, {"texte_html": "Les trois filières ne diffèrent pas, puisque leurs écarts-types sont presque identiques.", "score": -50.0, "feedback_html": "<p>L'écart-type mesure la dispersion, pas la position. Des groupes de même dispersion peuvent avoir des positions différentes.<\/p>"}]}]}, {"id": "S-002", "type": "serie", "categorie": "interpretation", "cm": [1], "etude": {"titre": "Qualité du sommeil des étudiants de L1"}, "etude_html": "<h4>Qualité du sommeil des étudiants de L1<\/h4><p>240 étudiants de L1 ont évalué la qualité de leur sommeil du dernier mois, de « très mauvaise » à « très bonne ».<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Données simulées pour l&#x27;exercice.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de qualite_sommeil<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">47<\/td><td style=\"padding:2px 12px;text-align:right\">19,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">27,1 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Correcte<\/td><td style=\"padding:2px 12px;text-align:right\">89<\/td><td style=\"padding:2px 12px;text-align:right\">37,1 %<\/td><td style=\"padding:2px 12px;text-align:right\">64,2 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Bonne<\/td><td style=\"padding:2px 12px;text-align:right\">63<\/td><td style=\"padding:2px 12px;text-align:right\">26,3 %<\/td><td style=\"padding:2px 12px;text-align:right\">90,4 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très bonne<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">9,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table>", "questions": [{"id": "S-002-q1", "difficulte": 1, "question_html": "<p>La variable <code>qualite_sommeil<\/code> est…<\/p>", "question_texte": "La variable `qualite_sommeil` est…", "feedback_general_html": "<p>Catégories ordonnées : variable ordinale.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses cinq modalités sont des catégories ordonnées, de « très mauvaise » à « très bonne ».<\/p>"}, {"texte_html": "nominale", "score": -20.0, "feedback_html": "<p>Les modalités ont un ordre naturel : la variable est ordinale.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>Des modalités ordonnées ne sont pas des quantités : on ne mesure pas l'écart entre « correcte » et « bonne ».<\/p>"}, {"texte_html": "dichotomique", "score": -50.0, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; celle-ci en a cinq.<\/p>"}]}, {"id": "S-002-q2", "difficulte": 1, "question_html": "<p>Combien d'étudiants déclarent un sommeil de « bonne » qualité ?<\/p>", "question_texte": "Combien d'étudiants déclarent un sommeil de « bonne » qualité ?", "feedback_general_html": "<p>Effectif : nombre d'individus d'une modalité. Pourcentage : leur part dans le total.<\/p>", "options": [{"texte_html": "63", "score": 100.0, "feedback_html": "<p>Exact. On lit la colonne « Effectifs » sur la ligne « Bonne ».<\/p>"}, {"texte_html": "23", "score": -20.0, "feedback_html": "<p>23 est l'effectif de la ligne « Très bonne », pas « Bonne ».<\/p>"}, {"texte_html": "217", "score": -30.0, "feedback_html": "<p>217 additionne les effectifs jusqu'à « Bonne » (18 + 47 + 89 + 63) : c'est un effectif cumulé.<\/p>"}, {"texte_html": "26", "score": -50.0, "feedback_html": "<p>26 vient du pourcentage (26,3 %), pas de la colonne des effectifs.<\/p>"}]}, {"id": "S-002-q3", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil au plus « correct » ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil au plus « correct » ?", "feedback_general_html": "<p>« Au plus » une modalité : pourcentage cumulé sur la ligne de cette modalité.<\/p>", "options": [{"texte_html": "64,2 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « Correcte » : 7,5 + 19,6 + 37,1.<\/p>"}, {"texte_html": "27,1 %", "score": -20.0, "feedback_html": "<p>27,1 % s'arrête à « Mauvaise ». « Au plus correct » inclut aussi « Correcte ».<\/p>"}, {"texte_html": "37,1 %", "score": -30.0, "feedback_html": "<p>37,1 % est la part de la seule modalité « Correcte ».<\/p>"}, {"texte_html": "35,8 %", "score": -50.0, "feedback_html": "<p>35,8 % est la part au-dessus de « Correcte » (bonne ou très bonne) : c'est le complément de la réponse.<\/p>"}]}, {"id": "S-002-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil bon ou très bon ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil bon ou très bon ?", "feedback_general_html": "<p>Pour une part « au moins » une modalité : 100 % moins le cumul de la modalité précédente.<\/p>", "options": [{"texte_html": "35,8 % (26,3 + 9,6, ou 100 − 64,2)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les deux modalités, ou on retire de 100 % le cumul jusqu'à « Correcte ».<\/p>"}, {"texte_html": "26,3 %", "score": -20.0, "feedback_html": "<p>26,3 % ne compte que « Bonne » ; il faut ajouter « Très bonne ».<\/p>"}, {"texte_html": "9,6 %", "score": -30.0, "feedback_html": "<p>9,6 % ne compte que « Très bonne ».<\/p>"}, {"texte_html": "90,4 %", "score": -50.0, "feedback_html": "<p>90,4 % est le cumul jusqu'à « Bonne » : il compte tout ce qui est en dessous, y compris les sommeils mauvais.<\/p>"}]}, {"id": "S-002-q5", "difficulte": 1, "question_html": "<p>Quel est le mode de cette distribution ?<\/p>", "question_texte": "Quel est le mode de cette distribution ?", "feedback_general_html": "<p>Le mode est la modalité la plus fréquente ; on le donne sous forme de modalité, pas d'effectif.<\/p>", "options": [{"texte_html": "Correcte", "score": 100.0, "feedback_html": "<p>Exact. C'est la modalité la plus fréquente (89 étudiants).<\/p>"}, {"texte_html": "89", "score": -20.0, "feedback_html": "<p>89 est l'effectif du mode. Le mode est la modalité elle-même : « Correcte ».<\/p>"}, {"texte_html": "Très bonne", "score": -30.0, "feedback_html": "<p>« Très bonne » est la dernière ligne, pas la plus fréquente (23 étudiants).<\/p>"}, {"texte_html": "Il n'y en a pas, car la variable est ordinale", "score": -50.0, "feedback_html": "<p>Toute variable a un mode, même nominale : c'est la modalité la plus fréquente.<\/p>"}]}, {"id": "S-002-q6", "difficulte": 2, "question_html": "<p>La colonne « % cumulé » a-t-elle un sens pour cette variable ?<\/p>", "question_texte": "La colonne « % cumulé » a-t-elle un sens pour cette variable ?", "feedback_general_html": "<p>Le cumul a un sens dès que les modalités sont ordonnées : variables ordinales et numériques.<\/p>", "options": [{"texte_html": "Oui, car les modalités sont ordonnées.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, « au plus correct » a un sens.<\/p>"}, {"texte_html": "Oui, car on peut toujours cumuler.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : pour une variable nominale, le cumul n'a pas de sens.<\/p>"}, {"texte_html": "Non, car la variable est qualitative.", "score": -30.0, "feedback_html": "<p>Une variable qualitative ordinale peut se cumuler : seules les variables nominales ne le peuvent pas.<\/p>"}, {"texte_html": "Non, car les effectifs sont inégaux.", "score": -50.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'ordre des modalités qui compte.<\/p>"}]}, {"id": "S-002-q7", "difficulte": 3, "question_html": "<p>Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?<\/p>", "question_texte": "Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?", "feedback_general_html": "<p>Moyenne d'une variable ordinale codée en chiffres : possible en pratique, mais discutable. La médiane est l'indice adapté.<\/p>", "options": [{"texte_html": "Il est à interpréter avec prudence : il suppose des écarts égaux entre modalités, ce qui n'est pas garanti.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, la moyenne est discutable ; la médiane est l'indice adapté.<\/p>"}, {"texte_html": "Il n'a aucun sens, comme une moyenne de filières.", "score": -20.0, "feedback_html": "<p>C'est trop sévère : contrairement à une variable nominale, les modalités sont ordonnées, et la moyenne peut donner une indication, avec prudence.<\/p>"}, {"texte_html": "Il signifie que la qualité moyenne est exactement « correcte ».", "score": -30.0, "feedback_html": "<p>Ce serait traiter le code comme une mesure exacte : rien ne garantit que les modalités soient équidistantes.<\/p>"}, {"texte_html": "C'est la modalité la plus fréquente.", "score": -50.0, "feedback_html": "<p>La modalité la plus fréquente est le mode, pas la moyenne.<\/p>"}]}, {"id": "S-002-q8", "difficulte": 2, "question_html": "<p>Laquelle de ces conclusions est permise ?<\/p>", "question_texte": "Laquelle de ces conclusions est permise ?", "feedback_general_html": "<p>Un tableau de fréquences décrit les individus observés : il ne permet ni de généraliser, ni de conclure à une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 240 étudiants, un peu plus d'un sur quatre déclare un sommeil mauvais ou très mauvais.", "score": 100.0, "feedback_html": "<p>Exact. 27,1 % des étudiants observés : la conclusion reste descriptive.<\/p>"}, {"texte_html": "Un étudiant français sur quatre dort mal.", "score": -20.0, "feedback_html": "<p>Le chiffre est juste pour ces 240 étudiants, mais la phrase généralise à tous les étudiants français.<\/p>"}, {"texte_html": "Ces étudiants dorment mal parce qu'ils révisent.", "score": -30.0, "feedback_html": "<p>Aucune cause n'est mesurée dans ces données.<\/p>"}, {"texte_html": "La plupart des étudiants dorment bien.", "score": -50.0, "feedback_html": "<p>Les sommeils bons et très bons ne représentent que 35,8 % des étudiants.<\/p>"}]}]}, {"id": "S-004", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Temps d'écran de loisir des étudiants"}, "etude_html": "<h4>Temps d&#x27;écran de loisir des étudiants<\/h4><p>Liebig et al. (2026) ont suivi 2 656 étudiants en médecine de Dresde de 2014 à 2024 : en 2024, ils passaient en moyenne 2,46 heures par jour devant un écran pour leurs loisirs. Ici, 200 étudiants ont estimé leur temps d'écran de loisir quotidien ; les réponses sont regroupées en classes de largeurs inégales.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Liebig, L., et al. (2026). Ten years of screen time among medical students in Dresden, Germany: unveiling the trends. BMC Medical Education.<\/p><p style=\"margin-bottom:2px\"><strong>Distribution en classes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Classe (heures)<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectif<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">%<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[0 ; 1[<\/td><td style=\"padding:2px 12px;text-align:right\">40<\/td><td style=\"padding:2px 12px;text-align:right\">20 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[1 ; 2[<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><td style=\"padding:2px 12px;text-align:right\">25 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[2 ; 3[<\/td><td style=\"padding:2px 12px;text-align:right\">40<\/td><td style=\"padding:2px 12px;text-align:right\">20 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[3 ; 5[<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><td style=\"padding:2px 12px;text-align:right\">25 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[5 ; 10[<\/td><td style=\"padding:2px 12px;text-align:right\">20<\/td><td style=\"padding:2px 12px;text-align:right\">10 %<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Histogramme (densité en ordonnée)<\/strong><\/p><p><img src=\"images/s004_histo_ecran.png\" alt=\"Histogramme (densité en ordonnée)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-004-q1", "difficulte": 1, "question_html": "<p>Le temps d'écran quotidien, mesuré en heures, est une variable…<\/p>
