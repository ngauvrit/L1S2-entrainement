bsK8FgGCMMQOAGFCXOF1YZ+TCPLtoWdJTAl3roGxOejJk4aT3+4MpA5XTQZloudPTlt52y2jbe/tOTtHcYbEMykSZ1X79znFj8dSlMRZ0bISbR01GjnzFTY1x2223RHwtAAQjMAMAALmeutaqS+IPP0zOlcuqbK26J6sLbY8e0Y2zBIBAjDEDAAC5niabHj3af1qB3EDjRd9667XcsCgA8igCMwDIh1RMQYU/9AAAALFH8Q8AAAAAiDHGmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIwRmAEAAABAjBGYAQAAAECMEZgBAAAAQIz9HzsIBWZSOU70AAAAAElFTkSuQmCC\" alt=\"Courbe des fréquences cumulées des temps de réaction de 200 participants\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "D'après la courbe des fréquences cumulées ci-dessous, environ quelle part des participants répond en moins de 500 ms ?", "feedback_general_html": "<p>Lecture directe de la fonction de répartition : on part d'une valeur et on lit la part des individus en dessous.<\/p>", "options": [{"texte_html": "Environ 75 %", "score": 100.0, "feedback_html": "<p>Exact. On part de 500 ms sur l'axe horizontal et on lit la fréquence cumulée.<\/p>"}, {"texte_html": "Environ 50 %", "score": -20.0, "feedback_html": "<p>C'est la fréquence cumulée de la médiane (environ 430 ms), pas de 500 ms.<\/p>"}, {"texte_html": "Environ 25 %", "score": -30.0, "feedback_html": "<p>C'est la part des participants qui répondent en plus de 500 ms.<\/p>"}, {"texte_html": "500 ms", "score": -50.0, "feedback_html": "<p>500 ms est la valeur de départ ; la question demande une part.<\/p>"}]}, {"id": "C-CM3-001", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?<\/p>", "question_texte": "Aux 300 étudiants du cours, on ajoute un étudiant qui a produit 40 répétitions. Quels indices changent le plus ?", "feedback_general_html": "<p>Indices robustes (peu sensibles aux valeurs extrêmes) : médiane, écart interquartile. Indices non robustes : moyenne, écart-type et surtout étendue.<\/p>", "options": [{"texte_html": "La moyenne et l'écart-type", "score": 100.0, "feedback_html": "<p>Exact. Ces deux indices ne sont pas robustes. Chaque valeur pèse selon sa distance au centre, et 40 est très loin.<\/p>"}, {"texte_html": "La médiane et l'écart interquartile", "score": -50.0, "feedback_html": "<p>C'est l'inverse. La médiane et l'EIQ ne dépendent que du rang des valeurs. Un individu de plus, même très extrême, les déplace à peine.<\/p>"}, {"texte_html": "La médiane et l'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type bouge, oui. Mais la médiane est robuste : elle ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La moyenne et l'écart interquartile", "score": -30.0, "feedback_html": "<p>La moyenne bouge, oui. Mais l'EIQ est robuste : il ignore les 25 % les plus bas et les 25 % les plus hauts.<\/p>"}]}, {"id": "C-CM4-001", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?<\/p>", "question_texte": "Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?", "feedback_general_html": "<p>Moyen mnémotechnique : la moyenne est tirée du côté de la queue. Asymétrie à gauche : moyenne &lt; médiane &lt; mode. Asymétrie à droite : mode &lt; médiane &lt; moyenne.<\/p>", "options": [{"texte_html": "Asymétrique à gauche", "score": 100.0, "feedback_html": "<p>Exact. Moyenne &lt; médiane &lt; mode. La moyenne est tirée vers les petites valeurs : la queue de la distribution est à gauche.<\/p>"}, {"texte_html": "Asymétrique à droite", "score": -20.0, "feedback_html": "<p>Le sommet (le mode) est à droite, mais l'asymétrie se nomme du côté de la queue, pas du côté du sommet. Ici, la queue est à gauche.<\/p>"}, {"texte_html": "Symétrique", "score": -30.0, "feedback_html": "<p>Dans une distribution symétrique, mode, médiane et moyenne sont confondus ou très proches. Ici, ils s'étalent de 8 à 12.<\/p>"}, {"texte_html": "Bimodale", "score": -50.0, "feedback_html": "<p>L'énoncé précise que la distribution est unimodale. L'ordre des trois indices renseigne sur l'asymétrie, pas sur le nombre de sommets.<\/p>"}]}, {"id": "C-CM5-001", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?<\/p>", "question_texte": "Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?", "feedback_general_html": "<p>Avant d'interpréter r, toujours regarder le nuage de points. r proche de 0 ne veut pas dire « aucune liaison ».<\/p>", "options": [{"texte_html": "Il n'y a presque pas de liaison linéaire, mais il peut exister une liaison d'une autre forme.", "score": 100.0, "feedback_html": "<p>Exact. r ne mesure que la liaison linéaire. Une liaison en U (performance maximale pour un stress moyen) peut donner un r proche de 0. Il faut regarder le nuage de points.<\/p>"}, {"texte_html": "Le stress n'a aucun lien avec la performance.", "score": -20.0, "feedback_html": "<p>Conclusion trop forte. Un r proche de 0 exclut seulement une liaison linéaire. Une liaison nette en forme de U peut donner r ≈ 0.<\/p>"}, {"texte_html": "Le stress a un faible effet causal sur la performance.", "score": -50.0, "feedback_html": "<p>Une corrélation ne permet pas de conclure à un effet causal, quelle que soit sa valeur.<\/p>"}, {"texte_html": "Il faudrait plutôt calculer la covariance, qui détecte les liaisons non linéaires.", "score": -30.0, "feedback_html": "<p>La covariance mesure la même chose que r (une liaison linéaire), mais dans les unités des variables. Elle ne détecte pas mieux une liaison en U.<\/p>"}]}, {"id": "S-001", "type": "serie", "categorie": "interpretation", "cm": [3, 4], "etude": {"titre": "Score de dépression selon la filière"}, "etude_html": "<h4>Score de dépression selon la filière<\/h4><p>300 étudiants de L1 à L3 (sciences, psychologie, arts, 100 par filière) ont rempli l'échelle de dépression de la DASS-21 (score de 0 à 42). On compare la distribution du score dans les trois filières.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Jeu de données fil rouge du cours (production_aleatoire.csv).<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Arts<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Psychologie<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Sciences<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Manquant<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">10,46<\/td><td style=\"padding:2px 12px;text-align:right\">10,14<\/td><td style=\"padding:2px 12px;text-align:right\">7,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">10,28<\/td><td style=\"padding:2px 12px;text-align:right\">9,69<\/td><td style=\"padding:2px 12px;text-align:right\">9,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">42<\/td><td style=\"padding:2px 12px;text-align:right\">34<\/td><td style=\"padding:2px 12px;text-align:right\">38<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">25e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,00<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">75e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">16,0<\/td><td style=\"padding:2px 12px;text-align:right\">16,5<\/td><td style=\"padding:2px 12px;text-align:right\">12,0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Asymétrie<\/td><td style=\"padding:2px 12px;text-align:right\">1,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,75<\/td><td style=\"padding:2px 12px;text-align:right\">1,41<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Aplatissement<\/td><td style=\"padding:2px 12px;text-align:right\">0,18<\/td><td style=\"padding:2px 12px;text-align:right\">-0,55<\/td><td style=\"padding:2px 12px;text-align:right\">1,03<\/td><\/tr><\/table><p style=\"font-size:0.85em;color:#555;margin-top:2px\">Variable dass_depression, séparée par filiere<\/p>", "questions": [{"id": "S-001-q1", "difficulte": 1, "question_html": "<p>Dans quelle filière la médiane du score de dépression est-elle la plus basse ?<\/p>", "question_texte": "Dans quelle filière la médiane du score de dépression est-elle la plus basse ?", "feedback_general_html": "<p>On lit la ligne « Médiane » du tableau. Elle vaut 8 en arts et en psychologie, 4 en sciences.<\/p>", "options": [{"texte_html": "Sciences", "score": 100.0, "feedback_html": "<p>Exact. La médiane vaut 4 en sciences, contre 8 dans les deux autres filières. La moitié des étudiants de sciences a un score de 4 ou moins.<\/p>"}, {"texte_html": "Arts", "score": -20.0, "feedback_html": "<p>La médiane d'arts vaut 8. Vous avez peut-être lu une autre ligne du tableau, comme la moyenne ou le maximum.<\/p>"}, {"texte_html": "Psychologie", "score": -30.0, "feedback_html": "<p>La médiane de psychologie vaut 8, comme en arts. C'est en sciences qu'elle est la plus basse (4).<\/p>"}, {"texte_html": "Elle est la même dans les trois filières, puisque le minimum vaut 0 partout.", "score": -50.0, "feedback_html": "<p>Le minimum et la médiane sont deux indices différents. Le minimum est la plus petite valeur ; la médiane coupe le groupe en deux moitiés.<\/p>"}]}, {"id": "S-001-q2", "difficulte": 2, "question_html": "<p>Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?<\/p>", "question_texte": "Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?", "feedback_general_html": "<p>Quand la moyenne dépasse nettement la médiane, la distribution est asymétrique à droite. Les coefficients d'asymétrie, tous positifs, le confirment.<\/p>", "options": [{"texte_html": "La distribution est étirée vers la droite ; quelques scores élevés tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est sensible aux valeurs extrêmes ; la médiane ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La distribution est étirée vers la gauche.", "score": -30.0, "feedback_html": "<p>C'est l'inverse. La moyenne est tirée du côté de la queue de la distribution. Ici elle est au-dessus de la médiane, donc la queue est à droite, vers les scores élevés.<\/p>"}, {"texte_html": "Il y a des données manquantes dans le tableau.", "score": -50.0, "feedback_html": "<p>La ligne « Manquant » vaut 0 dans les trois filières. L'écart entre moyenne et médiane vient de la forme de la distribution.<\/p>"}, {"texte_html": "La plupart des étudiants ont un score supérieur à la moyenne.", "score": -20.0, "feedback_html": "<p>C'est le contraire. La médiane étant sous la moyenne, plus de la moitié des étudiants ont un score inférieur à la moyenne.<\/p>"}]}, {"id": "S-001-q3", "difficulte": 2, "question_html": "<p>On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?<\/p>", "question_texte": "On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?", "feedback_general_html": "<p>Pour une distribution asymétrique ou avec des valeurs extrêmes, on décrit la position par la médiane et la dispersion par l'écart interquartile (Q3 − Q1).<\/p>", "options": [{"texte_html": "L'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Les distributions sont asymétriques, avec des valeurs élevées isolées. L'écart interquartile est robuste. Il vaut 14 en arts, 14,5 en psychologie et 12 en sciences.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type n'est pas faux, mais il est sensible aux valeurs extrêmes. Avec des distributions aussi asymétriques, on lui préfère un indice robuste.<\/p>"}, {"texte_html": "L'étendue", "score": -50.0, "feedback_html": "<p>L'étendue est l'indice le moins robuste. Elle ne dépend que des deux valeurs les plus extrêmes : en arts, un seul étudiant à 42 suffit à la gonfler.<\/p>"}, {"texte_html": "La variance", "score": -30.0, "feedback_html": "<p>La variance a les mêmes défauts que l'écart-type, et elle s'exprime en plus dans une unité au carré, difficile à interpréter.<\/p>"}]}, {"id": "S-001-q4", "difficulte": 3, "question_html": "<p>D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?<\/p>", "question_texte": "D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?", "feedback_general_html": "<p>Règle de Tukey : une valeur est atypique si elle dépasse Q3 + 1,5 × EIQ ou si elle est sous Q1 − 1,5 × EIQ.<\/p>", "options": [{"texte_html": "Au-dessus de 30", "score": 100.0, "feedback_html": "<p>Exact. En sciences, Q1 = 0 et Q3 = 12, donc EIQ = 12. Borne haute : 12 + 1,5 × 12 = 30. Les scores de 32, 36 et 38 sont atypiques.<\/p>"}, {"texte_html": "Au-dessus de 24", "score": -20.0, "feedback_html": "<p>24 = Q3 + EIQ. Il manque le facteur 1,5 : la borne est Q3 + 1,5 × EIQ = 12 + 18 = 30.<\/p>"}, {"texte_html": "Au-dessus de 38", "score": -50.0, "feedback_html": "<p>38 est le maximum observé, pas une borne. La règle de Tukey se calcule à partir des quartiles, pas des valeurs extrêmes.<\/p>"}, {"texte_html": "Au-dessus de 37", "score": -30.0, "feedback_html": "<p>37 est la borne calculée en cours sur les 300 étudiants (Q1 = 2, Q3 = 16). Pour les seuls étudiants de sciences, il faut utiliser leurs propres quartiles.<\/p>"}]}, {"id": "S-001-q5", "difficulte": 2, "question_html": "<p>Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?<\/p>", "question_texte": "Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?", "feedback_general_html": "<p>Coefficient d'asymétrie positif = asymétrie à droite ; au-delà de 1, elle est nette. Penser à vérifier sur un graphique que quelques valeurs extrêmes ne suffisent pas à l'expliquer.<\/p>", "options": [{"texte_html": "Elle est nettement asymétrique à droite, plus que dans les deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient d'asymétrie (1,41) dépasse 1, et c'est le plus élevé des trois. La médiane (4) est aussi loin sous la moyenne (7,80).<\/p>"}, {"texte_html": "Elle est asymétrique à gauche.", "score": -20.0, "feedback_html": "<p>Un coefficient d'asymétrie positif signale une asymétrie à droite, c'est-à-dire une queue vers les valeurs élevées.<\/p>"}, {"texte_html": "Elle est proche d'une loi normale, car l'aplatissement est proche de 1.", "score": -30.0, "feedback_html": "<p>Pour une loi normale, le coefficient d'aplatissement de Jamovi vaut 0, pas 1. Et surtout, l'asymétrie de 1,41 exclut une forme normale.<\/p>"}, {"texte_html": "Elle est symétrique, car le minimum est 0 comme dans les autres filières.", "score": -50.0, "feedback_html": "<p>Le minimum ne dit rien de la symétrie. Il faut regarder le coefficient d'asymétrie, ou comparer la moyenne et la médiane.<\/p>"}]}, {"id": "S-001-q6", "difficulte": 3, "question_html": "<p>Laquelle de ces conclusions est correcte ?<\/p>", "question_texte": "Laquelle de ces conclusions est correcte ?", "feedback_general_html": "<p>Comparer des groupes, c'est comparer leur position (médiane, moyenne) et leur dispersion. Une différence observée décrit ces individus ; elle ne prouve pas une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 300 étudiants, ceux de sciences ont en général des scores de dépression plus faibles que ceux des deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. La médiane, la moyenne et les quartiles sont plus bas en sciences. La conclusion reste descriptive et ne vaut que pour ces étudiants.<\/p>"}, {"texte_html": "Faire des études de sciences protège de la dépression.", "score": -30.0, "feedback_html": "<p>C'est une conclusion causale. Ces données d'observation ne permettent pas de la tirer. D'autres variables pourraient expliquer la différence, par exemple la répartition par sexe, qui n'est pas la même selon les filières.<\/p>"}, {"texte_html": "Tous les étudiants de sciences ont un score plus bas que les étudiants d'arts.", "score": -20.0, "feedback_html": "<p>Les distributions se chevauchent largement. Le maximum en sciences (38) dépasse de beaucoup la médiane d'arts (8). Une différence de position ne dit rien de chaque individu.<\/p>"}, {"texte_html": "Les trois filières ne diffèrent pas, puisque leurs écarts-types sont presque identiques.", "score": -50.0, "feedback_html": "<p>L'écart-type mesure la dispersion, pas la position. Des groupes de même dispersion peuvent avoir des positions différentes.<\/p>"}]}]}, {"id": "S-002", "type": "serie", "categorie": "interpretation", "cm": [1], "etude": {"titre": "Qualité du sommeil des étudiants de L1"}, "etude_html": "<h4>Qualité du sommeil des étudiants de L1<\/h4><p>240 étudiants de L1 ont évalué la qualité de leur sommeil du dernier mois, de « très mauvaise » à « très bonne ».<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Données simulées pour l&#x27;exercice.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de qualite_sommeil<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">47<\/td><td style=\"padding:2px 12px;text-align:right\">19,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">27,1 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Correcte<\/td><td style=\"padding:2px 12px;text-align:right\">89<\/td><td style=\"padding:2px 12px;text-align:right\">37,1 %<\/td><td style=\"padding:2px 12px;text-align:right\">64,2 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Bonne<\/td><td style=\"padding:2px 12px;text-align:right\">63<\/td><td style=\"padding:2px 12px;text-align:right\">26,3 %<\/td><td style=\"padding:2px 12px;text-align:right\">90,4 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très bonne<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">9,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table>", "questions": [{"id": "S-002-q1", "difficulte": 1, "question_html": "<p>La variable <code>qualite_sommeil<\/code> est…<\/p>", "question_texte": "La variable `qualite_sommeil` est…", "feedback_general_html": "<p>Catégories ordonnées : variable ordinale.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses cinq modalités sont des catégories ordonnées, de « très mauvaise » à « très bonne ».<\/p>"}, {"texte_html": "nominale", "score": -20.0, "feedback_html": "<p>Les modalités ont un ordre naturel : la variable est ordinale.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>Des modalités ordonnées ne sont pas des quantités : on ne mesure pas l'écart entre « correcte » et « bonne ».<\/p>"}, {"texte_html": "dichotomique", "score": -50.0, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; celle-ci en a cinq.<\/p>"}]}, {"id": "S-002-q2", "difficulte": 1, "question_html": "<p>Combien d'étudiants déclarent un sommeil de « bonne » qualité ?<\/p>", "question_texte": "Combien d'étudiants déclarent un sommeil de « bonne » qualité ?", "feedback_general_html": "<p>Effectif : nombre d'individus d'une modalité. Pourcentage : leur part dans le total.<\/p>", "options": [{"texte_html": "63", "score": 100.0, "feedback_html": "<p>Exact. On lit la colonne « Effectifs » sur la ligne « Bonne ».<\/p>"}, {"texte_html": "23", "score": -20.0, "feedback_html": "<p>23 est l'effectif de la ligne « Très bonne », pas « Bonne ».<\/p>"}, {"texte_html": "217", "score": -30.0, "feedback_html": "<p>217 additionne les effectifs jusqu'à « Bonne » (18 + 47 + 89 + 63) : c'est un effectif cumulé.<\/p>"}, {"texte_html": "26", "score": -50.0, "feedback_html": "<p>26 vient du pourcentage (26,3 %), pas de la colonne des effectifs.<\/p>"}]}, {"id": "S-002-q3", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil au plus « correct » ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil au plus « correct » ?", "feedback_general_html": "<p>« Au plus » une modalité : pourcentage cumulé sur la ligne de cette modalité.<\/p>", "options": [{"texte_html": "64,2 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « Correcte » : 7,5 + 19,6 + 37,1.<\/p>"}, {"texte_html": "27,1 %", "score": -20.0, "feedback_html": "<p>27,1 % s'arrête à « Mauvaise ». « Au plus correct » inclut aussi « Correcte ».<\/p>"}, {"texte_html": "37,1 %", "score": -30.0, "feedback_html": "<p>37,1 % est la part de la seule modalité « Correcte ».<\/p>"}, {"texte_html": "35,8 %", "score": -50.0, "feedback_html": "<p>35,8 % est la part au-dessus de « Correcte » (bonne ou très bonne) : c'est le complément de la réponse.<\/p>"}]}, {"id": "S-002-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil bon ou très bon ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil bon ou très bon ?", "feedback_general_html": "<p>Pour une part « au moins » une modalité : 100 % moins le cumul de la modalité précédente.<\/p>", "options": [{"texte_html": "35,8 % (26,3 + 9,6, ou 100 − 64,2)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les deux modalités, ou on retire de 100 % le cumul jusqu'à « Correcte ».<\/p>"}, {"texte_html": "26,3 %", "score": -20.0, "feedback_html": "<p>26,3 % ne compte que « Bonne » ; il faut ajouter « Très bonne ».<\/p>"}, {"texte_html": "9,6 %", "score": -30.0, "feedback_html": "<p>9,6 % ne compte que « Très bonne ».<\/p>"}, {"texte_html": "90,4 %", "score": -50.0, "feedback_html": "<p>90,4 % est le cumul jusqu'à « Bonne » : il compte tout ce qui est en dessous, y compris les sommeils mauvais.<\/p>"}]}, {"id": "S-002-q5", "difficulte": 1, "question_html": "<p>Quel est le mode de cette distribution ?<\/p>", "question_texte": "Quel est le mode de cette distribution ?", "feedback_general_html": "<p>Le mode est la modalité la plus fréquente ; on le donne sous forme de modalité, pas d'effectif.<\/p>", "options": [{"texte_html": "Correcte", "score": 100.0, "feedback_html": "<p>Exact. C'est la modalité la plus fréquente (89 étudiants).<\/p>"}, {"texte_html": "89", "score": -20.0, "feedback_html": "<p>89 est l'effectif du mode. Le mode est la modalité elle-même : « Correcte ».<\/p>"}, {"texte_html": "Très bonne", "score": -30.0, "feedback_html": "<p>« Très bonne » est la dernière ligne, pas la plus fréquente (23 étudiants).<\/p>"}, {"texte_html": "Il n'y en a pas, car la variable est ordinale", "score": -50.0, "feedback_html": "<p>Toute variable a un mode, même nominale : c'est la modalité la plus fréquente.<\/p>"}]}, {"id": "S-002-q6", "difficulte": 2, "question_html": "<p>La colonne « % cumulé » a-t-elle un sens pour cette variable ?<\/p>", "question_texte": "La colonne « % cumulé » a-t-elle un sens pour cette variable ?", "feedback_general_html": "<p>Le cumul a un sens dès que les modalités sont ordonnées : variables ordinales et numériques.<\/p>", "options": [{"texte_html": "Oui, car les modalités sont ordonnées.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, « au plus correct » a un sens.<\/p>"}, {"texte_html": "Oui, car on peut toujours cumuler.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : pour une variable nominale, le cumul n'a pas de sens.<\/p>"}, {"texte_html": "Non, car la variable est qualitative.", "score": -30.0, "feedback_html": "<p>Une variable qualitative ordinale peut se cumuler : seules les variables nominales ne le peuvent pas.<\/p>"}, {"texte_html": "Non, car les effectifs sont inégaux.", "score": -50.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'ordre des modalités qui compte.<\/p>"}]}, {"id": "S-002-q7", "difficulte": 3, "question_html": "<p>Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?<\/p>", "question_texte": "Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?", "feedback_general_html": "<p>Moyenne d'une variable ordinale codée en chiffres : possible en pratique, mais discutable. La médiane est l'indice adapté.<\/p>", "options": [{"texte_html": "Il est à interpréter avec prudence : il suppose des écarts égaux entre modalités, ce qui n'est pas garanti.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, la moyenne est discutable ; la médiane est l'indice adapté.<\/p>"}, {"texte_html": "Il n'a aucun sens, comme une moyenne de filières.", "score": -20.0, "feedback_html": "<p>C'est trop sévère : contrairement à une variable nominale, les modalités sont ordonnées, et la moyenne peut donner une indication, avec prudence.<\/p>"}, {"texte_html": "Il signifie que la qualité moyenne est exactement « correcte ».", "score": -30.0, "feedback_html": "<p>Ce serait traiter le code comme une mesure exacte : rien ne garantit que les modalités soient équidistantes.<\/p>"}, {"texte_html": "C'est la modalité la plus fréquente.", "score": -50.0, "feedback_html": "<p>La modalité la plus fréquente est le mode, pas la moyenne.<\/p>"}]}, {"id": "S-002-q8", "difficulte": 2, "question_html": "<p>Laquelle de ces conclusions est permise ?<\/p>", "question_texte": "Laquelle de ces conclusions est permise ?", "feedback_general_html": "<p>Un tableau de fréquences décrit les individus observés : il ne permet ni de généraliser, ni de conclure à une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 240 étudiants, un peu plus d'un sur quatre déclare un sommeil mauvais ou très mauvais.", "score": 100.0, "feedback_html": "<p>Exact. 27,1 % des étudiants observés : la conclusion reste descriptive.<\/p>"}, {"texte_html": "Un étudiant français sur quatre dort mal.", "score": -20.0, "feedback_html": "<p>Le chiffre est juste pour ces 240 étudiants, mais la phrase généralise à tous les étudiants français.<\/p>"}, {"texte_html": "Ces étudiants dorment mal parce qu'ils révisent.", "score": -30.0, "feedback_html": "<p>Aucune cause n'est mesurée dans ces données.<\/p>"}, {"texte_html": "La plupart des étudiants dorment bien.", "score": -50.0, "feedback_html": "<p>Les sommeils bons et très bons ne représentent que 35,8 % des étudiants.<\/p>"}]}]}, {"id": "S-004", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Temps d'écran de loisir des étudiants"}, "etude_html": "<h4>Temps d&#x27;écran de loisir des étudiants<\/h4><p>Liebig et al. (2026) ont suivi 2 656 étudiants en médecine de Dresde de 2014 à 2024 : en 2024, ils passaient en moyenne 2,46 heures par jour devant un écran pour leurs loisirs. Ici, 200 étudiants ont estimé leur temps d'écran de loisir quotidien ; les réponses sont regroupées en classes de largeurs inégales.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Liebig, L., et al. (2026). Ten years of screen time among medical students in Dresden, Germany: unveiling the trends. BMC Medical Education.<\/p><p style=\"margin-bottom:2px\"><strong>Distribution en classes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr AGxGYAYAAAAANiMwAwAAAACbEZgBAAAAgM0IzAAAAADAZgRmAAAAAGAzAjMAAAAAsBmBGQAAAADYjMAMAAAAAGxGYAYAAAAANiMwAwAAAACbEZgBAAAAgM0IzAAAAADAZgRmAAAAAGAzAjMAAAAAsBmBGQAAAADYjMAMAAAAAGxGYAYAAAAANiMwAwAAAACbEZgBAAAAgM0IzAAAAADAZgRmAAAAAGAzAjMAAAAAsBmBGQAAAADY7P8AdWXrb43UMPUAAAAASUVORK5CYII=\" alt=\"Histogramme (densité en ordonnée)\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-004-q1", "difficulte": 1, "question_html": "<p>Le temps d'écran quotidien, mesuré en heures, est une variable…<\/p>", "question_texte": "Le temps d'écran quotidien, mesuré en heures, est une variable…", "feedback_general_html": "<p>Une durée est une variable numérique continue.<\/p>", "options": [{"texte_html": "numérique continue", "score": 100.0, "feedback_html": "<p>Exact. Une durée peut prendre toutes les valeurs d'un intervalle.<\/p>"}, {"texte_html": "numérique discrète", "score": -20.0, "feedback_html": "<p>Elle est bien numérique, mais une durée n'est pas un comptage : elle est continue.<\/p>"}, {"texte_html": "ordinale", "score": -30.0, "feedback_html": "<p>Les écarts entre durées ont un sens : la variable est numérique.<\/p>"}, {"texte_html": "nominale", "score": -50.0, "feedback_html": "<p>Ce sont des quantités.<\/p>"}]}, {"id": "S-004-q2", "difficulte": 1, "question_html": "<p>Quelle est la largeur de la classe [5 ; 10[ ?<\/p>", "question_texte": "Quelle est la largeur de la classe [5 ; 10[ ?", "feedback_general_html": "<p>Largeur d'une classe = borne supérieure − borne inférieure.<\/p>", "options": [{"texte_html": "5 heures", "score": 100.0, "feedback_html": "<p>Exact. Largeur = borne supérieure − borne inférieure = 10 − 5.<\/p>"}, {"texte_html": "10 heures", "score": -20.0, "feedback_html": "<p>10 est la borne supérieure, pas la largeur.<\/p>"}, {"texte_html": "1 heure", "score": -30.0, "feedback_html": "<p>C'est la largeur des premières classes, pas de celle-ci.<\/p>"}, {"texte_html": "20", "score": -50.0, "feedback_html": "<p>20 est l'effectif de la classe.<\/p>"}]}, {"id": "S-004-q3", "difficulte": 1, "question_html": "<p>Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>Distinguer effectif, pourcentage et pourcentage cumulé.<\/p>", "options": [{"texte_html": "25 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le pourcentage de la classe [1 ; 2[.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % cumule les classes [0 ; 1[ et [1 ; 2[ : c'est la part de ceux qui passent moins de 2 heures.<\/p>"}, {"texte_html": "50 %", "score": -30.0, "feedback_html": "<p>50 est l'effectif de la classe, pas un pourcentage.<\/p>"}, {"texte_html": "1 %", "score": -50.0, "feedback_html": "<p>1 heure est la largeur de la classe, pas une part.<\/p>"}]}, {"id": "S-004-q4", "difficulte": 2, "question_html": "<p>Quelle est la densité de la classe [3 ; 5[ ?<\/p>", "question_texte": "Quelle est la densité de la classe [3 ; 5[ ?", "feedback_general_html": "<p>Densité = part de la classe / largeur de la classe.<\/p>", "options": [{"texte_html": "12,5 % par heure (25 % / 2 heures)", "score": 100.0, "feedback_html": "<p>Exact. Densité = part / largeur.<\/p>"}, {"texte_html": "25 %", "score": -20.0, "feedback_html": "<p>C'est la part de la classe : il faut encore diviser par sa largeur (2 heures).<\/p>"}, {"texte_html": "8,3 % par heure", "score": -30.0, "feedback_html": "<p>On a divisé par 3, la borne inférieure, au lieu de la largeur (2).<\/p>"}, {"texte_html": "50 % par heure", "score": -50.0, "feedback_html": "<p>On a multiplié par la largeur au lieu de diviser.<\/p>"}]}, {"id": "S-004-q5", "difficulte": 2, "question_html": "<p>Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?<\/p>", "question_texte": "Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?", "feedback_general_html": "<p>Classes inégales : densité en ordonnée.<\/p>", "options": [{"texte_html": "La classe large [5 ; 10[ paraîtrait plus peuplée qu'elle ne l'est.", "score": 100.0, "feedback_html": "<p>Exact. Large de 5 heures, elle formerait une grande surface pour seulement 20 étudiants.<\/p>"}, {"texte_html": "Les classes étroites paraîtraient trop peuplées.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : ce sont les classes larges qui sont gonflées.<\/p>"}, {"texte_html": "Les effectifs ne totaliseraient plus 200.", "score": -30.0, "feedback_html": "<p>Le total ne dépend pas du graphique.<\/p>"}, {"texte_html": "L'histogramme deviendrait un diagramme en barres.", "score": -50.0, "feedback_html": "<p>Aucun lien : c'est la lecture des surfaces qui serait faussée.<\/p>"}]}, {"id": "S-004-q6", "difficulte": 3, "question_html": "<p>Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?<\/p>", "question_texte": "Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?", "feedback_general_html": "<p>Histogramme en densité : la part d'une classe se lit sur l'aire (hauteur × largeur).<\/p>", "options": [{"texte_html": "La classe [3 ; 5[ contient pourtant plus d'étudiants (50 contre 40) : c'est l'aire, et non la hauteur, qui représente la part.", "score": 100.0, "feedback_html": "<p>Exact. Densités : 12,5 contre 20 % par heure ; mais la barre [3 ; 5[ est deux fois plus large : 25 % contre 20 %.<\/p>"}, {"texte_html": "La classe [3 ; 5[ contient moins d'étudiants, puisque sa barre est plus basse.", "score": -20.0, "feedback_html": "<p>Sur un histogramme en densité, la hauteur seule ne donne pas l'effectif : il faut tenir compte de la largeur.<\/p>"}, {"texte_html": "Le graphique est faux : la barre [3 ; 5[ devrait être plus haute.", "score": -30.0, "feedback_html": "<p>Le graphique est correct : la densité divise la part par la largeur.<\/p>"}, {"texte_html": "Les deux classes contiennent autant d'étudiants.", "score": -50.0, "feedback_html": "<p>Aucune lecture ne donne ce résultat : 50 contre 40.<\/p>"}]}, {"id": "S-004-q7", "difficulte": 2, "question_html": "<p>D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>« Moins de 3 heures » : on cumule toutes les classes en dessous de 3.<\/p>", "options": [{"texte_html": "65 % (20 + 25 + 20)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les trois premières classes.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % s'arrête à 2 heures ; il faut ajouter la classe [2 ; 3[.<\/p>"}, {"texte_html": "20 %", "score": -30.0, "feedback_html": "<p>20 % est la part de la seule classe [2 ; 3[.<\/p>"}, {"texte_html": "3 %", "score": -50.0, "feedback_html": "<p>3 heures est la borne ; la question demande une part.<\/p>"}]}]}, {"id": "S-005", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Nombre de cafés bus la veille"}, "etude_html": "<h4>Nombre de cafés bus la veille<\/h4><p>Riera-Sampol et al. (2022) ont interrogé 886 étudiants de l'université des Îles Baléares : 91 % consomment de la caféine, et le café en est la première source ; environ la moitié boivent du café (56 % des femmes, 42 % des hommes). Ici, 200 étudiants ont indiqué combien de cafés ils ont bus la veille.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Riera-Sampol, A., et al. (2022). Caffeine Intake among Undergraduate Students: Sex Differences, Sources, Motivations, and Associations with Smoking Status and Self-Reported Sleep Quality. Nutrients.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de nb_cafes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">0<\/td><td style=\"padding:2px 12px;text-align:right\">96<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1<\/td><td style=\"padding:2px 12px;text-align:right\">52<\/td><td style=\"padding:2px 12px;text-align:right\">26,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">74,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">2<\/td><td style=\"padding:2px 12px;text-align:right\">30<\/td><td style=\"padding:2px 12px;text-align:right\">15,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">89,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3<\/td><td style=\"padding:2px 12px;text-align:right\">12<\/td><td style=\"padding:2px 12px;text-align:right\">6,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">95,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">4<\/td><td style=\"padding:2px 12px;text-align:right\">6<\/td><td style=\"padding:2px 12px;text-align:right\">3,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">98,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">5<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><td style=\"padding:2px 12px;text-align:right\">2,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en bâtons et fréquences cumulées croissantes<\/strong><\/p><p><img src=\"data:image/png;base64,iVBORw0KGgo options": [{"texte_html": "Un diagramme en bâtons", "score": 100.0, "feedback_html": "<p>Exact. Variable numérique discrète avec peu de valeurs.<\/p>"}, {"texte_html": "Un histogramme", "score": -20.0, "feedback_html": "<p>Inutile de regrouper en classes une variable discrète à six valeurs.<\/p>"}, {"texte_html": "Un diagramme en barres", "score": -30.0, "feedback_html": "<p>Il perdrait l'axe numérique.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il perdrait l'ordre des valeurs.<\/p>"}]}, {"id": "S-005-q2", "difficulte": 1, "question_html": "<p>Quelle part des étudiants a bu au plus 2 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au plus 2 cafés ?", "feedback_general_html": "<p>« Au plus » une valeur : % cumulé sur la ligne de cette valeur.<\/p>", "options": [{"texte_html": "89,0 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « 2 ».<\/p>"}, {"texte_html": "74,0 %", "score": -20.0, "feedback_html": "<p>74,0 % s'arrête à 1 café.<\/p>"}, {"texte_html": "15,0 %", "score": -30.0, "feedback_html": "<p>15,0 % est la part de ceux qui ont bu exactement 2 cafés.<\/p>"}, {"texte_html": "30", "score": -50.0, "feedback_html": "<p>30 est un effectif, pas une part.<\/p>"}]}, {"id": "S-005-q3", "difficulte": 1, "question_html": "<p>Quel est le mode ?<\/p>", "question_texte": "Quel est le mode ?", "feedback_general_html": "<p>Le mode est une valeur de la variable, pas un effectif.<\/p>", "options": [{"texte_html": "0 café", "score": 100.0, "feedback_html": "<p>Exact. C'est la valeur la plus fréquente (96 étudiants).<\/p>"}, {"texte_html": "96", "score": -20.0, "feedback_html": "<p>96 est l'effectif du mode ; le mode est la valeur : 0 café.<\/p>"}, {"texte_html": "1 café", "score": -30.0, "feedback_html": "<p>1 café concerne 52 étudiants, moins que 0 café.<\/p>"}, {"texte_html": "Il n'y en a pas", "score": -50.0, "feedback_html": "<p>Toute distribution a un mode.<\/p>"}]}, {"id": "S-005-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants a bu au moins 3 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au moins 3 cafés ?", "feedback_general_html": "<p>« Au moins x » = 100 % − cumul jusqu'à la valeur précédente.<\/p>", "options": [{"texte_html": "11,0 % (100 − 89,0)", "score": 100.0, "feedback_html": "<p>Exact. On retire de 100 % le cumul jusqu'à 2 cafés.<\/p>"}, {"texte_html": "6,0 %", "score": -20.0, "feedback_html": "<p>6,0 % ne compte que ceux qui ont bu exactement 3 cafés.<\/p>"}, {"texte_html": "95,0 %", "score": -30.0, "feedback_html": "<p>95,0 % est le cumul jusqu'à 3 : il compte « au plus 3 », pas « au moins 3 ».<\/p>"}, {"texte_html": "12 %", "score": -50.0, "feedback_html": "<p>12 est l'effectif de la ligne « 3 », pas un pourcentage.<\/p>"}]}, {"id": "S-005-q5", "difficulte": 2, "question_html": "<p>À partir du % cumulé, quelle est la médiane du nombre de cafés ?<\/p>", "question_texte": "À partir du % cumulé, quelle est la médiane du nombre de cafés ?", "feedback_general_html": "<p>La médiane se lit sur les fréquences cumulées : première valeur dont le cumul atteint 50 %.<\/p>", "options": [{"texte_html": "1 café : c'est la première valeur où le cumul atteint ou dépasse 50 %", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 48 % à 0 et 74 % à 1 : la moitié des étudiants a bu au plus 1 café.<\/p>"}, {"texte_html": "0 café", "score": -20.0, "feedback_html": "<p>Le cumul de 0 (48 %) n'atteint pas 50 % : 0 est le mode, pas la médiane.<\/p>"}, {"texte_html": "2,5 cafés", "score": -30.0, "feedback_html": "<p>C'est le milieu de l'échelle (0 à 5), pas la valeur qui coupe les étudiants en deux.<\/p>"}, {"texte_html": "74,0 %", "score": -50.0, "feedback_html": "<p>C'est une fréquence cumulée, pas une valeur de la variable.<\/p>"}]}, {"id": "S-005-q6", "difficulte": 3, "question_html": "<p>On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?<\/p>", "question_texte": "On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?", "feedback_general_html": "<p>Le diagramme en bâtons montre les valeurs isolées et les vides de la distribution.<\/p>", "options": [{"texte_html": "Un bâton isolé apparaît en 12, séparé des autres par un vide", "score": 100.0, "feedback_html": "<p>Exact. Chaque valeur a son bâton à sa position réelle sur l'axe.<\/p>"}, {"texte_html": "Le bâton de la valeur 5 s'allonge", "score": -20.0, "feedback_html": "<p>La valeur 12 a son propre bâton : elle ne s'ajoute pas à la valeur 5.<\/p>"}, {"texte_html": "L'étudiant n'apparaît pas, car l'axe s'arrête à 5", "score": -30.0, "feedback_html": "<p>L'axe s'étend pour placer la nouvelle valeur.<\/p>"}, {"texte_html": "Tous les bâtons changent de hauteur", "score": -50.0, "feedback_html": "<p>En effectifs, les autres bâtons ne bougent pas : seul un nouveau bâton s'ajoute.<\/p>"}]}, {"id": "S-005-q7", "difficulte": 1, "question_html": "<p>Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?<\/p>", "question_texte": "Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?", "feedback_general_html": "<p>Fonction de répartition d'une variable discrète : un escalier, qui monte à chaque valeur observée.<\/p>", "options": [{"texte_html": "Parce que la variable est discrète : la fréquence cumulée ne change qu'aux valeurs 0, 1, 2…", "score": 100.0, "feedback_html": "<p>Exact. Entre deux valeurs entières, aucun étudiant n'est ajouté : la courbe reste plate, puis monte d'un coup.<\/p>"}, {"texte_html": "Parce que l'effectif est petit", "score": -20.0, "feedback_html": "<p>Même avec beaucoup plus d'étudiants, la courbe resterait en escalier : c'est la nature discrète de la variable qui compte.<\/p>"}, {"texte_html": "C'est une erreur de tracé : la courbe devrait être lisse", "score": -30.0, "feedback_html": "<p>Pour une variable discrète, l'escalier est la représentation correcte.<\/p>"}, {"texte_html": "Parce que la variable est qualitative", "score": -50.0, "feedback_html": "<p>Le nombre de cafés est une variable numérique.<\/p>"}]}]}]</script>
<script>
(function () {
  "use strict";
  const BASE = JSON.parse(document.getElementById("donnees").textContent);
  const app = document.getElementById("app");
  const LETTRES = "ABCD";
  const NOMS_CAT = { comprehension: "Compréhension", choix: "Choix", interpretation: "Interprétation" };

  // --- mémoire légère dans le navigateur (questions déjà vues) ---
  function lireVues() { try { return JSON.parse(localStorage.getItem("l1s2-vues") || "{}"); } catch (e) { return {}; } }
  function ecrireVues(v) { try { localStorage.setItem("l1s2-vues", JSON.stringify(v)); } catch (e) {} }

  function melanger(t) { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function fmtPoints(p) { const s = (Math.round(p * 100) / 100).toString().replace(".", ","); return (p > 0 ? "+" : "") + s; }

  let session = null;

  // ------------------------------------------------------------ accueil
  function accueil() {
    const cms = [1, 2, 3, 4, 5];
    app.innerHTML = `
      <h2>Composer une série d'exercices</h2>
      <p class="note">Les questions sont tirées au hasard, en priorité parmi celles que vous n'avez pas encore vues sur cet appareil.</p>
      <form id="reglages">
        <fieldset><legend>Cours magistraux</legend><div class="choix">
          ${cms.map(c => `<label><input type="checkbox" name="cm" value="${c}" checked> CM ${c}</label>`).join("")}
        </div></fieldset>
        <fieldset><legend>Type de questions</legend><div class="choix">
          <label><input type="checkbox" name="cat" value="comprehension" checked> Compréhension du cours</label>
          <label><input type="checkbox" name="cat" value="choix" checked> Choisir un indice ou un graphique</label>
          <label><input type="checkbox" name="cat" value="interpretation" checked> Interpréter une étude (séries de questions)</label>
        </div></fieldset>
        <fieldset><legend>Difficulté</legend><div class="choix">
          <label><input type="checkbox" name="diff" value="1" checked> Facile</label>
          <label><input type="checkbox" name="diff" value="2" checked> Moyenne</label>
          <label><input type="checkbox" name="diff" value="3" checked> Difficile</label>
        </div></fieldset>
        <fieldset><legend>Nombre de questions</legend><div class="choix">
          ${[5, 10, 20, 40].map((n, i) => `<label><input type="radio" name="nb" value="${n}" ${i === 1 ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <p class="note">Une étude compte pour toutes ses questions : le total peut dépasser un peu le nombre demandé.</p></fieldset>
        <div class="bloc"><strong>Barème de l'examen.</strong> Bonne réponse : +1 point. Mauvaise réponse : un retrait qui dépend de la gravité de l'erreur (souvent −0,25 ou −0,5). « Je ne sais pas » : 0 point.</div>
        <p id="erreur" class="note" role="alert"></p>
        <div class="boutons"><button type="submit" class="principal">Commencer</button></div>
      </form>`;
    document.getElementById("reglages").addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const r = { cm: f.getAll("cm").map(Number), cat: f.getAll("cat"), diff: f.getAll("diff").map(Number), nb: Number(f.get("nb")) };
      const items = tirer(r);
      if (!items.length) { document.getElementById("erreur").textContent = "Aucune question ne correspond à ces réglages. Élargissez la sélection."; return; }
      session = { items, i: 0, reponses: [] };
      afficherQuestion();
    });
  }

  // ------------------------------------------------------------ tirage
  function tirer(r) {
    const vues = lireVues();
    const unites = [];
    for (const ex of BASE) {
      if (!r.cat.includes(ex.categorie)) continue;
      if (!ex.cm.some(c => r.cm.includes(c))) continue;
      if (ex.type === "serie") {
        const qs = ex.questions.filter(q => r.diff.includes(q.difficulte));
        if (!qs.length) continue;
        unites.push({ cle: ex.id, questions: ex.questions.map(q => Object.assign({ serie: ex, categorie: ex.categorie, cm: ex.cm }, q)) });
      } else if (r.diff.includes(ex.difficulte)) {
        unites.push({ cle: ex.id, questions: [ex] });
      }
    }
    const triees = melanger(unites).sort((a, b) => (vues[a.cle] || 0) - (vues[b.cle] || 0));
    const choisies = [];
    let n = 0;
    for (const u of triees) {
      if (n >= r.nb) break;
      if (n > 0 && n + u.questions.length > r.nb + 4) continue;
      choisies.push(u); n += u.questions.length;
    }
    // séries groupées, questions isolées mélangées autour
    return melanger(choisies).flatMap(u => u.questions.map(q => Object.assign({}, q, { options: melanger(q.options) })));
  }

  // ------------------------------------------------------------ question
  function afficherQuestion() {
    const q = session.items[session.i], total = session.items.length;
    const etude = q.serie ? `
      <div class="bloc etude">
        ${session.i > 0 && session.items[session.i - 1].serie === q.serie
          ? `<details><summary>Revoir l'étude : ${esc(q.serie.etude.titre)}</summary>${q.serie.etude_html}</details>`
          : q.serie.etude_html}
      </div>` : "";
    app.innerHTML = `
      <div class="progression"><span>Question ${session.i + 1} / ${total}</span><span>${scoreCourant()}</span></div>
      <div class="barre"><div style="width:${100 * session.i / total}%"></div></div>
      <div class="etiquettes"><span>${NOMS_CAT[q.categorie]}</span><span>CM ${q.cm.join(", ")}</span><span>${["", "Facile", "Moyenne", "Difficile"][q.difficulte]}</span></div>
      ${etude}
      <div class="enonce">${q.question_html}</div>
      <form id="qcm">
        ${q.options.map((o, k) => `
          <label class="option" data-k="${k}">
            <input type="radio" name="rep" value="${k}">
            <span class="lettre">${LETTRES[k]}</span><span>${o.texte_html}</span>
          </label>`).join("")}
        <div class="boutons">
          <button type="submit" class="principal" id="valider" disabled>Valider</button>
          <button type="button" class="secondaire" id="passer">Je ne sais pas</button>
        </div>
      </form>
      <div id="retour"></div>`;
    const form = document.getElementById("qcm");
    form.addEventListener("change", () => { document.getElementById("valider").disabled = false; });
    form.addEventListener("submit", ev => { ev.preventDefault(); corriger(Number(new FormData(form).get("rep"))); });
    document.getElementById("passer").addEventListener("click", () => corriger(null));
    window.scrollTo(0, 0);
  }

  function corriger(k) {
    const q = session.items[session.i];
    const bonne = q.options.findIndex(o => o.score === 100);
    const points = k === null ? 0 : q.options[k].score / 100;
    session.reponses.push({ q, k, points });
    const vues = lireVues(); const cle = q.serie ? q.serie.id : q.id;
    vues[cle] = (vues[cle] || 0) + (q.serie ? 1 / q.serie.questions.length : 1); ecrireVues(vues);

    document.querySelectorAll(".option").forEach(el => {
      const j = Number(el.dataset.k);
      el.classList.add("verrouillee");
      el.querySelector("input").disabled = true;
      if (j === bonne) el.classList.add("juste");
      else if (j === k) el.classList.add("fausse");
    });
    const classe = k === null ? "neutre" : (k === bonne ? "ok" : "ko");
    const titre = k === null ? "Pas de réponse" : (k === bonne ? "Bonne réponse" : "Mauvaise réponse");
    let corps = "";
    if (k !== null) corps += `<div>${q.options[k].feedback_html}</div>`;
    if (k !== bonne) corps += `<p><strong>La bonne réponse était ${LETTRES[bonne]}.</strong></p><div>${q.options[bonne].feedback_html}</div>`;
    const dernier = session.i === session.items.length - 1;
    document.getElementById("retour").innerHTML = `
      <div class="retour ${classe}">
        <p><strong>${titre}</strong> · <span class="points">${fmtPoints(points)} point${Math.abs(points) > 1 ? "s" : ""}</span></p>
        ${corps}
        ${q.feedback_general_html ? `<div class="general"><strong>À retenir.</strong> ${q.feedback_general_html}</div>` : ""}
      </div>
      <div class="boutons"><button class="principal" id="suite">${dernier ? "Voir le bilan" : "Question suivante"}</button></div>`;
    document.querySelectorAll("#qcm .boutons button").forEach(b => b.remove());
    const suite = document.getElementById("suite");
    suite.addEventListener("click", () => { session.i++; dernier ? bilan() : afficherQuestion(); });
    suite.focus();
  }

  function scoreCourant() {
    const s = session.reponses.reduce((a, r) => a + r.points, 0);
    return session.reponses.length ? `Score : ${fmtPoints(s).replace("+", "")} / ${session.reponses.length}` : "";
  }

  // ------------------------------------------------------------ bilan
  function bilan() {
    const R = session.reponses, n = R.length;
    const total = R.reduce((a, r) => a + r.points, 0);
    const sur20 = Math.max(0, 20 * total / n);
    const groupes = {};
    for (const r of R) {
      const g = NOMS_CAT[r.q.categorie];
      groupes[g] = groupes[g] || { n: 0, justes: 0, pts: 0 };
      groupes[g].n++; groupes[g].pts += r.points;
      if (r.points === 1) groupes[g].justes++;
    }
    const ratees = R.filter(r => r.points < 1);
    app.innerHTML = `
      <h2>Bilan</h2>
      <div class="score">${fmtPoints(total).replace("+", "")} / ${n}</div>
      <p>Soit ${sur20.toFixed(1).replace(".", ",")} / 20 avec le barème de l'examen. ${R.filter(r => r.points === 1).length} bonne(s) réponse(s), ${R.filter(r => r.k === null).length} « je ne sais pas ».</p>
      <table class="bilan"><tr><th>Type</th><th class="n" style="text-align:right">Questions</th><th style="text-align:right">Justes</th><th style="text-align:right">Points</th></tr>
        ${Object.entries(groupes).map(([g, v]) => `<tr><td>${g}</td><td class="n">${v.n}</td><td class="n">${v.justes}</td><td class="n">${fmtPoints(v.pts).replace("+", "")}</td></tr>`).join("")}
      </table>
      ${ratees.length ? `<h2>À revoir</h2><ul class="revoir">${ratees.map(r =>
        `<li>${r.q.question_texte} <span class="note">(CM ${r.q.cm.join(", ")})</span></li>`).join("")}</ul>` : "<p>Aucune erreur : bravo !</p>"}
      <div class="boutons"><button class="principal" id="encore">Nouvelle série</button></div>`;
    document.getElementById("encore").addEventListener("click", accueil);
    window.scrollTo(0, 0);
  }

  accueil();
})();
</script>
</body>
</html>
