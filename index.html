<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement · Statistiques L1 S2</title>
<style>
  :root {
    --accent: #5862ED; --accent-fonce: #3A43C9; --noir: #1C1C22; --gris: #6B6B73;
    --gris-clair: #E6E6EB; --fond: #F3F3FD; --vert: #1E7F4F; --vert-fond: #E7F5EE;
    --rouge: #B3261E; --rouge-fond: #FBEAE9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--noir); background: #fff; line-height: 1.5; }
  header { background: var(--noir); color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 500; }
  header p { margin: 2px 0 0; font-size: 0.85rem; color: #c9c9d6; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h2 { color: var(--accent-fonce); font-weight: 500; font-size: 1.3rem; margin: 0 0 12px; }
  fieldset { border: 1px solid var(--gris-clair); border-radius: 8px; padding: 12px 16px; margin: 0 0 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  .choix { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .choix label { cursor: pointer; }
  .note { color: var(--gris); font-size: 0.9rem; }
  .bloc { background: var(--fond); border-radius: 8px; padding: 14px 18px; margin: 14px 0; }
  button { font: inherit; border-radius: 6px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--accent-fonce); }
  .principal { background: var(--accent-fonce); color: #fff; }
  .principal:disabled { background: var(--gris-clair); border-color: var(--gris-clair); color: var(--gris); cursor: default; }
  .secondaire { background: #fff; color: var(--accent-fonce); }
  .boutons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .progression { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: var(--gris-clair); border-radius: 3px; margin-bottom: 18px; overflow: hidden; }
  .barre > div { height: 100%; background: var(--accent); transition: width .3s; }
  .etiquettes span { display: inline-block; font-size: 0.78rem; color: var(--accent-fonce); background: var(--fond);
                     border-radius: 10px; padding: 1px 9px; margin-right: 6px; }
  .enonce { font-size: 1.05rem; margin: 10px 0 14px; }
  .enonce p { margin: 0 0 8px; }
  .etude { border-left: 4px solid var(--accent); }
  .etude h4 { margin: 0 0 6px; font-size: 1rem; }
  .etude table { background: #fff; }
  .etude details summary { cursor: pointer; color: var(--accent-fonce); }
  .option { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--gris-clair); border-radius: 8px;
            padding: 10px 14px; margin: 8px 0; cursor: pointer; }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 5px; }
  .option .lettre { font-weight: 600; color: var(--accent-fonce); min-width: 1.2em; }
  .option.juste { border-color: var(--vert); background: var(--vert-fond); }
  .option.fausse { border-color: var(--rouge); background: var(--rouge-fond); }
  .option.verrouillee { cursor: default; }
  .retour { border-radius: 8px; padding: 12px 16px; margin-top: 14px; }
  .retour.ok { background: var(--vert-fond); border-left: 4px solid var(--vert); }
  .retour.ko { background: var(--rouge-fond); border-left: 4px solid var(--rouge); }
  .retour.neutre { background: var(--fond); border-left: 4px solid var(--gris); }
  .retour p { margin: 4px 0; }
  .points { font-weight: 600; }
  .general { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.1); }
  .score { font-size: 2.4rem; color: var(--accent-fonce); font-weight: 500; margin: 6px 0; }
  table.bilan { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.95rem; }
  table.bilan th, table.bilan td { padding: 5px 8px; border-bottom: 1px solid var(--gris-clair); text-align: left; }
  table.bilan td.n { text-align: right; }
  .revoir li { margin-bottom: 6px; }
  footer { text-align: center; color: var(--gris); font-size: 0.8rem; padding: 20px; }
  @media (max-width: 520px) { main { padding: 16px 12px 40px; } .score { font-size: 2rem; } }
</style>
</head>
<body>
<header>
  <h1>Statistiques appliquées à la psychologie · L1 S2</h1>
  <p>Entraînement aux QCM · Université de Lille</p>
</header>
<main id="app"></main>
<footer>188 questions disponibles · mise à jour le 15/11/2026</footer>

<script id="donnees" type="application/json">[{"id": "X-CM1-001", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Une étude recueille le nombre de séances de thérapie déjà suivies par chaque patient (de 0 à 40). Quel type de mesure lui donner (dans Jamovi par exemple) ?<\/p>", "question_texte": "Une étude recueille le nombre de séances de thérapie déjà suivies par chaque patient (de 0 à 40). Quel type de mesure lui donner (dans Jamovi par exemple) ?", "feedback_general_html": "<p>Un comptage est une variable numérique discrète. Le type de mesure commande les indices et graphiques disponibles.<\/p>", "options": [{"texte_html": "Numérique", "score": 100.0, "feedback_html": "<p>Exact. C'est un comptage : une variable numérique (discrète).<\/p>"}, {"texte_html": "Ordinal", "score": -20.0, "feedback_html": "<p>On peut ranger les valeurs, mais on peut aussi mesurer leurs écarts : 10 séances, c'est 5 de plus que 5. La variable est numérique.<\/p>"}, {"texte_html": "Nominal", "score": -30.0, "feedback_html": "<p>Ce sont des quantités, pas des catégories sans ordre.<\/p>"}, {"texte_html": "ID (identifiant)", "score": -50.0, "feedback_html": "<p>Un identifiant sert à distinguer les individus ; ici, plusieurs patients peuvent avoir le même nombre de séances.<\/p>"}]}, {"id": "X-CM1-002", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 1, "question_html": "<p>On veut décrire la répartition des 300 étudiants entre les trois filières. Que faut-il produire ?<\/p>", "question_texte": "On veut décrire la répartition des 300 étudiants entre les trois filières. Que faut-il produire ?", "feedback_general_html": "<p>Pour une variable nominale : effectifs et pourcentages par modalité, sans cumul.<\/p>", "options": [{"texte_html": "Un tableau des effectifs et des pourcentages par filière", "score": 100.0, "feedback_html": "<p>Exact. C'est le tableau de distribution d'une variable nominale.<\/p>"}, {"texte_html": "Un tableau des effectifs cumulés", "score": -20.0, "feedback_html": "<p>Le cumul suppose un ordre entre modalités : il n'a pas de sens pour une variable nominale.<\/p>"}, {"texte_html": "Le tableau de données complet", "score": -30.0, "feedback_html": "<p>Il donne la filière de chaque étudiant, mais ne résume rien.<\/p>"}, {"texte_html": "La moyenne de la filière codée 1, 2, 3", "score": -50.0, "feedback_html": "<p>Une « filière moyenne » n'a aucun sens : les chiffres ne sont que des codes.<\/p>"}]}, {"id": "X-CM1-003", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>On a l'âge en années de 500 participants (de 18 à 75 ans). Comment présenter sa distribution dans un tableau ?<\/p>", "question_texte": "On a l'âge en années de 500 participants (de 18 à 75 ans). Comment présenter sa distribution dans un tableau ?", "feedback_general_html": "<p>Quand une variable prend beaucoup de valeurs, on la regroupe en classes : ni trop, ni trop peu, de préférence de même amplitude.<\/p>", "options": [{"texte_html": "Regrouper les âges en classes de même amplitude, par exemple de 10 ans", "score": 100.0, "feedback_html": "<p>Exact. Quelques classes de même largeur rendent la distribution lisible.<\/p>"}, {"texte_html": "Une ligne par âge observé", "score": -20.0, "feedback_html": "<p>Près de 60 lignes : le tableau serait long et difficile à lire.<\/p>"}, {"texte_html": "Deux classes : moins de 40 ans, 40 ans et plus", "score": -30.0, "feedback_html": "<p>Trop peu de classes : on ne voit plus la forme de la distribution.<\/p>"}, {"texte_html": "Une ligne par participant", "score": -50.0, "feedback_html": "<p>C'est le tableau de données, pas une distribution.<\/p>"}]}, {"id": "X-CM1-004", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Dans un tableau de distribution du nombre de séances suivies par les patients, quelle colonne indique la part des patients qui ont suivi au plus 3 séances ?<\/p>", "question_texte": "Dans un tableau de distribution du nombre de séances suivies par les patients, quelle colonne indique la part des patients qui ont suivi au plus 3 séances ?", "feedback_general_html": "<p>« Au plus » une valeur : on lit le pourcentage cumulé sur la ligne de cette valeur.<\/p>", "options": [{"texte_html": "Le pourcentage cumulé, sur la ligne « 3 »", "score": 100.0, "feedback_html": "<p>Exact. Il additionne les parts de 0, 1, 2 et 3 séances.<\/p>"}, {"texte_html": "Le pourcentage, sur la ligne « 3 »", "score": -20.0, "feedback_html": "<p>Il ne compte que les patients à exactement 3 séances, pas ceux qui en ont suivi moins.<\/p>"}, {"texte_html": "L'effectif, sur la ligne « 3 »", "score": -30.0, "feedback_html": "<p>Il n'est ni cumulé, ni exprimé en proportion.<\/p>"}, {"texte_html": "La ligne de l'effectif le plus grand", "score": -50.0, "feedback_html": "<p>Cette ligne donne le mode, sans rapport avec « au plus 3 ».<\/p>"}]}, {"id": "X-CM1-006", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>Un chercheur veut pouvoir calculer plus tard une moyenne d'anxiété. Comment doit-il la recueillir ?<\/p>", "question_texte": "Un chercheur veut pouvoir calculer plus tard une moyenne d'anxiété. Comment doit-il la recueillir ?", "feedback_general_html": "<p>Le type de variable se décide au moment du recueil : on peut toujours simplifier une variable numérique ensuite, jamais l'inverse.<\/p>", "options": [{"texte_html": "Par un score numérique à un questionnaire (par exemple de 0 à 42)", "score": 100.0, "feedback_html": "<p>Exact. Seule une variable numérique permet une moyenne pleinement interprétable.<\/p>"}, {"texte_html": "En trois catégories : faible, moyenne, forte", "score": -20.0, "feedback_html": "<p>Ce serait une variable ordinale : sa moyenne serait discutable, et le regroupement perdrait de l'information.<\/p>"}, {"texte_html": "Par une unique question oui / non", "score": -30.0, "feedback_html": "<p>La moyenne d'une variable 0/1 n'est qu'une proportion : elle ne mesure pas un niveau d'anxiété.<\/p>"}, {"texte_html": "Par un code 1, 2, 3 attribué à chaque groupe de passation", "score": -50.0, "feedback_html": "<p>Un code de groupe n'est pas une mesure de l'anxiété.<\/p>"}]}, {"id": "X-CM1-007", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 2, "question_html": "<p>La variable « nombre de frères et sœurs » va de 0 à 6 chez 200 étudiants. Faut-il la regrouper en classes pour la décrire ?<\/p>", "question_texte": "La variable « nombre de frères et sœurs » va de 0 à 6 chez 200 étudiants. Faut-il la regrouper en classes pour la décrire ?", "feedback_general_html": "<p>Regrouper en classes simplifie mais fait perdre de l'information : on ne le fait que si le tableau valeur par valeur serait illisible.<\/p>", "options": [{"texte_html": "Non : avec 7 valeurs possibles, un tableau valeur par valeur reste lisible.", "score": 100.0, "feedback_html": "<p>Exact. On ne regroupe en classes que lorsque les valeurs sont trop nombreuses.<\/p>"}, {"texte_html": "Oui, une variable numérique se regroupe toujours en classes.", "score": -20.0, "feedback_html": "<p>Les classes servent quand les valeurs sont trop nombreuses ; avec 7 valeurs, ce n'est pas nécessaire.<\/p>"}, {"texte_html": "Non, car on ne peut pas regrouper une variable discrète.", "score": -30.0, "feedback_html": "<p>On peut regrouper une variable discrète quand elle prend beaucoup de valeurs.<\/p>"}, {"texte_html": "Oui, car c'est une variable continue.", "score": -50.0, "feedback_html": "<p>C'est un comptage, donc une variable discrète.<\/p>"}]}, {"id": "X-CM1-008", "type": "question", "categorie": "choix", "cm": [1], "difficulte": 3, "question_html": "<p>Un chercheur hésite à remplacer le score DASS par ses 5 catégories dans toutes ses analyses. Quel argument est correct ?<\/p>", "question_texte": "Un chercheur hésite à remplacer le score DASS par ses 5 catégories dans toutes ses analyses. Quel argument est correct ?", "feedback_general_html": "<p>Simplifier une variable peut aider à la lecture, mais fait toujours perdre de l'information.<\/p>", "options": [{"texte_html": "Les catégories facilitent la lecture clinique, mais font perdre de l'information : mieux vaut garder aussi le score.", "score": 100.0, "feedback_html": "<p>Exact. Les catégories sont parlantes, mais le score contient plus d'information.<\/p>"}, {"texte_html": "Les deux contiennent exactement la même information.", "score": -20.0, "feedback_html": "<p>Plusieurs scores donnent la même catégorie : le regroupement perd de l'information.<\/p>"}, {"texte_html": "Le score n'a pas de sens, car il est ordinal.", "score": -30.0, "feedback_html": "<p>Le score DASS est une variable numérique ; ce sont les catégories qui sont ordinales.<\/p>"}, {"texte_html": "Les catégories sont plus précises que le score.", "score": -50.0, "feedback_html": "<p>C'est l'inverse : les catégories sont moins précises que le score.<\/p>"}]}, {"id": "X-CM2-001", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 1, "question_html": "<p>Une enquête relève le niveau d'études de 250 étudiants (L1, L2, L3, M1, M2). Quel graphique faut-il choisir pour représenter cette variable ?<\/p>", "question_texte": "Une enquête relève le niveau d'études de 250 étudiants (L1, L2, L3, M1, M2). Quel graphique faut-il choisir pour représenter cette variable ?", "feedback_general_html": "<p>Variable qualitative : diagramme en barres. Si elle est ordinale, les barres suivent l'ordre des modalités ; si elle est nominale, l'ordre est libre.<\/p>", "options": [{"texte_html": "Un diagramme en barres, avec les barres dans l'ordre L1, L2, L3, M1, M2", "score": 100.0, "feedback_html": "<p>Exact. La variable est qualitative ordinale : des barres séparées, rangées dans l'ordre des modalités.<\/p>"}, {"texte_html": "Un histogramme", "score": -50.0, "feedback_html": "<p>L'histogramme est réservé aux variables numériques continues regroupées en classes. Le niveau d'études est une variable qualitative.<\/p>"}, {"texte_html": "Un diagramme en barres, avec les barres rangées par effectif décroissant", "score": -20.0, "feedback_html": "<p>Le type de graphique est le bon, mais trier par effectif casse l'ordre naturel des modalités. Cela convient à une variable nominale, pas ordinale.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -30.0, "feedback_html": "<p>Le camembert se lit mal (on compare des angles) et fait perdre l'ordre des modalités. Avec cinq modalités, il devient difficile à lire.<\/p>"}]}, {"id": "X-CM2-003", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 1, "question_html": "<p>On a relevé le nombre d'enfants (de 0 à 5) de 150 parents. Quel graphique choisir ?<\/p>", "question_texte": "On a relevé le nombre d'enfants (de 0 à 5) de 150 parents. Quel graphique choisir ?", "feedback_general_html": "<p>Numérique discrète : diagramme en bâtons.<\/p>", "options": [{"texte_html": "Un diagramme en bâtons", "score": 100.0, "feedback_html": "<p>Exact. Variable numérique discrète avec peu de valeurs : un bâton par valeur.<\/p>"}, {"texte_html": "Un histogramme", "score": -20.0, "feedback_html": "<p>Avec six valeurs possibles, inutile de regrouper en classes.<\/p>"}, {"texte_html": "Un diagramme en barres", "score": -30.0, "feedback_html": "<p>Il perdrait l'axe numérique, qui montre l'écart entre les valeurs.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il perdrait l'ordre et la position des valeurs.<\/p>"}]}, {"id": "X-CM2-007", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 2, "question_html": "<p>On veut pouvoir lire, pour toute valeur x, la part des étudiants qui ont produit au plus x répétitions. Quel graphique choisir ?<\/p>", "question_texte": "On veut pouvoir lire, pour toute valeur x, la part des étudiants qui ont produit au plus x répétitions. Quel graphique choisir ?", "feedback_general_html": "<p>« Au plus x » : fréquences cumulées, donc fonction de répartition.<\/p>", "options": [{"texte_html": "La fonction de répartition", "score": 100.0, "feedback_html": "<p>Exact. Elle donne, pour chaque valeur, la part cumulée des individus en dessous.<\/p>"}, {"texte_html": "Le diagramme en bâtons", "score": -20.0, "feedback_html": "<p>Il donne la part de chaque valeur, pas le cumul ; il faudrait additionner les bâtons.<\/p>"}, {"texte_html": "L'histogramme", "score": -30.0, "feedback_html": "<p>Il donne la part de chaque classe, pas le cumul.<\/p>"}, {"texte_html": "Le diagramme circulaire", "score": -50.0, "feedback_html": "<p>Aucun cumul n'est possible sur un cercle.<\/p>"}]}, {"id": "X-CM2-008", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 2, "question_html": "<p>On veut superposer les distributions du nombre de répétitions de trois filières de tailles différentes. Quel graphique choisir ?<\/p>", "question_texte": "On veut superposer les distributions du nombre de répétitions de trois filières de tailles différentes. Quel graphique choisir ?", "feedback_general_html": "<p>Superposer des distributions : diagrammes en ligne, en pourcentage de chaque groupe.<\/p>", "options": [{"texte_html": "Trois diagrammes en ligne, en pourcentage de chaque groupe", "score": 100.0, "feedback_html": "<p>Exact. Les diagrammes en ligne se superposent bien, et les pourcentages rendent les groupes comparables.<\/p>"}, {"texte_html": "Trois diagrammes en ligne, en effectifs", "score": -20.0, "feedback_html": "<p>La superposition est bonne, mais les tailles différentes faussent la comparaison.<\/p>"}, {"texte_html": "Un seul diagramme en bâtons pour tous les étudiants", "score": -30.0, "feedback_html": "<p>On ne distinguerait plus les filières.<\/p>"}, {"texte_html": "Un diagramme circulaire par filière", "score": -50.0, "feedback_html": "<p>On perdrait l'axe numérique du nombre de répétitions.<\/p>"}]}, {"id": "X-CM2-009", "type": "question", "categorie": "choix", "cm": [2], "difficulte": 2, "question_html": "<p>On a regroupé l'âge en classes inégales (18–20, 21–25, 26–40, 41–70). Comment construire l'histogramme ?<\/p>", "question_texte": "On a regroupé l'âge en classes inégales (18–20, 21–25, 26–40, 41–70). Comment construire l'histogramme ?", "feedback_general_html": "<p>Classes inégales : densité en ordonnée.<\/p>", "options": [{"texte_html": "Mettre la densité en ordonnée, ou refaire des classes de même largeur", "score": 100.0, "feedback_html": "<p>Exact. La densité (part / largeur) rend les aires proportionnelles aux parts.<\/p>"}, {"texte_html": "Mettre les pourcentages en ordonnée", "score": -20.0, "feedback_html": "<p>Les pourcentages ont le même défaut que les effectifs avec des classes inégales.<\/p>"}, {"texte_html": "Mettre les effectifs en ordonnée", "score": -30.0, "feedback_html": "<p>Les classes larges, comme 41–70, paraîtraient trop peuplées.<\/p>"}, {"texte_html": "Faire un diagramme en barres séparées", "score": -50.0, "feedback_html": "<p>L'âge est continu : on garde un histogramme.<\/p>"}]}, {"id": "X-CM3-001", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une expérience de temps de réaction, la plupart des participants répondent en 300 à 500 ms, mais quelques-uns, inattentifs, mettent plus de 2 000 ms. Quel couple d'indices choisir pour décrire ces temps ?<\/p>", "question_texte": "Dans une expérience de temps de réaction, la plupart des participants répondent en 300 à 500 ms, mais quelques-uns, inattentifs, mettent plus de 2 000 ms. Quel couple d'indices choisir pour décrire ces temps ?", "feedback_general_html": "<p>Couples cohérents : moyenne + écart-type (distribution symétrique, sans valeurs extrêmes) ; médiane + écart interquartile (asymétrie ou valeurs extrêmes).<\/p>", "options": [{"texte_html": "La médiane et l'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Avec des valeurs extrêmes, on choisit des indices robustes, et un couple cohérent position + dispersion.<\/p>"}, {"texte_html": "La moyenne et l'écart-type", "score": -50.0, "feedback_html": "<p>C'est le couple adapté à une distribution à peu près symétrique, sans valeurs extrêmes. Ici, les quelques temps très longs tireraient la moyenne et l'écart-type vers le haut.<\/p>"}, {"texte_html": "La médiane et l'étendue", "score": -30.0, "feedback_html": "<p>La médiane convient, mais l'étendue est l'indice le moins robuste. Elle ne dépend que du minimum et du maximum, donc précisément des temps aberrants.<\/p>"}, {"texte_html": "La moyenne et l'écart interquartile", "score": -20.0, "feedback_html": "<p>L'écart interquartile convient, mais la moyenne n'est pas robuste. Et l'on associe d'habitude médiane avec EIQ, moyenne avec écart-type.<\/p>"}]}, {"id": "X-CM3-002", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 1, "question_html": "<p>On décrit la couleur préférée de 200 enfants (rouge, bleu, vert, jaune, autre). Quel paramètre de position donner ?<\/p>", "question_texte": "On décrit la couleur préférée de 200 enfants (rouge, bleu, vert, jaune, autre). Quel paramètre de position donner ?", "feedback_general_html": "<p>Nominale : mode. Ordinale : médiane. Numérique : moyenne ou médiane.<\/p>", "options": [{"texte_html": "Le mode", "score": 100.0, "feedback_html": "<p>Exact. La variable est nominale : le mode est le seul paramètre de position utilisable.<\/p>"}, {"texte_html": "La médiane", "score": -20.0, "feedback_html": "<p>La médiane suppose qu'on puisse ranger les modalités ; il n'y a pas d'ordre entre les couleurs.<\/p>"}, {"texte_html": "La moyenne", "score": -30.0, "feedback_html": "<p>On ne peut pas additionner des couleurs.<\/p>"}, {"texte_html": "L'écart-type", "score": -50.0, "feedback_html": "<p>C'est un paramètre de dispersion, et il suppose une variable numérique.<\/p>"}]}, {"id": "X-CM3-004", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 2, "question_html": "<p>150 personnes ont répondu à une question d'accord en cinq points (de « pas du tout » à « tout à fait »). Quel couple de paramètres choisir ?<\/p>", "question_texte": "150 personnes ont répondu à une question d'accord en cinq points (de « pas du tout » à « tout à fait »). Quel couple de paramètres choisir ?", "feedback_general_html": "<p>Variable ordinale : médiane et écart interquartile.<\/p>", "options": [{"texte_html": "La médiane et l'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Variable ordinale : on peut ranger les réponses, donc calculer médiane et quartiles.<\/p>"}, {"texte_html": "La moyenne et l'écart-type", "score": -20.0, "feedback_html": "<p>C'est fréquent en pratique, mais cela suppose des écarts égaux entre les modalités : un choix discuté.<\/p>"}, {"texte_html": "La médiane et l'écart-type", "score": -30.0, "feedback_html": "<p>La médiane convient, mais l'écart-type suppose une variable numérique et va avec la moyenne.<\/p>"}, {"texte_html": "Le mode et l'étendue", "score": -50.0, "feedback_html": "<p>Le mode n'utilise pas l'ordre des modalités, et l'étendue (de 1 à 5, presque toujours) ne dit presque rien.<\/p>"}]}, {"id": "X-CM3-007", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 1, "question_html": "<p>On veut montrer, en un seul graphique, la médiane, les quartiles et les valeurs isolées d'un score dans quatre groupes. Quel graphique choisir ?<\/p>", "question_texte": "On veut montrer, en un seul graphique, la médiane, les quartiles et les valeurs isolées d'un score dans quatre groupes. Quel graphique choisir ?", "feedback_general_html": "<p>Pour comparer des distributions numériques entre groupes : des boîtes à moustaches côte à côte.<\/p>", "options": [{"texte_html": "Quatre boîtes à moustaches côte à côte", "score": 100.0, "feedback_html": "<p>Exact. Chaque boîte résume la médiane, les quartiles et les points isolés, et les boîtes se comparent facilement.<\/p>"}, {"texte_html": "Quatre histogrammes", "score": -20.0, "feedback_html": "<p>Ils montrent la forme de chaque distribution, mais ni la médiane ni les quartiles directement, et se comparent moins bien.<\/p>"}, {"texte_html": "Un diagramme en barres des moyennes des quatre groupes", "score": -30.0, "feedback_html": "<p>Il ne montre que la moyenne : ni médiane, ni quartiles, ni valeurs isolées.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il représente les parts d'un tout, pas la distribution d'un score.<\/p>"}]}, {"id": "X-CM3-009", "type": "question", "categorie": "choix", "cm": [3], "difficulte": 2, "question_html": "<p>Une variable vaut 1 si le participant a réussi l'épreuve et 0 sinon. Quel paramètre donne directement le taux de réussite ?<\/p>", "question_texte": "Une variable vaut 1 si le participant a réussi l'épreuve et 0 sinon. Quel paramètre donne directement le taux de réussite ?", "feedback_general_html": "<p>Variable codée 0/1 : moyenne = proportion de 1.<\/p>", "options": [{"texte_html": "La moyenne", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable codée 0/1, la moyenne est la proportion de 1, ici le taux de réussite.<\/p>"}, {"texte_html": "Le mode", "score": -20.0, "feedback_html": "<p>Il dit seulement si la majorité a réussi (1) ou échoué (0), pas dans quelle proportion.<\/p>"}, {"texte_html": "La médiane", "score": -30.0, "feedback_html": "<p>Elle vaut 0 ou 1 : elle dit seulement si au moins la moitié a réussi.<\/p>"}, {"texte_html": "L'écart-type", "score": -50.0, "feedback_html": "<p>C'est un paramètre de dispersion.<\/p>"}]}, {"id": "X-CM4-001", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 3, "question_html": "<p>Léa a obtenu 15 à un test de mémoire (moyenne du groupe 12, écart-type 2) et 18 à un test d'attention (moyenne 14, écart-type 4). Pour savoir dans quel test sa performance est la plus remarquable, que faut-il faire ?<\/p>", "question_texte": "Léa a obtenu 15 à un test de mémoire (moyenne du groupe 12, écart-type 2) et 18 à un test d'attention (moyenne 14, écart-type 4). Pour savoir dans quel test sa performance est la plus remarquable, que faut-il faire ?", "feedback_general_html": "<p>Le score z, z = (x − moyenne) / écart-type, exprime l'écart à la moyenne en nombre d'écarts-types. Il permet de comparer des valeurs mesurées sur des échelles différentes.<\/p>", "options": [{"texte_html": "Calculer ses scores z dans chaque test et les comparer", "score": 100.0, "feedback_html": "<p>Exact. Mémoire : z = (15 − 12) / 2 = 1,5. Attention : z = (18 − 14) / 4 = 1. Sa performance est plus remarquable en mémoire, alors que son écart brut y est plus petit.<\/p>"}, {"texte_html": "Comparer directement ses deux notes, 15 et 18", "score": -30.0, "feedback_html": "<p>Les deux tests n'ont ni la même moyenne ni la même dispersion. Une note brute seule ne dit pas si la performance est haute ou basse dans son groupe.<\/p>"}, {"texte_html": "Comparer ses écarts bruts à la moyenne, 3 et 4 points", "score": -20.0, "feedback_html": "<p>C'est la moitié du chemin. Il faut aussi tenir compte de la dispersion de chaque test. Un écart de 4 points compte moins quand l'écart-type vaut 4 que quand il vaut 2.<\/p>"}, {"texte_html": "Comparer les coefficients d'asymétrie des deux tests", "score": -50.0, "feedback_html": "<p>L'asymétrie décrit la forme de chaque distribution. Elle ne dit pas où se situe Léa dans chacune.<\/p>"}]}, {"id": "X-CM4-002", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 2, "question_html": "<p>Un score de symptômes est nettement asymétrique à droite, avec quelques valeurs atypiques. Quel couple de paramètres choisir pour le décrire ?<\/p>", "question_texte": "Un score de symptômes est nettement asymétrique à droite, avec quelques valeurs atypiques. Quel couple de paramètres choisir pour le décrire ?", "feedback_general_html": "<p>Asymétrie ou valeurs atypiques : médiane et écart interquartile.<\/p>", "options": [{"texte_html": "La médiane et l'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Ils sont robustes et forment un couple cohérent.<\/p>"}, {"texte_html": "La médiane et l'écart-type", "score": -20.0, "feedback_html": "<p>La médiane convient, mais l'écart-type est sensible aux valeurs atypiques et va avec la moyenne.<\/p>"}, {"texte_html": "La moyenne et l'écart-type", "score": -30.0, "feedback_html": "<p>Ils conviennent à une distribution à peu près symétrique, sans valeurs extrêmes.<\/p>"}, {"texte_html": "Le mode et le coefficient d'aplatissement", "score": -50.0, "feedback_html": "<p>Ni l'un ni l'autre ne décrit la position et la dispersion de façon satisfaisante.<\/p>"}]}, {"id": "X-CM4-005", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 2, "question_html": "<p>Comment vérifier si un score suit à peu près une loi normale ?<\/p>", "question_texte": "Comment vérifier si un score suit à peu près une loi normale ?", "feedback_general_html": "<p>Normalité : graphique et comparaison avec la règle 68-95-99,7.<\/p>", "options": [{"texte_html": "Superposer à l'histogramme la loi normale de même moyenne et de même écart-type, et comparer les pourcentages observés à 1, 2 et 3 écarts-types avec 68, 95 et 99,7 %.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce qui a été fait au cours pour les répétitions (73 %, 96 %, 99,7 %).<\/p>"}, {"texte_html": "Vérifier seulement que la moyenne et la médiane sont proches.", "score": -20.0, "feedback_html": "<p>C'est nécessaire, pas suffisant : une distribution symétrique peut avoir des queues très différentes d'une loi normale, ou deux sommets.<\/p>"}, {"texte_html": "Vérifier que l'étendue vaut environ six écarts-types.", "score": -30.0, "feedback_html": "<p>L'étendue dépend des deux valeurs extrêmes : c'est un critère bien trop fragile.<\/p>"}, {"texte_html": "Calculer le score z de chaque individu.", "score": -50.0, "feedback_html": "<p>Les scores z gardent la forme de la distribution : les calculer ne dit pas si elle est normale.<\/p>"}]}, {"id": "X-CM4-007", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 1, "question_html": "<p>Un psychologue veut situer le score d'un patient par rapport à un groupe de référence dont il connaît la moyenne et l'écart-type. Quel outil choisir ?<\/p>", "question_texte": "Un psychologue veut situer le score d'un patient par rapport à un groupe de référence dont il connaît la moyenne et l'écart-type. Quel outil choisir ?", "feedback_general_html": "<p>Situer un individu dans un groupe : score z.<\/p>", "options": [{"texte_html": "Le score z du patient", "score": 100.0, "feedback_html": "<p>Exact. Il dit à combien d'écarts-types de la moyenne du groupe se trouve le patient.<\/p>"}, {"texte_html": "L'écart brut entre le score du patient et la moyenne", "score": -20.0, "feedback_html": "<p>C'est un début, mais sans l'écart-type on ne sait pas si cet écart est petit ou grand.<\/p>"}, {"texte_html": "La médiane du groupe de référence", "score": -30.0, "feedback_html": "<p>Elle décrit le groupe, pas la position du patient.<\/p>"}, {"texte_html": "Le coefficient d'asymétrie du groupe de référence", "score": -50.0, "feedback_html": "<p>Il décrit la forme du groupe, pas la position du patient.<\/p>"}]}, {"id": "X-CM4-009", "type": "question", "categorie": "choix", "cm": [4], "difficulte": 1, "question_html": "<p>Dans quel ordre le cours propose-t-il de décrire une distribution ?<\/p>", "question_texte": "Dans quel ordre le cours propose-t-il de décrire une distribution ?", "feedback_general_html": "<p>Démarche : graphique, position, dispersion, forme, valeurs atypiques.<\/p>", "options": [{"texte_html": "Graphique, position, dispersion, forme, valeurs atypiques", "score": 100.0, "feedback_html": "<p>Exact. On commence toujours par regarder le graphique.<\/p>"}, {"texte_html": "Position, dispersion, forme, valeurs atypiques, et le graphique en dernier", "score": -20.0, "feedback_html": "<p>Les étapes sont les bonnes, mais le graphique vient en premier : il guide le choix des indices.<\/p>"}, {"texte_html": "Supprimer d'abord les valeurs atypiques, puis position, dispersion et forme", "score": -30.0, "feedback_html": "<p>On ne supprime pas les valeurs atypiques d'emblée : on les repère, on les vérifie, on les signale.<\/p>"}, {"texte_html": "Calculer seulement les coefficients d'asymétrie et d'aplatissement", "score": -50.0, "feedback_html": "<p>Ils ne suffisent pas, et ils ne sont pas robustes.<\/p>"}]}, {"id": "X-CM5-001", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 2, "question_html": "<p>On veut mesurer la liaison entre l'âge de 80 patients et leur satisfaction à l'égard d'une thérapie, notée sur une échelle de 1 (pas du tout satisfait) à 5 (tout à fait satisfait). Quel indice choisir ?<\/p>", "question_texte": "On veut mesurer la liaison entre l'âge de 80 patients et leur satisfaction à l'égard d'une thérapie, notée sur une échelle de 1 (pas du tout satisfait) à 5 (tout à fait satisfait). Quel indice choisir ?", "feedback_general_html": "<p>Spearman = corrélation de Pearson calculée sur les rangs. À préférer quand une variable est ordinale, quand il y a des valeurs extrêmes, ou quand la liaison est monotone sans être linéaire.<\/p>", "options": [{"texte_html": "Le coefficient de corrélation de Spearman", "score": 100.0, "feedback_html": "<p>Exact. La satisfaction est une variable ordinale. Spearman ne travaille que sur les rangs et ne suppose pas que les écarts entre modalités sont égaux.<\/p>"}, {"texte_html": "Le coefficient de corrélation de Pearson", "score": -20.0, "feedback_html": "<p>Pearson traite l'échelle de 1 à 5 comme numérique, en supposant des écarts égaux entre modalités. Pour une variable ordinale, Spearman est plus adapté.<\/p>"}, {"texte_html": "La covariance entre l'âge et la satisfaction", "score": -30.0, "feedback_html": "<p>La covariance dépend des unités. Sa valeur ne dit rien de l'intensité de la liaison, et elle suppose aussi deux variables numériques.<\/p>"}, {"texte_html": "Aucun indice, car on ne peut pas mesurer de liaison avec une variable ordinale", "score": -50.0, "feedback_html": "<p>C'est justement le rôle du coefficient de Spearman. Il mesure une liaison monotone et fonctionne avec des variables ordinales.<\/p>"}]}, {"id": "X-CM5-002", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 1, "question_html": "<p>On veut représenter le lien entre le nombre d'heures de révision et la note obtenue par 150 étudiants. Quel graphique choisir ?<\/p>", "question_texte": "On veut représenter le lien entre le nombre d'heures de révision et la note obtenue par 150 étudiants. Quel graphique choisir ?", "feedback_general_html": "<p>Deux variables numériques : nuage de points.<\/p>", "options": [{"texte_html": "Un nuage de points", "score": 100.0, "feedback_html": "<p>Exact. Deux variables numériques mesurées sur les mêmes individus.<\/p>"}, {"texte_html": "Deux histogrammes, un par variable", "score": -20.0, "feedback_html": "<p>Ils montrent chaque distribution séparément, mais pas le lien entre les deux variables.<\/p>"}, {"texte_html": "Un diagramme en barres", "score": -30.0, "feedback_html": "<p>Il convient à une variable qualitative.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il ne montre aucun lien entre deux variables.<\/p>"}]}, {"id": "X-CM5-005", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 1, "question_html": "<p>Deux jurys classent les 12 mêmes candidats, du 1er au 12e. Quel indice choisir pour mesurer leur accord ?<\/p>", "question_texte": "Deux jurys classent les 12 mêmes candidats, du 1er au 12e. Quel indice choisir pour mesurer leur accord ?", "feedback_general_html": "<p>Variables ordinales ou rangs : Spearman.<\/p>", "options": [{"texte_html": "La corrélation de Spearman", "score": 100.0, "feedback_html": "<p>Exact. Les données sont déjà des rangs : Spearman est fait pour cela.<\/p>"}, {"texte_html": "La corrélation de Pearson", "score": -20.0, "feedback_html": "<p>Elle donnerait ici le même nombre, mais Spearman est l'indice conçu pour des rangs et des variables ordinales.<\/p>"}, {"texte_html": "La covariance", "score": -30.0, "feedback_html": "<p>Elle dépend de l'échelle et ne se lit pas comme une intensité.<\/p>"}, {"texte_html": "Le mode des classements", "score": -50.0, "feedback_html": "<p>Ce n'est pas une mesure de liaison.<\/p>"}]}, {"id": "X-CM5-006", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 1, "question_html": "<p>On trouve r = 0,04 entre l'anxiété avant un examen et la note. Que faire en premier ?<\/p>", "question_texte": "On trouve r = 0,04 entre l'anxiété avant un examen et la note. Que faire en premier ?", "feedback_general_html": "<p>Toujours regarder le nuage de points avant d'interpréter r.<\/p>", "options": [{"texte_html": "Regarder le nuage de points", "score": 100.0, "feedback_html": "<p>Exact. Une liaison en U inversé, par exemple, donnerait un r proche de 0.<\/p>"}, {"texte_html": "Calculer la covariance", "score": -20.0, "feedback_html": "<p>Elle ne verrait pas mieux une liaison non linéaire, et dépend des unités.<\/p>"}, {"texte_html": "Conclure que l'anxiété n'a aucun lien avec la note", "score": -30.0, "feedback_html": "<p>r ne mesure que la liaison linéaire : il faut d'abord regarder le nuage.<\/p>"}, {"texte_html": "Interroger davantage d'étudiants", "score": -50.0, "feedback_html": "<p>Plus d'étudiants ne changerait pas la forme de la liaison.<\/p>"}]}, {"id": "X-CM5-009", "type": "question", "categorie": "choix", "cm": [5], "difficulte": 2, "question_html": "<p>Le nuage de points entre stress et performance dessine un U inversé. Comment rendre compte de cette liaison ?<\/p>", "question_texte": "Le nuage de points entre stress et performance dessine un U inversé. Comment rendre compte de cette liaison ?", "feedback_general_html": "<p>Liaison non monotone : la décrire à partir du nuage.<\/p>", "options": [{"texte_html": "Décrire la forme du nuage (performance maximale pour un stress moyen) plutôt que donner un seul coefficient.", "score": 100.0, "feedback_html": "<p>Exact. Ni Pearson ni Spearman ne résument une liaison qui monte puis redescend.<\/p>"}, {"texte_html": "Donner la corrélation de Spearman.", "score": -20.0, "feedback_html": "<p>Spearman mesure une liaison monotone ; un U inversé ne l'est pas.<\/p>"}, {"texte_html": "Donner la corrélation de Pearson.", "score": -30.0, "feedback_html": "<p>Elle serait proche de 0 et laisserait croire à l'absence de liaison.<\/p>"}, {"texte_html": "Donner la covariance.", "score": -50.0, "feedback_html": "<p>Elle souffre du même problème que Pearson, et dépend en plus des unités.<\/p>"}]}, {"id": "C-CM1-001", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans un fichier de données, le numéro du groupe de TD de chaque étudiant (de 1 à 12) est une variable…<\/p>", "question_texte": "Dans un fichier de données, le numéro du groupe de TD de chaque étudiant (de 1 à 12) est une variable…", "feedback_general_html": "<p>Une variable codée par des chiffres n'est numérique que si ces chiffres représentent des quantités. Un numéro de groupe, d'étudiant ou un code postal sont des variables nominales.<\/p>", "options": [{"texte_html": "nominale", "score": 100.0, "feedback_html": "<p>Exact. Le numéro sert seulement à nommer le groupe. Le groupe 6 n'est pas « deux fois » le groupe 3, et il n'est pas « plus » que le groupe 2.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>C'est le piège classique : des chiffres ne font pas une variable numérique. Test simple : une moyenne des numéros de groupe aurait-elle un sens ? Non.<\/p>"}, {"texte_html": "ordinale", "score": -20.0, "feedback_html": "<p>Les groupes ne sont pas rangés selon un ordre qui a un sens. Le groupe 12 n'est pas « au-dessus » du groupe 1.<\/p>"}, {"texte_html": "numérique continue", "score": -50.0, "feedback_html": "<p>Une variable continue suppose des valeurs qui sont des quantités, avec toujours une valeur possible entre deux autres. Ce n'est pas le cas d'un numéro de groupe.<\/p>"}]}, {"id": "C-CM1-002", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une expérience de temps de réaction, chacun des 10 participants réalise 40 essais. On analyse la durée de chaque essai. Quels sont les individus statistiques ?<\/p>", "question_texte": "Dans une expérience de temps de réaction, chacun des 10 participants réalise 40 essais. On analyse la durée de chaque essai. Quels sont les individus statistiques ?", "feedback_general_html": "<p>L'individu (ou unité statistique) est l'entité sur laquelle on mesure les variables : une ligne du tableau de données. Ce n'est pas forcément une personne : un essai, une séance, une classe…<\/p>", "options": [{"texte_html": "Chacun des 400 essais", "score": 100.0, "feedback_html": "<p>Exact. On mesure une durée par essai : chaque essai est une ligne du tableau de données, donc un individu statistique. Il y en a 10 × 40 = 400.<\/p>"}, {"texte_html": "Chacun des 10 participants", "score": -20.0, "feedback_html": "<p>C'est l'erreur la plus fréquente : un individu statistique n'est pas toujours une personne. Ici, la durée est mesurée à chaque essai, pas une seule fois par participant.<\/p>"}, {"texte_html": "Les temps de réaction", "score": -30.0, "feedback_html": "<p>Le temps de réaction est la variable mesurée, pas l'individu. L'individu est ce sur quoi on mesure la variable : l'essai.<\/p>"}, {"texte_html": "L'expérience dans son ensemble", "score": -50.0, "feedback_html": "<p>L'expérience est l'étude elle-même. Les individus sont les unités sur lesquelles on recueille une valeur, ici les essais.<\/p>"}]}, {"id": "C-CM1-005", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pour la variable <code>filiere<\/code>, « Sciences », « Psychologie » et « Arts » sont…<\/p>", "question_texte": "Pour la variable `filiere`, « Sciences », « Psychologie » et « Arts » sont…", "feedback_general_html": "<p>Une variable est une caractéristique qui varie d'un individu à l'autre ; ses modalités sont les valeurs qu'elle peut prendre.<\/p>", "options": [{"texte_html": "les modalités de la variable", "score": 100.0, "feedback_html": "<p>Exact. Les modalités sont les valeurs que peut prendre une variable.<\/p>"}, {"texte_html": "trois variables différentes", "score": -20.0, "feedback_html": "<p>Il n'y a qu'une variable, la filière. Sciences, Psychologie et Arts sont ses valeurs possibles.<\/p>"}, {"texte_html": "des effectifs", "score": -30.0, "feedback_html": "<p>Un effectif est un nombre d'individus. « Sciences » est une modalité ; l'effectif est le nombre d'étudiants qui la présentent (100).<\/p>"}, {"texte_html": "des individus", "score": -50.0, "feedback_html": "<p>Les individus sont les étudiants. Sciences, Psychologie et Arts sont les valeurs que prend leur filière.<\/p>"}]}, {"id": "C-CM1-010", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>La variable <code>filiere<\/code> (Sciences, Psychologie, Arts) est…<\/p>", "question_texte": "La variable `filiere` (Sciences, Psychologie, Arts) est…", "feedback_general_html": "<p>Variable nominale : qualitative, sans ordre entre les modalités. Ordinale : qualitative, avec un ordre naturel.<\/p>", "options": [{"texte_html": "nominale", "score": 100.0, "feedback_html": "<p>Exact. Ses modalités sont des catégories sans ordre naturel.<\/p>"}, {"texte_html": "ordinale", "score": -33.33333, "feedback_html": "<p>Il n'y a pas d'ordre naturel entre sciences, psychologie et arts : on peut les ranger dans n'importe quel ordre.<\/p>"}, {"texte_html": "numérique discrète", "score": -33.33333, "feedback_html": "<p>Ses modalités ne sont pas des quantités : même codées 1, 2, 3, une « filière moyenne » n'aurait aucun sens.<\/p>"}, {"texte_html": "dichotomique", "score": -33.33333, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; la filière en a trois.<\/p>"}]}, {"id": "C-CM1-011", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>La variable <code>niveau<\/code> (L1, L2, L3) est…<\/p>", "question_texte": "La variable `niveau` (L1, L2, L3) est…", "feedback_general_html": "<p>Ordinale : on peut ranger les modalités, mais l'écart entre deux modalités n'est pas mesurable.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses modalités sont des catégories ordonnées : L1 &lt; L2 &lt; L3.<\/p>"}, {"texte_html": "numérique discrète", "score": -20.0, "feedback_html": "<p>Le chiffre dans « L1 » ou « L2 » n'est pas une quantité mesurée : on sait ranger les niveaux, mais pas mesurer l'écart entre eux.<\/p>"}, {"texte_html": "nominale", "score": -30.0, "feedback_html": "<p>Les modalités ont un ordre naturel (L1 &lt; L2 &lt; L3) : la variable est ordinale.<\/p>"}, {"texte_html": "numérique continue", "score": -50.0, "feedback_html": "<p>Il n'existe pas de valeur entre L1 et L2 : la variable n'est pas continue, ni même numérique.<\/p>"}]}, {"id": "C-CM1-015", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans le logiciel Jamovi (par exemple), comment appelle-t-on une variable qualitative (catégorielle) qui sert à former des groupes à comparer ?<\/p>", "question_texte": "Dans le logiciel Jamovi (par exemple), comment appelle-t-on une variable qualitative (catégorielle) qui sert à former des groupes à comparer ?", "feedback_general_html": "<p>Un facteur est une variable qualitative à peu de modalités, utilisée pour former des groupes à comparer.<\/p>", "options": [{"texte_html": "Un facteur", "score": 100.0, "feedback_html": "<p>Exact. La filière, par exemple, est un facteur à trois modalités qui définit trois groupes.<\/p>"}, {"texte_html": "Une modalité", "score": -20.0, "feedback_html": "<p>Les modalités sont les valeurs du facteur (Sciences, Psychologie, Arts), pas la variable elle-même.<\/p>"}, {"texte_html": "Un identifiant", "score": -30.0, "feedback_html": "<p>Un identifiant distingue chaque individu : il ne forme pas de groupes.<\/p>"}, {"texte_html": "Une variable continue", "score": -50.0, "feedback_html": "<p>Une variable continue est numérique ; un facteur est qualitatif.<\/p>"}]}, {"id": "C-CM1-016", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Une variable est codée par des chiffres. Quelle question permet de savoir si elle est vraiment numérique ?<\/p>", "question_texte": "Une variable est codée par des chiffres. Quelle question permet de savoir si elle est vraiment numérique ?", "feedback_general_html": "<p>Des chiffres ne font pas une variable numérique. Test : la moyenne de ces valeurs a-t-elle un sens ?<\/p>", "options": [{"texte_html": "Une moyenne de ces valeurs aurait-elle un sens ?", "score": 100.0, "feedback_html": "<p>Exact. Si la moyenne n'a pas de sens (une « filière moyenne » de 2,0), les chiffres ne sont que des codes.<\/p>"}, {"texte_html": "Les valeurs sont-elles des nombres entiers ?", "score": -20.0, "feedback_html": "<p>Des entiers peuvent être de vraies quantités (un comptage) ou de simples codes (un numéro de groupe). Ce critère distingue plutôt discret et continu.<\/p>"}, {"texte_html": "Le logiciel accepte-t-il de calculer une moyenne ?", "score": -30.0, "feedback_html": "<p>Le logiciel calcule la moyenne de n'importe quels chiffres, même d'un code de filière. C'est à nous de juger si elle a un sens.<\/p>"}, {"texte_html": "Les valeurs sont-elles toutes différentes ?", "score": -50.0, "feedback_html": "<p>Des valeurs toutes différentes évoquent un identifiant, ce qui ne dit rien du caractère numérique.<\/p>"}]}, {"id": "C-CM1-020", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 3, "question_html": "<p>La variable <code>prop_repetitions<\/code> vaut 0, 1/49, 2/49… Que dire de son statut ?<\/p>", "question_texte": "La variable `prop_repetitions` vaut 0, 1/49, 2/49… Que dire de son statut ?", "feedback_general_html": "<p>Le statut discret ou continu dépend aussi de l'usage : une variable discrète aux valeurs nombreuses et serrées peut être traitée comme continue.<\/p>", "options": [{"texte_html": "Elle est discrète en théorie, mais on la traite comme continue car ses valeurs sont nombreuses et serrées.", "score": 100.0, "feedback_html": "<p>Exact. Elle ne prend que des multiples de 1/49, mais ces valeurs sont si proches qu'on la traite comme continue.<\/p>"}, {"texte_html": "Elle est discrète, et on ne peut pas la traiter comme continue.", "score": -20.0, "feedback_html": "<p>Elle est bien discrète en théorie, mais on peut la traiter comme continue : c'est un choix de modélisation justifié par le nombre et la proximité de ses valeurs.<\/p>"}, {"texte_html": "Elle est continue, car c'est une proportion.", "score": -30.0, "feedback_html": "<p>Une proportion calculée à partir d'un comptage reste discrète : elle ne peut valoir que 0, 1/49, 2/49…<\/p>"}, {"texte_html": "Elle est qualitative, car elle est comprise entre 0 et 1.", "score": -50.0, "feedback_html": "<p>Être comprise entre 0 et 1 ne rend pas une variable qualitative : c'est une quantité.<\/p>"}]}, {"id": "C-CM1-022", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pour une variable nominale, quel est le seul indice de position utilisable ?<\/p>", "question_texte": "Pour une variable nominale, quel est le seul indice de position utilisable ?", "feedback_general_html": "<p>Le type de variable commande les indices : mode pour une variable nominale, médiane pour une ordinale, moyenne pour une numérique.<\/p>", "options": [{"texte_html": "Le mode", "score": 100.0, "feedback_html": "<p>Exact. Le mode (la modalité la plus fréquente) ne suppose ni ordre ni quantité.<\/p>"}, {"texte_html": "La médiane", "score": -20.0, "feedback_html": "<p>La médiane suppose de ranger les valeurs : elle n'a pas de sens sans ordre entre les modalités.<\/p>"}, {"texte_html": "L'effectif cumulé", "score": -30.0, "feedback_html": "<p>Ce n'est pas un indice de position, et cumuler suppose aussi un ordre.<\/p>"}, {"texte_html": "La moyenne", "score": -50.0, "feedback_html": "<p>Une moyenne de catégories, comme une « filière moyenne », n'a aucun sens.<\/p>"}]}, {"id": "C-CM1-025", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>182 des 300 étudiants ont répondu oui. Quelle est la fréquence des « oui » (répondez sans faire de calcul exact) ?<\/p>", "question_texte": "182 des 300 étudiants ont répondu oui. Quelle est la fréquence des « oui » (répondez sans faire de calcul exact) ?", "feedback_general_html": "<p>Fréquence = effectif de la modalité / effectif total. Elle est toujours comprise entre 0 et 1 (0 et 100 %).<\/p>", "options": [{"texte_html": "0,607, soit 60,7 %", "score": 100.0, "feedback_html": "<p>Exact. 182 / 300 : un peu plus de la moitié, environ 0,6.<\/p>"}, {"texte_html": "0,393", "score": -20.0, "feedback_html": "<p>0,393 est la fréquence des « non » (118 / 300). Les « oui » sont plus de la moitié : leur fréquence dépasse 0,5.<\/p>"}, {"texte_html": "182", "score": -30.0, "feedback_html": "<p>182 est l'effectif des « oui ». La fréquence est la part qu'ils représentent : 182 / 300.<\/p>"}, {"texte_html": "1,54", "score": -50.0, "feedback_html": "<p>Une fréquence ne dépasse jamais 1 (100 %). 1,54 correspond à 182 / 118, une division par le nombre de « non ».<\/p>"}]}, {"id": "C-CM1-026", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans un tableau de distribution, la somme des <strong>fréquences<\/strong> de toutes les modalités vaut…<\/p>", "question_texte": "Dans un tableau de distribution, la somme des **fréquences** de toutes les modalités vaut…", "feedback_general_html": "<p>La somme des effectifs vaut l'effectif total ; la somme des fréquences vaut 1 (100 %).<\/p>", "options": [{"texte_html": "1, soit 100 %", "score": 100.0, "feedback_html": "<p>Exact. Chaque individu est compté une fois, dans une seule modalité : les parts additionnées font le tout.<\/p>"}, {"texte_html": "l'effectif total", "score": -20.0, "feedback_html": "<p>C'est la somme des effectifs qui vaut l'effectif total. La somme des fréquences vaut 1.<\/p>"}, {"texte_html": "une valeur qui dépend de la variable", "score": -30.0, "feedback_html": "<p>Quelle que soit la variable, les fréquences de toutes les modalités totalisent 1.<\/p>"}, {"texte_html": "le nombre de modalités", "score": -50.0, "feedback_html": "<p>Le nombre de modalités n'a aucun lien avec la somme des fréquences.<\/p>"}]}, {"id": "C-CM1-027", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans la distribution de <code>niveau<\/code>, le pourcentage cumulé de L2 vaut 75,3 %. Cela signifie que…<\/p>", "question_texte": "Dans la distribution de `niveau`, le pourcentage cumulé de L2 vaut 75,3 %. Cela signifie que…", "feedback_general_html": "<p>Pourcentage cumulé d'une modalité = part des individus qui ont cette modalité ou une modalité inférieure.<\/p>", "options": [{"texte_html": "75,3 % des étudiants sont en L1 ou en L2", "score": 100.0, "feedback_html": "<p>Exact. Le cumul additionne les modalités jusqu'à L2 incluse : 75,3 % des étudiants sont au plus en L2.<\/p>"}, {"texte_html": "75,3 % des étudiants sont en L2", "score": -20.0, "feedback_html": "<p>Le pourcentage cumulé n'est pas celui de la seule modalité L2 (36,3 %) : il inclut aussi les L1.<\/p>"}, {"texte_html": "75,3 % des étudiants sont en L2 ou en L3", "score": -30.0, "feedback_html": "<p>Le cumul croissant part de la première modalité : il additionne L1 et L2, pas L2 et L3.<\/p>"}, {"texte_html": "24,7 % des étudiants sont en L1", "score": -50.0, "feedback_html": "<p>24,7 % (100 − 75,3) est la part des étudiants au-delà de L2, donc des L3.<\/p>"}]}, {"id": "C-CM1-028", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pourquoi ne calcule-t-on pas de fréquences cumulées pour la variable <code>filiere<\/code> ?<\/p>", "question_texte": "Pourquoi ne calcule-t-on pas de fréquences cumulées pour la variable `filiere` ?", "feedback_general_html": "<p>Cumuler suppose un ordre entre les modalités : pas de cumul pour une variable nominale.<\/p>", "options": [{"texte_html": "Ses modalités n'ont pas d'ordre : un cumul dépendrait d'un ordre arbitraire.", "score": 100.0, "feedback_html": "<p>Exact. « 200 étudiants sont au plus en psychologie » n'a pas de sens.<\/p>"}, {"texte_html": "Ses trois modalités ont le même effectif.", "score": -20.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'absence d'ordre entre modalités qui empêche de cumuler.<\/p>"}, {"texte_html": "Jamovi ne le permet pas.", "score": -30.0, "feedback_html": "<p>C'est une question de sens, pas de logiciel.<\/p>"}, {"texte_html": "On ne peut pas calculer de fréquences pour une variable qualitative.", "score": -50.0, "feedback_html": "<p>On peut calculer des fréquences pour toute variable. C'est le cumul qui suppose un ordre.<\/p>"}]}, {"id": "C-CM1-034", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pour un temps de réaction mesuré à la milliseconde, pourquoi un tableau des effectifs valeur par valeur est-il peu utile ?<\/p>", "question_texte": "Pour un temps de réaction mesuré à la milliseconde, pourquoi un tableau des effectifs valeur par valeur est-il peu utile ?", "feedback_general_html": "<p>Pour une variable continue, on s'intéresse à la part des individus dans un intervalle plutôt qu'à chaque valeur exacte.<\/p>", "options": [{"texte_html": "Une valeur précise n'est presque jamais observée deux fois.", "score": 100.0, "feedback_html": "<p>Exact. Presque chaque valeur aurait un effectif de 1 : on regroupe donc en classes.<\/p>"}, {"texte_html": "Les effectifs seraient trop grands.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : ils seraient presque tous de 1.<\/p>"}, {"texte_html": "On ne peut pas compter des individus pour une variable continue.", "score": -30.0, "feedback_html": "<p>On peut toujours compter ; le problème est que chaque valeur exacte est presque unique.<\/p>"}, {"texte_html": "Les fréquences dépasseraient 100 %.", "score": -50.0, "feedback_html": "<p>Le total des fréquences vaut toujours 100 %.<\/p>"}]}, {"id": "C-CM1-035", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec un vrai dé, combien de répétitions attend-on environ dans une suite de 50 lancers (49 paires de lancers voisins) ?<\/p>", "question_texte": "Avec un vrai dé, combien de répétitions attend-on environ dans une suite de 50 lancers (49 paires de lancers voisins) ?", "feedback_general_html": "<p>Avec un dé, une paire de lancers voisins est une répétition une fois sur six. Les humains en produisent moins que le hasard.<\/p>", "options": [{"texte_html": "Environ 8", "score": 100.0, "feedback_html": "<p>Exact. Chaque paire a une chance sur six d'être une répétition : 49 / 6 ≈ 8.<\/p>"}, {"texte_html": "Environ 5", "score": -20.0, "feedback_html": "<p>C'est ce que font les étudiants, qui évitent les répétitions. Le hasard en produit davantage.<\/p>"}, {"texte_html": "Environ 25", "score": -30.0, "feedback_html": "<p>Ce serait le cas avec une chance sur deux (une pièce). Avec un dé, c'est une chance sur six.<\/p>"}, {"texte_html": "Aucune, car le hasard évite les répétitions", "score": -50.0, "feedback_html": "<p>C'est précisément l'intuition fausse étudiée dans le cours : le hasard produit des répétitions.<\/p>"}]}, {"id": "C-CM2-001", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans un histogramme, qu'est-ce qui représente la fréquence d'une classe ?<\/p>", "question_texte": "Dans un histogramme, qu'est-ce qui représente la fréquence d'une classe ?", "feedback_general_html": "<p>Histogramme : fréquence d'une classe = aire de la barre. D'où la règle : quand les classes ont des largeurs différentes, on met une densité en ordonnée, pas un effectif.<\/p>", "options": [{"texte_html": "L'aire de la barre", "score": 100.0, "feedback_html": "<p>Exact. Dans un histogramme, c'est l'aire de la barre qui représente la part des individus dans la classe. La hauteur est une densité.<\/p>"}, {"texte_html": "La hauteur de la barre", "score": -20.0, "feedback_html": "<p>C'est vrai pour un diagramme en barres ou en bâtons, pas pour un histogramme. Hauteur et aire ne racontent la même chose que si toutes les classes ont la même largeur.<\/p>"}, {"texte_html": "La largeur de la barre", "score": -30.0, "feedback_html": "<p>La largeur est l'amplitude de la classe, fixée par le choix des classes. Elle ne dit rien du nombre d'individus.<\/p>"}, {"texte_html": "La position du milieu de la barre sur l'axe horizontal", "score": -50.0, "feedback_html": "<p>Le milieu de la barre est le centre de la classe, une valeur de la variable. Ce n'est pas une fréquence.<\/p>"}]}, {"id": "C-CM2-002", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Quel est le graphique principal pour représenter la distribution d'une variable qualitative ?<\/p>", "question_texte": "Quel est le graphique principal pour représenter la distribution d'une variable qualitative ?", "feedback_general_html": "<p>Qualitative : barres. Numérique discrète : bâtons. Numérique continue : histogramme.<\/p>", "options": [{"texte_html": "Le diagramme en barres", "score": 100.0, "feedback_html": "<p>Exact. Une barre par modalité, séparée des autres, dont la hauteur donne l'effectif ou le pourcentage.<\/p>"}, {"texte_html": "Le diagramme circulaire", "score": -20.0, "feedback_html": "<p>Il est possible, mais déconseillé : l'œil compare mal des angles, et il devient illisible au-delà de trois ou quatre parts.<\/p>"}, {"texte_html": "Le diagramme en bâtons", "score": -30.0, "feedback_html": "<p>Le diagramme en bâtons place des valeurs numériques sur un axe gradué : il est réservé aux variables numériques discrètes.<\/p>"}, {"texte_html": "L'histogramme", "score": -50.0, "feedback_html": "<p>L'histogramme représente une variable numérique continue regroupée en classes, avec des barres jointives.<\/p>"}]}, {"id": "C-CM2-004", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>On représente la variable <code>reponse<\/code> en barres, d'abord en effectifs (182 et 118), puis en pourcentages (60,7 % et 39,3 %). Qu'est-ce qui change ?<\/p>", "question_texte": "On représente la variable `reponse` en barres, d'abord en effectifs (182 et 118), puis en pourcentages (60,7 % et 39,3 %). Qu'est-ce qui change ?", "feedback_general_html": "<p>Effectifs ou pourcentages : même forme, autre échelle. Les pourcentages facilitent la comparaison entre groupes.<\/p>", "options": [{"texte_html": "Seulement l'échelle de l'axe vertical : la forme du graphique est identique", "score": 100.0, "feedback_html": "<p>Exact. Passer des effectifs aux pourcentages divise toutes les hauteurs par le même nombre (300) : seule la graduation change.<\/p>"}, {"texte_html": "L'ordre des barres", "score": -20.0, "feedback_html": "<p>L'ordre des barres ne dépend pas de l'unité choisie.<\/p>"}, {"texte_html": "La hauteur relative des barres", "score": -30.0, "feedback_html": "<p>Le rapport entre les hauteurs reste le même : 182 / 118 = 60,7 / 39,3.<\/p>"}, {"texte_html": "Le type de graphique", "score": -50.0, "feedback_html": "<p>On reste dans un diagramme en barres ; seule l'unité de l'axe vertical change.<\/p>"}]}, {"id": "C-CM2-005", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Pour une variable nominale, l'ordre des barres d'un diagramme en barres…<\/p>", "question_texte": "Pour une variable nominale, l'ordre des barres d'un diagramme en barres…", "feedback_general_html": "<p>Nominale : ordre libre (souvent par effectif décroissant). Ordinale : ordre des modalités imposé.<\/p>", "options": [{"texte_html": "est libre ; on les range souvent par effectif décroissant", "score": 100.0, "feedback_html": "<p>Exact. Sans ordre naturel entre les modalités, on choisit l'ordre le plus lisible.<\/p>"}, {"texte_html": "doit suivre l'ordre alphabétique", "score": -20.0, "feedback_html": "<p>Aucune règle ne l'impose ; l'ordre alphabétique est rarement le plus lisible.<\/p>"}, {"texte_html": "doit suivre l'ordre d'apparition des modalités dans le fichier", "score": -30.0, "feedback_html": "<p>L'ordre du fichier est arbitraire : rien n'oblige à le suivre.<\/p>"}, {"texte_html": "change les effectifs représentés", "score": -50.0, "feedback_html": "<p>Changer l'ordre des barres ne modifie pas les données.<\/p>"}]}, {"id": "C-CM2-007", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>On compare la répartition des réponses dans deux groupes de 100 et 400 personnes. Que faut-il représenter ?<\/p>", "question_texte": "On compare la répartition des réponses dans deux groupes de 100 et 400 personnes. Que faut-il représenter ?", "feedback_general_html": "<p>Pour comparer des groupes de tailles différentes, on utilise des pourcentages calculés dans chaque groupe.<\/p>", "options": [{"texte_html": "Les pourcentages dans chaque groupe", "score": 100.0, "feedback_html": "<p>Exact. Les pourcentages ramènent chaque groupe à 100 et rendent les répartitions comparables.<\/p>"}, {"texte_html": "Les effectifs, en barres groupées", "score": -20.0, "feedback_html": "<p>Avec des effectifs, le groupe de 400 paraîtra toujours dominer, quelle que soit la répartition.<\/p>"}, {"texte_html": "L'effectif total de chaque groupe", "score": -30.0, "feedback_html": "<p>Cela ne dit rien de la répartition des réponses à l'intérieur des groupes.<\/p>"}, {"texte_html": "Un seul diagramme circulaire pour les 500 personnes", "score": -50.0, "feedback_html": "<p>On mélangerait les deux groupes : on ne pourrait plus les comparer.<\/p>"}]}, {"id": "C-CM2-010", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Dans le diagramme en bâtons du nombre de répétitions, rien n'apparaît entre 13 et 19. Cela signifie que…<\/p>", "question_texte": "Dans le diagramme en bâtons du nombre de répétitions, rien n'apparaît entre 13 et 19. Cela signifie que…", "feedback_general_html": "<p>Sur un diagramme en bâtons, les valeurs absentes laissent un vide : c'est une information sur la distribution.<\/p>", "options": [{"texte_html": "aucun étudiant n'a produit de 14 à 18 répétitions", "score": 100.0, "feedback_html": "<p>Exact. L'axe numérique place chaque valeur à sa position réelle : un vide signale des valeurs non observées.<\/p>"}, {"texte_html": "ces valeurs sont impossibles", "score": -20.0, "feedback_html": "<p>Elles sont tout à fait possibles ; simplement, personne ne les a produites ici.<\/p>"}, {"texte_html": "le graphique a été tronqué", "score": -30.0, "feedback_html": "<p>Rien n'est coupé : l'axe va bien de 0 à 23, et le vide est une information.<\/p>"}, {"texte_html": "les données de ces étudiants sont manquantes", "score": -50.0, "feedback_html": "<p>Une valeur non observée n'est pas une donnée manquante : tous les étudiants ont une valeur, aucune n'est entre 14 et 18.<\/p>"}]}, {"id": "C-CM2-012", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Dans un histogramme dont toutes les classes ont la même largeur, que peut-on dire de la hauteur des barres ?<\/p>", "question_texte": "Dans un histogramme dont toutes les classes ont la même largeur, que peut-on dire de la hauteur des barres ?", "feedback_general_html": "<p>Dans un histogramme, la fréquence est représentée par l'aire. Avec des classes de même largeur, la hauteur suffit pour comparer.<\/p>", "options": [{"texte_html": "Elle est proportionnelle à l'effectif : on peut comparer les hauteurs directement", "score": 100.0, "feedback_html": "<p>Exact. Avec des largeurs égales, l'aire est proportionnelle à la hauteur : hauteur et aire racontent la même chose.<\/p>"}, {"texte_html": "Elle ne dit rien : seule l'aire compte", "score": -20.0, "feedback_html": "<p>C'est l'aire qui représente la fréquence, mais quand les largeurs sont égales, la hauteur la reflète fidèlement.<\/p>"}, {"texte_html": "Elle indique la largeur de la classe", "score": -30.0, "feedback_html": "<p>La largeur se lit sur l'axe horizontal, pas sur la hauteur.<\/p>"}, {"texte_html": "Elle donne la valeur moyenne de la classe", "score": -50.0, "feedback_html": "<p>Les valeurs de la variable sont sur l'axe horizontal ; la hauteur concerne le nombre d'individus.<\/p>"}]}, {"id": "C-CM2-013", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Les catégories DASS ont des largeurs inégales (0–9, 10–13, 14–20, 21–27, 28–42). Si l'on met l'effectif en hauteur, la classe 28–42…<\/p>", "question_texte": "Les catégories DASS ont des largeurs inégales (0–9, 10–13, 14–20, 21–27, 28–42). Si l'on met l'effectif en hauteur, la classe 28–42…", "feedback_general_html": "<p>Avec des classes de largeurs inégales, on met la densité (part / largeur) en ordonnée, ou on refait des classes de même largeur.<\/p>", "options": [{"texte_html": "paraît plus peuplée qu'elle ne l'est, à cause de sa largeur", "score": 100.0, "feedback_html": "<p>Exact. Large de 15 points, elle forme une grande surface, alors qu'elle ne compte que 28 étudiants.<\/p>"}, {"texte_html": "paraît moins peuplée qu'elle ne l'est", "score": -20.0, "feedback_html": "<p>C'est l'inverse : sa grande largeur gonfle sa surface.<\/p>"}, {"texte_html": "est représentée correctement", "score": -30.0, "feedback_html": "<p>L'œil lit l'aire des barres : une classe large avec l'effectif en hauteur paraît trop importante.<\/p>"}, {"texte_html": "disparaît du graphique", "score": -50.0, "feedback_html": "<p>Aucune classe ne disparaît ; c'est sa taille apparente qui est faussée.<\/p>"}]}, {"id": "C-CM2-014", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Une classe de largeur 4 points contient 12 % des individus. Quelle est sa densité ?<\/p>", "question_texte": "Une classe de largeur 4 points contient 12 % des individus. Quelle est sa densité ?", "feedback_general_html": "<p>Densité d'une classe = part de la classe / largeur de la classe. Elle s'exprime en « % par unité de la variable ».<\/p>", "options": [{"texte_html": "3 % par point", "score": 100.0, "feedback_html": "<p>Exact. Densité = part de la classe / largeur = 12 % / 4 = 3 % par point.<\/p>"}, {"texte_html": "12 %", "score": -20.0, "feedback_html": "<p>C'est la part de la classe. La densité s'obtient en divisant par la largeur.<\/p>"}, {"texte_html": "48 % par point", "score": -30.0, "feedback_html": "<p>On a multiplié par la largeur au lieu de diviser.<\/p>"}, {"texte_html": "4 points", "score": -50.0, "feedback_html": "<p>C'est la largeur de la classe, pas sa densité.<\/p>"}]}, {"id": "C-CM2-016", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>La fonction de répartition de <code>prop_repetitions<\/code> atteint 90 % à la valeur 1/6. Que signifie ce point ?<\/p>", "question_texte": "La fonction de répartition de `prop_repetitions` atteint 90 % à la valeur 1/6. Que signifie ce point ?", "feedback_general_html": "<p>Fonction de répartition : pour chaque valeur x, la part des individus dont la valeur est inférieure ou égale à x.<\/p>", "options": [{"texte_html": "90 % des étudiants ont une proportion de répétitions inférieure ou égale à 1/6.", "score": 100.0, "feedback_html": "<p>Exact. La fonction de répartition donne, pour chaque valeur, la part des individus qui sont en dessous ou égaux. Ici : 90 % des étudiants font moins de répétitions que le hasard.<\/p>"}, {"texte_html": "90 % des étudiants ont exactement la proportion 1/6.", "score": -20.0, "feedback_html": "<p>C'est un cumul : il compte tous les étudiants jusqu'à 1/6, pas seulement ceux qui ont exactement 1/6.<\/p>"}, {"texte_html": "10 % des étudiants ont une proportion inférieure ou égale à 1/6.", "score": -30.0, "feedback_html": "<p>Le sens du cumul est inversé : 10 % sont au-dessus de 1/6.<\/p>"}, {"texte_html": "La proportion moyenne de répétitions vaut 1/6.", "score": -50.0, "feedback_html": "<p>La fonction de répartition ne donne pas directement la moyenne.<\/p>"}]}, {"id": "C-CM2-017", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Un graphique est dit autosuffisant quand…<\/p>", "question_texte": "Un graphique est dit autosuffisant quand…", "feedback_general_html": "<p>Un bon graphique est simple, lisible et autosuffisant : titre, axes nommés, unités, effectif total, légende si besoin.<\/p>", "options": [{"texte_html": "on peut le comprendre sans lire le texte qui l'accompagne", "score": 100.0, "feedback_html": "<p>Exact. Il porte un titre, des axes nommés avec leurs unités, l'effectif total et une légende si nécessaire.<\/p>"}, {"texte_html": "il contient toutes les données brutes", "score": -20.0, "feedback_html": "<p>Un graphique résume les données ; il ne les reproduit pas toutes.<\/p>"}, {"texte_html": "il utilise plusieurs couleurs", "score": -30.0, "feedback_html": "<p>Les couleurs n'aident que si elles codent une information ; elles ne rendent pas un graphique autosuffisant.<\/p>"}, {"texte_html": "il n'a pas besoin de titre", "score": -50.0, "feedback_html": "<p>C'est l'inverse : le titre est un des éléments qui le rendent compréhensible seul.<\/p>"}]}, {"id": "C-CM2-020", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Pour un diagramme en barres, l'axe vertical doit commencer…<\/p>", "question_texte": "Pour un diagramme en barres, l'axe vertical doit commencer…", "feedback_general_html": "<p>Diagramme en barres : axe vertical à partir de zéro.<\/p>", "options": [{"texte_html": "à zéro", "score": 100.0, "feedback_html": "<p>Exact. La hauteur d'une barre représente une quantité : elle doit partir de zéro pour que les rapports de hauteur soient justes.<\/p>"}, {"texte_html": "à n'importe quelle valeur, pourvu qu'elle soit indiquée", "score": -20.0, "feedback_html": "<p>Même indiqué sur l'axe, un départ au-dessus de zéro trompe l'œil, qui compare les hauteurs.<\/p>"}, {"texte_html": "à la plus petite valeur observée", "score": -30.0, "feedback_html": "<p>C'est un axe tronqué : les différences seraient exagérées.<\/p>"}, {"texte_html": "à la moyenne des valeurs", "score": -50.0, "feedback_html": "<p>Aucune justification : les barres sous la moyenne disparaîtraient.<\/p>"}]}, {"id": "C-CM2-021", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Un diagramme montre l'effectif de chaque catégorie DASS, avec des barres triées de la plus haute à la plus basse. Quel est le principal reproche ?<\/p>", "question_texte": "Un diagramme montre l'effectif de chaque catégorie DASS, avec des barres triées de la plus haute à la plus basse. Quel est le principal reproche ?", "feedback_general_html": "<p>Ordinale : barres dans l'ordre des modalités. Le tri par effectif est réservé aux variables nominales.<\/p>", "options": [{"texte_html": "L'ordre de gravité, naturel pour cette variable ordinale, est perdu.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, les barres suivent l'ordre des modalités ; ici, on ne voit plus comment l'effectif évolue avec la gravité.<\/p>"}, {"texte_html": "L'effectif total n'est pas indiqué.", "score": -20.0, "feedback_html": "<p>Ce serait un défaut possible, mais secondaire : le problème principal est l'ordre des barres.<\/p>"}, {"texte_html": "Il faudrait un diagramme circulaire.", "score": -30.0, "feedback_html": "<p>Le camembert ferait aussi perdre l'ordre, et se lit plus mal.<\/p>"}, {"texte_html": "Il faudrait un histogramme des effectifs.", "score": -50.0, "feedback_html": "<p>La variable est qualitative ordinale : on garde un diagramme en barres.<\/p>"}]}, {"id": "C-CM2-022", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Que reprochez-vous au graphique ci-dessous ?<\/p><p><img src=\"images/cm2_axe_tronque.png\" alt=\"Diagramme en barres du pourcentage de oui par filière, axe vertical de 50 à 75 %\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Que reprochez-vous au graphique ci-dessous ?", "feedback_general_html": "<p>Pour un diagramme en barres, l'axe vertical commence à zéro.<\/p>", "options": [{"texte_html": "L'axe vertical commence à 50 % : les différences entre filières paraissent bien plus grandes qu'elles ne le sont.", "score": 100.0, "feedback_html": "<p>Exact. 71 % contre 53 % : la barre « Sciences » paraît pourtant sept fois plus haute que la barre « Arts ».<\/p>"}, {"texte_html": "Il faudrait des effectifs plutôt que des pourcentages.", "score": -20.0, "feedback_html": "<p>Les pourcentages conviennent pour comparer des groupes ; le problème est l'axe tronqué.<\/p>"}, {"texte_html": "Les barres devraient être jointives.", "score": -30.0, "feedback_html": "<p>La filière est qualitative : les barres restent séparées.<\/p>"}, {"texte_html": "Rien, le graphique est correct.", "score": -50.0, "feedback_html": "<p>L'axe tronqué rend ce graphique trompeur.<\/p>"}]}, {"id": "C-CM2-023", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Quel est le principal défaut du graphique ci-dessous ?<\/p><p><img src=\"images/cm2_camembert_dass.png\" alt=\"Diagramme circulaire des cinq catégories de dépression DASS\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Quel est le principal défaut du graphique ci-dessous ?", "feedback_general_html": "<p>Pour une variable ordinale, on préfère un diagramme en barres dans l'ordre des modalités.<\/p>", "options": [{"texte_html": "Les parts proches (Léger : 37, Modéré : 38) se comparent mal, et l'ordre de gravité est peu lisible sur un cercle.", "score": 100.0, "feedback_html": "<p>Exact. Deux parts presque égales sont indiscernables à l'œil, et le cercle ne montre pas l'ordre de gravité.<\/p>"}, {"texte_html": "L'effectif de chaque catégorie n'est pas écrit.", "score": -20.0, "feedback_html": "<p>C'est un défaut secondaire : même avec les chiffres, la forme resterait peu lisible.<\/p>"}, {"texte_html": "Il faudrait un histogramme.", "score": -30.0, "feedback_html": "<p>La variable est qualitative ordinale : il faudrait un diagramme en barres.<\/p>"}, {"texte_html": "Les parts ne totalisent pas 100 %.", "score": -50.0, "feedback_html": "<p>Un diagramme circulaire représente toujours le tout.<\/p>"}]}, {"id": "C-CM2-027", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>D'après la courbe des fréquences cumulées ci-dessous, environ quelle part des participants répond en moins de 500 ms ?<\/p><p><img src=\"images/cm2_cumul_temps_reaction.png\" alt=\"Courbe des fréquences cumulées des temps de réaction de 200 participants\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "D'après la courbe des fréquences cumulées ci-dessous, environ quelle part des participants répond en moins de 500 ms ?", "feedback_general_html": "<p>Lecture directe de la fonction de répartition : on part d'une valeur et on lit la part des individus en dessous.<\/p>", "options": [{"texte_html": "Environ 75 %", "score": 100.0, "feedback_html": "<p>Exact. On part de 500 ms sur l'axe horizontal et on lit la fréquence cumulée.<\/p>"}, {"texte_html": "Environ 50 %", "score": -20.0, "feedback_html": "<
