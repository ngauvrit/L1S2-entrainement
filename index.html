 de la variable.<\/p>", "options": [{"texte_html": "50 ms", "score": 100.0, "feedback_html": "<p>Exact. L'écart-type est la racine carrée de la variance : √2 500 = 50, dans l'unité de la variable.<\/p>"}, {"texte_html": "50 ms²", "score": -20.0, "feedback_html": "<p>La valeur est juste, mais l'unité ne l'est pas : c'est la variance qui s'exprime en ms² ; l'écart-type revient en ms.<\/p>"}, {"texte_html": "1 250 ms", "score": -30.0, "feedback_html": "<p>On a divisé par 2 ; il faut prendre la racine carrée.<\/p>"}, {"texte_html": "6 250 000 ms", "score": -50.0, "feedback_html": "<p>On a élevé au carré au lieu de prendre la racine carrée.<\/p>"}]}, {"id": "C-CM3-016", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Un enseignant ajoute 5 points à toutes les notes d'un examen. Que deviennent la moyenne et l'écart-type ?<\/p>", "question_texte": "Un enseignant ajoute 5 points à toutes les notes d'un examen. Que deviennent la moyenne et l'écart-type ?", "feedback_general_html": "<p>Ajouter une constante déplace la position et ne change pas la dispersion.<\/p>", "options": [{"texte_html": "La moyenne augmente de 5 ; l'écart-type ne change pas.", "score": 100.0, "feedback_html": "<p>Exact. La distribution se déplace d'un bloc : la position change, les écarts entre les notes restent les mêmes.<\/p>"}, {"texte_html": "La moyenne et l'écart-type augmentent tous deux de 5.", "score": -20.0, "feedback_html": "<p>La moyenne augmente bien de 5. Mais les écarts à la moyenne sont inchangés : l'écart-type ne bouge pas.<\/p>"}, {"texte_html": "La moyenne ne change pas ; l'écart-type augmente de 5.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : ajouter une constante déplace la position, pas la dispersion.<\/p>"}, {"texte_html": "Ni la moyenne ni l'écart-type ne changent.", "score": -50.0, "feedback_html": "<p>Toutes les notes augmentent de 5 : leur moyenne aussi.<\/p>"}]}, {"id": "C-CM3-019", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>Classez ces trois indices de dispersion du moins robuste au plus robuste.<\/p>", "question_texte": "Classez ces trois indices de dispersion du moins robuste au plus robuste.", "feedback_general_html": "<p>Sur les répétitions du cours, retirer deux suites extrêmes fait passer l'étendue de 23 à 13, l'écart-type de 2,66 à 2,34, et laisse l'EIQ à 3.<\/p>", "options": [{"texte_html": "Étendue, écart-type, écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. L'étendue ne dépend que des deux valeurs extrêmes ; l'écart-type utilise toutes les valeurs, les grands écarts pesant beaucoup ; l'écart interquartile ignore les 25 % les plus bas et les 25 % les plus hauts.<\/p>"}, {"texte_html": "Écart-type, étendue, écart interquartile", "score": -20.0, "feedback_html": "<p>L'écart interquartile est bien le plus robuste, mais l'étendue est encore moins robuste que l'écart-type : elle ne dépend que du minimum et du maximum.<\/p>"}, {"texte_html": "Étendue, écart interquartile, écart-type", "score": -30.0, "feedback_html": "<p>L'étendue est bien la moins robuste, mais l'écart interquartile est plus robuste que l'écart-type, qui est sensible aux valeurs extrêmes.<\/p>"}, {"texte_html": "Écart interquartile, écart-type, étendue", "score": -50.0, "feedback_html": "<p>C'est l'ordre inverse : l'écart interquartile est le plus robuste, l'étendue la moins robuste.<\/p>"}]}, {"id": "C-CM3-021", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Les deux groupes ci-dessous ont la même moyenne (20). Quelle affirmation est correcte ?<\/p><p><img src=\"images/cm3_deux_dispersions.png\" alt=\"Deux courbes centrées sur 20 : A resserrée, B étalée\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "question_texte": "Les deux groupes ci-dessous ont la même moyenne (20). Quelle affirmation est correcte ?", "feedback_general_html": "<p>Même position ne veut pas dire même dispersion. Une distribution plus étalée a un écart-type plus grand.<\/p>", "options": [{"texte_html": "Le groupe B a l'écart-type le plus grand : ses scores s'écartent davantage de 20.", "score": 100.0, "feedback_html": "<p>Exact. La courbe de B est plus étalée : ses valeurs sont plus loin de la moyenne.<\/p>"}, {"texte_html": "Les deux groupes ont la même dispersion, puisqu'ils ont la même moyenne.", "score": -20.0, "feedback_html": "<p>Position et dispersion sont deux choses différentes : on peut avoir la même moyenne et des dispersions très différentes.<\/p>"}, {"texte_html": "On ne peut rien dire sans connaître la médiane.", "score": -30.0, "feedback_html": "<p>La médiane est un paramètre de position ; l'étalement des courbes suffit pour comparer les dispersions.<\/p>"}, {"texte_html": "Le groupe A a l'écart-type le plus grand, puisque sa courbe est plus haute.", "score": -50.0, "feedback_html": "<p>Une courbe plus haute est plus resserrée : les valeurs sont concentrées autour de 20. L'écart-type de A est le plus petit.<\/p>"}]}, {"id": "C-CM3-022", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans une boîte à moustaches, la boîte elle-même contient…<\/p>", "question_texte": "Dans une boîte à moustaches, la boîte elle-même contient…", "feedback_general_html": "<p>Boîte : de Q1 à Q3 (moitié centrale), trait à la médiane. Moustaches : jusqu'aux valeurs pas trop éloignées. Au-delà : points isolés.<\/p>", "options": [{"texte_html": "la moitié centrale des individus, du premier au troisième quartile.", "score": 100.0, "feedback_html": "<p>Exact. La boîte va de Q1 à Q3, avec un trait à la médiane.<\/p>"}, {"texte_html": "environ les trois quarts des individus, du minimum au troisième quartile.", "score": -20.0, "feedback_html": "<p>La boîte commence au premier quartile, pas au minimum. Entre Q1 et Q3, il y a la moitié des individus.<\/p>"}, {"texte_html": "tous les individus, sauf les points isolés.", "score": -30.0, "feedback_html": "<p>Ceux-là sont couverts par la boîte et les moustaches réunies ; la boîte seule n'en contient que la moitié.<\/p>"}, {"texte_html": "les individus situés autour de la moyenne.", "score": -50.0, "feedback_html": "<p>La boîte est construite avec les quartiles ; la moyenne n'y apparaît pas.<\/p>"}]}, {"id": "C-CM3-024", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Le poids de nouveau-nés est mesuré en grammes. Dans quelle unité s'expriment la variance et l'écart-type de ce poids ?<\/p>", "question_texte": "Le poids de nouveau-nés est mesuré en grammes. Dans quelle unité s'expriment la variance et l'écart-type de ce poids ?", "feedback_general_html": "<p>La variance s'exprime dans l'unité de la variable au carré ; l'écart-type dans l'unité de la variable. C'est pour cela qu'on interprète l'écart-type.<\/p>", "options": [{"texte_html": "La variance en grammes au carré (g²), l'écart-type en grammes (g).", "score": 100.0, "feedback_html": "<p>Exact. La variance est une moyenne d'écarts élevés au carré ; l'écart-type, sa racine, revient à l'unité de la variable.<\/p>"}, {"texte_html": "Toutes deux en grammes (g).", "score": -20.0, "feedback_html": "<p>C'est vrai de l'écart-type, pas de la variance : élever les écarts au carré élève aussi l'unité au carré.<\/p>"}, {"texte_html": "La variance en grammes (g), l'écart-type en grammes au carré (g²).", "score": -30.0, "feedback_html": "<p>C'est l'inverse : la variance est en g², et l'écart-type, sa racine carrée, en g.<\/p>"}, {"texte_html": "Ni l'une ni l'autre n'a d'unité.", "score": -50.0, "feedback_html": "<p>Les deux ont une unité, liée à celle de la variable : g² pour la variance, g pour l'écart-type.<\/p>"}]}, {"id": "C-CM4-001", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?<\/p>", "question_texte": "Une distribution unimodale a pour mode 12, pour médiane 10 et pour moyenne 8. Comment est-elle probablement ?", "feedback_general_html": "<p>Moyen mnémotechnique : la moyenne est tirée du côté de la queue. Asymétrie à gauche : moyenne &lt; médiane &lt; mode. Asymétrie à droite : mode &lt; médiane &lt; moyenne.<\/p>", "options": [{"texte_html": "Asymétrique à gauche", "score": 100.0, "feedback_html": "<p>Exact. Moyenne &lt; médiane &lt; mode. La moyenne est tirée vers les petites valeurs : la queue de la distribution est à gauche.<\/p>"}, {"texte_html": "Asymétrique à droite", "score": -20.0, "feedback_html": "<p>Le sommet (le mode) est à droite, mais l'asymétrie se nomme du côté de la queue, pas du côté du sommet. Ici, la queue est à gauche.<\/p>"}, {"texte_html": "Symétrique", "score": -30.0, "feedback_html": "<p>Dans une distribution symétrique, mode, médiane et moyenne sont confondus ou très proches. Ici, ils s'étalent de 8 à 12.<\/p>"}, {"texte_html": "Bimodale", "score": -50.0, "feedback_html": "<p>L'énoncé précise que la distribution est unimodale. L'ordre des trois indices renseigne sur l'asymétrie, pas sur le nombre de sommets.<\/p>"}]}, {"id": "C-CM5-001", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?<\/p>", "question_texte": "Une étude trouve une corrélation de Pearson r = 0,05 entre le niveau de stress et la performance à une tâche. Que peut-on en conclure ?", "feedback_general_html": "<p>Avant d'interpréter r, toujours regarder le nuage de points. r proche de 0 ne veut pas dire « aucune liaison ».<\/p>", "options": [{"texte_html": "Il n'y a presque pas de liaison linéaire, mais il peut exister une liaison d'une autre forme.", "score": 100.0, "feedback_html": "<p>Exact. r ne mesure que la liaison linéaire. Une liaison en U (performance maximale pour un stress moyen) peut donner un r proche de 0. Il faut regarder le nuage de points.<\/p>"}, {"texte_html": "Le stress n'a aucun lien avec la performance.", "score": -20.0, "feedback_html": "<p>Conclusion trop forte. Un r proche de 0 exclut seulement une liaison linéaire. Une liaison nette en forme de U peut donner r ≈ 0.<\/p>"}, {"texte_html": "Le stress a un faible effet causal sur la performance.", "score": -50.0, "feedback_html": "<p>Une corrélation ne permet pas de conclure à un effet causal, quelle que soit sa valeur.<\/p>"}, {"texte_html": "Il faudrait plutôt calculer la covariance, qui détecte les liaisons non linéaires.", "score": -30.0, "feedback_html": "<p>La covariance mesure la même chose que r (une liaison linéaire), mais dans les unités des variables. Elle ne détecte pas mieux une liaison en U.<\/p>"}]}, {"id": "S-001", "type": "serie", "categorie": "interpretation", "cm": [3, 4], "etude": {"titre": "Score de dépression selon la filière"}, "etude_html": "<h4>Score de dépression selon la filière<\/h4><p>300 étudiants de L1 à L3 (sciences, psychologie, arts, 100 par filière) ont rempli l'échelle de dépression de la DASS-21 (score de 0 à 42). On compare la distribution du score dans les trois filières.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Jeu de données fil rouge du cours (production_aleatoire.csv).<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Arts<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Psychologie<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Sciences<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Manquant<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">10,46<\/td><td style=\"padding:2px 12px;text-align:right\">10,14<\/td><td style=\"padding:2px 12px;text-align:right\">7,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">8<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">10,28<\/td><td style=\"padding:2px 12px;text-align:right\">9,69<\/td><td style=\"padding:2px 12px;text-align:right\">9,80<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">42<\/td><td style=\"padding:2px 12px;text-align:right\">34<\/td><td style=\"padding:2px 12px;text-align:right\">38<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">25e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">2,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,00<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">75e percentile<\/td><td style=\"padding:2px 12px;text-align:right\">16,0<\/td><td style=\"padding:2px 12px;text-align:right\">16,5<\/td><td style=\"padding:2px 12px;text-align:right\">12,0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Asymétrie<\/td><td style=\"padding:2px 12px;text-align:right\">1,00<\/td><td style=\"padding:2px 12px;text-align:right\">0,75<\/td><td style=\"padding:2px 12px;text-align:right\">1,41<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Aplatissement<\/td><td style=\"padding:2px 12px;text-align:right\">0,18<\/td><td style=\"padding:2px 12px;text-align:right\">-0,55<\/td><td style=\"padding:2px 12px;text-align:right\">1,03<\/td><\/tr><\/table><p style=\"font-size:0.85em;color:#555;margin-top:2px\">Variable dass_depression, séparée par filiere<\/p>", "questions": [{"id": "S-001-q1", "difficulte": 1, "question_html": "<p>Dans quelle filière la médiane du score de dépression est-elle la plus basse ?<\/p>", "question_texte": "Dans quelle filière la médiane du score de dépression est-elle la plus basse ?", "feedback_general_html": "<p>On lit la ligne « Médiane » du tableau. Elle vaut 8 en arts et en psychologie, 4 en sciences.<\/p>", "options": [{"texte_html": "Sciences", "score": 100.0, "feedback_html": "<p>Exact. La médiane vaut 4 en sciences, contre 8 dans les deux autres filières. La moitié des étudiants de sciences a un score de 4 ou moins.<\/p>"}, {"texte_html": "Arts", "score": -20.0, "feedback_html": "<p>La médiane d'arts vaut 8. Vous avez peut-être lu une autre ligne du tableau, comme la moyenne ou le maximum.<\/p>"}, {"texte_html": "Psychologie", "score": -30.0, "feedback_html": "<p>La médiane de psychologie vaut 8, comme en arts. C'est en sciences qu'elle est la plus basse (4).<\/p>"}, {"texte_html": "Elle est la même dans les trois filières, puisque le minimum vaut 0 partout.", "score": -50.0, "feedback_html": "<p>Le minimum et la médiane sont deux indices différents. Le minimum est la plus petite valeur ; la médiane coupe le groupe en deux moitiés.<\/p>"}]}, {"id": "S-001-q2", "difficulte": 2, "question_html": "<p>Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?<\/p>", "question_texte": "Dans les trois filières, la moyenne est nettement plus élevée que la médiane. Qu'est-ce que cela indique ?", "feedback_general_html": "<p>Quand la moyenne dépasse nettement la médiane, la distribution est asymétrique à droite. Les coefficients d'asymétrie, tous positifs, le confirment.<\/p>", "options": [{"texte_html": "La distribution est étirée vers la droite ; quelques scores élevés tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La moyenne est sensible aux valeurs extrêmes ; la médiane ne dépend que du rang des valeurs.<\/p>"}, {"texte_html": "La distribution est étirée vers la gauche.", "score": -30.0, "feedback_html": "<p>C'est l'inverse. La moyenne est tirée du côté de la queue de la distribution. Ici elle est au-dessus de la médiane, donc la queue est à droite, vers les scores élevés.<\/p>"}, {"texte_html": "Il y a des données manquantes dans le tableau.", "score": -50.0, "feedback_html": "<p>La ligne « Manquant » vaut 0 dans les trois filières. L'écart entre moyenne et médiane vient de la forme de la distribution.<\/p>"}, {"texte_html": "La plupart des étudiants ont un score supérieur à la moyenne.", "score": -20.0, "feedback_html": "<p>C'est le contraire. La médiane étant sous la moyenne, plus de la moitié des étudiants ont un score inférieur à la moyenne.<\/p>"}]}, {"id": "S-001-q3", "difficulte": 2, "question_html": "<p>On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?<\/p>", "question_texte": "On veut comparer la dispersion du score de dépression entre les filières. Compte tenu de la forme des distributions, quel indice est le plus adapté ?", "feedback_general_html": "<p>Pour une distribution asymétrique ou avec des valeurs extrêmes, on décrit la position par la médiane et la dispersion par l'écart interquartile (Q3 − Q1).<\/p>", "options": [{"texte_html": "L'écart interquartile", "score": 100.0, "feedback_html": "<p>Exact. Les distributions sont asymétriques, avec des valeurs élevées isolées. L'écart interquartile est robuste. Il vaut 14 en arts, 14,5 en psychologie et 12 en sciences.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>L'écart-type n'est pas faux, mais il est sensible aux valeurs extrêmes. Avec des distributions aussi asymétriques, on lui préfère un indice robuste.<\/p>"}, {"texte_html": "L'étendue", "score": -50.0, "feedback_html": "<p>L'étendue est l'indice le moins robuste. Elle ne dépend que des deux valeurs les plus extrêmes : en arts, un seul étudiant à 42 suffit à la gonfler.<\/p>"}, {"texte_html": "La variance", "score": -30.0, "feedback_html": "<p>La variance a les mêmes défauts que l'écart-type, et elle s'exprime en plus dans une unité au carré, difficile à interpréter.<\/p>"}]}, {"id": "S-001-q4", "difficulte": 3, "question_html": "<p>D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?<\/p>", "question_texte": "D'après la règle de Tukey, au-dessus de quel score un étudiant de sciences est-il considéré comme atypique ?", "feedback_general_html": "<p>Règle de Tukey : une valeur est atypique si elle dépasse Q3 + 1,5 × EIQ ou si elle est sous Q1 − 1,5 × EIQ.<\/p>", "options": [{"texte_html": "Au-dessus de 30", "score": 100.0, "feedback_html": "<p>Exact. En sciences, Q1 = 0 et Q3 = 12, donc EIQ = 12. Borne haute : 12 + 1,5 × 12 = 30. Les scores de 32, 36 et 38 sont atypiques.<\/p>"}, {"texte_html": "Au-dessus de 24", "score": -20.0, "feedback_html": "<p>24 = Q3 + EIQ. Il manque le facteur 1,5 : la borne est Q3 + 1,5 × EIQ = 12 + 18 = 30.<\/p>"}, {"texte_html": "Au-dessus de 38", "score": -50.0, "feedback_html": "<p>38 est le maximum observé, pas une borne. La règle de Tukey se calcule à partir des quartiles, pas des valeurs extrêmes.<\/p>"}, {"texte_html": "Au-dessus de 37", "score": -30.0, "feedback_html": "<p>37 est la borne calculée en cours sur les 300 étudiants (Q1 = 2, Q3 = 16). Pour les seuls étudiants de sciences, il faut utiliser leurs propres quartiles.<\/p>"}]}, {"id": "S-001-q5", "difficulte": 2, "question_html": "<p>Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?<\/p>", "question_texte": "Que peut-on dire de la forme de la distribution chez les étudiants de sciences ?", "feedback_general_html": "<p>Coefficient d'asymétrie positif = asymétrie à droite ; au-delà de 1, elle est nette. Penser à vérifier sur un graphique que quelques valeurs extrêmes ne suffisent pas à l'expliquer.<\/p>", "options": [{"texte_html": "Elle est nettement asymétrique à droite, plus que dans les deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. Le coefficient d'asymétrie (1,41) dépasse 1, et c'est le plus élevé des trois. La médiane (4) est aussi loin sous la moyenne (7,80).<\/p>"}, {"texte_html": "Elle est asymétrique à gauche.", "score": -20.0, "feedback_html": "<p>Un coefficient d'asymétrie positif signale une asymétrie à droite, c'est-à-dire une queue vers les valeurs élevées.<\/p>"}, {"texte_html": "Elle est proche d'une loi normale, car l'aplatissement est proche de 1.", "score": -30.0, "feedback_html": "<p>Pour une loi normale, le coefficient d'aplatissement de Jamovi vaut 0, pas 1. Et surtout, l'asymétrie de 1,41 exclut une forme normale.<\/p>"}, {"texte_html": "Elle est symétrique, car le minimum est 0 comme dans les autres filières.", "score": -50.0, "feedback_html": "<p>Le minimum ne dit rien de la symétrie. Il faut regarder le coefficient d'asymétrie, ou comparer la moyenne et la médiane.<\/p>"}]}, {"id": "S-001-q6", "difficulte": 3, "question_html": "<p>Laquelle de ces conclusions est correcte ?<\/p>", "question_texte": "Laquelle de ces conclusions est correcte ?", "feedback_general_html": "<p>Comparer des groupes, c'est comparer leur position (médiane, moyenne) et leur dispersion. Une différence observée décrit ces individus ; elle ne prouve pas une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 300 étudiants, ceux de sciences ont en général des scores de dépression plus faibles que ceux des deux autres filières.", "score": 100.0, "feedback_html": "<p>Exact. La médiane, la moyenne et les quartiles sont plus bas en sciences. La conclusion reste descriptive et ne vaut que pour ces étudiants.<\/p>"}, {"texte_html": "Faire des études de sciences protège de la dépression.", "score": -30.0, "feedback_html": "<p>C'est une conclusion causale. Ces données d'observation ne permettent pas de la tirer. D'autres variables pourraient expliquer la différence, par exemple la répartition par sexe, qui n'est pas la même selon les filières.<\/p>"}, {"texte_html": "Tous les étudiants de sciences ont un score plus bas que les étudiants d'arts.", "score": -20.0, "feedback_html": "<p>Les distributions se chevauchent largement. Le maximum en sciences (38) dépasse de beaucoup la médiane d'arts (8). Une différence de position ne dit rien de chaque individu.<\/p>"}, {"texte_html": "Les trois filières ne diffèrent pas, puisque leurs écarts-types sont presque identiques.", "score": -50.0, "feedback_html": "<p>L'écart-type mesure la dispersion, pas la position. Des groupes de même dispersion peuvent avoir des positions différentes.<\/p>"}]}]}, {"id": "S-002", "type": "serie", "categorie": "interpretation", "cm": [1], "etude": {"titre": "Qualité du sommeil des étudiants de L1"}, "etude_html": "<h4>Qualité du sommeil des étudiants de L1<\/h4><p>240 étudiants de L1 ont évalué la qualité de leur sommeil du dernier mois, de « très mauvaise » à « très bonne ».<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · Données simulées pour l&#x27;exercice.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de qualite_sommeil<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><td style=\"padding:2px 12px;text-align:right\">7,5 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mauvaise<\/td><td style=\"padding:2px 12px;text-align:right\">47<\/td><td style=\"padding:2px 12px;text-align:right\">19,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">27,1 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Correcte<\/td><td style=\"padding:2px 12px;text-align:right\">89<\/td><td style=\"padding:2px 12px;text-align:right\">37,1 %<\/td><td style=\"padding:2px 12px;text-align:right\">64,2 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Bonne<\/td><td style=\"padding:2px 12px;text-align:right\">63<\/td><td style=\"padding:2px 12px;text-align:right\">26,3 %<\/td><td style=\"padding:2px 12px;text-align:right\">90,4 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Très bonne<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><td style=\"padding:2px 12px;text-align:right\">9,6 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table>", "questions": [{"id": "S-002-q1", "difficulte": 1, "question_html": "<p>La variable <code>qualite_sommeil<\/code> est…<\/p>", "question_texte": "La variable `qualite_sommeil` est…", "feedback_general_html": "<p>Catégories ordonnées : variable ordinale.<\/p>", "options": [{"texte_html": "ordinale", "score": 100.0, "feedback_html": "<p>Exact. Ses cinq modalités sont des catégories ordonnées, de « très mauvaise » à « très bonne ».<\/p>"}, {"texte_html": "nominale", "score": -20.0, "feedback_html": "<p>Les modalités ont un ordre naturel : la variable est ordinale.<\/p>"}, {"texte_html": "numérique discrète", "score": -30.0, "feedback_html": "<p>Des modalités ordonnées ne sont pas des quantités : on ne mesure pas l'écart entre « correcte » et « bonne ».<\/p>"}, {"texte_html": "dichotomique", "score": -50.0, "feedback_html": "<p>Une variable dichotomique n'a que deux modalités ; celle-ci en a cinq.<\/p>"}]}, {"id": "S-002-q2", "difficulte": 1, "question_html": "<p>Combien d'étudiants déclarent un sommeil de « bonne » qualité ?<\/p>", "question_texte": "Combien d'étudiants déclarent un sommeil de « bonne » qualité ?", "feedback_general_html": "<p>Effectif : nombre d'individus d'une modalité. Pourcentage : leur part dans le total.<\/p>", "options": [{"texte_html": "63", "score": 100.0, "feedback_html": "<p>Exact. On lit la colonne « Effectifs » sur la ligne « Bonne ».<\/p>"}, {"texte_html": "23", "score": -20.0, "feedback_html": "<p>23 est l'effectif de la ligne « Très bonne », pas « Bonne ».<\/p>"}, {"texte_html": "217", "score": -30.0, "feedback_html": "<p>217 additionne les effectifs jusqu'à « Bonne » (18 + 47 + 89 + 63) : c'est un effectif cumulé.<\/p>"}, {"texte_html": "26", "score": -50.0, "feedback_html": "<p>26 vient du pourcentage (26,3 %), pas de la colonne des effectifs.<\/p>"}]}, {"id": "S-002-q3", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil au plus « correct » ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil au plus « correct » ?", "feedback_general_html": "<p>« Au plus » une modalité : pourcentage cumulé sur la ligne de cette modalité.<\/p>", "options": [{"texte_html": "64,2 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « Correcte » : 7,5 + 19,6 + 37,1.<\/p>"}, {"texte_html": "27,1 %", "score": -20.0, "feedback_html": "<p>27,1 % s'arrête à « Mauvaise ». « Au plus correct » inclut aussi « Correcte ».<\/p>"}, {"texte_html": "37,1 %", "score": -30.0, "feedback_html": "<p>37,1 % est la part de la seule modalité « Correcte ».<\/p>"}, {"texte_html": "35,8 %", "score": -50.0, "feedback_html": "<p>35,8 % est la part au-dessus de « Correcte » (bonne ou très bonne) : c'est le complément de la réponse.<\/p>"}]}, {"id": "S-002-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants déclare un sommeil bon ou très bon ?<\/p>", "question_texte": "Quelle part des étudiants déclare un sommeil bon ou très bon ?", "feedback_general_html": "<p>Pour une part « au moins » une modalité : 100 % moins le cumul de la modalité précédente.<\/p>", "options": [{"texte_html": "35,8 % (26,3 + 9,6, ou 100 − 64,2)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les deux modalités, ou on retire de 100 % le cumul jusqu'à « Correcte ».<\/p>"}, {"texte_html": "26,3 %", "score": -20.0, "feedback_html": "<p>26,3 % ne compte que « Bonne » ; il faut ajouter « Très bonne ».<\/p>"}, {"texte_html": "9,6 %", "score": -30.0, "feedback_html": "<p>9,6 % ne compte que « Très bonne ».<\/p>"}, {"texte_html": "90,4 %", "score": -50.0, "feedback_html": "<p>90,4 % est le cumul jusqu'à « Bonne » : il compte tout ce qui est en dessous, y compris les sommeils mauvais.<\/p>"}]}, {"id": "S-002-q5", "difficulte": 1, "question_html": "<p>Quel est le mode de cette distribution ?<\/p>", "question_texte": "Quel est le mode de cette distribution ?", "feedback_general_html": "<p>Le mode est la modalité la plus fréquente ; on le donne sous forme de modalité, pas d'effectif.<\/p>", "options": [{"texte_html": "Correcte", "score": 100.0, "feedback_html": "<p>Exact. C'est la modalité la plus fréquente (89 étudiants).<\/p>"}, {"texte_html": "89", "score": -20.0, "feedback_html": "<p>89 est l'effectif du mode. Le mode est la modalité elle-même : « Correcte ».<\/p>"}, {"texte_html": "Très bonne", "score": -30.0, "feedback_html": "<p>« Très bonne » est la dernière ligne, pas la plus fréquente (23 étudiants).<\/p>"}, {"texte_html": "Il n'y en a pas, car la variable est ordinale", "score": -50.0, "feedback_html": "<p>Toute variable a un mode, même nominale : c'est la modalité la plus fréquente.<\/p>"}]}, {"id": "S-002-q6", "difficulte": 2, "question_html": "<p>La colonne « % cumulé » a-t-elle un sens pour cette variable ?<\/p>", "question_texte": "La colonne « % cumulé » a-t-elle un sens pour cette variable ?", "feedback_general_html": "<p>Le cumul a un sens dès que les modalités sont ordonnées : variables ordinales et numériques.<\/p>", "options": [{"texte_html": "Oui, car les modalités sont ordonnées.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, « au plus correct » a un sens.<\/p>"}, {"texte_html": "Oui, car on peut toujours cumuler.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : pour une variable nominale, le cumul n'a pas de sens.<\/p>"}, {"texte_html": "Non, car la variable est qualitative.", "score": -30.0, "feedback_html": "<p>Une variable qualitative ordinale peut se cumuler : seules les variables nominales ne le peuvent pas.<\/p>"}, {"texte_html": "Non, car les effectifs sont inégaux.", "score": -50.0, "feedback_html": "<p>Les effectifs ne changent rien : c'est l'ordre des modalités qui compte.<\/p>"}]}, {"id": "S-002-q7", "difficulte": 3, "question_html": "<p>Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?<\/p>", "question_texte": "Le chercheur code les modalités de 1 à 5 et Jamovi affiche une moyenne de 3,1. Que penser de ce nombre ?", "feedback_general_html": "<p>Moyenne d'une variable ordinale codée en chiffres : possible en pratique, mais discutable. La médiane est l'indice adapté.<\/p>", "options": [{"texte_html": "Il est à interpréter avec prudence : il suppose des écarts égaux entre modalités, ce qui n'est pas garanti.", "score": 100.0, "feedback_html": "<p>Exact. Pour une variable ordinale, la moyenne est discutable ; la médiane est l'indice adapté.<\/p>"}, {"texte_html": "Il n'a aucun sens, comme une moyenne de filières.", "score": -20.0, "feedback_html": "<p>C'est trop sévère : contrairement à une variable nominale, les modalités sont ordonnées, et la moyenne peut donner une indication, avec prudence.<\/p>"}, {"texte_html": "Il signifie que la qualité moyenne est exactement « correcte ».", "score": -30.0, "feedback_html": "<p>Ce serait traiter le code comme une mesure exacte : rien ne garantit que les modalités soient équidistantes.<\/p>"}, {"texte_html": "C'est la modalité la plus fréquente.", "score": -50.0, "feedback_html": "<p>La modalité la plus fréquente est le mode, pas la moyenne.<\/p>"}]}, {"id": "S-002-q8", "difficulte": 2, "question_html": "<p>Laquelle de ces conclusions est permise ?<\/p>", "question_texte": "Laquelle de ces conclusions est permise ?", "feedback_general_html": "<p>Un tableau de fréquences décrit les individus observés : il ne permet ni de généraliser, ni de conclure à une cause.<\/p>", "options": [{"texte_html": "Dans ce groupe de 240 étudiants, un peu plus d'un sur quatre déclare un sommeil mauvais ou très mauvais.", "score": 100.0, "feedback_html": "<p>Exact. 27,1 % des étudiants observés : la conclusion reste descriptive.<\/p>"}, {"texte_html": "Un étudiant français sur quatre dort mal.", "score": -20.0, "feedback_html": "<p>Le chiffre est juste pour ces 240 étudiants, mais la phrase généralise à tous les étudiants français.<\/p>"}, {"texte_html": "Ces étudiants dorment mal parce qu'ils révisent.", "score": -30.0, "feedback_html": "<p>Aucune cause n'est mesurée dans ces données.<\/p>"}, {"texte_html": "La plupart des étudiants dorment bien.", "score": -50.0, "feedback_html": "<p>Les sommeils bons et très bons ne représentent que 35,8 % des étudiants.<\/p>"}]}]}, {"id": "S-004", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Temps d'écran de loisir des étudiants"}, "etude_html": "<h4>Temps d&#x27;écran de loisir des étudiants<\/h4><p>Liebig et al. (2026) ont suivi 2 656 étudiants en médecine de Dresde de 2014 à 2024 : en 2024, ils passaient en moyenne 2,46 heures par jour devant un écran pour leurs loisirs. Ici, 200 étudiants ont estimé leur temps d'écran de loisir quotidien ; les réponses sont regroupées en classes de largeurs inégales.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Liebig, L., et al. (2026). Ten years of screen time among medical students in Dresden, Germany: unveiling the trends. BMC Medical Education.<\/p><p style=\"margin-bottom:2px\"><strong>Distribution en classes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Classe (heures)<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectif<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">%<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[0 ; 1[<\/td><td style=\"padding:2px 12px;text-align:right\">40<\/td><td style=\"padding:2px 12px;text-align:right\">20 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[1 ; 2[<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><td style=\"padding:2px 12px;text-align:right\">25 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[2 ; 3[<\/td><td style=\"padding:2px 12px;text-align:right\">40<\/td><td style=\"padding:2px 12px;text-align:right\">20 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[3 ; 5[<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><td style=\"padding:2px 12px;text-align:right\">25 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">[5 ; 10[<\/td><td style=\"padding:2px 12px;text-align:right\">20<\/td><td style=\"padding:2px 12px;text-align:right\">10 %<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Histogramme (densité en ordonnée)<\/strong><\/p><p><img src=\"images/s004_histo_ecran.png\" alt=\"Histogramme (densité en ordonnée)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-004-q1", "difficulte": 1, "question_html": "<p>Le temps d'écran quotidien, mesuré en heures, est une variable…<\/p>", "question_texte": "Le temps d'écran quotidien, mesuré en heures, est une variable…", "feedback_general_html": "<p>Une durée est une variable numérique continue.<\/p>", "options": [{"texte_html": "numérique continue", "score": 100.0, "feedback_html": "<p>Exact. Une durée peut prendre toutes les valeurs d'un intervalle.<\/p>"}, {"texte_html": "numérique discrète", "score": -20.0, "feedback_html": "<p>Elle est bien numérique, mais une durée n'est pas un comptage : elle est continue.<\/p>"}, {"texte_html": "ordinale", "score": -30.0, "feedback_html": "<p>Les écarts entre durées ont un sens : la variable est numérique.<\/p>"}, {"texte_html": "nominale", "score": -50.0, "feedback_html": "<p>Ce sont des quantités.<\/p>"}]}, {"id": "S-004-q2", "difficulte": 1, "question_html": "<p>Quelle est la largeur de la classe [5 ; 10[ ?<\/p>", "question_texte": "Quelle est la largeur de la classe [5 ; 10[ ?", "feedback_general_html": "<p>Largeur d'une classe = borne supérieure − borne inférieure.<\/p>", "options": [{"texte_html": "5 heures", "score": 100.0, "feedback_html": "<p>Exact. Largeur = borne supérieure − borne inférieure = 10 − 5.<\/p>"}, {"texte_html": "10 heures", "score": -20.0, "feedback_html": "<p>10 est la borne supérieure, pas la largeur.<\/p>"}, {"texte_html": "1 heure", "score": -30.0, "feedback_html": "<p>C'est la largeur des premières classes, pas de celle-ci.<\/p>"}, {"texte_html": "20", "score": -50.0, "feedback_html": "<p>20 est l'effectif de la classe.<\/p>"}]}, {"id": "S-004-q3", "difficulte": 1, "question_html": "<p>Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "Quelle part des étudiants passe entre 1 et 2 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>Distinguer effectif, pourcentage et pourcentage cumulé.<\/p>", "options": [{"texte_html": "25 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le pourcentage de la classe [1 ; 2[.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % cumule les classes [0 ; 1[ et [1 ; 2[ : c'est la part de ceux qui passent moins de 2 heures.<\/p>"}, {"texte_html": "50 %", "score": -30.0, "feedback_html": "<p>50 est l'effectif de la classe, pas un pourcentage.<\/p>"}, {"texte_html": "1 %", "score": -50.0, "feedback_html": "<p>1 heure est la largeur de la classe, pas une part.<\/p>"}]}, {"id": "S-004-q4", "difficulte": 2, "question_html": "<p>Quelle est la densité de la classe [3 ; 5[ ?<\/p>", "question_texte": "Quelle est la densité de la classe [3 ; 5[ ?", "feedback_general_html": "<p>Densité = part de la classe / largeur de la classe.<\/p>", "options": [{"texte_html": "12,5 % par heure (25 % / 2 heures)", "score": 100.0, "feedback_html": "<p>Exact. Densité = part / largeur.<\/p>"}, {"texte_html": "25 %", "score": -20.0, "feedback_html": "<p>C'est la part de la classe : il faut encore diviser par sa largeur (2 heures).<\/p>"}, {"texte_html": "8,3 % par heure", "score": -30.0, "feedback_html": "<p>On a divisé par 3, la borne inférieure, au lieu de la largeur (2).<\/p>"}, {"texte_html": "50 % par heure", "score": -50.0, "feedback_html": "<p>On a multiplié par la largeur au lieu de diviser.<\/p>"}]}, {"id": "S-004-q5", "difficulte": 2, "question_html": "<p>Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?<\/p>", "question_texte": "Pourquoi un histogramme avec l'effectif en hauteur serait-il trompeur ici ?", "feedback_general_html": "<p>Classes inégales : densité en ordonnée.<\/p>", "options": [{"texte_html": "La classe large [5 ; 10[ paraîtrait plus peuplée qu'elle ne l'est.", "score": 100.0, "feedback_html": "<p>Exact. Large de 5 heures, elle formerait une grande surface pour seulement 20 étudiants.<\/p>"}, {"texte_html": "Les classes étroites paraîtraient trop peuplées.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : ce sont les classes larges qui sont gonflées.<\/p>"}, {"texte_html": "Les effectifs ne totaliseraient plus 200.", "score": -30.0, "feedback_html": "<p>Le total ne dépend pas du graphique.<\/p>"}, {"texte_html": "L'histogramme deviendrait un diagramme en barres.", "score": -50.0, "feedback_html": "<p>Aucun lien : c'est la lecture des surfaces qui serait faussée.<\/p>"}]}, {"id": "S-004-q6", "difficulte": 3, "question_html": "<p>Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?<\/p>", "question_texte": "Sur l'histogramme (densité en ordonnée), la barre [3 ; 5[ est plus basse que la barre [0 ; 1[. Quelle lecture est correcte ?", "feedback_general_html": "<p>Histogramme en densité : la part d'une classe se lit sur l'aire (hauteur × largeur).<\/p>", "options": [{"texte_html": "La classe [3 ; 5[ contient pourtant plus d'étudiants (50 contre 40) : c'est l'aire, et non la hauteur, qui représente la part.", "score": 100.0, "feedback_html": "<p>Exact. Densités : 12,5 contre 20 % par heure ; mais la barre [3 ; 5[ est deux fois plus large : 25 % contre 20 %.<\/p>"}, {"texte_html": "La classe [3 ; 5[ contient moins d'étudiants, puisque sa barre est plus basse.", "score": -20.0, "feedback_html": "<p>Sur un histogramme en densité, la hauteur seule ne donne pas l'effectif : il faut tenir compte de la largeur.<\/p>"}, {"texte_html": "Le graphique est faux : la barre [3 ; 5[ devrait être plus haute.", "score": -30.0, "feedback_html": "<p>Le graphique est correct : la densité divise la part par la largeur.<\/p>"}, {"texte_html": "Les deux classes contiennent autant d'étudiants.", "score": -50.0, "feedback_html": "<p>Aucune lecture ne donne ce résultat : 50 contre 40.<\/p>"}]}, {"id": "S-004-q7", "difficulte": 2, "question_html": "<p>D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?<\/p>", "question_texte": "D'après le tableau, quelle part des étudiants passe moins de 3 heures par jour devant un écran de loisir ?", "feedback_general_html": "<p>« Moins de 3 heures » : on cumule toutes les classes en dessous de 3.<\/p>", "options": [{"texte_html": "65 % (20 + 25 + 20)", "score": 100.0, "feedback_html": "<p>Exact. On additionne les trois premières classes.<\/p>"}, {"texte_html": "45 %", "score": -20.0, "feedback_html": "<p>45 % s'arrête à 2 heures ; il faut ajouter la classe [2 ; 3[.<\/p>"}, {"texte_html": "20 %", "score": -30.0, "feedback_html": "<p>20 % est la part de la seule classe [2 ; 3[.<\/p>"}, {"texte_html": "3 %", "score": -50.0, "feedback_html": "<p>3 heures est la borne ; la question demande une part.<\/p>"}]}]}, {"id": "S-005", "type": "serie", "categorie": "interpretation", "cm": [2], "etude": {"titre": "Nombre de cafés bus la veille"}, "etude_html": "<h4>Nombre de cafés bus la veille<\/h4><p>Riera-Sampol et al. (2022) ont interrogé 886 étudiants de l'université des Îles Baléares : 91 % consomment de la caféine, et le café en est la première source ; environ la moitié boivent du café (56 % des femmes, 42 % des hommes). Ici, 200 étudiants ont indiqué combien de cafés ils ont bus la veille.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Riera-Sampol, A., et al. (2022). Caffeine Intake among Undergraduate Students: Sex Differences, Sources, Motivations, and Associations with Smoking Status and Self-Reported Sleep Quality. Nutrients.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences de nb_cafes<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Niveaux<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Effectifs<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% du total<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">0<\/td><td style=\"padding:2px 12px;text-align:right\">96<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">48,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1<\/td><td style=\"padding:2px 12px;text-align:right\">52<\/td><td style=\"padding:2px 12px;text-align:right\">26,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">74,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">2<\/td><td style=\"padding:2px 12px;text-align:right\">30<\/td><td style=\"padding:2px 12px;text-align:right\">15,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">89,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3<\/td><td style=\"padding:2px 12px;text-align:right\">12<\/td><td style=\"padding:2px 12px;text-align:right\">6,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">95,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">4<\/td><td style=\"padding:2px 12px;text-align:right\">6<\/td><td style=\"padding:2px 12px;text-align:right\">3,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">98,0 %<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">5<\/td><td style=\"padding:2px 12px;text-align:right\">4<\/td><td style=\"padding:2px 12px;text-align:right\">2,0 %<\/td><td style=\"padding:2px 12px;text-align:right\">100,0 %<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en bâtons et fréquences cumulées croissantes<\/strong><\/p><p><img src=\"images/s005_cafes.png\" alt=\"Diagramme en bâtons et fréquences cumulées croissantes\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-005-q1", "difficulte": 1, "question_html": "<p>Quel graphique choisir pour représenter cette distribution ?<\/p>", "question_texte": "Quel graphique choisir pour représenter cette distribution ?", "feedback_general_html": "<p>Numérique discrète : diagramme en bâtons.<\/p>", "options": [{"texte_html": "Un diagramme en bâtons", "score": 100.0, "feedback_html": "<p>Exact. Variable numérique discrète avec peu de valeurs.<\/p>"}, {"texte_html": "Un histogramme", "score": -20.0, "feedback_html": "<p>Inutile de regrouper en classes une variable discrète à six valeurs.<\/p>"}, {"texte_html": "Un diagramme en barres", "score": -30.0, "feedback_html": "<p>Il perdrait l'axe numérique.<\/p>"}, {"texte_html": "Un diagramme circulaire", "score": -50.0, "feedback_html": "<p>Il perdrait l'ordre des valeurs.<\/p>"}]}, {"id": "S-005-q2", "difficulte": 1, "question_html": "<p>Quelle part des étudiants a bu au plus 2 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au plus 2 cafés ?", "feedback_general_html": "<p>« Au plus » une valeur : % cumulé sur la ligne de cette valeur.<\/p>", "options": [{"texte_html": "89,0 %", "score": 100.0, "feedback_html": "<p>Exact. On lit le % cumulé sur la ligne « 2 ».<\/p>"}, {"texte_html": "74,0 %", "score": -20.0, "feedback_html": "<p>74,0 % s'arrête à 1 café.<\/p>"}, {"texte_html": "15,0 %", "score": -30.0, "feedback_html": "<p>15,0 % est la part de ceux qui ont bu exactement 2 cafés.<\/p>"}, {"texte_html": "30", "score": -50.0, "feedback_html": "<p>30 est un effectif, pas une part.<\/p>"}]}, {"id": "S-005-q3", "difficulte": 1, "question_html": "<p>Quel est le mode ?<\/p>", "question_texte": "Quel est le mode ?", "feedback_general_html": "<p>Le mode est une valeur de la variable, pas un effectif.<\/p>", "options": [{"texte_html": "0 café", "score": 100.0, "feedback_html": "<p>Exact. C'est la valeur la plus fréquente (96 étudiants).<\/p>"}, {"texte_html": "96", "score": -20.0, "feedback_html": "<p>96 est l'effectif du mode ; le mode est la valeur : 0 café.<\/p>"}, {"texte_html": "1 café", "score": -30.0, "feedback_html": "<p>1 café concerne 52 étudiants, moins que 0 café.<\/p>"}, {"texte_html": "Il n'y en a pas", "score": -50.0, "feedback_html": "<p>Toute distribution a un mode.<\/p>"}]}, {"id": "S-005-q4", "difficulte": 2, "question_html": "<p>Quelle part des étudiants a bu au moins 3 cafés ?<\/p>", "question_texte": "Quelle part des étudiants a bu au moins 3 cafés ?", "feedback_general_html": "<p>« Au moins x » = 100 % − cumul jusqu'à la valeur précédente.<\/p>", "options": [{"texte_html": "11,0 % (100 − 89,0)", "score": 100.0, "feedback_html": "<p>Exact. On retire de 100 % le cumul jusqu'à 2 cafés.<\/p>"}, {"texte_html": "6,0 %", "score": -20.0, "feedback_html": "<p>6,0 % ne compte que ceux qui ont bu exactement 3 cafés.<\/p>"}, {"texte_html": "95,0 %", "score": -30.0, "feedback_html": "<p>95,0 % est le cumul jusqu'à 3 : il compte « au plus 3 », pas « au moins 3 ».<\/p>"}, {"texte_html": "12 %", "score": -50.0, "feedback_html": "<p>12 est l'effectif de la ligne « 3 », pas un pourcentage.<\/p>"}]}, {"id": "S-005-q5", "difficulte": 2, "question_html": "<p>À partir du % cumulé, quelle est la médiane du nombre de cafés ?<\/p>", "question_texte": "À partir du % cumulé, quelle est la médiane du nombre de cafés ?", "feedback_general_html": "<p>La médiane se lit sur les fréquences cumulées : première valeur dont le cumul atteint 50 %.<\/p>", "options": [{"texte_html": "1 café : c'est la première valeur où le cumul atteint ou dépasse 50 %", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 48 % à 0 et 74 % à 1 : la moitié des étudiants a bu au plus 1 café.<\/p>"}, {"texte_html": "0 café", "score": -20.0, "feedback_html": "<p>Le cumul de 0 (48 %) n'atteint pas 50 % : 0 est le mode, pas la médiane.<\/p>"}, {"texte_html": "2,5 cafés", "score": -30.0, "feedback_html": "<p>C'est le milieu de l'échelle (0 à 5), pas la valeur qui coupe les étudiants en deux.<\/p>"}, {"texte_html": "74,0 %", "score": -50.0, "feedback_html": "<p>C'est une fréquence cumulée, pas une valeur de la variable.<\/p>"}]}, {"id": "S-005-q6", "difficulte": 3, "question_html": "<p>On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?<\/p>", "question_texte": "On ajoute un étudiant qui a bu 12 cafés. Que devient le diagramme en bâtons des effectifs ?", "feedback_general_html": "<p>Le diagramme en bâtons montre les valeurs isolées et les vides de la distribution.<\/p>", "options": [{"texte_html": "Un bâton isolé apparaît en 12, séparé des autres par un vide", "score": 100.0, "feedback_html": "<p>Exact. Chaque valeur a son bâton à sa position réelle sur l'axe.<\/p>"}, {"texte_html": "Le bâton de la valeur 5 s'allonge", "score": -20.0, "feedback_html": "<p>La valeur 12 a son propre bâton : elle ne s'ajoute pas à la valeur 5.<\/p>"}, {"texte_html": "L'étudiant n'apparaît pas, car l'axe s'arrête à 5", "score": -30.0, "feedback_html": "<p>L'axe s'étend pour placer la nouvelle valeur.<\/p>"}, {"texte_html": "Tous les bâtons changent de hauteur", "score": -50.0, "feedback_html": "<p>En effectifs, les autres bâtons ne bougent pas : seul un nouveau bâton s'ajoute.<\/p>"}]}, {"id": "S-005-q7", "difficulte": 1, "question_html": "<p>Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?<\/p>", "question_texte": "Sur le graphique de droite, pourquoi la courbe des fréquences cumulées est-elle en escalier ?", "feedback_general_html": "<p>Fonction de répartition d'une variable discrète : un escalier, qui monte à chaque valeur observée.<\/p>", "options": [{"texte_html": "Parce que la variable est discrète : la fréquence cumulée ne change qu'aux valeurs 0, 1, 2…", "score": 100.0, "feedback_html": "<p>Exact. Entre deux valeurs entières, aucun étudiant n'est ajouté : la courbe reste plate, puis monte d'un coup.<\/p>"}, {"texte_html": "Parce que l'effectif est petit", "score": -20.0, "feedback_html": "<p>Même avec beaucoup plus d'étudiants, la courbe resterait en escalier : c'est la nature discrète de la variable qui compte.<\/p>"}, {"texte_html": "C'est une erreur de tracé : la courbe devrait être lisse", "score": -30.0, "feedback_html": "<p>Pour une variable discrète, l'escalier est la représentation correcte.<\/p>"}, {"texte_html": "Parce que la variable est qualitative", "score": -50.0, "feedback_html": "<p>Le nombre de cafés est une variable numérique.<\/p>"}]}]}, {"id": "S-006", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Combien de fois regarde-t-on son téléphone ?"}, "etude_html": "<h4>Combien de fois regarde-t-on son téléphone ?<\/h4><p>Andrews et al. (2015) ont installé une application sur le smartphone de 23 jeunes adultes (18 à 33 ans), qui a enregistré chaque utilisation pendant deux semaines. En moyenne, les participants utilisaient leur téléphone 84,7 fois par jour (écart-type 55,2), pour un total de 5 heures par jour. Interrogés avant l'enregistrement, ils estimaient l'utiliser 37 fois par jour en moyenne. Plus de la moitié des utilisations duraient moins de 30 secondes. Les 23 valeurs ci-dessous sont simulées, calées sur la moyenne et l'écart-type publiés.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Andrews, S., Ellis, D. A., Shaw, H., &amp; Piwek, L. (2015). Beyond self-report: Tools to compare estimated and real-world smartphone use. PLOS ONE, 10(10), e0139004.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives : utilisations par jour<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">23<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">86,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">72<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">52,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">18<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">246<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1er quartile<\/td><td style=\"padding:2px 12px;text-align:right\">56<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3e quartile<\/td><td style=\"padding:2px 12px;text-align:right\">117,5<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Utilisations par jour : un point par participant et boîte à moustaches<\/strong><\/p><p><img src=\"images/s006_smartphone.png\" alt=\"Utilisations par jour : un point par participant et boîte à moustaches\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-006-q1", "difficulte": 1, "question_html": "<p>Combien de fois par jour, en moyenne, ces participants utilisent-ils leur téléphone ?<\/p>", "question_texte": "Combien de fois par jour, en moyenne, ces participants utilisent-ils leur téléphone ?", "feedback_general_html": "<p>Moyenne, médiane, écart-type : chaque ligne du tableau répond à une question différente.<\/p>", "options": [{"texte_html": "Environ 86 fois", "score": 100.0, "feedback_html": "<p>Exact. On lit la ligne « Moyenne » : 86,5.<\/p>"}, {"texte_html": "72 fois", "score": -20.0, "feedback_html": "<p>72 est la médiane, pas la moyenne.<\/p>"}, {"texte_html": "52,6 fois", "score": -30.0, "feedback_html": "<p>52,6 est l'écart-type : il mesure la dispersion, pas la position.<\/p>"}, {"texte_html": "246 fois", "score": -50.0, "feedback_html": "<p>246 est le maximum, la valeur d'un seul participant.<\/p>"}]}, {"id": "S-006-q2", "difficulte": 1, "question_html": "<p>Complétez : la moitié des participants utilise son téléphone…<\/p>", "question_texte": "Complétez : la moitié des participants utilise son téléphone…", "feedback_general_html": "<p>La médiane coupe les individus en deux moitiés.<\/p>", "options": [{"texte_html": "72 fois par jour ou moins.", "score": 100.0, "feedback_html": "<p>Exact. C'est la définition de la médiane : la moitié des participants est en dessous ou égale.<\/p>"}, {"texte_html": "86,5 fois par jour ou moins.", "score": -20.0, "feedback_html": "<p>86,5 est la moyenne. Ici, plus de la moitié des participants est en dessous, car la moyenne est tirée vers le haut.<\/p>"}, {"texte_html": "117,5 fois par jour ou plus.", "score": -30.0, "feedback_html": "<p>117,5 est le 3e quartile : un quart des participants est au-dessus, pas la moitié.<\/p>"}, {"texte_html": "exactement 72 fois par jour.", "score": -50.0, "feedback_html": "<p>La médiane est une borne : la moitié est en dessous ou égale, pas exactement à 72.<\/p>"}]}, {"id": "S-006-q3", "difficulte": 2, "question_html": "<p>Pourquoi la moyenne (86,5) est-elle plus grande que la médiane (72) ?<\/p>", "question_texte": "Pourquoi la moyenne (86,5) est-elle plus grande que la médiane (72) ?", "feedback_general_html": "<p>Distribution étirée vers les valeurs élevées : moyenne &gt; médiane.<\/p>", "options": [{"texte_html": "Quelques gros utilisateurs, dont un à 246 utilisations par jour, tirent la moyenne vers le haut.", "score": 100.0, "feedback_html": "<p>Exact. La distribution est étirée vers les valeurs élevées ; la moyenne s'éloigne de la médiane de ce côté.<\/p>"}, {"texte_html": "Parce que la plupart des participants utilisent leur téléphone plus de 86 fois par jour.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : la médiane est à 72, donc la plupart des participants sont en dessous de 86.<\/p>"}, {"texte_html": "Parce que l'échantillon est petit (23 personnes).", "score": -30.0, "feedback_html": "<p>La taille de l'échantillon n'explique pas le sens de l'écart. C'est la forme de la distribution qui compte.<\/p>"}, {"texte_html": "C'est une erreur : la moyenne et la médiane devraient être égales.", "score": -50.0, "feedback_html": "<p>Elles ne sont égales que pour une distribution symétrique. Ici, la distribution est étirée vers le haut.<\/p>"}]}, {"id": "S-006-q4", "difficulte": 2, "question_html": "<p>On retire le participant à 246 utilisations par jour. Lequel de ces paramètres change le plus ?<\/p>", "question_texte": "On retire le participant à 246 utilisations par jour. Lequel de ces paramètres change le plus ?", "feedback_general_html": "<p>L'étendue est l'indice le moins robuste ; la médiane le plus robuste.<\/p>", "options": [{"texte_html": "L'étendue (de 228 à 133)", "score": 100.0, "feedback_html": "<p>Exact. L'étendue dépend directement du maximum : elle perd presque la moitié de sa valeur. L'écart-type passe de 52,6 à 40,4, la moyenne de 86,5 à 79,2, la médiane de 72 à 68,5.<\/p>"}, {"texte_html": "L'écart-type", "score": -20.0, "feedback_html": "<p>Il baisse nettement (de 52,6 à 40,4), mais moins que l'étendue, qui ne dépend que des deux valeurs extrêmes.<\/p>"}, {"texte_html": "La moyenne", "score": -30.0, "feedback_html": "<p>Elle baisse (de 86,5 à 79,2), mais bien moins que l'étendue.<\/p>"}, {"texte_html": "La médiane", "score": -50.0, "feedback_html": "<p>C'est l'indice qui change le moins (de 72 à 68,5) : elle est robuste.<\/p>"}]}, {"id": "S-006-q5", "difficulte": 3, "question_html": "<p>Les participants estimaient utiliser leur téléphone 37 fois par jour en moyenne. Quelle conclusion descriptive peut-on tirer ?<\/p>", "question_texte": "Les participants estimaient utiliser leur téléphone 37 fois par jour en moyenne. Quelle conclusion descriptive peut-on tirer ?", "feedback_general_html": "<p>Une comparaison de moyennes décrit le groupe, pas chaque individu.<\/p>", "options": [{"texte_html": "En moyenne, ils utilisent leur téléphone plus de deux fois plus souvent qu'ils ne le pensent.", "score": 100.0, "feedback_html": "<p>Exact. 84,7 / 37 ≈ 2,3. La conclusion porte sur les moyennes du groupe.<\/p>"}, {"texte_html": "Chaque participant sous-estime son usage de plus de moitié.", "score": -20.0, "feedback_html": "<p>Les moyennes ne disent rien de chaque participant : certains peuvent s'estimer correctement, d'autres très mal.<\/p>"}, {"texte_html": "Les participants surestiment leur usage.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : l'usage réel (84,7) dépasse l'estimation (37).<\/p>"}, {"texte_html": "Les estimations des participants sont plus dispersées que leur usage réel.", "score": -50.0, "feedback_html": "<p>On ne connaît ici que la moyenne des estimations, pas leur dispersion.<\/p>"}]}, {"id": "S-006-q6", "difficulte": 2, "question_html": "<p>Pour exprimer l'usage par semaine, on multiplie chaque valeur par 7. Que deviennent la moyenne et l'écart-type ?<\/p>", "question_texte": "Pour exprimer l'usage par semaine, on multiplie chaque valeur par 7. Que deviennent la moyenne et l'écart-type ?", "feedback_general_html": "<p>Multiplier par k : moyenne et écart-type multipliés par k.<\/p>", "options": [{"texte_html": "Environ 605 et 368", "score": 100.0, "feedback_html": "<p>Exact. 86,5 × 7 ≈ 605 et 52,6 × 7 ≈ 368 : multiplier par une constante multiplie la position et la dispersion.<\/p>"}, {"texte_html": "Environ 605 et 52,6", "score": -20.0, "feedback_html": "<p>La moyenne est juste, mais l'écart-type est aussi multiplié par 7.<\/p>"}, {"texte_html": "Environ 93,5 et 52,6", "score": -30.0, "feedback_html": "<p>C'est ce qu'on obtiendrait en ajoutant 7 à chaque valeur, pas en multipliant par 7.<\/p>"}, {"texte_html": "Ils ne changent pas.", "score": -50.0, "feedback_html": "<p>Toutes les valeurs sont multipliées par 7 : leur moyenne et leur dispersion aussi.<\/p>"}]}]}, {"id": "S-008", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Combien d'amis ?"}, "etude_html": "<h4>Combien d&#x27;amis ?<\/h4><p>Pennington, Hall et Holmstrom (2024) ont interrogé un échantillon d'adultes américains dans le cadre de l'American Friendship Project. En 2023, 2 243 participants ont indiqué leur nombre d'amis en choisissant une classe : 0, 1–5, 6–10, etc. 1,5 % n'ont déclaré aucun ami, 44,4 % de 1 à 5 amis, 24,2 % de 6 à 10 amis. Dans le tableau, les trois premières classes sont celles de l'article ; la répartition des classes suivantes est simulée.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Pennington, N., Hall, J. A., &amp; Holmstrom, A. J. (2024). The American Friendship Project: A report on the status and health of friendship in America. PLOS ONE, 19(7), e0305834.<\/p><p style=\"margin-bottom:2px\"><strong>Fréquences du nombre d&#x27;amis<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\">Nombre d&#x27;amis<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">%<\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">% cumulé<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">0<\/td><td style=\"padding:2px 12px;text-align:right\">1,5<\/td><td style=\"padding:2px 12px;text-align:right\">1,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1–5<\/td><td style=\"padding:2px 12px;text-align:right\">44,4<\/td><td style=\"padding:2px 12px;text-align:right\">45,9<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">6–10<\/td><td style=\"padding:2px 12px;text-align:right\">24,2<\/td><td style=\"padding:2px 12px;text-align:right\">70,1<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">11–15<\/td><td style=\"padding:2px 12px;text-align:right\">10,5<\/td><td style=\"padding:2px 12px;text-align:right\">80,6<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">16–20<\/td><td style=\"padding:2px 12px;text-align:right\">7,2<\/td><td style=\"padding:2px 12px;text-align:right\">87,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">21–30<\/td><td style=\"padding:2px 12px;text-align:right\">5,6<\/td><td style=\"padding:2px 12px;text-align:right\">93,4<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">31–50<\/td><td style=\"padding:2px 12px;text-align:right\">3,4<\/td><td style=\"padding:2px 12px;text-align:right\">96,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">51 et plus<\/td><td style=\"padding:2px 12px;text-align:right\">3,2<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><\/table>", "questions": [{"id": "S-008-q1", "difficulte": 1, "question_html": "<p>Quelle est la classe modale ?<\/p>", "question_texte": "Quelle est la classe modale ?", "feedback_general_html": "<p>Le mode est une modalité (ici une classe), pas une fréquence.<\/p>", "options": [{"texte_html": "1–5 amis", "score": 100.0, "feedback_html": "<p>Exact. C'est la classe la plus fréquente (44,4 %).<\/p>"}, {"texte_html": "6–10 amis", "score": -20.0, "feedback_html": "<p>6–10 est la classe de la médiane ; la classe modale est la plus fréquente, 1–5.<\/p>"}, {"texte_html": "44,4 %", "score": -30.0, "feedback_html": "<p>44,4 % est la fréquence de la classe modale ; le mode est la classe elle-même.<\/p>"}, {"texte_html": "51 amis et plus", "score": -50.0, "feedback_html": "<p>C'est l'une des classes les moins fréquentes (3,2 %).<\/p>"}]}, {"id": "S-008-q2", "difficulte": 2, "question_html": "<p>Dans quelle classe se trouve la médiane ?<\/p>", "question_texte": "Dans quelle classe se trouve la médiane ?", "feedback_general_html": "<p>Médiane d'une variable en classes ordonnées : la classe où le pourcentage cumulé franchit 50 %.<\/p>", "options": [{"texte_html": "6–10 amis", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 45,9 % à la fin de la classe 1–5 et 70,1 % à la fin de 6–10 : les 50 % sont franchis dans la classe 6–10.<\/p>"}, {"texte_html": "1–5 amis", "score": -20.0, "feedback_html": "<p>C'est la classe modale. Le cumul n'y atteint que 45,9 % : moins de la moitié.<\/p>"}, {"texte_html": "11–15 amis", "score": -30.0, "feedback_html": "<p>Le cumul dépasse déjà 50 % à la fin de la classe 6–10.<\/p>"}, {"texte_html": "Il n'y en a pas : le nombre d'amis est donné en classes.", "score": -50.0, "feedback_html": "<p>Les classes sont ordonnées : on peut repérer celle où le cumul franchit 50 %.<\/p>"}]}, {"id": "S-008-q3", "difficulte": 2, "question_html": "<p>Pourquoi ne peut-on pas calculer exactement la moyenne du nombre d'amis à partir de ce tableau ?<\/p>", "question_texte": "Pourquoi ne peut-on pas calculer exactement la moyenne du nombre d'amis à partir de ce tableau ?", "feedback_general_html": "<p>Avec des classes, surtout une classe ouverte, la moyenne exacte est inconnue ; médiane et quartiles restent repérables.<\/p>", "options": [{"texte_html": "Les réponses sont données en classes, dont la dernière est ouverte (51 et plus) : on ne connaît pas les valeurs exactes.", "score": 100.0, "feedback_html": "<p>Exact. Dans la classe « 51 et plus », une personne peut avoir 52 ou 300 amis : la moyenne en dépend fortement.<\/p>"}, {"texte_html": "Parce que la distribution est asymétrique.", "score": -20.0, "feedback_html": "<p>Une distribution asymétrique a bien une moyenne ; elle est seulement éloignée de la médiane. Le problème ici, ce sont les classes.<\/p>"}, {"texte_html": "Parce que l'échantillon est trop grand.", "score": -30.0, "feedback_html": "<p>La taille de l'échantillon n'empêche pas de calculer une moyenne.<\/p>"}, {"texte_html": "Parce que le nombre d'amis est une variable nominale.", "score": -50.0, "feedback_html": "<p>Le nombre d'amis est une variable numérique, ici regroupée en classes ordonnées.<\/p>"}]}, {"id": "S-008-q4", "difficulte": 2, "question_html": "<p>Dans quelle classe se trouve le troisième quartile ?<\/p>", "question_texte": "Dans quelle classe se trouve le troisième quartile ?", "feedback_general_html": "<p>Troisième quartile : la classe où le pourcentage cumulé franchit 75 %.<\/p>", "options": [{"texte_html": "11–15 amis", "score": 100.0, "feedback_html": "<p>Exact. Le cumul vaut 70,1 % à la fin de 6–10 et 80,6 % à la fin de 11–15 : les 75 % sont franchis dans la classe 11–15.<\/p>"}, {"texte_html": "6–10 amis", "score": -20.0, "feedback_html": "<p>Le cumul n'y atteint que 70,1 %, moins de 75 %.<\/p>"}, {"texte_html": "16–20 amis", "score": -30.0, "feedback_html": "<p>Les 75 % sont déjà franchis à la fin de la classe 11–15 (80,6 %).<\/p>"}, {"texte_html": "51 amis et plus", "score": -50.0, "feedback_html": "<p>Cette classe contient les 3,2 % les plus hauts, bien au-delà de 75 %.<\/p>"}]}, {"id": "S-008-q5", "difficulte": 3, "question_html": "<p>Un journaliste résume : « La moitié des Américains a entre 1 et 5 amis. » Est-ce exact ?<\/p>", "question_texte": "Un journaliste résume : « La moitié des Américains a entre 1 et 5 amis. » Est-ce exact ?", "feedback_general_html": "<p>Classe modale et moitié des individus sont deux choses différentes.<\/p>", "options": [{"texte_html": "Non : 45,9 % ont 5 amis ou moins, zéro compris ; la moitié n'est atteinte que dans la classe 6–10.", "score": 100.0, "feedback_html": "<p>Exact. La classe 1–5 regroupe 44,4 % des répondants : beaucoup, mais pas la moitié.<\/p>"}, {"texte_html": "Oui : 1–5 est la classe la plus fréquente.", "score": -20.0, "feedback_html": "<p>C'est bien la classe modale, mais être la plus fréquente ne veut pas dire regrouper la moitié des répondants.<\/p>"}, {"texte_html": "Non : la moitié des Américains a plus de 10 amis.", "score": -30.0, "feedback_html": "<p>Seuls 29,9 % des répondants ont plus de 10 amis.<\/p>"}, {"texte_html": "On ne peut pas le vérifier sans la moyenne.", "score": -50.0, "feedback_html": "<p>La moyenne n'est pas utile ici : les pourcentages du tableau suffisent.<\/p>"}]}]}, {"id": "S-009", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Le jeu du dictateur"}, "etude_html": "<h4>Le jeu du dictateur<\/h4><p>Dans le jeu du dictateur, un participant reçoit une somme d'argent et décide seul de la part qu'il donne à un inconnu, qui ne peut rien faire. Engel (2011) a rassemblé plus de 600 versions de cette expérience. En moyenne, les participants donnent 28 % de la somme ; environ un tiers ne donne rien, et environ un sixième partage à égalité. Ci-dessous, 400 participants simulés d'après ces résultats. Variable <code>don<\/code> : part de la somme donnée, en %.<\/p><p style=\"font-size:0.85em;color:#555\">Données simulées · d&#x27;après Engel, C. (2011). Dictator games: A meta study. Experimental Economics, 14(4), 583–610.<\/p><p style=\"margin-bottom:2px\"><strong>Statistiques descriptives de don (%)<\/strong><\/p><table style=\"border-collapse:collapse;font-size:0.95em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 12px;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 12px;text-align:right;border-bottom:1px solid #333\">Valeur<\/th><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">N<\/td><td style=\"padding:2px 12px;text-align:right\">400<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Moyenne<\/td><td style=\"padding:2px 12px;text-align:right\">28,8<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Médiane<\/td><td style=\"padding:2px 12px;text-align:right\">20<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Mode<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Écart-type<\/td><td style=\"padding:2px 12px;text-align:right\">29,5<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Minimum<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">Maximum<\/td><td style=\"padding:2px 12px;text-align:right\">100<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">1er quartile<\/td><td style=\"padding:2px 12px;text-align:right\">0<\/td><\/tr><tr><td style=\"padding:2px 12px;text-align:left\">3e quartile<\/td><td style=\"padding:2px 12px;text-align:right\">50<\/td><\/tr><\/table><p style=\"margin-bottom:2px\"><strong>Diagramme en bâtons de don<\/strong><\/p><p><img src=\"images/s009_dictateur.png\" alt=\"Diagramme en bâtons de don\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-009-q1", "difficulte": 1, "question_html": "<p>Quel est le mode de la variable <code>don<\/code> ?<\/p>", "question_texte": "Quel est le mode de la variable `don` ?", "feedback_general_html": "<p>Le mode est la valeur la plus fréquente.<\/p>", "options": [{"texte_html": "0 %", "score": 100.0, "feedback_html": "<p>Exact. C'est la valeur la plus fréquente : 36 % des participants ne donnent rien.<\/p>"}, {"texte_html": "50 %", "score": -20.0, "feedback_html": "<p>C'est le second sommet (17 % des participants), mais pas le plus haut.<\/p>"}, {"texte_html": "36 %", "score": -30.0, "feedback_html": "<p>36 % est la part des participants qui donnent 0 ; le mode est la valeur 0 elle-même.<\/p>"}, {"texte_html": "28,8 %", "score": -50.0, "feedback_html": "<p>C'est la moyenne, que presque personne ne donne.<\/p>"}]}, {"id": "S-009-q2", "difficulte": 1, "question_html": "<p>Comment qualifier la forme de cette distribution ?<\/p>", "question_texte": "Comment qualifier la forme de cette distribution ?", "feedback_general_html": "<p>Deux sommets : distribution bimodale. Elle suggère deux façons de se comporter.<\/p>", "options": [{"texte_html": "Bimodale : un sommet à 0 % et un second à 50 %.", "score": 100.0, "feedback_html": "<p>Exact. Deux comportements fréquents se dégagent : ne rien donner, et partager à égalité.<\/p>"}, {"texte_html": "Unimodale, étirée vers les valeurs élevées.", "score": -20.0, "feedback_html": "<p>Elle est bien étirée vers les valeurs élevées, mais le pic à 50 % forme un second sommet.<\/p>"}, {"texte_html": "Symétrique autour de 50 %.", "score": -30.0, "feedback_html": "<p>Le gros des participants est à gauche de 50 %, avec un pic à 0 : la distribution n'est pas symétrique.<\/p>"}, {"texte_html": "Uniforme : chaque valeur est aussi fréquente que les autres.", "score": -50.0, "feedback_html": "<p>Les bâtons ont des hauteurs très différentes, de 1 % à 36 %.<\/p>"}]}, {"id": "S-009-q3", "difficulte": 1, "question_html": "<p>Que signifie la médiane de 20 % ?<\/p>", "question_texte": "Que signifie la médiane de 20 % ?", "feedback_general_html": "<p>La médiane coupe les participants en deux moitiés.<\/p>", "options": [{"texte_html": "La moitié des participants donne 20 % de la somme ou moins.", "score": 100.0, "feedback_html": "<p>Exact. C'est la définition de la médiane.<\/p>"}, {"texte_html": "En moyenne, les participants donnent 20 % de la somme.", "score": -20.0, "feedback_html": "<p>La moyenne vaut 28,8 % ; 20 % est la médiane.<\/p>"}, {"texte_html": "20 % des participants donnent la moitié de la somme.", "score": -30.0, "feedback_html": "<p>La médiane est une valeur de la variable, pas une part des participants.<\/p>"}, {"texte_html": "La plupart des participants donnent exactement 20 %.", "score": -50.0, "feedback_html": "<p>Seuls 9 % des participants donnent 20 %. La valeur la plus fréquente est 0.<\/p>"}]}, {"id": "S-009-q4", "difficulte": 2, "question_html": "<p>On crée la variable <code>a_donne<\/code> : 1 si le participant a donné quelque chose, 0 sinon. Quelle est sa moyenne ?<\/p>", "question_texte": "On crée la variable `a_donne` : 1 si le participant a donné quelque chose, 0 sinon. Quelle est sa moyenne ?", "feedback_general_html": "<p>Variable codée 0/1 : moyenne = proportion de 1.<\/p>", "options": [{"texte_html": "0,64", "score": 100.0, "feedback_html": "<p>Exact. 36 % ne donnent rien, donc 64 % donnent quelque chose ; la moyenne d'une variable 0/1 est la proportion de 1.<\/p>"}, {"texte_html": "0,36", "score": -20.0, "feedback_html": "<p>0,36 est la proportion de 0 (ceux qui ne donnent rien). La moyenne est la proportion de 1.<\/p>"}, {"texte_html": "0,288", "score": -30.0, "feedback_html": "<p>C'est la moyenne de <code>don<\/code> divisée par 100, pas la proportion de participants qui donnent.<\/p>"}, {"texte_html": "0,5, puisque la variable n'a que deux valeurs", "score": -50.0, "feedback_html": "<p>La moyenne dépend de la proportion de 1, pas du nombre de valeurs possibles.<\/p>"}]}, {"id": "S-009-q5", "difficulte": 3, "question_html": "<p>Le premier quartile vaut 0. Que signifie-t-il ?<\/p>", "question_texte": "Le premier quartile vaut 0. Que signifie-t-il ?", "feedback_general_html": "<p>Un quartile peut être égal au minimum si plus d'un quart des individus ont cette valeur.<\/p>", "options": [{"texte_html": "Au moins un quart des participants ne donne rien.", "score": 100.0, "feedback_html": "<p>Exact. 25 % des participants ont une valeur inférieure ou égale à 0, c'est-à-dire 0. En réalité, ils sont 36 %.<\/p>"}, {"texte_html": "Exactement un quart des participants ne donne rien.", "score": -20.0, "feedback_html": "<p>Le quartile dit qu'au moins 25 % sont à 0, pas exactement 25 %. Ici, ils sont 36 %.<\/p>"}, {"texte_html": "Le quart le plus généreux des participants donne 0 %.", "score": -30.0, "feedback_html": "<p>C'est le quart le moins généreux qui est en dessous de Q1.<\/p>"}, {"texte_html": "C'est une erreur : un quartile ne peut pas être égal au minimum.", "score": -50.0, "feedback_html": "<p>C'est tout à fait possible quand beaucoup d'individus ont la valeur minimale.<\/p>"}]}, {"id": "S-009-q6", "difficulte": 3, "question_html": "<p>Quel résumé décrit le plus fidèlement ces données ?<\/p>", "question_texte": "Quel résumé décrit le plus fidèlement ces données ?", "feedback_general_html": "<p>Pour une distribution bimodale, aucun indice de position ne décrit un individu typique : on décrit la forme.<\/p>", "options": [{"texte_html": "Plus d'un tiers des participants ne donne rien et environ un sixième partage à égalité ; en moyenne, on donne 29 %, mais cette moyenne ne décrit pas un comportement typique.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux sommets, un seul nombre résume mal : il faut décrire la forme de la distribution.<\/p>"}, {"texte_html": "Les participants donnent en général un peu moins de 30 % de la somme.", "score": -20.0, "feedback_html": "<p>La moyenne est juste, mais « en général » suggère un comportement typique : or la plupart donnent soit 0, soit 50 %.<\/p>"}, {"texte_html": "La plupart des participants partagent à égalité.", "score": -30.0, "feedback_html": "<p>Seuls 17 % partagent à égalité.<\/p>"}, {"texte_html": "Les participants ne donnent rien.", "score": -50.0, "feedback_html": "<p>C'est le mode, mais 64 % des participants donnent quelque chose.<\/p>"}]}]}, {"id": "S-011", "type": "serie", "categorie": "interpretation", "cm": [3], "etude": {"titre": "Découvrir le diagramme en violon"}, "etude_html": "<h4>Découvrir le diagramme en violon<\/h4><p>Un diagramme en violon montre la forme d'une distribution numérique. Pour chaque valeur, la largeur du violon indique la densité : plus le violon est large à une hauteur donnée, plus les individus sont nombreux autour de cette valeur. La forme est dessinée en miroir, à gauche et à droite, ce qui donne l'allure d'un violon. On y ajoute souvent une petite boîte à moustaches. Ici, chaque violon a la même largeur maximale, quel que soit l'effectif du groupe.<\/p><p>Qin et al. (2020) ont validé un questionnaire de dépistage du trouble du jeu vidéo. Ils ont interrogé 3 724 étudiants chinois et 131 patients venus consulter pour leur pratique du jeu. Temps de jeu hebdomadaire : 8,1 heures en moyenne chez les étudiants (écart-type 10,8) ; 26,0 heures chez les patients (écart-ty
